<h1>单词合集 · Day 1–45</h1>
<p class="sub" id="summary">Day 1–45 · 450 项（含阅读补充 60 项）｜先看中文和挖空例句，再翻开答案；支持朗读、口音切换与错题复习。</p>

<div class="bar">
  <div class="day-range">
    <label for="dayFrom">学习日</label>
    <select id="dayFrom" aria-label="开始学习日"></select>
    <span>至</span>
    <select id="dayTo" aria-label="结束学习日"></select>
  </div>
  <label for="scope">类型</label>
  <select id="scope">
    <option value="0">全部 450 项</option>
    <option value="p">只练短语（164）</option>
    <option value="v">只练单词（286）</option>
  </select>
  <label for="accentSelect">口音</label><select id="accentSelect"><option value="en-AU">🇦🇺 澳洲</option><option value="en-GB">🇬🇧 英国</option><option value="en-US">🇺🇸 美国</option></select>
  <button id="restart" style="font-size:13px;padding:6px 12px;">重新开始</button>
  <span class="progress" id="prog"></span>
</div>
<div class="track"><div class="fill" id="fill"></div></div>

<div id="quiz">
  <div class="card">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <p class="prompt-cn" id="pcn"></p>
      <span class="prompt-pos" id="ppos"></span>
      <span class="daytag" id="pday"></span>
    </div>
    <p class="cloze" id="cloze"></p>
    <p class="clozetr" id="clozetr"></p>
    <div class="answer" id="ans">
      <div style="display:flex;align-items:center;flex-wrap:wrap;">
        <span class="aw" id="aw"></span><span class="ipa" id="aipa"></span>
      </div>
      <p class="usage" id="usage"></p>
       <div class="row"><button class="say" id="btnWord" aria-label="朗读单词">🔊</button><span class="tr">朗读单词 / 短语</span></div>
      <p class="example-label">例句 1</p>
      <div class="sentence-row">
        <p class="en" id="aen"></p>
        <button class="say" id="btnSay" aria-label="朗读例句">🔊</button>
      </div>
      <p class="tr" id="atr"></p>
      <div id="extraExamples"></div>
      <details class="source-note" id="sourceNote" hidden>
        <summary id="sourceTitle"></summary>
        <p class="source-en" id="sourceQuote"></p>
        <p class="tr" id="sourceTranslation"></p>
      </details>
    </div>
    <div class="row" id="rowReveal">
      <button class="primary" id="reveal">显示答案</button>
    </div>
    <div class="row" id="rowJudge" style="display:none;">
      <button class="no" id="btnNo">还不熟</button>
      <button class="ok" id="btnOk">记得</button>
    </div>
  </div>
</div>

<div id="done" class="card">
  <h2 id="doneTitle"></h2>
  <p class="sub" id="doneSub" style="margin-bottom:4px;"></p>
  <div id="missList"></div>
  <div class="row">
    <button class="primary" id="again">再练一轮「还不熟」</button>
  </div>
</div>

  {"d":2,"w":"culprit","pos":"n.","p":"/ˈkʌlprɪt/","cn":"罪魁祸首、（问题的）根源","k":"culprit","ex":"The stale IAM principal ID turned out to be the culprit behind the access denials.","tr":"最后发现，那个失效的 IAM principal ID 才是拒绝访问的罪魁祸首。","usage":"The culprit is ... 可自然地指出故障根源，不一定真指犯罪者；常用 turn out to be the culprit。","extraExamples":[{"ex":"We thought the fridge was broken, but a loose plug was the culprit.","tr":"我们以为冰箱坏了，结果是插头松了。"},{"ex":"If your phone keeps overheating, a background app could be the culprit.","tr":"如果手机总是过热，后台应用可能就是原因。"}]},
  {"d":2,"w":"bottleneck","pos":"n.","p":"/ˈbɒtlnek/","cn":"瓶颈、制约点","k":"bottleneck","ex":"IP exhaustion in the VPC CNI became the main bottleneck for scaling the EKS cluster.","tr":"VPC CNI 的 IP 耗尽成了 EKS 集群扩容的主要瓶颈。","usage":"常说 identify / remove a bottleneck，表示找出／消除限制整体速度的环节，也可指道路堵点。","extraExamples":[{"ex":"The single ticket machine became a bottleneck as the crowd arrived.","tr":"人群到来时，唯一的售票机成了拖慢速度的瓶颈。"},{"ex":"More staff won't help until we identify the bottleneck in the approval process.","tr":"找出审批流程的瓶颈之前，增加人手也没用。"}]},
  {"d":2,"w":"tactile","pos":"adj.","p":"/ˈtæktaɪl/","cn":"有触感的、手感反馈好的","k":"tactile","ex":"The BRZ's steering is wonderfully tactile, you feel exactly what the front tyres are doing.","tr":"BRZ 的转向手感极好，前轮的每一个动作你都能清晰感受到。","usage":"常搭配 tactile feedback，描述能通过手感感知的反馈；车评中常指转向让你感觉到轮胎状态。","extraExamples":[{"ex":"The camera's tactile controls make it easy to adjust settings without looking.","tr":"相机的实体按键有清晰手感，不用看也能调整设置。"},{"ex":"I prefer a keyboard with clear tactile feedback.","tr":"我更喜欢按下去有清晰触感反馈的键盘。"}]},

  {"d":2,"w":"resilient","pos":"adj.","p":"/rɪˈzɪliənt/","cn":"有韧性的、抗跌的","k":"resilient","ex":"Despite the sell-off, the Nasdaq has been surprisingly resilient this quarter.","tr":"尽管出现了抛售，纳斯达克本季度的抗跌表现出人意料。","usage":"be resilient to shocks 指能承受冲击并恢复；形容人时侧重挫折后的恢复能力。","extraExamples":[{"ex":"The plants are remarkably resilient and recovered after the dry spell.","tr":"这些植物很有韧性，干旱过后又恢复了生机。"},{"ex":"She's resilient, but that doesn't mean she never needs support.","tr":"她很坚强，但这不代表她从不需要支持。"}]},
  {"d":2,"w":"detour","pos":"n. / v.","p":"/ˈdiːtʊə/","cn":"绕道、绕行路线","k":"detour","ex":"We took a scenic detour through the Yarra Valley on the way to Melbourne.","tr":"去墨尔本的路上，我们绕道穿过了风景优美的雅拉河谷。","usage":"take / make a detour 是绕道；a detour via / through 某地说明经过哪里，不一定是被迫改道。","extraExamples":[{"ex":"A fallen tree forced us to make a long detour.","tr":"一棵倒下的树迫使我们绕了很远的路。"},{"ex":"Can we take a short detour to pick up some groceries?","tr":"我们能不能稍微绕一下，买点食品杂货？"}]},
  {"d":2,"w":"hospitable","pos":"adj.","p":"/hɒˈspɪtəbl/","cn":"好客的、热情周到的","k":"hospitable","ex":"The locals in Brisbane were incredibly hospitable and gave us great tips.","tr":"布里斯班的当地人非常热情好客，给了我们很多好建议。","usage":"常形容人或接待：hospitable hosts / locals；a hospitable environment 则指适合生存或发展的环境。","extraExamples":[{"ex":"Our hosts were so hospitable that we felt at home immediately.","tr":"主人非常热情好客，我们立刻有了宾至如归的感觉。"},{"ex":"Despite arriving late, we received a wonderfully hospitable welcome.","tr":"虽然到得很晚，我们还是受到了十分热情的接待。"}]},
  {"d":3,"w":"provision","pos":"v.","p":"/prəˈvɪʒn/","cn":"配置、开通（资源）","k":"provision","ex":"The Terraform pipeline can provision a new AWS China account in under an hour.","tr":"这条 Terraform 流水线能在一小时内开通一个新的 AWS 中国区账号。","usage":"动词常搭配 provision resources / servers，指配置并准备好资源；名词 provisions 也可指物资或条款。","extraExamples":[{"ex":"Can you provision a temporary account for the external reviewer?","tr":"你能为外部审核人员开通一个临时账户吗？"},{"ex":"The new servers were provisioned overnight and ready by morning.","tr":"新服务器在夜间完成了配置，早上就能使用了。"}]},
  {"d":3,"w":"throttle","pos":"v. / n.","p":"/ˈθrɒtl/","cn":"限流、节流；油门","k":"throttling","ex":"The API started throttling our requests once we exceeded the rate limit.","tr":"一旦超过速率上限，API 就开始对我们的请求限流。","usage":"throttle requests 指限制请求速率，过程叫 throttling；车上的 the throttle 是油门，语境决定意思。","extraExamples":[{"ex":"The provider may throttle your connection once you reach the monthly limit.","tr":"达到月度用量上限后，服务商可能会限制你的网速。"},{"ex":"The bike responded smoothly when I opened the throttle.","tr":"我拧动油门时，摩托车的响应很平顺。"}]},
  {"d":3,"w":"streamline","pos":"v.","p":"/ˈstriːmlaɪn/","cn":"精简、简化（流程）","k":"streamlined","ex":"We streamlined the patching workflow to cut the change window in half.","tr":"我们精简了打补丁的流程，把变更窗口缩短了一半。","usage":"streamline a process / workflow 强调删掉多余步骤、提高效率，通常不表示简单缩短文字。","extraExamples":[{"ex":"Combining the two forms would streamline the registration process.","tr":"合并这两张表格能简化注册流程。"},{"ex":"We've streamlined the weekly report so it takes ten minutes instead of an hour.","tr":"我们简化了周报流程，现在只要十分钟，不再需要一小时。"}]},
  {"d":3,"w":"nimble","pos":"adj.","p":"/ˈnɪmbl/","cn":"灵活敏捷的","k":"nimble","ex":"The BRZ feels remarkably nimble through a tight chicane.","tr":"BRZ 在狭窄的连续弯里显得格外灵活敏捷。","usage":"nimble handling 指车身灵活；形容人可指动作敏捷，形容团队可指快速适应变化。","extraExamples":[{"ex":"You need nimble fingers to fix that tiny clasp.","tr":"修那个小搭扣需要手指灵巧。"},{"ex":"The small team was nimble enough to change direction within a week.","tr":"这个小团队足够灵活，一周内就调整了方向。"}]},
  {"d":3,"w":"poised","pos":"adj.","p":"/pɔɪzd/","cn":"沉稳从容的；蓄势待发的","k":"poised","ex":"The chassis stays poised even when you trail-brake into the apex.","tr":"即便你拖刹进弯心，底盘依然保持沉稳。","usage":"这里形容底盘从容稳定；be poised to do something 是准备就绪、即将做某事，两种结构要分清。","extraExamples":[{"ex":"She looked poised as she walked onto the stage.","tr":"她走上舞台时显得从容自信。"},{"ex":"With the bags packed and the tickets ready, we were poised to leave.","tr":"行李收好、票也准备好，我们随时可以出发。"}]},
  {"d":3,"w":"aromatic","pos":"adj.","p":"/ˌærəˈmætɪk/","cn":"芳香馥郁的","k":"aromatic","ex":"Freshly ground beans fill the kitchen with an aromatic scent.","tr":"刚磨好的咖啡豆让厨房充满馥郁的香气。","usage":"常搭配 aromatic coffee / herbs，侧重散发明显的香气；形容不好闻的味道一般不用它。","extraExamples":[{"ex":"The kitchen smelled of aromatic herbs and roasted garlic.","tr":"厨房里弥漫着香草和烤蒜的香气。"},{"ex":"This tea is wonderfully aromatic even before you add water.","tr":"这种茶还没泡水就已经香气扑鼻。"}]},
  {"d":3,"w":"lingering","pos":"adj.","p":"/ˈlɪŋɡərɪŋ/","cn":"余韵悠长的、久久不散的","k":"lingering","ex":"This natural Ethiopian leaves a lingering, wine-like finish.","tr":"这支日晒埃塞留下一段悠长的、类似红酒的余韵。","usage":"a lingering finish 是久久不散的余味；lingering doubts / pain 则指挥之不去的疑虑或疼痛。","extraExamples":[{"ex":"A lingering cough kept him awake for several nights.","tr":"持续不退的咳嗽让他好几晚睡不好。"},{"ex":"I left with a lingering feeling that we had missed something important.","tr":"离开时，我心里一直觉得我们漏掉了什么重要的事。"}]},
  {"d":3,"w":"volatile","pos":"adj.","p":"/ˈvɒlətaɪl/","cn":"波动剧烈的、易变的","k":"volatile","ex":"Tech stocks have been especially volatile ahead of the earnings season.","tr":"财报季前科技股的波动一直特别剧烈。","usage":"volatile markets / prices 指变化剧烈且难预测；形容人的性情时可指情绪不稳定、容易激动。","extraExamples":[{"ex":"The weather in the mountains can be volatile, so check it again before you leave.","tr":"山里的天气可能变化很大，所以出发前再确认一下。"},{"ex":"The discussion became volatile when the rent increase was mentioned.","tr":"一提到涨租，讨论的气氛就变得很不稳定。"}]},
  {"d":3,"w":"diversify","pos":"v.","p":"/daɪˈvɜːsɪfaɪ/","cn":"分散（投资）、多元化","k":"diversify","ex":"Spreading money across index funds helps diversify your risk.","tr":"把资金分散到多只指数基金有助于分散风险。","usage":"diversify a portfolio 指让投资组合多样化；diversify into 某领域表示拓展到新的业务方向。","extraExamples":[{"ex":"The café diversified its menu after customers asked for more vegetarian options.","tr":"顾客希望有更多素食选择后，咖啡馆丰富了菜单。"},{"ex":"She wants to diversify her skills instead of relying on one specialism.","tr":"她想拓展技能，而不是只依赖一个专长。"}]},
  {"d":3,"w":"bustling","pos":"adj.","p":"/ˈbʌslɪŋ/","cn":"熙攘热闹的","k":"bustling","ex":"Melbourne's laneways are bustling with cafés and street art.","tr":"墨尔本的小巷里满是咖啡馆和街头艺术，热闹非凡。","usage":"a bustling city / market 描述人来人往的热闹；bustling with people 是常见结构，通常带有活力感。","extraExamples":[{"ex":"The quiet square turns into a bustling market on Saturdays.","tr":"安静的广场每到周六就变成热闹的集市。"},{"ex":"We found a table away from the bustling entrance.","tr":"我们找了张远离熙攘入口的桌子。"}]},
  {"d":4,"w":"cumbersome","pos":"adj.","p":"/ˈkʌmbəsəm/","cn":"繁琐笨重的、不好用的","k":"cumbersome","ex":"The current approval process is far too cumbersome for emergency changes.","tr":"目前的审批流程对紧急变更来说实在太繁琐了。","usage":"a cumbersome process 强调操作繁琐；a cumbersome suitcase 则指体积笨重、不便搬动。","extraExamples":[{"ex":"That suitcase is too cumbersome to carry up all these stairs.","tr":"那个行李箱太笨重了，没法拎上这么多级楼梯。"},{"ex":"The booking system is cumbersome even for simple changes.","tr":"这个预订系统很繁琐，做个简单修改也很麻烦。"}]},
  {"d":4,"w":"reconcile","pos":"v.","p":"/ˈrekənsaɪl/","cn":"核对、使一致（对账）","k":"reconcile","ex":"I had to reconcile the patch report with what the agent actually logged.","tr":"我得把补丁报告和 agent 实际记录的日志核对一遍。","usage":"reconcile A with B 表示核对并使两者一致；reconcile differences 可指调和分歧。","extraExamples":[{"ex":"The two receipts don't reconcile with the total on the invoice.","tr":"这两张收据和发票总额对不上。"},{"ex":"I find it hard to reconcile his friendly manner with what he said about us.","tr":"他待人友善，却说了那些关于我们的话，我很难把两者联系起来。"}]},
  {"d":4,"w":"deprecate","pos":"v.","p":"/ˈdeprəkeɪt/","cn":"弃用、不再推荐使用","k":"deprecated","ex":"That API version has been deprecated, so we should migrate before the cutoff.","tr":"那个 API 版本已被弃用，我们应该在截止日期前完成迁移。","usage":"技术中 deprecated 通常表示不再推荐、将被淘汰，并不保证功能已删除；删除可用 removed。","extraExamples":[{"ex":"The release notes explain why the old authentication method was deprecated.","tr":"版本说明解释了旧认证方式为什么被弃用。"},{"ex":"We should warn users before we deprecate that feature.","tr":"弃用那个功能之前，我们应该先通知用户。"}]},
  {"d":4,"w":"oversight","pos":"n.","p":"/ˈəʊvəsaɪt/","cn":"疏忽；监管","k":"oversight","ex":"Deleting the mount target was an oversight, not a deliberate change.","tr":"删除挂载点是一次疏忽，并非有意的变更。","usage":"an oversight 是一次疏忽；不带冠词的 oversight 常指监管，如 regulatory oversight。","extraExamples":[{"ex":"Leaving her name off the invitation was an unfortunate oversight.","tr":"邀请函上漏了她的名字，是一次令人遗憾的疏忽。"},{"ex":"The project needs clearer oversight now that several suppliers are involved.","tr":"现在有多家供应商参与，这个项目需要更明确的监管。"}]},
  {"d":4,"w":"planted","pos":"adj.","p":"/ˈplɑːntɪd/","cn":"（车）抓地扎实、贴地感强","k":"planted","ex":"With the new coilovers, the car feels much more planted at high speed.","tr":"换上新绞牙避震后，这台车高速下的贴地感扎实多了。","usage":"车评常说 feel / stay planted，指贴地、抓地稳定；不表示车真的被固定在地面上。","extraExamples":[{"ex":"The car felt planted through the long bend despite the uneven surface.","tr":"虽然路面不平，车在那个长弯里仍然很稳。"},{"ex":"Fresh tyres made the front end feel more planted in wet conditions.","tr":"新轮胎让车头在湿地上感觉更扎实稳定。"}]},
  {"d":4,"w":"astringent","pos":"adj.","p":"/əˈstrɪndʒənt/","cn":"涩口的、收敛感强的","k":"astringent","ex":"If the grind is too fine, the espresso comes out bitter and astringent.","tr":"如果研磨太细，浓缩萃出来会又苦又涩。","usage":"astringent 描述口腔干涩、收敛的感觉，和 bitter（苦味）不同；茶和咖啡都可以有这两种感受。","extraExamples":[{"ex":"The tea becomes astringent if you leave the bag in too long.","tr":"茶包泡得太久，茶会变涩。"},{"ex":"That wine was a little too astringent for my taste.","tr":"那款葡萄酒对我来说有点太涩了。"}]},
  {"d":4,"w":"prudent","pos":"adj.","p":"/ˈpruːdnt/","cn":"审慎稳妥的","k":"prudent","ex":"It's prudent to keep six months of expenses in cash before investing more.","tr":"在加大投资之前，留出六个月的开销做现金储备是比较审慎的做法。","usage":"It is prudent to do ... 表示做某事较稳妥，语气偏正式；也常说 a prudent decision。","extraExamples":[{"ex":"It would be prudent to confirm the opening hours before driving out there.","tr":"开车过去之前先确认营业时间，会比较稳妥。"},{"ex":"She took the prudent step of keeping copies of all the documents.","tr":"她很审慎，把所有文件都留了副本。"}]},
  {"d":4,"w":"compounding","pos":"n.","p":"/kəmˈpaʊndɪŋ/","cn":"复利（效应）","k":"compounding","ex":"The real power of index investing comes from compounding over decades.","tr":"指数投资真正的威力来自几十年的复利累积。","usage":"the power / effect of compounding 指复利的累积效应；动词 compound 还可表示使问题进一步加重。","extraExamples":[{"ex":"The chart shows the effect of compounding when interest is left in the account.","tr":"这张图展示了利息留在账户里时产生的复利效应。"},{"ex":"Compounding makes the timing of interest payments matter over long periods.","tr":"在较长时期内，复利会让利息支付的时间产生影响。"}]},
  {"d":4,"w":"laid-back","pos":"adj.","p":"/ˌleɪd ˈbæk/","cn":"悠闲随性的、不紧不慢的","k":"laid-back","ex":"Brisbane has a far more laid-back feel than Sydney.","tr":"布里斯班的氛围比悉尼要悠闲随性得多。","usage":"a laid-back person / atmosphere 指随和或轻松，不一定是懒散；写作时保留中间连字符。","extraExamples":[{"ex":"The interview was surprisingly laid-back, more like a conversation over coffee.","tr":"面试出乎意料地轻松，更像是喝咖啡聊天。"},{"ex":"He's laid-back about plans as long as everyone lets him know what's happening.","tr":"只要大家告诉他安排，他对计划怎么定都很随和。"}]},
  {"d":4,"w":"quaint","pos":"adj.","p":"/kweɪnt/","cn":"古雅别致的、小而有味道的","k":"quaint","ex":"We stayed in a quaint little town on the road to the Great Ocean Road.","tr":"去大洋路的路上，我们住在一个古雅的小镇里。","usage":"a quaint village / cottage 常带欣赏意味，指小巧古雅、有旧时魅力，通常不用于现代摩天楼。","extraExamples":[{"ex":"There's a quaint bookshop tucked behind the station.","tr":"车站后面藏着一家古雅的小书店。"},{"ex":"I liked the village, although some of the shops felt a little too quaint and touristy.","tr":"我喜欢那个村子，不过有些商店显得过分古色古香、游客气太重。"}]},
  {"d":5,"w":"hectic","pos":"adj.","p":"/ˈhektɪk/","cn":"忙乱的、兵荒马乱的","k":"hectic","ex":"It's been a hectic week with two major incidents back to back.","tr":"这周忙翻了，接连出了两起重大故障。","usage":"a hectic week / schedule 强调忙且节奏乱；It's been hectic 是朋友聊天和工作闲聊都自然的说法。","extraExamples":[{"ex":"The morning was so hectic that I forgot to eat breakfast.","tr":"早上忙得不可开交，我连早餐都忘了吃。"},{"ex":"Let's go somewhere quiet after such a hectic day.","tr":"忙了这么一天，我们找个安静的地方吧。"}]},
  {"d":5,"w":"juggle","pos":"v.","p":"/ˈdʒʌɡl/","cn":"同时应付、兼顾（多件事）","k":"juggling","ex":"I'm juggling three change requests and an on-call shift this week.","tr":"这周我同时忙着三个变更申请，还要值班。","usage":"juggle work and family / several tasks 指同时兼顾多项责任，常暗示时间精力不够用。","extraExamples":[{"ex":"She juggles study, part-time work and training without much time to herself.","tr":"她兼顾学习、兼职和训练，几乎没有自己的时间。"},{"ex":"I'm struggling to juggle all these appointments next week.","tr":"下周这么多预约，我有点安排不过来了。"}]},
  {"d":5,"w":"sluggish","pos":"adj.","p":"/ˈslʌɡɪʃ/","cn":"迟缓的、反应慢的","k":"sluggish","ex":"The database has been sluggish since the disk hit ninety percent.","tr":"自从磁盘用到 90%，数据库就一直很迟缓。","usage":"这里指系统反应慢；也可说 feel sluggish 描述自己没精神，比单纯 slow 多一层迟钝感。","extraExamples":[{"ex":"I feel sluggish if I sit indoors all afternoon.","tr":"整个下午坐在屋里，我会觉得懒洋洋、提不起劲。"},{"ex":"The laptop became sluggish when I opened several large files.","tr":"同时打开几个大文件后，笔记本电脑变得迟缓了。"}]},
  {"d":5,"w":"crisp","pos":"adj.","p":"/krɪsp/","cn":"干脆利落的；清爽的","k":"crisp","ex":"The short-throw shifter gives you a really crisp gear change.","tr":"这套短行程换挡杆的换挡手感非常干脆利落。","usage":"crisp gear changes 指换挡清晰利落；crisp air 是清爽空气，crisp food 则是酥脆食物。","extraExamples":[{"ex":"The sheets were crisp and cool when we climbed into bed.","tr":"我们上床时，床单挺括又凉爽。"},{"ex":"The camera captured the lettering in crisp detail.","tr":"相机把字母拍得清晰细致。"}]},
  {"d":5,"w":"brisk","pos":"adj.","p":"/brɪsk/","cn":"轻快的、爽利的","k":"brisk","ex":"We took a brisk walk along the river before the cafés opened.","tr":"趁咖啡馆还没开门，我们沿着河边快步走了一段。","usage":"a brisk walk / pace 指速度快、步伐有精神；go for a brisk walk 是常用日常搭配。","extraExamples":[{"ex":"We set off at a brisk pace to catch the earlier train.","tr":"为了赶上早一班火车，我们迈着轻快的步子出发了。"},{"ex":"The receptionist gave me a brisk but helpful explanation.","tr":"前台给我的解释简短利落，但很有帮助。"}]},
  {"d":5,"w":"pricey","pos":"adj.","p":"/ˈpraɪsi/","cn":"偏贵的（口语）","k":"pricey","ex":"Coffee in Melbourne is good, though a bit pricey compared to Shanghai.","tr":"墨尔本的咖啡很不错，就是比上海贵一些。","usage":"口语常说 a bit pricey / pretty pricey，表示觉得偏贵；正式说明价格时用 expensive 更中性。","extraExamples":[{"ex":"The hotel was pricey, but being able to walk everywhere was convenient.","tr":"酒店有点贵，不过去哪儿都能走路很方便。"},{"ex":"Those shoes are a bit pricey for something I'll only wear once.","tr":"那双鞋我只会穿一次，这个价钱有点贵了。"}]},
  {"d":5,"w":"give someone a heads-up","pos":"phr.","p":"/ˈhedz ʌp/","cn":"提前打个招呼、事先知会一声","k":"a heads-up","ex":"Just a heads-up: the patching window may run past midnight.","tr":"提前跟你说一声：打补丁的窗口可能会拖到午夜以后。","usage":"give someone a heads-up about something 是提前提醒；Just a heads-up: ... 可直接放在消息开头。","extraExamples":[{"ex":"Could you give me a heads-up if you're bringing anyone else?","tr":"如果你还要带别人来，能不能提前跟我说一声？"},{"ex":"Thanks for the heads-up about the roadworks; I took a different route.","tr":"谢谢你提前提醒道路施工的事，我换了条路线。"}]},
  {"d":5,"w":"circle back","pos":"phr. v.","p":"/ˈsɜːkl bæk/","cn":"回头再聊、稍后再跟进","k":"circle back","ex":"Let's circle back on the RDS upgrade once the test results are in.","tr":"等测试结果出来，我们再回头讨论 RDS 升级的事。","usage":"办公室常用 circle back to / on a topic 表示稍后再谈；朋友间可以直接说 get back to this。","extraExamples":[{"ex":"We can circle back to the budget after we've agreed on the dates.","tr":"确定日期之后，我们可以再回头讨论预算。"},{"ex":"I wanted to circle back on something you mentioned yesterday.","tr":"我想回头聊聊你昨天提到的一件事。"}]},
  {"d":5,"w":"off the top of my head","pos":"phr.","p":"/ɒf ðə tɒp əv maɪ hed/","cn":"凭印象说、一时想到的（不确定）","k":"Off the top of my head","ex":"Off the top of my head, I'd say around twenty servers were affected.","tr":"我凭印象说，大概有二十台服务器受影响。","usage":"表示没查资料、凭记忆估计，常用于回答数字或细节；说话人可换成 his / her head。","extraExamples":[{"ex":"I can't remember the address off the top of my head, but it's in my messages.","tr":"我一下子想不起地址，不过消息里有。"},{"ex":"Off the top of my head, the walk takes about two hours.","tr":"凭印象说，那段路大概要走两个小时。"}]},
  {"d":5,"w":"call it a day","pos":"phr.","p":"/kɔːl ɪt ə deɪ/","cn":"今天就到这儿吧、收工","k":"call it a day","ex":"The logs can wait until tomorrow — let's call it a day.","tr":"日志明天再看吧，今天就到这儿。","usage":"Let's call it a day 是结束今天这轮工作或活动，不要求事情全部完成；过去式 called it a day。","extraExamples":[{"ex":"We've done enough painting for one afternoon. Shall we call it a day?","tr":"一个下午刷了这么多漆，今天就到这里吧？"},{"ex":"Let's finish this section and call it a day.","tr":"我们把这一段做完，今天就收工。"}]},
  {"d":6,"w":"backlog","pos":"n.","p":"/ˈbæklɒɡ/","cn":"积压的待办工作","k":"backlog","ex":"We're still working through a backlog of patching tickets from last month.","tr":"我们还在处理上个月积压下来的打补丁工单。","usage":"a backlog of tickets / work 是积压任务；clear / work through the backlog 表示清掉／逐步处理。","extraExamples":[{"ex":"A backlog of unread messages was waiting when I got back from leave.","tr":"休假回来时，一堆未读消息正等着我。"},{"ex":"The workshop is hiring another mechanic to clear its backlog of repairs.","tr":"修理厂正在招聘另一名技师，处理积压的维修工作。"}]},
  {"d":6,"w":"circumvent","pos":"v.","p":"/ˌsɜːkəmˈvent/","cn":"规避、绕过（规则或管控）","k":"circumvent","ex":"Please don't circumvent the change process just to save time.","tr":"请不要为了省时间就绕过变更流程。","usage":"直接接 rules / restrictions / a process，指设法绕过限制；常暗示规避正常程序，语气比 avoid 强。","extraExamples":[{"ex":"Taking the side streets lets us circumvent the road closure.","tr":"走小路可以绕过封路路段。"},{"ex":"The new process shouldn't become another rule that people try to circumvent.","tr":"新流程不应该变成另一条大家想办法绕过的规定。"}]},
  {"d":6,"w":"erratic","pos":"adj.","p":"/ɪˈrætɪk/","cn":"飘忽不定的、时好时坏的","k":"erratic","ex":"The node's memory usage has been erratic since the last deployment.","tr":"上次部署之后，这个节点的内存占用一直飘忽不定。","usage":"erratic behaviour / performance 指没有稳定规律，未必周期性发生；intermittent 更强调断断续续。","extraExamples":[{"ex":"Her sleep has been erratic since she started working nights.","tr":"开始上夜班以后，她的睡眠一直不规律。"},{"ex":"The bus service is too erratic to rely on for an early flight.","tr":"公交车的班次太不稳定，赶早班飞机不能指望它。"}]},
  {"d":6,"w":"taut","pos":"adj.","p":"/tɔːt/","cn":"紧绷的、绷得住的（底盘）","k":"taut","ex":"The KW coilovers give the car a taut, controlled feel over bumps.","tr":"这套 KW 绞牙让车过颠簸时有一种紧绷、受控的感觉。","usage":"taut suspension 描述紧致受控的悬架；a taut rope 是拉紧的绳子，注意不要和 taught 混淆。","extraExamples":[{"ex":"Pull the rope taut before you secure the tent.","tr":"固定帐篷前，先把绳子拉紧。"},{"ex":"His shoulders were taut with tension throughout the meeting.","tr":"整个会议期间，他的肩膀都紧绷着。"}]},
  {"d":6,"w":"syrupy","pos":"adj.","p":"/ˈsɪrəpi/","cn":"糖浆般浓稠的","k":"syrupy","ex":"A well-pulled ristretto should be thick and almost syrupy.","tr":"萃取得好的 ristretto 应该浓稠得近乎糖浆感。","usage":"a syrupy texture 指浓稠如糖浆，未必特别甜；形容音乐或感情表达时也可含过分甜腻之意。","extraExamples":[{"ex":"The sauce turns syrupy as it cools.","tr":"酱汁冷却时会变得像糖浆一样浓稠。"},{"ex":"The dessert was too syrupy and sweet for me.","tr":"那道甜点对我来说太黏稠、太甜了。"}]},
  {"d":6,"w":"balmy","pos":"adj.","p":"/ˈbɑːmi/","cn":"温暖宜人的（天气）","k":"balmy","ex":"Brisbane was still balmy in early October.","tr":"十月初的布里斯班依然温暖宜人。","usage":"a balmy evening / breeze 指温暖柔和、令人舒服；天气热得难受时不宜用 balmy。","extraExamples":[{"ex":"We sat outside all evening in the balmy air.","tr":"晚风温暖宜人，我们在外面坐了一整晚。"},{"ex":"After a week of cold rain, a balmy afternoon felt like a treat.","tr":"冷雨下了一周后，一个温暖宜人的下午简直是享受。"}]},
  {"d":6,"w":"touch base","pos":"phr. v.","p":"/tʌtʃ beɪs/","cn":"碰个头、简短沟通一下","k":"touch base","ex":"Let's touch base on Friday before the change freeze kicks in.","tr":"变更冻结开始之前，我们周五碰个头。","usage":"touch base with someone about something 指简短联系、同步情况；适合工作沟通，也可用于朋友联络。","extraExamples":[{"ex":"I'll touch base with you when I know what time we're arriving.","tr":"知道抵达时间后，我会和你联系一下。"},{"ex":"Can we touch base tomorrow to see whether you need any help?","tr":"我们明天简短聊一下，看看你是否需要帮忙，好吗？"}]},
  {"d":6,"w":"be on the same page","pos":"phr.","p":"/ɒn ðə seɪm peɪdʒ/","cn":"理解一致、达成共识","k":"on the same page","ex":"I'd like to make sure we're all on the same page before I send this out.","tr":"在我发出去之前，想确认一下大家的理解是一致的。","usage":"be on the same page about something 强调对事情理解或目标一致；不是所有想法都完全相同。","extraExamples":[{"ex":"Are we on the same page about splitting the accommodation costs?","tr":"关于平摊住宿费，我们的理解一致吗？"},{"ex":"Before you book anything, let's get everyone on the same page.","tr":"你订任何东西之前，我们先让大家达成一致。"}]},
  {"d":6,"w":"drop the ball","pos":"phr.","p":"/drɒp ðə bɔːl/","cn":"掉链子、办事失误","k":"dropped the ball","ex":"I dropped the ball on that ticket — I forgot to update the status.","tr":"那个工单我掉链子了，忘了更新状态。","usage":"常说 I dropped the ball on ... 承认自己疏忽；直接说别人 dropped the ball 可能带责备语气。","extraExamples":[{"ex":"I really dropped the ball by forgetting to collect her from the station.","tr":"我忘了去车站接她，这次真是掉链子了。"},{"ex":"Nobody wants to admit they dropped the ball, but we need to fix the problem.","tr":"没人愿意承认自己出了差错，但我们得解决问题。"}]},
  {"d":6,"w":"worth a shot","pos":"phr.","p":"/wɜːθ ə ʃɒt/","cn":"值得一试","k":"worth a shot","ex":"Prefix delegation might not fix it, but it's worth a shot.","tr":"前缀委派未必能解决，但值得一试。","usage":"It's worth a shot 表示成功不保证，但可以试试；worth 后接名词或 doing，不接 to do。","extraExamples":[{"ex":"The café may be full, but asking for a table is worth a shot.","tr":"那家咖啡馆可能已经满了，不过问问有没有位子值得一试。"},{"ex":"I've never tried trail running, but it looks worth a shot.","tr":"我没试过越野跑，不过看起来值得尝试。"}]},
  {"d":7,"w":"inadvertently","pos":"adv.","p":"/ˌɪnədˈvɜːtəntli/","cn":"无意中、不小心地","k":"inadvertently","ex":"The script inadvertently removed the versionlock before the upgrade.","tr":"该脚本在升级前无意中移除了 versionlock。","usage":"常用于解释非故意操作：inadvertently deleted / changed；比 accidentally 正式，适合复盘说明。","extraExamples":[{"ex":"I inadvertently sent the invitation to the wrong group.","tr":"我不小心把邀请发错了群。"},{"ex":"The wording may inadvertently make the offer sound less generous than it is.","tr":"这段措辞可能无意中让优惠显得没那么大方。"}]},
  {"d":7,"w":"preemptive","pos":"adj.","p":"/priˈemptɪv/","cn":"先发的、预防性的","k":"preemptive","ex":"We did a preemptive reboot rather than waiting for the node to fail.","tr":"我们主动做了一次预防性重启，而不是等节点挂掉。","usage":"preemptive action 指提前出手避免问题或抢先行动；preventive maintenance 更常指常规预防性维护。","extraExamples":[{"ex":"We made a preemptive booking before the holiday dates were announced.","tr":"假期日期公布前，我们就先预订了。"},{"ex":"A preemptive call to the hotel saved us a long wait at reception.","tr":"提前给酒店打了个电话，让我们省去了在前台久等的麻烦。"}]},
  {"d":7,"w":"granular","pos":"adj.","p":"/ˈɡrænjələ/","cn":"细粒度的、颗粒感的","k":"granular","ex":"IAM lets you define granular permissions down to a single action.","tr":"IAM 允许你把权限细化到单个操作。","usage":"granular permissions / detail 指划分很细；more granular 是更细致，技术交流中比日常聊天常见。","extraExamples":[{"ex":"Could you give us a more granular breakdown of the costs?","tr":"你能把费用分得更细一点吗？"},{"ex":"The map provides a granular view of each neighbourhood.","tr":"这张地图详细展示了每个社区的情况。"}]},
  {"d":7,"w":"jittery","pos":"adj.","p":"/ˈdʒɪtəri/","cn":"心慌手抖的；（市场）神经紧张的","k":"jittery","ex":"Too much espresso before a track day leaves me jittery.","tr":"赛道日之前喝太多浓缩会让我心慌手抖。","usage":"feel jittery 常描述紧张、心慌或咖啡喝多后的抖动；它侧重身体和情绪上的不安。","extraExamples":[{"ex":"I get jittery before speaking in front of a large group.","tr":"在一大群人面前发言之前，我会紧张不安。"},{"ex":"The long wait made everyone a little jittery.","tr":"漫长的等待让大家都有点焦躁。"}]},
  {"d":7,"w":"winding","pos":"adj.","p":"/ˈwaɪndɪŋ/","cn":"蜿蜒曲折的","k":"winding","ex":"The road up to Kamikochi is narrow and winding.","tr":"通往上高地的那条路又窄又蜿蜒。","usage":"a winding road / path 是蜿蜒路线，读音与 wind（风）不同；沿路多个弯，不只是一个拐角。","extraExamples":[{"ex":"A winding path led from the house down to the beach.","tr":"一条蜿蜒的小径从房子通向海滩。"},{"ex":"I felt sick on the winding bus ride through the hills.","tr":"公交车在山间绕来绕去，我坐得有点晕。"}]},
  {"d":7,"w":"steep","pos":"adj. / v.","p":"/stiːp/","cn":"陡峭的；（价格）高昂的；浸泡","k":"steep","ex":"The learning curve for EKS networking is pretty steep.","tr":"EKS 网络的学习曲线相当陡。","usage":"a steep learning curve 常表示上手困难；a steep price 指价格高，动词 steep tea 则是泡茶。","extraExamples":[{"ex":"The final stretch of the climb is steep but quite short.","tr":"最后一段上坡很陡，不过不长。"},{"ex":"That's a steep price for a room without a window.","tr":"一间没有窗的房间卖这个价钱，实在太贵了。"}]},
  {"d":7,"w":"bear with me","pos":"phr.","p":"/beə wɪð miː/","cn":"请稍等一下、担待一下","k":"Bear with me","ex":"Bear with me while I pull up the CloudWatch dashboard.","tr":"稍等我一下，我把 CloudWatch 面板调出来。","usage":"Bear with me while ... 是请对方耐心稍等；拼 bear，不是 bare，后者表示裸露。","extraExamples":[{"ex":"Bear with me; I'm still getting used to the new camera.","tr":"稍等我一下，我还在熟悉这台新相机。"},{"ex":"Could you bear with us while we find your reservation?","tr":"我们查找预订记录时，请您稍等一下，好吗？"}]},
  {"d":7,"w":"run something by someone","pos":"phr. v.","p":"/rʌn ˈsʌmθɪŋ baɪ/","cn":"跟某人过一下、征求一下意见","k":"run this change plan by","ex":"Let me run this change plan by the security team first.","tr":"我先把这份变更方案跟安全团队过一下。","usage":"run an idea / plan by someone 是先请人看看并给意见；用代词时说 run it by you。","extraExamples":[{"ex":"Can I run an idea by you before I book the trip?","tr":"订旅行之前，我能不能先跟你聊个想法？"},{"ex":"She ran the revised schedule by everyone at lunch.","tr":"午饭时，她把修改后的时间表拿给大家过了一遍。"}]},
  {"d":7,"w":"in hindsight","pos":"phr.","p":"/ɪn ˈhaɪndsaɪt/","cn":"事后回想、现在看来","k":"In hindsight","ex":"In hindsight, we should have tested the patch in dev first.","tr":"事后回想，我们本该先在 dev 环境测这个补丁。","usage":"In hindsight 常放句首，表示有了后来的信息再回看；常接 should have done 来总结教训。","extraExamples":[{"ex":"In hindsight, taking the overnight bus wasn't worth the money we saved.","tr":"事后想想，坐通宵大巴省下的钱不值得我们这么折腾。"},{"ex":"It's easy to spot the warning signs in hindsight.","tr":"事后回看，那些警示信号很容易就能发现。"}]},
  {"d":7,"w":"loop someone in","pos":"phr. v.","p":"/luːp ˈsʌmwʌn ɪn/","cn":"把某人拉进来知会一声","k":"loop you in","ex":"I'll loop you in on the thread with the global team.","tr":"我会把你加进跟全球团队的那条邮件线里。","usage":"loop someone in on something 表示让对方加入沟通并知情；代词放中间：loop me in。","extraExamples":[{"ex":"I'll loop Sam in so he knows where to meet us.","tr":"我会把山姆也拉进来，好让他知道在哪里会合。"},{"ex":"Could you loop me in on any changes to the itinerary?","tr":"行程有变化的话，能不能也通知我？"}]},
  {"d":8,"w":"overhaul","pos":"n. / v.","p":"/ˈəʊvəhɔːl/","cn":"彻底整改、大修","k":"overhaul","ex":"The patching process needs a complete overhaul, not another quick fix.","tr":"打补丁的流程需要彻底重做，而不是再打一个补丁了事。","usage":"a complete overhaul 是全面重做；动词 overhaul a system / engine 可指彻底改革或大修。","extraExamples":[{"ex":"The old house needs a complete overhaul before anyone can move in.","tr":"这栋老房子要彻底翻修后才能入住。"},{"ex":"We overhauled the menu after listening to our regular customers.","tr":"听取常客的意见后，我们彻底调整了菜单。"}]},
  {"d":8,"w":"stopgap","pos":"n. / adj.","p":"/ˈstɒpɡæp/","cn":"权宜之计、临时顶一下的办法","k":"stopgap","ex":"Restarting the service is only a stopgap until we fix the memory leak.","tr":"重启服务只是权宜之计，真正要解决的是内存泄漏。","usage":"a stopgap measure / solution 是临时顶上的办法，默认仍需长期方案；通常不用于成熟的最终解决方案。","extraExamples":[{"ex":"Sleeping on the sofa is a stopgap while the spare room is being decorated.","tr":"客房装修期间，睡沙发只是临时办法。"},{"ex":"We need a lasting solution rather than another stopgap measure.","tr":"我们需要长久的解决办法，而不是再来一个权宜措施。"}]},
  {"d":8,"w":"scrutiny","pos":"n.","p":"/ˈskruːtəni/","cn":"仔细审查、严格审视","k":"scrutiny","ex":"Any change to production networking gets extra scrutiny from the security team.","tr":"任何生产网络的变更都会受到安全团队的额外审查。","usage":"under scrutiny / come under scrutiny 是受到审查；scrutiny 通常不可数，不说 a scrutiny。","extraExamples":[{"ex":"Her proposal stood up well to close scrutiny.","tr":"她的提议经受住了仔细审查。"},{"ex":"The decision came under scrutiny after residents raised concerns.","tr":"居民提出担忧后，这个决定受到了审视。"}]},
  {"d":8,"w":"skittish","pos":"adj.","p":"/ˈskɪtɪʃ/","cn":"躁动不安的；（车尾）发飘不安分的","k":"skittish","ex":"The rear end feels skittish over bumps when the damping is too stiff.","tr":"阻尼调得太硬时，车尾过颠簸会显得躁动不安。","usage":"可形容易受惊的动物或紧张的人；车尾 skittish 则是对路面变化敏感、显得不安定。","extraExamples":[{"ex":"The horse gets skittish around loud traffic.","tr":"那匹马遇到吵闹的车流就会惊慌。"},{"ex":"I'm a little skittish about booking with that company again.","tr":"再次找那家公司预订，让我有点不安。"}]},
  {"d":8,"w":"muted","pos":"adj.","p":"/ˈmjuːtɪd/","cn":"平淡的、不强烈的（反应/风味）","k":"muted","ex":"The market reaction to the earnings was surprisingly muted.","tr":"市场对这份财报的反应出奇地平淡。","usage":"a muted response / reaction 指反应不强烈；muted colours 是柔和低调的颜色，不等于完全没有颜色。","extraExamples":[{"ex":"The room was decorated in muted greens and greys.","tr":"房间用了柔和的绿色和灰色装饰。"},{"ex":"His response to the invitation was rather muted.","tr":"他对邀请的回应相当平淡。"}]},
  {"d":8,"w":"grueling","pos":"adj.","p":"/ˈɡruːəlɪŋ/","cn":"极其累人的、折磨人的","k":"grueling","ex":"A full day of track sessions is more grueling than it looks.","tr":"一整天的赛道跑下来，比看上去累多了。","usage":"a grueling session 强调身心都很吃力；英澳常见拼写 gruelling，与历史条目的 grueling 同义。","extraExamples":[{"ex":"The final kilometres of the hike were grueling in the afternoon heat.","tr":"午后的酷热让徒步最后几公里格外难熬。"},{"ex":"After a grueling week of moving house, we ordered takeaway and did nothing.","tr":"搬家折腾了一周，我们累得够呛，最后叫了外卖，什么也没做。"}]},
  {"d":8,"w":"keep someone posted","pos":"phr.","p":"/kiːp ˈsʌmwʌn ˈpəʊstɪd/","cn":"随时同步进展给某人","k":"keep you posted","ex":"I'll keep you posted as the patching progresses tonight.","tr":"今晚打补丁的进展我会随时同步给你。","usage":"keep someone posted on / about progress 是持续告知新进展；I'll keep you posted 可独立作为回复。","extraExamples":[{"ex":"Keep me posted if you hear whether the concert is going ahead.","tr":"如果你听说演唱会是否照常举行，随时告诉我。"},{"ex":"I'll keep you posted on our arrival time once we're on the road.","tr":"上路之后，我会随时向你更新抵达时间。"}]},
  {"d":8,"w":"hold off on something","pos":"phr. v.","p":"/həʊld ɒf ɒn/","cn":"先缓一缓、暂时不做","k":"hold off on","ex":"Let's hold off on the deployment until the change freeze lifts.","tr":"我们先缓一缓，等变更冻结解除再部署。","usage":"hold off on a decision / doing something 是暂缓行动；说 hold off until Friday 可交代等到何时。","extraExamples":[{"ex":"I'd hold off on buying that jacket until you've tried it on.","tr":"那件外套我会先试穿，再决定买不买。"},{"ex":"They held off on announcing the result until everyone had been contacted.","tr":"他们等联系完所有人后，才公布结果。"}]},
  {"d":8,"w":"at short notice","pos":"phr.","p":"/ət ʃɔːt ˈnəʊtɪs/","cn":"临时通知、仓促之间","k":"at such short notice","ex":"Thanks for joining the call at such short notice.","tr":"感谢你这么临时地加入这个会。","usage":"英澳常说 at short notice；美式常见 on short notice，感谢临时参加时可加 such。","extraExamples":[{"ex":"I'm sorry to change the plan at such short notice.","tr":"这么临时改计划，真不好意思。"},{"ex":"It's hard to find a reasonably priced room at short notice.","tr":"临时很难找到价格合理的房间。"}]},
  {"d":8,"w":"iron out","pos":"phr. v.","p":"/ˈaɪən aʊt/","cn":"理顺、解决（细节或分歧）","k":"iron out","ex":"We still need to iron out a few details before the go-live.","tr":"上线之前还有几个细节需要理顺。","usage":"iron out details / differences 指把剩余问题理顺；代词放中间：iron them out。","extraExamples":[{"ex":"A quick rehearsal helped us iron out the awkward transitions.","tr":"一次简短排练帮我们理顺了不自然的衔接。"},{"ex":"We can iron out the payment details when we meet.","tr":"付款细节等见面时再商量妥当。"}]},
  {"d":9,"w":"cascade","pos":"v. / n.","p":"/kæˈskeɪd/","cn":"级联、引发连锁反应","k":"cascaded","ex":"One failed mount target cascaded into a full boot failure.","tr":"一个失效的挂载点级联引发了整台机器无法启动。","usage":"cascade into further failures 指故障引发后续连锁问题；cascading failures 是常见技术搭配。","extraExamples":[{"ex":"One cancelled train caused a cascade of missed connections.","tr":"一班火车取消，引发了一连串错过转乘的问题。"},{"ex":"Small delays can cascade through the whole delivery schedule.","tr":"小延误可能连锁影响整个配送时间表。"}]},
  {"d":9,"w":"contentious","pos":"adj.","p":"/kənˈtenʃəs/","cn":"有争议的、容易吵起来的","k":"contentious","ex":"Whether to put the endpoint on the consumer side turned out to be contentious.","tr":"端点该放在消费方这一侧，结果成了很有争议的问题。","usage":"a contentious issue / decision 指容易引发争论；形容人时则可能是爱争辩，语气较负面。","extraExamples":[{"ex":"Parking is a contentious issue in our neighbourhood.","tr":"停车是我们社区一个争议很大的问题。"},{"ex":"We left the most contentious point until everyone had finished eating.","tr":"我们等大家吃完饭后，才讨论最有争议的问题。"}]},
  {"d":9,"w":"finicky","pos":"adj.","p":"/ˈfɪnɪki/","cn":"难伺候的、挑剔麻烦的","k":"finicky","ex":"The old SSM agent is finicky about proxy settings.","tr":"老版本的 SSM agent 对代理设置很挑剔。","usage":"be finicky about settings / food 指特别挑条件；用于软件时是口语化说它难调、难伺候。","extraExamples":[{"ex":"The coffee machine is finicky about how tightly you fit the filter.","tr":"这台咖啡机对滤网装得有多紧很挑剔。"},{"ex":"He's a finicky eater, so check the menu before booking.","tr":"他吃东西很挑剔，所以订位前先看看菜单。"}]},
  {"d":9,"w":"drawdown","pos":"n.","p":"/ˈdrɔːdaʊn/","cn":"回撤（从高点下跌的幅度）","k":"drawdown","ex":"I add more capital whenever the index hits a ten percent drawdown.","tr":"每当指数回撤 10%，我就追加一笔资金。","usage":"a drawdown 指相对先前高点的回撤；report a 10% drawdown 是描述指标，不等于已卖出亏损。","extraExamples":[{"ex":"The report compares the fund's largest drawdown with those of earlier years.","tr":"报告把这只基金的最大回撤与往年作了比较。"},{"ex":"A strong annual return can still include a substantial drawdown along the way.","tr":"即使年度收益表现很强，期间也可能出现明显回撤。"}]},
  {"d":9,"w":"immaculate","pos":"adj.","p":"/ɪˈmækjələt/","cn":"一尘不染的、完美无瑕的","k":"immaculate","ex":"He keeps the car immaculate, even after a track day.","tr":"他把车保持得一尘不染，哪怕刚跑完赛道。","usage":"in immaculate condition 是状态极好、几乎无瑕；也常说 an immaculate kitchen 指一尘不染。","extraExamples":[{"ex":"The kitchen was immaculate when the guests arrived.","tr":"客人到来时，厨房一尘不染。"},{"ex":"She found a second-hand jacket in immaculate condition.","tr":"她找到了一件保存得几乎全新的二手外套。"}]},
  {"d":9,"w":"layover","pos":"n.","p":"/ˈleɪəʊvə/","cn":"中转停留（短暂等待）","k":"layover","ex":"We had a six-hour layover in Singapore on the way to Melbourne.","tr":"去墨尔本的路上，我们在新加坡中转停留了六个小时。","usage":"have a layover in Singapore / a six-hour layover 是中转等候；英澳旅行交流中也常用 stopover。","extraExamples":[{"ex":"Our layover was just long enough to get lunch and stretch our legs.","tr":"中转停留时间刚好够我们吃午饭、活动一下。"},{"ex":"I'd rather have a longer layover than risk missing the connection.","tr":"我宁愿中转时间长一点，也不想冒着赶不上转机的风险。"}]},
  {"d":9,"w":"fall through the cracks","pos":"phr.","p":"/fɔːl θruː ðə kræks/","cn":"被漏掉、没人跟进就没了下文","k":"fall through the cracks","ex":"Let's log it now so it doesn't fall through the cracks.","tr":"现在就把它登记下来，免得这事儿被漏掉。","usage":"常以任务或事项作主语：Something fell through the cracks，表示流程中被遗漏，没有人持续跟进。","extraExamples":[{"ex":"Without a shared list, small requests tend to fall through the cracks.","tr":"没有共用清单，小请求往往会被漏掉。"},{"ex":"Her application fell through the cracks when the office changed staff.","tr":"办公室换人时，她的申请被遗漏了。"}]},
  {"d":9,"w":"play it by ear","pos":"phr.","p":"/pleɪ ɪt baɪ ɪə/","cn":"看情况再定、随机应变","k":"play it by ear","ex":"We haven't booked anything for Sunday, so we'll play it by ear.","tr":"周日我们什么都没订，到时候看情况再说。","usage":"Let's play it by ear 表示先不定死、到时再看；不要把耳朵的字面意思带入旅行安排。","extraExamples":[{"ex":"We can play it by ear if the weather looks uncertain.","tr":"天气不确定的话，我们可以看情况再决定。"},{"ex":"Let's not promise a finish time; we'll play it by ear.","tr":"我们先别承诺结束时间，到时候看情况吧。"}]},
  {"d":9,"w":"on the back burner","pos":"phr.","p":"/ɒn ðə bæk ˈbɜːnə/","cn":"暂时搁置、优先级往后放","k":"on the back burner","ex":"The dashboard project is on the back burner until Q4.","tr":"那个看板项目先搁置，等第四季度再说。","usage":"put something on the back burner 是降低优先级、留待以后；与取消计划不同，仍可能继续做。","extraExamples":[{"ex":"The renovation is on the back burner while we sort out the roof.","tr":"修好屋顶之前，装修计划先搁置。"},{"ex":"She put her travel plans on the back burner to care for her father.","tr":"为了照顾父亲，她暂时搁置了旅行计划。"}]},
  {"d":9,"w":"a long shot","pos":"phr.","p":"/ə lɒŋ ʃɒt/","cn":"希望不大的尝试、赌一把","k":"a long shot","ex":"Rolling back the driver is a long shot, but nothing else has worked.","tr":"回滚驱动希望不大，但别的办法都试过了。","usage":"It's a long shot, but ... 常引出成功机会不大的尝试；强调概率低，不是路程长。","extraExamples":[{"ex":"Finding a quiet campsite this late is a long shot.","tr":"这么晚才找安静的营地，希望不大。"},{"ex":"It's a long shot, but the owner might still have a spare key.","tr":"希望不大，不过房东也许还留着一把备用钥匙。"}]},

  {"d":10,"w":"convoluted","pos":"adj.","p":"/ˈkɒnvəluːtɪd/","cn":"错综复杂的、绕来绕去的","k":"convoluted","ex":"The cross-account routing setup is so convoluted that nobody wants to touch it.","tr":"这套跨账号路由绕得没人愿意碰。","usage":"a convoluted explanation / setup 指复杂得难理解，通常带批评意味；不只是中性的 complex。","extraExamples":[{"ex":"The film's plot was so convoluted that I lost track of who was related to whom.","tr":"电影情节太绕，我都搞不清谁和谁是什么关系了。"},{"ex":"There's a much simpler route than that convoluted set of directions.","tr":"与其按那套绕来绕去的指示走，不如选一条简单得多的路线。"}]},
  {"d":10,"w":"compliant","pos":"adj.","p":"/kəmˈplaɪənt/","cn":"合规的；（悬架）柔顺有韧性的","k":"compliant","ex":"A compliant suspension soaks up bumps without feeling floaty.","tr":"有柔顺性的悬架能吸收颠簸，又不会发飘。","usage":"车评中 compliant suspension 指柔顺、能贴合路面；合规含义则用 compliant with rules / standards。","extraExamples":[{"ex":"The building has been made compliant with the new access requirements.","tr":"这栋楼已经完成改造，符合新的无障碍要求。"},{"ex":"The tyres have a compliant sidewall that softens small bumps.","tr":"这些轮胎的胎壁比较柔顺，能缓和小颠簸。"}]},
  {"d":10,"w":"stale","pos":"adj.","p":"/steɪl/","cn":"不新鲜的；（数据）过期失效的","k":"stale","ex":"The dashboard was showing stale data from a cached query.","tr":"面板显示的是缓存查询里的过期数据。","usage":"stale data / credentials 指过期或失效；stale bread 是不新鲜的面包，两者都强调失去原有状态。","extraExamples":[{"ex":"The bread had gone stale by the time we got home.","tr":"我们到家时，面包已经不新鲜了。"},{"ex":"We're making decisions using stale information from last year.","tr":"我们在用去年的过时信息做决定。"}]},
  {"d":10,"w":"overrated","pos":"adj.","p":"/ˌəʊvəˈreɪtɪd/","cn":"名过其实的、被高估的","k":"overrated","ex":"The tourist strip was overrated; the suburbs had far better coffee.","tr":"那条游客街名过其实，郊区的咖啡好得多。","usage":"I think it's overrated 是认为名气超过实际水平，带主观评价；比较委婉可加 a bit。","extraExamples":[{"ex":"I thought the restaurant was overrated, though the service was lovely.","tr":"虽然服务很好，但我觉得那家餐厅名过其实。"},{"ex":"That viewpoint is overrated; the walk there is much more memorable.","tr":"那个观景点被高估了，反而是走过去的过程更难忘。"}]},
  {"d":10,"w":"rebalance","pos":"v.","p":"/ˌriːˈbæləns/","cn":"再平衡（调整资产配置比例）","k":"rebalance","ex":"I rebalance the portfolio once a year rather than reacting to every dip.","tr":"我一年做一次组合再平衡，而不是每次下跌都去反应。","usage":"rebalance a portfolio 指调整资产权重；也可说 rebalance workloads 表示重新分配工作负载。","extraExamples":[{"ex":"The manager rebalanced the fund after its quarterly review.","tr":"季度复核后，经理调整了基金的资产配置。"},{"ex":"We rebalanced the workload so one person wasn't carrying everything.","tr":"我们重新分配了工作量，不让一个人扛下全部。"}]},
  {"d":10,"w":"off the beaten path","pos":"phr.","p":"/ɒf ðə ˈbiːtn pɑːθ/","cn":"人少小众、不在常规路线上的","k":"off the beaten path","ex":"The best cafés in Melbourne are off the beaten path.","tr":"墨尔本最好的咖啡馆都藏在游客少去的地方。","usage":"常形容旅行地点小众：somewhere off the beaten path；英澳也常说 off the beaten track。","extraExamples":[{"ex":"We wanted a village off the beaten path, away from the coach tours.","tr":"我们想找个不在常规路线上的村子，避开旅行团大巴。"},{"ex":"Ask the owner for places to eat off the beaten path.","tr":"可以问问店主，有哪些游客少去的小众餐馆。"}]},
  {"d":10,"w":"flag something up","pos":"phr. v.","p":"/flæɡ ˈsʌmθɪŋ ʌp/","cn":"把某事提出来、引起注意","k":"flagged it up","ex":"I flagged it up to the network team before the freeze started.","tr":"冻结开始之前，我把这件事提给网络团队了。","usage":"flag something up to someone 是提醒对方注意，英式工作英语常见；代词放中间：flag it up。","extraExamples":[{"ex":"Please flag it up if anyone has a food allergy.","tr":"如果有人食物过敏，请提前提出来。"},{"ex":"She flagged up the missing page before we sent the document.","tr":"文件发出去之前，她提醒我们少了一页。"}]},
  {"d":10,"w":"cut corners","pos":"phr.","p":"/kʌt ˈkɔːnəz/","cn":"图省事、偷工减料","k":"cut corners","ex":"We can't cut corners on testing just to hit the deadline.","tr":"不能为了赶截止日期就在测试上偷工减料。","usage":"cut corners on testing / safety 指省略必要步骤，通常是负面评价；不等于合理提高效率。","extraExamples":[{"ex":"The furniture was cheap because the manufacturer had cut corners on the fittings.","tr":"家具便宜，是因为厂家在配件上偷工减料。"},{"ex":"I'd rather wait an extra week than cut corners on the repairs.","tr":"我宁愿多等一周，也不想让维修质量打折扣。"}]},
