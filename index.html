 {d:32,tag:"au",w:"brackish",pos:"adj.",p:"/ˈbrækɪʃ/",cn:"半咸的（淡咸水交汇）",k:"brackish",ex:"Estuarine crocodiles live in brackish water near river mouths.",tr:"河口鳄栖息在入海口附近的半咸水中。",usage:"brackish water 是带一定盐分的水，常见于淡咸水交汇处；不是用来形容普通淡水。"},
 {d:32,w:"supple",pos:"adj.",p:"/ˈsʌpl/",cn:"柔韧顺从的（身体或悬架）",k:"supple",ex:"The damping feels supple over broken tarmac without going soft.",tr:"这套阻尼在破损路面上很柔韧，但又不显得软。",usage:"supple leather / muscles 指柔软有弹性；车评中 supple suspension 强调柔韧吸震，同时不必松垮。"},
 {d:32,w:"go back to the drawing board",pos:"phr.",p:"/ðə ˈdrɔːɪŋ bɔːd/",cn:"推翻重新设计（比 square one 更强）",k:"back to the drawing board",ex:"If prefix delegation doesn't help, we go back to the drawing board.",tr:"如果前缀委派也没用，我们就得推翻重新设计。",usage:"go back to the drawing board 是失败后重新考虑设计或方案；不保证必须完全丢弃之前每一部分。"},
 {d:32,w:"bend over backwards",pos:"phr.",p:"/bend ˈəʊvə ˈbækwədz/",cn:"竭尽全力去配合、拼命迁就",k:"bent over backwards",ex:"We bent over backwards to fit their timeline and they still missed it.",tr:"我们竭尽全力配合他们的时间表，结果他们还是没赶上。",usage:"bend over backwards to help someone 是竭力帮助或迁就；过去式 bent，常暗示付出已超出正常程度。"},
 {d:32,w:"a blessing in disguise",pos:"phr.",p:"/ə ˈblesɪŋ ɪn dɪsˈɡaɪz/",cn:"塞翁失马、坏事变好事",k:"a blessing in disguise",ex:"The failed deploy was a blessing in disguise — it exposed the missing alert.",tr:"那次部署失败反倒是好事，它暴露了缺失的告警。",usage:"a blessing in disguise 是最初看似坏事、后来带来好处；常在知道后续结果时回头评价。"},
 {d:32,w:"all things considered",pos:"phr.",p:"/ɔːl θɪŋz kənˈsɪdəd/",cn:"综合来看、考虑到各种因素",k:"All things considered",ex:"All things considered, a forty-minute outage wasn't a bad outcome.",tr:"综合来看，四十分钟的中断算不上糟糕的结果。",usage:"All things considered, ... 是综合权衡后的判断；常放句首，允许结论中保留缺点或例外。"},
  {"d": 33, "w": "underwhelming", "pos": "adj.", "p": "/ˌʌndəˈwelmɪŋ/", "cn": "令人失望的；不如预期惊艳", "usage": "评价没有想象中出色的体验，比 disappointing 更委婉。", "ex": "The restaurant had amazing reviews, but the food was honestly a bit underwhelming.", "tr": "那家餐厅评价特别高，但说实话，食物有点让人失望。", "k": "underwhelming"},
  {"d": 33, "w": "spontaneous", "pos": "adj.", "p": "/spɒnˈteɪniəs/", "cn": "随性的；即兴的；心血来潮的", "usage": "常修饰临时起意的旅行、决定或活动；spontaneous trip。", "ex": "We went on a spontaneous road trip down the coast last weekend.", "tr": "上周末我们心血来潮，沿着海岸线自驾了一趟。", "k": "spontaneous"},
  {"d": 33, "w": "flustered", "pos": "adj.", "p": "/ˈflʌstəd/", "cn": "慌乱的；手忙脚乱的", "usage": "get flustered 表示由于压力或突发情况而一时慌了阵脚。", "ex": "I got a bit flustered when everyone started asking me questions at once.", "tr": "大家突然同时问我问题，我一下子有点手忙脚乱。", "k": "flustered"},
  {"d": 33, "w": "considerate", "pos": "adj.", "p": "/kənˈsɪdərət/", "cn": "体贴的；考虑周到的", "usage": "It was considerate of someone to do something 表示某人做某事很体贴。", "ex": "It was really considerate of her to check whether everyone had got home safely.", "tr": "她特意确认大家是否安全到家，真的很体贴。", "k": "considerate"},
  {"d": 33, "w": "apprehensive", "pos": "adj.", "p": "/ˌæprɪˈhensɪv/", "cn": "忐忑不安的；心存顾虑的", "usage": "be apprehensive about something：对未来或未知的事情感到不安。", "ex": "I was a little apprehensive about joining the badminton club, but everyone turned out to be really friendly.", "tr": "刚开始我对加入羽毛球俱乐部有点忐忑，但后来发现大家都很友好。", "k": "apprehensive"},
  {"d": 33, "w": "knack", "pos": "n.", "p": "/næk/", "cn": "诀窍；特别擅长某事的本事", "usage": "have a knack for something / doing something 是常用固定搭配。", "ex": "He's got a knack for making people feel comfortable, even when they've only just met.", "tr": "他特别擅长让人感到自在，即使是刚认识的人也一样。", "k": "knack"},
  {"d": 33, "w": "I'm not fussed", "pos": "phr.", "p": "/aɪm nɒt fʌst/", "cn": "我都行；我没有特别偏好", "usage": "英澳常用口语，表示对两个选择都可以，不一定是不感兴趣。", "ex": "I'm not fussed whether we get Thai or Japanese food tonight — whatever you feel like.", "tr": "今晚吃泰餐还是日餐我都行——看你想吃什么。", "k": "I'm not fussed"},
  {"d": 33, "w": "It slipped my mind", "pos": "phr.", "p": "/ɪt slɪpt maɪ maɪnd/", "cn": "我一时忘了", "usage": "委婉自然地解释非故意忘事；也可说 It completely slipped my mind。", "ex": "I was supposed to call you yesterday, but it completely slipped my mind.", "tr": "我昨天本来应该给你打电话的，但我完全忘了。", "k": "slipped my mind"},
  {"d": 33, "w": "read the room", "pos": "phr.", "p": "/riːd ðə ruːm/", "cn": "察言观色；看清场合气氛", "usage": "判断社交环境中其他人的情绪和现场氛围。", "ex": "He started joking while everyone was stressed. He really needs to read the room.", "tr": "大家都很焦虑时他却开始开玩笑。他真应该学会看场合。", "k": "read the room"},
  {"d": 33, "w": "go out of your way", "pos": "phr.", "p": "/ɡəʊ aʊt əv jɔː weɪ/", "cn": "特意费心；不嫌麻烦", "usage": "go out of your way to do something，常用于感谢额外付出。", "ex": "You didn't have to go out of your way to pick me up from the airport, but I appreciate it.", "tr": "你其实不用特意跑一趟机场接我，不过真的很感谢。", "k": "go out of your way"},

  {"d": 34, "date": "2026-10-09", "w": "accommodating", "pos": "adj.", "p": "/əˈkɒmədeɪtɪŋ/", "cn": "乐于配合的；愿意通融的", "usage": "形容愿意照顾别人需要的人或服务；比 helpful 更强调灵活配合。", "ex": "The host was really accommodating when we asked to check in a bit earlier.", "tr": "我们提出想提前一点入住时，房东很愿意通融。", "k": "accommodating"},
  {"d": 34, "date": "2026-10-09", "w": "rapport", "pos": "n.", "p": "/ræˈpɔː/", "cn": "融洽的关系；彼此信任的默契", "usage": "build / establish a rapport with someone：与某人建立融洽关系；常用于朋友、同事或客户之间。", "ex": "We built a good rapport over a few games of badminton and a coffee afterwards.", "tr": "一起打了几场羽毛球，之后又喝了杯咖啡，我们渐渐熟络起来。", "k": "rapport"},
  {"d": 34, "date": "2026-10-09", "w": "frazzled", "pos": "adj.", "p": "/ˈfræzld/", "cn": "忙得精疲力竭的；心力交瘁的", "usage": "非正式表达，强调忙乱或压力导致的身心疲惫；feel / look frazzled。", "ex": "I was feeling pretty frazzled after work, so I went for an easy run to clear my head.", "tr": "下班后我感到心力交瘁，就出去轻松跑了一会儿，让脑子放松一下。", "k": "frazzled"},
  {"d": 34, "date": "2026-10-09", "w": "haphazard", "pos": "adj.", "p": "/hæpˈhæzəd/", "cn": "缺乏规划的；杂乱无章的", "usage": "形容安排或做法随意、没有系统性，通常带批评意味；a haphazard approach。", "ex": "Our packing was a bit haphazard, and we ended up bringing three chargers but no sunscreen.", "tr": "我们收拾行李时有点乱，结果带了三个充电器，却没带防晒霜。", "k": "haphazard"},
  {"d": 34, "date": "2026-10-09", "w": "unobtrusive", "pos": "adj.", "p": "/ˌʌnəbˈtruːsɪv/", "cn": "不引人注意的；不打扰人的", "usage": "常形容服务、设计或设备低调、不妨碍体验；通常是褒义，区别于 intrusive（打扰人的）。", "ex": "The service was friendly and unobtrusive, so we could chat without being interrupted.", "tr": "服务亲切又不打扰人，我们可以自在聊天，不被打断。", "k": "unobtrusive"},
  {"d": 34, "date": "2026-10-09", "w": "buoyant", "pos": "adj.", "p": "/ˈbɔɪənt/", "cn": "情绪高涨的；乐观有活力的；有浮力的", "usage": "形容心情时可说 in a buoyant mood；也可描述能漂浮的物体，或活跃的市场。", "ex": "She was in a buoyant mood after finishing her first half marathon.", "tr": "完成自己的第一场半程马拉松后，她心情特别振奋。", "k": "buoyant"},
  {"d": 34, "date": "2026-10-09", "w": "be up for something", "pos": "phr.", "p": "/biː ʌp fə ˈsʌmθɪŋ/", "cn": "愿意参加；有兴致做某事", "usage": "be up for + 名词 / 动名词，常用于轻松邀约；Are you up for ...? 注意区别于 be up to（正在做或胜任）。", "ex": "Are you up for a coastal walk and a coffee on Saturday?", "tr": "周六有兴趣一起沿海边走走，再喝杯咖啡吗？", "k": "up for"},
  {"d": 34, "date": "2026-10-09", "w": "give it a miss", "pos": "phr.", "p": "/ɡɪv ɪt ə mɪs/", "cn": "这次不参加；跳过这一次", "usage": "英澳常用非正式表达；give something a miss 指主动决定不做，并非错过机会。", "ex": "I usually play on Wednesdays, but I'll give it a miss this week because my knee is sore.", "tr": "我通常周三打球，但这周膝盖疼，就先不去了。", "k": "give it a miss"},

const latestDay = Math.max(...DATA.map(x => x.d));
function updateSummary(){
  const title = "单词合集 · Day 1–" + latestDay;
  document.title = title;
  document.querySelector("h1").textContent = title;
  document.getElementById("summary").textContent = "Day 1–" + latestDay + " · " + DATA.length + " 项｜先看中文和挖空例句，再翻开答案；支持朗读、口音切换与错题复习。";
  const scope = document.getElementById("scope");
  const labels = {
    "0": "全部 " + DATA.length + " 项",
    "p": "只练短语（" + DATA.filter(isPhrase).length + "）",
    "v": "只练单词（" + DATA.filter(x => !isPhrase(x)).length + "）",
    "b": "羽毛球专题（" + DATA.filter(x => x.tag === "bad").length + "）",
    "z": "澳洲专题（" + DATA.filter(x => x.tag === "au").length + "）",
    "r": "最近四天（Day " + Math.max(1, latestDay - 3) + "–" + latestDay + "）"
  };
  for (const option of [...scope.options]) {
    if (/^\d+$/.test(option.value) && option.value !== "0") option.remove();
    else if (labels[option.value]) option.textContent = labels[option.value];
  }
  for (const day of [...new Set(DATA.map(x => x.d))].sort((a,b) => a-b)) {
    scope.add(new Option("Day " + day, String(day)));
  }
}

let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
function say(text){
  if (!window.speechSynthesis) {alert("此浏览器不支持语音朗读，请尝试 Safari 或 Chrome。");return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const lang = document.getElementById("accentSelect").value;
  u.lang = lang;
  const available = voices.filter(v => v.lang && v.lang.replace("_","-").toLowerCase() === lang.toLowerCase());
  if(available.length) u.voice = available.find(v => /premium|enhanced|natural/i.test(v.name)) || available[0];
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function isPhrase(x){ return x.pos.indexOf("phr") === 0; }
function makeCloze(item){
  const len = isPhrase(item) ? Math.max(6, Math.min(16, item.k.length)) : 6;
  return item.ex.replace(new RegExp(esc(item.k), "i"), '<span class="blank">' + "_".repeat(len) + '</span>');
}

let queue = [], idx = 0, missed = [];
function pool(){
  const v = document.getElementById("scope").value;
  if (v === "0") return DATA.slice();
  if (v === "p") return DATA.filter(isPhrase);
  if (v === "v") return DATA.filter(x => !isPhrase(x));
  if (v === "b") return DATA.filter(x => x.tag === "bad");
  if (v === "z") return DATA.filter(x => x.tag === "au");
  if (v === "r") return DATA.filter(x => x.d >= Math.max(1, latestDay - 3));
  if (v === "m") return DATA.filter(x => x.d >= 8 && x.d <= 28);
  if (v === "e") return DATA.filter(x => x.d <= 7);
  return DATA.filter(x => x.d === parseInt(v, 10));
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function start(list){
  queue = shuffle(list.slice()); idx = 0; missed = [];
  document.getElementById("done").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  render();
}
function render(){
  if (idx >= queue.length) return finish();
  const it = queue[idx];
  document.getElementById("pcn").textContent = it.cn;
  const pp = document.getElementById("ppos");
  pp.textContent = it.pos;
  pp.className = isPhrase(it) ? "prompt-pos p" : "prompt-pos";
  document.getElementById("pday").textContent = "Day " + it.d;
  document.getElementById("cloze").innerHTML = makeCloze(it);
  const ct = document.getElementById("clozetr");
  ct.textContent = it.tr;
  ct.className = isPhrase(it) ? "clozetr show" : "clozetr";
  document.getElementById("aw").textContent = it.w;
  document.getElementById("aipa").textContent = it.p;
  document.getElementById("aen").textContent = it.ex;
   document.getElementById("usage").textContent = it.usage ? "💡 用法："+it.usage : "";
  document.getElementById("atr").textContent = it.tr;
  document.getElementById("ans").classList.remove("show");
  document.getElementById("rowReveal").style.display = "flex";
  document.getElementById("rowJudge").style.display = "none";
  document.getElementById("prog").textContent = (idx+1) + " / " + queue.length;
  document.getElementById("fill").style.width = (idx / queue.length * 100) + "%";
}
function finish(){
  document.getElementById("quiz").style.display = "none";
  document.getElementById("done").style.display = "block";
  document.getElementById("fill").style.width = "100%";
  document.getElementById("prog").textContent = "完成";
  const total = queue.length, ok = total - missed.length;
  document.getElementById("doneTitle").textContent = "本轮完成：记得 " + ok + " / " + total;
  const ml = document.getElementById("missList");
  ml.innerHTML = "";
  if (missed.length) {
    document.getElementById("doneSub").textContent = "以下这些还需要再过一遍：";
    missed.forEach(it => {
      const d = document.createElement("div");
      d.className = "miss";
      d.innerHTML = "<b>" + it.w + "</b><span>Day " + it.d + " · " + it.cn + "</span>";
      ml.appendChild(d);
    });
    document.getElementById("again").style.display = "block";
  } else {
    document.getElementById("doneSub").textContent = "全部记住了，这轮很干净 👏";
    document.getElementById("again").style.display = "none";
  }
}
document.getElementById("reveal").addEventListener("click", () => {
  document.getElementById("ans").classList.add("show");
  document.getElementById("rowReveal").style.display = "none";
  document.getElementById("rowJudge").style.display = "flex";
  say(queue[idx].w.replace(/^a /,"").replace(/^be /,"").replace(/ something/g," it").replace(/someone/g,"somebody").replace(/-/g," "));
});
document.getElementById("btnOk").addEventListener("click", () => { idx++; render(); });
document.getElementById("btnNo").addEventListener("click", () => { missed.push(queue[idx]); idx++; render(); });
document.getElementById("btnWord").addEventListener("click", () => say(queue[idx].w));
 document.getElementById("btnSay").addEventListener("click", () => say(queue[idx].ex));
document.getElementById("again").addEventListener("click", () => start(missed));
document.getElementById("restart").addEventListener("click", () => start(pool()));
document.getElementById("scope").addEventListener("change", () => start(pool()));
updateSummary();
start(pool());
</script>
