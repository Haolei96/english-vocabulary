  {"d":23,"w":"sparse","pos":"adj.","p":"/spɑːs/","cn":"稀疏的、稀少的","k":"sparse","ex":"Traffic gets sparse once you're past the last town.","tr":"过了最后一个镇子，路上车就很少了。","usage":"sparse traffic / vegetation 指密度低、分布零散；sparse information 则是信息少、不够充分。","extraExamples":[{"ex":"The hillside had only sparse vegetation after the dry summer.","tr":"干旱的夏季过后，山坡上只剩稀疏的植被。"},{"ex":"The instructions are sparse, so you may need to ask for more detail.","tr":"说明很简略，你可能得再问些细节。"}]},
  {"d":23,"w":"pull it off","pos":"phr.","p":"/pʊl ɪt ɒf/","cn":"（有难度地）成功做成","k":"pulled it off","ex":"Finishing the migration in one window was ambitious, but we pulled it off.","tr":"一个窗口内完成迁移挺激进的，但我们做成了。","usage":"pull off a difficult task 是成功做成难事；代词必须放中间：pull it off，不说 pull off it。","extraExamples":[{"ex":"I wasn't sure she could organise the party in two days, but she pulled it off.","tr":"我不确定她能不能两天内办好聚会，但她真的做到了。"},{"ex":"It was a difficult shot, and I was delighted to pull it off.","tr":"那个球很难打，能成功我很高兴。"}]},
  {"d":23,"w":"the bottom line","pos":"phr.","p":"/ðə ˈbɒtəm laɪn/","cn":"关键结论、说到底","k":"The bottom line","ex":"The bottom line is that we need a second maintenance window.","tr":"结论是，我们还需要第二个维护窗口。","usage":"The bottom line is that ... 用来引出最关键的结论；财务语境中 bottom line 也指净利润。","extraExamples":[{"ex":"The bottom line is that we can't all fit in one car.","tr":"关键是，我们没法全挤进一辆车。"},{"ex":"I like both flats, but the bottom line is the travel time to work.","tr":"两套公寓我都喜欢，不过最终关键还是上班通勤时间。"}]},
  {"d":23,"w":"down the line","pos":"phr.","p":"/daʊn ðə laɪn/","cn":"以后、将来某个时候","k":"down the line","ex":"We can revisit the architecture further down the line.","tr":"架构的事我们可以以后再回过头来看。","usage":"somewhere / further down the line 指将来某个阶段；表达时间较模糊，不适合代替明确的交付日期。","extraExamples":[{"ex":"We might need a bigger place a few years down the line.","tr":"再过几年，我们也许需要更大的住处。"},{"ex":"I'd rather ask now than discover a problem further down the line.","tr":"我宁愿现在问清楚，也不想以后才发现问题。"}]},
  {"d":23,"w":"from scratch","pos":"phr.","p":"/frəm skrætʃ/","cn":"从零开始、从头做起","k":"from scratch","ex":"It was faster to rebuild the node from scratch than to debug it.","tr":"把节点从零重建比慢慢排查更快。","usage":"build / cook / start from scratch 是从零开始；make food from scratch 常指自己用原料做，而非用现成品。","extraExamples":[{"ex":"Did you make the sauce from scratch or use a jar?","tr":"酱汁是你从头做的，还是用的瓶装酱？"},{"ex":"After losing my notes, I had to start the presentation from scratch.","tr":"笔记丢了以后，我只好从头准备演示。"}]},
  {"d":24,"w":"concede","pos":"v.","p":"/kənˈsiːd/","cn":"承认（对方对）；让掉一局","k":"concede","ex":"I'll concede that the vendor's explanation makes sense.","tr":"我承认厂商的解释是说得通的。","usage":"concede that ... 是勉强承认对方有道理；concede a point / goal 则可指让出分数或被对方得分。","extraExamples":[{"ex":"She conceded that the earlier train would be less stressful.","tr":"她承认，坐早一班火车会更从容。"},{"ex":"We conceded the opening game but recovered in the second.","tr":"我们丢了第一局，不过第二局找回了状态。"}]},
  {"d":24,"w":"stipulate","pos":"v.","p":"/ˈstɪpjuleɪt/","cn":"（合同或规定）明确规定","k":"stipulates","ex":"The SLA stipulates a four-hour response time for P1 incidents.","tr":"服务协议明确规定 P1 故障需在四小时内响应。","usage":"stipulate that ... / stipulate a condition 表示条款明确要求；常见于合同和规定，日常请求用 ask 更自然。","extraExamples":[{"ex":"The rental agreement stipulates that pets must be approved in advance.","tr":"租约规定，养宠物必须事先获得批准。"},{"ex":"They stipulated a minimum number of guests before confirming the booking.","tr":"他们规定，达到最低人数才确认预订。"}]},
  {"d":24,"w":"incremental","pos":"adj.","p":"/ˌɪŋkrəˈmentl/","cn":"逐步递增的、小步推进的","k":"incremental","ex":"We took an incremental approach rather than a big-bang cutover.","tr":"我们采取逐步推进的方式，而不是一次性切换。","usage":"incremental changes / improvements 是一点点推进的改变；incremental backup 则是技术里的增量备份。","extraExamples":[{"ex":"Small, incremental changes made the routine easier to maintain.","tr":"逐步做些小调整，让这套日常安排更容易坚持。"},{"ex":"The software will be improved through incremental updates.","tr":"软件会通过逐步更新来改进。"}]},
  {"d":24,"w":"pristine","pos":"adj.","p":"/ˈprɪstiːn/","cn":"原始未受破坏的；崭新如初的","k":"pristine","ex":"Tasmania still has genuinely pristine wilderness.","tr":"塔斯马尼亚仍保有真正原始未被破坏的荒野。","usage":"pristine wilderness 强调原始未受破坏；in pristine condition 指物品像新的一样，侧重点不同。","extraExamples":[{"ex":"The beach looked pristine before the first visitors arrived.","tr":"第一批游客到来前，海滩看起来洁净如初。"},{"ex":"She keeps the camera in pristine condition despite using it every day.","tr":"虽然每天都用，她仍把相机保养得像新的一样。"}]},
  {"d":24,"w":"cramped","pos":"adj.","p":"/kræmpt/","cn":"狭窄局促的","k":"cramped","ex":"The economy seats were cramped on the twelve-hour leg.","tr":"十二小时那一程的经济舱座位非常局促。","usage":"a cramped room / seat 指空间狭窄、活动受限；cramp 是抽筋，feel cramped 才是觉得局促。","extraExamples":[{"ex":"The kitchen felt cramped once three of us started cooking.","tr":"我们三个人一开始做饭，厨房就显得局促了。"},{"ex":"I couldn't stretch my legs in the cramped back seat.","tr":"后排太狭窄，我伸不开腿。"}]},
  {"d":24,"w":"brew","pos":"v. / n.","p":"/bruː/","cn":"冲煮；（麻烦）正在酝酿","k":"brew","ex":"Let it brew for four minutes before you press down.","tr":"按下压杆前先让它浸泡四分钟。","usage":"brew coffee / tea 是冲煮或浸泡；trouble is brewing 是麻烦在酝酿，brew 本身也可作名词指饮品。","extraExamples":[{"ex":"I'll brew some tea while you unpack.","tr":"你收拾行李，我来泡点茶。"},{"ex":"Trouble was brewing when nobody could agree on how to split the bill.","tr":"大家都不同意账单怎么分，麻烦开始酝酿了。"}]},
  {"d":24,"w":"err on the side of caution","pos":"phr.","p":"/ɜːr ɒn ðə saɪd/","cn":"宁可谨慎一点、保守起见","k":"err on the side of caution","ex":"Let's err on the side of caution and schedule a rollback window.","tr":"保守起见，我们还是预留一个回滚窗口吧。","usage":"表示拿不准时宁可选择更谨慎的一边；err on the side of 后也可接 generosity 等名词。","extraExamples":[{"ex":"We erred on the side of caution and left plenty of time for the connection.","tr":"我们宁可谨慎一点，留足了转乘时间。"},{"ex":"When I wasn't sure how formal to dress, I erred on the side of caution.","tr":"不确定穿得多正式合适时，我选了比较稳妥的穿法。"}]},
  {"d":24,"w":"a rough idea","pos":"phr.","p":"/ə rʌf aɪˈdɪə/","cn":"大致的概念、粗略了解","k":"a rough idea","ex":"Can you give me a rough idea of the blast radius?","tr":"能大致说一下影响范围有多大吗？","usage":"have / give a rough idea of something 是有／提供大致了解；rough 在这里不是粗鲁，而是不精确。","extraExamples":[{"ex":"Have you got a rough idea of how many people are coming?","tr":"大概会来多少人，你有个数吗？"},{"ex":"The sketch gives you a rough idea of what the room will look like.","tr":"这张草图能让你大致了解房间的样子。"}]},
  {"d":24,"w":"stand to reason","pos":"phr.","p":"/stænd tə ˈriːzn/","cn":"合乎情理、想想也知道","k":"stands to reason","ex":"It stands to reason that a bigger node pool would ease the pressure.","tr":"想想也知道，节点池更大一些自然能缓解压力。","usage":"固定结构 It stands to reason that ...，表示结论合乎情理；it 作主语时 stands 要加 s。","extraExamples":[{"ex":"It stands to reason that a quieter room will be easier to sleep in.","tr":"安静一点的房间更容易睡好觉，这很合乎常理。"},{"ex":"It stands to reason that we'd need more food if extra guests are coming.","tr":"如果有更多客人要来，我们自然得准备更多食物。"}]},
  {"d":24,"w":"off the hook","pos":"phr.","p":"/ɒf ðə hʊk/","cn":"脱身、不用担责了","k":"off the hook","ex":"The vendor confirmed it was their bug, so we're off the hook.","tr":"厂商确认是他们的 bug，所以我们脱责了。","usage":"be / get off the hook 是摆脱责任、义务或困境；let someone off the hook 是不再追究或放过对方。","extraExamples":[{"ex":"If she can drive us, you're off the hook for picking everyone up.","tr":"如果她能开车送我们，你就不用负责接所有人了。"},{"ex":"I apologised, but that didn't let me off the hook for the extra work.","tr":"我道了歉，不过额外的工作还是得我来做。"}]},
  {"d":25,"w":"anomaly","pos":"n.","p":"/əˈnɒməli/","cn":"异常现象、反常数据点","k":"anomaly","ex":"The spike looked like an anomaly until it happened again on Thursday.","tr":"那个尖峰本来像是个异常点，直到周四又出现了一次。","usage":"detect / investigate an anomaly 是发现／调查异常；复数 anomalies，异常点不一定意味着已经找到故障根因。","extraExamples":[{"ex":"The unusual reading may be an anomaly rather than a sign of a wider problem.","tr":"那次异常读数也许只是个别情况，不一定说明有更普遍的问题。"},{"ex":"His absence was an anomaly; he normally arrived before everyone else.","tr":"他没来很反常，平时他总比大家都早到。"}]},
  {"d":25,"w":"supersede","pos":"v.","p":"/ˌsuːpəˈsiːd/","cn":"取代、替代","k":"supersedes","ex":"This runbook supersedes the version from last March.","tr":"本操作手册取代去年三月的版本。","usage":"A supersedes B 表示新版本替代旧版本，较正式；特别注意拼写 supersede，不是 supercede。","extraExamples":[{"ex":"The updated timetable supersedes the one printed on your ticket.","tr":"新的时间表取代了你票面上印的旧时间表。"},{"ex":"This agreement supersedes all earlier arrangements between us.","tr":"这份协议取代我们此前的所有安排。"}]},
  {"d":25,"w":"rigorous","pos":"adj.","p":"/ˈrɪɡərəs/","cn":"严格缜密的（测试或流程）","k":"rigorous","ex":"The change passed a rigorous review before it reached production.","tr":"该变更在进入生产前通过了严格的评审。","usage":"rigorous testing / analysis 指严格、细致、缜密；rigorous 不等于 rigid，后者常指僵化不灵活。","extraExamples":[{"ex":"The equipment went through rigorous checks before the trip.","tr":"出发前，设备经过了严格检查。"},{"ex":"She took a rigorous approach to comparing the different offers.","tr":"她用严谨的方法比较了不同的报价。"}]},
  {"d":25,"w":"hollow","pos":"adj.","p":"/ˈhɒləʊ/","cn":"空洞的、中空的；（声音）发闷的","k":"hollow","ex":"The brakes made a hollow sound, which turned out to be worn pads.","tr":"刹车发出一种发闷的声音，后来发现是刹车片磨损了。","usage":"a hollow sound 指带空腔感的声音；hollow promises 是空洞承诺，hollow victory 是缺乏满足感的胜利。","extraExamples":[{"ex":"The tree trunk was hollow, with a small nest inside.","tr":"树干是空心的，里面有个小鸟巢。"},{"ex":"His apology sounded hollow after he repeated the same behaviour.","tr":"同样的行为又发生后，他的道歉听起来很空洞。"}]},
  {"d":25,"w":"sprawling","pos":"adj.","p":"/ˈsprɔːlɪŋ/","cn":"蔓延扩张的、摊得很开的","k":"sprawling","ex":"Melbourne is sprawling, so plan for longer drives than you expect.","tr":"墨尔本摊得很开，行程上要多留些车程时间。","usage":"a sprawling city / suburb 指向外扩展、覆盖面积大；可能暗示分散，不能简单等同于人口密集。","extraExamples":[{"ex":"The sprawling market was easy to get lost in.","tr":"那个集市铺得很大，很容易迷路。"},{"ex":"We stayed on the edge of a sprawling suburb.","tr":"我们住在一个范围很大的郊区边缘。"}]},
  {"d":25,"w":"nagging","pos":"adj.","p":"/ˈnæɡɪŋ/","cn":"挥之不去的、隐隐作痛的","k":"nagging","ex":"I had a nagging feeling we'd missed something in the checklist.","tr":"我一直有种挥之不去的感觉，checklist 上漏了什么。","usage":"a nagging doubt / pain 指持续纠缠的疑虑或隐痛；a nagging person 则是在不停唠叨的人。","extraExamples":[{"ex":"I had a nagging doubt about whether I'd locked the door.","tr":"我一直隐隐担心，门到底锁没锁。"},{"ex":"A nagging ache in my shoulder made carrying the bag uncomfortable.","tr":"肩膀持续隐痛，背着包很不舒服。"}]},
  {"d":25,"w":"cover for someone","pos":"phr. v.","p":"/ˈkʌvə fɔː/","cn":"替某人顶班、代为处理","k":"cover for me","ex":"Could you cover for me on Friday? I'll take your Monday shift.","tr":"周五能帮我顶个班吗？你周一的班我来上。","usage":"cover for someone 可指替人顶班，也可指替人掩饰过失；工作交接最好明确说明覆盖哪项职责。","extraExamples":[{"ex":"Can you cover for me at the desk while I collect the delivery?","tr":"我去收货时，你能替我在前台顶一会儿吗？"},{"ex":"She covered for her colleague during the school holidays.","tr":"学校放假期间，她替同事顶了班。"}]},
  {"d":25,"w":"be swept under the rug","pos":"phr.","p":"/swept ˈʌndə ðə rʌɡ/","cn":"被掩盖过去、压下不提","k":"swept under the rug","ex":"This near-miss shouldn't be swept under the rug.","tr":"这次险些出事的情况不该被掩盖过去。","usage":"sweep a problem under the rug 指刻意掩盖、不处理；英澳也常说 under the carpet，常用于批评。","extraExamples":[{"ex":"Their concerns were swept under the rug instead of being discussed.","tr":"他们的担忧被压了下去，没有得到讨论。"},{"ex":"We can't just sweep the missing money under the rug.","tr":"钱不见了这件事，我们不能就这么掩盖过去。"}]},
  {"d":25,"w":"have a lot on one's plate","pos":"phr.","p":"/ə lɒt ɒn wʌnz pleɪt/","cn":"手头事情一大堆","k":"a lot on your plate","ex":"I know you've got a lot on your plate, so no rush.","tr":"我知道你手头事情一大堆，所以不急。","usage":"have a lot on my / your plate 指任务或责任很多；常用来体谅对方忙，不是在说吃了很多食物。","extraExamples":[{"ex":"She's got a lot on her plate with the move and the new job.","tr":"她又要搬家又要开始新工作，事情很多。"},{"ex":"I don't want to add to your workload if you've already got a lot on your plate.","tr":"如果你已经忙得不可开交，我不想再给你添工作。"}]},
  {"d":25,"w":"split the difference","pos":"phr.","p":"/splɪt ðə ˈdɪfrəns/","cn":"各让一步、折中处理","k":"split the difference","ex":"They wanted Monday, we wanted Friday, so we split the difference.","tr":"他们想周一，我们想周五，最后折中了一下。","usage":"原指在两个数之间各让一半，也常泛指折中；商量价格时 Let's split the difference 很自然。","extraExamples":[{"ex":"You offered eighty and I asked for a hundred; shall we split the difference?","tr":"你出八十，我要一百，我们各让一步，九十成交好吗？"},{"ex":"We split the difference and met halfway between the two stations.","tr":"我们折中了一下，在两座车站中间会面。"}]},
  {"d":26,"w":"warrant","pos":"v.","p":"/ˈwɒrənt/","cn":"值得、有必要（做某事）","k":"warrant","ex":"A single failed check doesn't warrant waking up the on-call engineer.","tr":"单次检查失败还不至于把值班工程师叫醒。","usage":"warrant action / further investigation 指情况足以值得采取行动；后接动名词也可，如 warrant waking someone up。","extraExamples":[{"ex":"That small scratch doesn't warrant replacing the whole panel.","tr":"那道小划痕还不至于需要换整块面板。"},{"ex":"The sudden change in his behaviour warrants a closer look.","tr":"他的行为突然改变，值得再仔细了解一下。"}]},
  {"d":26,"w":"nuance","pos":"n.","p":"/ˈnjuːɑːns/","cn":"细微差别、微妙之处","k":"nuance","ex":"There's a nuance here: the agent reports success even when it skips hosts.","tr":"这里有个微妙之处：即使跳过了主机，agent 也会上报成功。","usage":"a nuance 是细微但有意义的差别；the nuances of something 是其中的微妙之处，形容词是 nuanced。","extraExamples":[{"ex":"A literal translation can miss the nuance of a friendly joke.","tr":"逐字翻译可能会漏掉友善玩笑中的微妙之处。"},{"ex":"I'm still learning the nuances of how people disagree politely here.","tr":"我还在学习这里的人如何委婉表达不同意见的细微差别。"}]},
  {"d":26,"w":"impede","pos":"v.","p":"/ɪmˈpiːd/","cn":"阻碍、妨碍（拖慢而非挡死）","k":"impeding","ex":"The approval backlog is impeding the whole migration schedule.","tr":"审批积压正在拖慢整个迁移计划。","usage":"impede progress / traffic / recovery 是阻碍进展；比 prevent 更不强调完全阻止，语气偏正式。","extraExamples":[{"ex":"The broken lift impeded access for anyone carrying luggage.","tr":"电梯坏了，让带行李的人进出很不方便。"},{"ex":"Heavy traffic impeded our progress through the city.","tr":"拥堵的车流拖慢了我们穿城的速度。"}]},
  {"d":26,"w":"candid","pos":"adj.","p":"/ˈkændɪd/","cn":"坦率直言的（不回避问题）","k":"candid","ex":"I'd rather have a candid postmortem than a polished one.","tr":"我宁愿要一份坦率的复盘，而不是一份漂亮的。","usage":"a candid discussion / assessment 指坦率面对问题；to be candid 可引出直言，但仍需注意措辞。","extraExamples":[{"ex":"Can I be candid? I don't think the dates will work for everyone.","tr":"我能直说吗？我觉得这个日期不适合所有人。"},{"ex":"We had a candid discussion about what living together would involve.","tr":"关于一起住需要面对什么，我们坦诚地谈了一次。"}]},
  {"d":26,"w":"lush","pos":"adj.","p":"/lʌʃ/","cn":"草木茂盛葱郁的","k":"lush","ex":"The rainforest around Cairns is unbelievably lush.","tr":"凯恩斯周边的雨林葱郁得令人难以置信。","usage":"lush vegetation / rainforest 指草木丰茂葱郁；形容装修或音乐时也可能指华丽、丰富。","extraExamples":[{"ex":"The garden turned lush and green after the rain.","tr":"雨后，花园变得青翠茂盛。"},{"ex":"A narrow path disappeared into the lush vegetation.","tr":"一条小径隐入了繁茂的植被中。"}]},
  {"d":26,"w":"brisk","pos":"adj.","p":"/brɪsk/","cn":"（生意）红火的（第三义项）","k":"brisk","ex":"The café does a brisk trade before nine every morning.","tr":"那家咖啡馆每天九点前生意都很红火。","usage":"do a brisk trade 是生意红火的固定搭配；这里的 brisk 描述交易活跃，不是天气冷或走路快。","extraExamples":[{"ex":"The bakery did brisk business on the first morning of the market.","tr":"集市第一天早上，面包店生意很红火。"},{"ex":"There was brisk demand for the cheaper tickets.","tr":"便宜票的需求很旺盛。"}]},
  {"d":26,"w":"get to the bottom of something","pos":"phr.","p":"/ðə ˈbɒtəm əv/","cn":"查清根源、弄个水落石出","k":"got to the bottom of","ex":"We still haven't got to the bottom of the intermittent timeouts.","tr":"间歇性超时的根源我们还没查清楚。","usage":"get to the bottom of a problem 是弄清根源；常用于排查异常或追查真相，比了解表面情况更深入。","extraExamples":[{"ex":"We need to get to the bottom of why the bills keep arriving late.","tr":"我们得查清楚，账单为什么总是迟到。"},{"ex":"I finally got to the bottom of the strange noise in the kitchen.","tr":"我终于弄清了厨房里奇怪声音的来源。"}]},
  {"d":26,"w":"hit a snag","pos":"phr.","p":"/hɪt ə snæɡ/","cn":"遇到意外阻碍、卡住了","k":"hit a snag","ex":"We hit a snag halfway through the cutover.","tr":"切换进行到一半时我们遇到了意外阻碍。","usage":"hit / run into a snag 是遇到意外障碍；snag 通常指具体卡点，不一定让整个计划彻底失败。","extraExamples":[{"ex":"We hit a snag when the key didn't fit the lock.","tr":"钥匙插不进锁，我们遇到了麻烦。"},{"ex":"The plans have hit a snag, but we haven't cancelled the trip.","tr":"计划遇到了意外阻碍，不过旅行还没取消。"}]},
  {"d":26,"w":"on the same wavelength","pos":"phr.","p":"/seɪm ˈweɪvleŋθ/","cn":"想法合拍、很默契","k":"on the same wavelength","ex":"My doubles partner and I are on the same wavelength at the net.","tr":"我和双打搭档在网前特别默契。","usage":"be on the same wavelength 表示思路合拍、容易互相理解；on the same page 更侧重对具体事情达成一致。","extraExamples":[{"ex":"We were on the same wavelength from the first conversation.","tr":"第一次聊天，我们就觉得很合拍。"},{"ex":"I like working with her because we're usually on the same wavelength.","tr":"我喜欢和她共事，因为我们通常很有默契。"}]},
  {"d":26,"w":"put something to bed","pos":"phr.","p":"/pʊt tə bed/","cn":"彻底了结、收尾归档","k":"to bed","ex":"Let's put this ticket to bed before the end of the sprint.","tr":"我们在这个 sprint 结束前把这个工单彻底了结。","usage":"put an issue / project to bed 是把事情彻底处理完，偏口语；正式报告可说 resolve / close。","extraExamples":[{"ex":"Let's put the argument to bed and enjoy the rest of the evening.","tr":"我们把争论了结，好好享受今晚剩下的时间吧。"},{"ex":"That final email should put the matter to bed.","tr":"最后那封邮件应该能让事情彻底收尾。"}]},
  {"d":27,"w":"prone","pos":"adj.","p":"/prəʊn/","cn":"易于出问题的","k":"prone","ex":"Manual patching is prone to human error, especially at 3 a.m.","tr":"手工打补丁容易出人为失误，尤其是凌晨三点。","usage":"be prone to errors / injury / doing something 指容易发生某种问题；to 后接名词或动名词，不接动词原形。","extraExamples":[{"ex":"That corner of the garden is prone to flooding.","tr":"花园的那个角落容易积水。"},{"ex":"I'm prone to overpacking, even for a weekend away.","tr":"即使只是周末出去，我也很容易带太多行李。"}]},
  {"d":27,"w":"segregate","pos":"v.","p":"/ˈseɡrɪɡeɪt/","cn":"隔离分开（网络或环境）","k":"segregate","ex":"We segregate production traffic onto a dedicated subnet.","tr":"我们把生产流量隔离到一个专用子网上。","usage":"segregate A from B 是将两者隔离；技术场景可指流量隔离，涉及人群时可能带歧视性隔离的含义。","extraExamples":[{"ex":"The organisers segregated the waste into separate recycling bins.","tr":"组织者把垃圾分类，放进不同的回收箱。"},{"ex":"We segregate the test equipment from devices used by customers.","tr":"我们把测试设备与客户使用的设备分开存放。"}]},
  {"d":27,"w":"salvage","pos":"v. / n.","p":"/ˈsælvɪdʒ/","cn":"抢救出来、挽回（部分）","k":"salvage","ex":"We managed to salvage the data from the corrupted volume.","tr":"我们设法从损坏的卷里抢救出了数据。","usage":"salvage data / a situation 是从受损或失败中挽回有用部分；不意味着原样完整恢复。","extraExamples":[{"ex":"We managed to salvage a few books after the leak.","tr":"漏水之后，我们设法抢救出了几本书。"},{"ex":"The rain ruined the picnic, but we salvaged the afternoon with a museum visit.","tr":"雨毁了野餐，不过我们去逛博物馆，挽回了这个下午。"}]},
  {"d":27,"w":"meticulous","pos":"adj.","p":"/məˈtɪkjələs/","cn":"一丝不苟的、极其细致的","k":"meticulous","ex":"His handover notes are meticulous — nothing gets missed.","tr":"他的交接记录一丝不苟，什么都不会漏。","usage":"be meticulous about details / in your work 是做事极细致；常用于赞扬记录、检查或准备工作。","extraExamples":[{"ex":"She keeps meticulous records of every booking and payment.","tr":"她细致地记录每一笔预订和付款。"},{"ex":"His meticulous preparation made the actual move much easier.","tr":"他一丝不苟的准备，让真正搬家时轻松了很多。"}]},
  {"d":27,"w":"torrential","pos":"adj.","p":"/təˈrenʃl/","cn":"（雨）倾盆如注的","k":"Torrential","ex":"Torrential rain closed the coastal road for two days.","tr":"倾盆大雨让沿海公路封闭了两天。","usage":"torrential rain / downpours 是倾盆大雨；通常用来形容雨势，不用来形容闷热或小阵雨。","extraExamples":[{"ex":"We waited under the shelter until the torrential rain eased.","tr":"我们在棚下等暴雨减弱。"},{"ex":"Torrential downpours left the paths covered in mud.","tr":"倾盆大雨过后，小径上全是泥。"}]},
  {"d":27,"w":"knackered","pos":"adj.","p":"/ˈnækəd/","cn":"（零件）磨坏报废了（第二义项）","k":"knackered","ex":"The rear bushings were completely knackered after the track days.","tr":"跑完那几个赛道日，后桥衬套彻底报废了。","usage":"这里是零件磨损坏掉：The bushings are knackered；形容人则是累坏了，两者都是英澳随意口语。","extraExamples":[{"ex":"The old kettle is knackered; it won't switch on at all.","tr":"旧水壶已经坏了，完全打不开。"},{"ex":"My trainers are knackered after all those muddy walks.","tr":"走了那么多泥路，我的运动鞋已经磨坏了。"}]},
  {"d":27,"w":"take a step back","pos":"phr.","p":"/teɪk ə step bæk/","cn":"退一步想、跳出来看全局","k":"take a step back","ex":"Let's take a step back — are we even solving the right problem?","tr":"我们退一步想想，我们解决的到底是不是对的问题？","usage":"take a step back from a problem 是暂时抽离、重新看全局；也可字面表示往后退一步。","extraExamples":[{"ex":"Take a step back and look at what everyone is actually asking for.","tr":"退一步想，看看大家真正想要什么。"},{"ex":"We took a step back from planning when it stopped being enjoyable.","tr":"规划旅行不再令人愉快时，我们先停下来，重新审视了一下。"}]},
  {"d":27,"w":"par for the course","pos":"phr.","p":"/pɑː fɔː ðə kɔːs/","cn":"意料之中、习以为常了","k":"par for the course","ex":"Vendor delays are par for the course with this product.","tr":"这个产品的厂商延期已经是家常便饭了。","usage":"That's par for the course 表示这种事在该情况下很常见；往往带无奈语气，不是称赞事情做得好。","extraExamples":[{"ex":"Queues are par for the course at a popular spot on a sunny weekend.","tr":"晴朗的周末，热门景点排队是意料之中的事。"},{"ex":"A few awkward moments are par for the course when you're meeting new people.","tr":"认识新朋友时，有几个尴尬瞬间很正常。"}]},
  {"d":27,"w":"throw someone under the bus","pos":"phr.","p":"/ˈʌndə ðə bʌs/","cn":"甩锅给某人、出卖队友","k":"thrown under the bus","ex":"A blameless postmortem means nobody gets thrown under the bus.","tr":"无责复盘意味着没有人会被甩锅。","usage":"throw someone under the bus 是为自保牺牲或甩锅给他人，语气强；无责复盘中可用其被动形式。","extraExamples":[{"ex":"I won't throw my colleague under the bus to make myself look better.","tr":"我不会为了让自己显得更好，就把责任推给同事。"},{"ex":"He felt he'd been thrown under the bus when the story became public.","tr":"事情公开后，他觉得自己成了替罪羊。"}]},
  {"d":27,"w":"a can of worms","pos":"phr.","p":"/ə kæn əv wɜːmz/","cn":"一堆麻烦事、打开就收不住","k":"a real can of worms","ex":"Refactoring that module would open a real can of worms.","tr":"重构那个模块会捅出一大堆麻烦。","usage":"open a can of worms 指牵出一串难处理的问题；常用于劝人先想清楚某项改动的连带影响。","extraExamples":[{"ex":"Asking who should pay opened a can of worms.","tr":"一问谁该付钱，就引出了一堆麻烦。"},{"ex":"I'd rather not open that can of worms during dinner.","tr":"我宁愿别在晚饭时挑起那堆麻烦事。"}]},
  {"d":28,"w":"scrutinise","pos":"v.","p":"/ˈskruːtənaɪz/","cn":"细看审查","k":"scrutinised","ex":"We scrutinised every line of the diff before approving it.","tr":"批准之前，我们逐行审查了那份 diff。","usage":"scrutinise a document / decision 是仔细审查，直接接宾语；美式常拼 scrutinize，名词是 scrutiny。","extraExamples":[{"ex":"She scrutinised the bill before asking about the extra charge.","tr":"她仔细查看了账单，随后询问那笔额外收费。"},{"ex":"I scrutinised the photos for signs of damage before buying the camera.","tr":"买相机前，我仔细检查照片，寻找损坏的迹象。"}]},
  {"d":28,"w":"mundane","pos":"adj.","p":"/mʌnˈdeɪn/","cn":"平凡琐碎的、普通不起眼的","k":"mundane","ex":"The root cause turned out to be something mundane — a full disk.","tr":"根因原来是件很平常的事——磁盘满了。","usage":"mundane tasks / details 指平常、琐碎甚至有点无聊的事；用来描述原因时强调它并不神秘。","extraExamples":[{"ex":"We spent the morning on mundane tasks like laundry and shopping.","tr":"我们上午都在处理洗衣、买东西之类的琐事。"},{"ex":"Even a mundane journey feels different when you're in a new country.","tr":"到了一个新国家，即使普通的一段路程也会感觉不同。"}]},
  {"d":28,"w":"curb","pos":"v. / n.","p":"/kɜːb/","cn":"抑制、控制住（增长或成本）","k":"curb","ex":"We added quotas to curb runaway storage costs.","tr":"我们加了配额来控制失控的存储成本。","usage":"curb spending / costs 是控制或遏制增长；英澳路边的路缘石通常拼 kerb，动词仍拼 curb。","extraExamples":[{"ex":"I leave my phone in another room to curb the temptation to check it.","tr":"我把手机放在另一个房间，减少忍不住查看的冲动。"},{"ex":"The council introduced measures to curb noise late at night.","tr":"市政部门采取了措施，控制深夜噪声。"}]},
  {"d":28,"w":"staple","pos":"n. / adj.","p":"/ˈsteɪpl/","cn":"主食、常备必需品；订书钉","k":"staple","ex":"Flat whites are a staple of Melbourne café culture.","tr":"Flat white 是墨尔本咖啡馆文化里的标配。","usage":"a staple of something 指其中常见、不可缺少的组成部分；staple food 是主食，另有订书钉含义。","extraExamples":[{"ex":"Rice is a staple in many households.","tr":"米饭是许多家庭的主食。"},{"ex":"A plain white shirt is a staple of his work wardrobe.","tr":"一件纯白衬衫是他工作衣橱里的必备单品。"}]},
  {"d":28,"w":"vantage point","pos":"n.","p":"/ˈvɑːntɪdʒ pɔɪnt/","cn":"观景位置；看问题的角度","k":"vantage point","ex":"The lookout gives you the best vantage point over the whole valley.","tr":"那个观景台是俯瞰整个山谷的最佳位置。","usage":"a vantage point 是观察位置，常用 from a vantage point；也可比喻分析角度，不只表示看风景。","extraExamples":[{"ex":"From our vantage point on the hill, we could see the ferry approaching.","tr":"从山上那个位置，我们能看到渡轮正在靠近。"},{"ex":"The balcony offered a better vantage point than the crowded pavement.","tr":"与拥挤的人行道相比，阳台上的视野更好。"}]},
  {"d":28,"w":"feeble","pos":"adj.","p":"/ˈfiːbl/","cn":"微弱无力的；（借口）站不住脚的","k":"feeble","ex":"Mobile coverage gets feeble once you leave the highway.","tr":"一离开高速，手机信号就变得很弱。","usage":"a feeble signal / attempt 是微弱或无力；a feeble excuse 带批评意味，指借口很站不住脚。","extraExamples":[{"ex":"His excuse sounded rather feeble once we checked the times.","tr":"我们核对了时间后，他的借口就显得很牵强了。"},{"ex":"The torch gave only a feeble light because its battery was nearly flat.","tr":"手电筒的电池快没电了，所以光线很微弱。"}]},

  {"d":28,"w":"be none the wiser","pos":"phr.","p":"/nʌn ðə ˈwaɪzə/","cn":"完全没察觉、不明就里","k":"none the wiser","ex":"We failed over at 2 a.m. and the users were none the wiser.","tr":"我们凌晨两点做了切换，用户完全没察觉。","usage":"be none the wiser 可以是毫不知情，也可以是听完解释仍没弄懂；需由上下文判断。","extraExamples":[{"ex":"I read the explanation twice and was still none the wiser.","tr":"我把解释读了两遍，还是没弄明白。"},{"ex":"We replaced the broken cup before she returned, and she was none the wiser.","tr":"她回来前，我们换掉了打碎的杯子，她完全没有察觉。"}]},

  {"d":28,"w":"go pear-shaped","pos":"phr.","p":"/ɡəʊ ˈpeəʃeɪpt/","cn":"彻底搞砸、事情崩了（英澳口语）","k":"went pear-shaped","ex":"The upgrade went pear-shaped about twenty minutes in.","tr":"升级开始大约二十分钟后就彻底崩了。","usage":"英澳口语描述计划出岔子或搞砸；过去式 went pear-shaped，正式复盘可说 went wrong。","extraExamples":[{"ex":"Everything went pear-shaped when the car wouldn't start.","tr":"车发动不了，整个计划一下子乱了套。"},{"ex":"If the weather goes pear-shaped, we can move the party indoors.","tr":"如果天气变糟，我们可以把聚会挪到室内。"}]},
  {"d":29,"tag":"au","w":"mob","pos":"n.","p":"/mɒb/","cn":"一群袋鼠（澳洲专用量词）","k":"A mob","ex":"A mob of kangaroos was grazing right beside the road.","tr":"一群袋鼠正在路边吃草。","usage":"澳洲自然语境常说 a mob of kangaroos；mob 在其他语境也可指喧闹或具有威胁性的人群。","extraExamples":[{"ex":"A small mob of kangaroos moved across the paddock at dusk.","tr":"黄昏时，一小群袋鼠穿过了围场。"},{"ex":"We stopped to watch a mob of kangaroos resting in the shade.","tr":"我们停下来，看一群袋鼠在树荫下休息。"}]},
  {"d":29,"tag":"au","w":"pouch","pos":"n.","p":"/paʊtʃ/","cn":"育儿袋","k":"pouch","ex":"You could just see a joey's foot poking out of the pouch.","tr":"能看到一只小袋鼠的脚从育儿袋里伸出来。","usage":"a joey in its mother's pouch 是育儿袋里的幼崽；pouch 也可指装小物品的软袋，不只用于动物。","extraExamples":[{"ex":"The joey disappeared back into its mother's pouch.","tr":"小袋鼠又钻回了妈妈的育儿袋。"},{"ex":"I keep spare batteries in a little pouch inside my camera bag.","tr":"我把备用电池放在相机包里的小软袋中。"}]},
  {"d":29,"tag":"au","w":"forage","pos":"v.","p":"/ˈfɒrɪdʒ/","cn":"觅食、四处找吃的","k":"forage","ex":"Possums come down to forage once the campsite goes quiet.","tr":"营地一安静下来，负鼠就下来觅食了。","usage":"forage for food 是四处觅食；forage in an area 说明觅食地点，与 scavenge 的捡食剩余物不同。","extraExamples":[{"ex":"The birds forage among the fallen leaves.","tr":"鸟儿在落叶间觅食。"},{"ex":"We watched the animals forage quietly along the edge of the clearing.","tr":"我们看着动物们沿着空地边缘安静地找食物。"}]},
  {"d":29,"tag":"au","w":"cull","pos":"v. / n.","p":"/kʌl/","cn":"（为控制数量而）扑杀、剔除","k":"Culling","ex":"Culling feral animals remains a contentious policy in Australia.","tr":"扑杀野化动物在澳洲仍是一项有争议的政策。","usage":"cull a population 指有选择地减少数量；a cull 可指这类控制行动，讨论政策时是较严肃的用词。","extraExamples":[{"ex":"The proposal to cull the herd prompted a long debate.","tr":"扑杀部分兽群的提议引发了长时间的争论。"},{"ex":"I need to cull hundreds of blurry photos before I make the album.","tr":"做相册前，我得先剔除几百张模糊照片。"}]},
  {"d":29,"tag":"au","w":"habitat","pos":"n.","p":"/ˈhæbɪtæt/","cn":"栖息地","k":"habitat","ex":"Bushfires destroyed a huge amount of koala habitat.","tr":"山火摧毁了大量考拉栖息地。","usage":"natural habitat / habitat loss 是常见搭配；可用 habitats 指不同栖息环境，不要与 habit（习惯）混淆。","extraExamples":[{"ex":"The wetland provides habitat for a wide variety of birds.","tr":"这片湿地为多种鸟类提供了栖息环境。"},{"ex":"Restoring the riverbank helped protect the animals' natural habitat.","tr":"修复河岸帮助保护了动物的自然栖息地。"}]},
  {"d":29,"tag":"au","w":"thrive","pos":"v.","p":"/θraɪv/","cn":"繁衍兴旺、长得好","k":"thrive","ex":"Rainbow lorikeets thrive in suburban gardens.","tr":"彩虹鹦鹉在城郊的花园里繁衍得很好。","usage":"thrive in an environment 指在某环境中生长或发展得很好；survive 只是活下来，thrive 强调兴旺。","extraExamples":[{"ex":"These herbs thrive on a sunny windowsill.","tr":"这些香草在阳光充足的窗台上长得很好。"},{"ex":"She seems to thrive in a small team where everyone shares ideas.","tr":"在人人都能交流想法的小团队里，她似乎能发挥得很好。"}]},

  {"d":30,"w":"dormant","pos":"adj.","p":"/ˈdɔːmənt/","cn":"休眠的、蛰伏不活动的","k":"dormant","ex":"The account had been dormant for two years before someone logged in.","tr":"那个账号已休眠两年，直到有人登录进去。","usage":"a dormant account / volcano 指当前不活跃但可能重新活动；latent 更强调特征或问题尚未显露。","extraExamples":[{"ex":"The project lay dormant until a new volunteer took it on.","tr":"直到新志愿者接手之前，那个项目一直搁置着。"},{"ex":"The plant remains dormant through the colder months.","tr":"在寒冷的几个月里，这种植物保持休眠状态。"}]},
  {"d":30,"tag":"au","w":"territorial","pos":"adj.","p":"/ˌterɪˈtɔːriəl/","cn":"护领地的、地盘意识强的","k":"territorial","ex":"Magpies get very territorial while they're nesting.","tr":"喜鹊在筑巢期间地盘意识会变得非常强。","usage":"territorial behaviour 是护领地的行为；形容同事时可比喻特别维护自己职责或资源，不愿别人介入。","extraExamples":[{"ex":"The bird became territorial whenever another one approached the feeder.","tr":"只要另一只鸟接近喂食器，它就会表现出护地盘的行为。"},{"ex":"He's surprisingly territorial about the kitchen when he's cooking.","tr":"他做饭时，对厨房的地盘意识出乎意料地强。"}]},

  {"d":30,"tag":"au","w":"camouflage","pos":"n. / v.","p":"/ˈkæməflɑːʒ/","cn":"伪装、保护色","k":"camouflage","ex":"The frogmouth's camouflage makes it look exactly like a broken branch.","tr":"蟆口鸱的保护色让它看起来就像一截断枝。","usage":"camouflage 常作不可数名词指伪装；动词 camouflage something as something 是把某物伪装成别的东西。","extraExamples":[{"ex":"Its brown feathers provide excellent camouflage against the bark.","tr":"它褐色的羽毛与树皮融为一体，形成极好的保护色。"},{"ex":"The tent's camouflage pattern made it hard to spot among the trees.","tr":"帐篷的迷彩图案让它在树林间很难被发现。"}]},
  {"d":30,"tag":"au","w":"resurgence","pos":"n.","p":"/rɪˈsɜːdʒəns/","cn":"重新抬头、回升复苏","k":"resurgence","ex":"There's been a resurgence in the local quoll population.","tr":"当地的袋鼬种群数量出现了回升。","usage":"a resurgence in numbers 是数量回升；a resurgence of interest 则是兴趣重新兴起，常用于较正式描述。","extraExamples":[{"ex":"The town has seen a resurgence of interest in its old railway.","tr":"镇上的老铁路重新引起了人们的兴趣。"},{"ex":"There's been a resurgence in live music at the smaller venues.","tr":"较小场馆的现场音乐演出又活跃了起来。"}]},
  {"d":30,"w":"taper","pos":"v.","p":"/ˈteɪpə/","cn":"逐渐变细、慢慢减少","k":"tapers off","ex":"Traffic tapers off after eight on weeknights.","tr":"工作日晚上八点之后车流就渐渐少了。","usage":"taper off 是逐渐减少或减弱；跑步训练中的 taper 指赛前逐步减少训练量，不是突然全停。","extraExamples":[{"ex":"The path tapers to a narrow track beyond the bridge.","tr":"过桥后，路逐渐收窄成一条小径。"},{"ex":"The noise began to taper off as the last guests left.","tr":"最后几位客人离开时，喧闹声逐渐减弱了。"}]},
  {"d":30,"tag":"au","w":"a far cry from something","pos":"phr.","p":"/ə fɑː kraɪ frəm/","cn":"与…相去甚远、差得远","k":"a far cry from","ex":"A zoo enclosure is a far cry from the open bush.","tr":"动物园的围栏跟开阔的灌木林相去甚远。","usage":"A is a far cry from B 表示两者差距很大；不自动表示谁更好，评价方向取决于上下文。","extraExamples":[{"ex":"Our tiny first flat was a far cry from the spacious place we live in now.","tr":"我们最初那套小公寓，与现在宽敞的住处相差很大。"},{"ex":"The actual walk was a far cry from the gentle stroll in the brochure.","tr":"实际走起来，和宣传册上说的轻松散步完全不是一回事。"}]},
  {"d":30,"tag":"au","w":"in one piece","pos":"phr.","p":"/ɪn wʌn piːs/","cn":"完好无损地（人或物）","k":"in one piece","ex":"We made it back from the outback in one piece.","tr":"我们从内陆平安无事地回来了。","usage":"arrive / get back in one piece 是平安无损地到达或回来，常带松一口气的口语感觉。","extraExamples":[{"ex":"The parcel arrived in one piece despite the damaged box.","tr":"箱子虽然破了，包裹里的东西还是完好送到了。"},{"ex":"I'm just glad we got home in one piece after that storm.","tr":"那场暴风雨之后，能平安到家，我就很高兴了。"}]},
  {"d":30,"tag":"au","w":"up close","pos":"phr.","p":"/ʌp kləʊs/","cn":"近距离地","k":"up close","ex":"You don't appreciate how big an emu is until you see one up close.","tr":"不近距离看一次，你不会知道鸸鹋有多大。","usage":"see something up close 是近距离看；放名词前常写 an up-close view，作副词时不加连字符。","extraExamples":[{"ex":"The painting looked completely different up close.","tr":"近距离看，那幅画完全不一样。"},{"ex":"We could watch the craftsman work up close without getting in his way.","tr":"我们可以近距离看工匠工作，又不会妨碍他。"}]},
  {"d":30,"w":"call it a night","pos":"phr.","p":"/kɔːl ɪt ə naɪt/","cn":"今晚就到这儿","k":"call it a night","ex":"The spotlighting walk was great, but let's call it a night.","tr":"夜观动物挺好玩的，不过今晚就到这儿吧。","usage":"Let's call it a night 是结束今晚的活动、准备休息；与 call it a day 类似，但更贴合夜间情境。","extraExamples":[{"ex":"I'm starting to yawn. Shall we call it a night?","tr":"我开始打哈欠了，今晚就到这儿好吗？"},{"ex":"We called it a night after the last song.","tr":"最后一首歌结束后，我们就结束了今晚的活动。"}]},
  {"d":31,"w":"reinstate","pos":"v.","p":"/ˌriːɪnˈsteɪt/","cn":"恢复（权限、职位、规则）","k":"reinstated","ex":"We reinstated the read-only role after the audit finished.","tr":"审计结束后我们恢复了那个只读角色。","usage":"reinstate access / a rule / an employee 是恢复先前被取消的权限、规则或职位，语气较正式。","extraExamples":[{"ex":"The airline agreed to reinstate our booking at the original price.","tr":"航空公司同意按原价恢复我们的预订。"},{"ex":"Her membership was reinstated once the payment error was resolved.","tr":"付款错误解决后，她的会员资格就恢复了。"}]},
  {"d":31,"w":"cursory","pos":"adj.","p":"/ˈkɜːsəri/","cn":"草草的、走马观花的","k":"cursory","ex":"A cursory look at the logs won't tell you much — you need the raw output.","tr":"草草看一眼日志说明不了什么，你得看原始输出。","usage":"a cursory glance / review 是匆匆、表面的查看，常暗示不够深入；与 thorough review 相对。 易混提示：rigorous 强调严格缜密，与 cursory 的草草查看不同。","extraExamples":[{"ex":"He gave the flat a cursory inspection before signing the lease.","tr":"他在签租约前只是草草看了一下公寓。"},{"ex":"I only had time for a cursory glance at the menu.","tr":"我只来得及匆匆扫一眼菜单。"}]},
  {"d":31,"w":"unwieldy","pos":"adj.","p":"/ʌnˈwiːldi/","cn":"笨重难操作的、大得不好使","k":"unwieldy","ex":"The config file has grown unwieldy — nobody knows what half of it does.","tr":"这个配置文件已经臃肿到不好使了，一半的内容没人知道是干什么的。","usage":"an unwieldy object / system 指因体积或复杂度而难操作；重点是不好掌控，不只是重量大。","extraExamples":[{"ex":"The suitcase was too unwieldy to carry up the narrow stairs.","tr":"行李箱太笨重，很难提上狭窄的楼梯。"},{"ex":"An unwieldy booking system made a simple change take twenty minutes.","tr":"预订系统操作繁琐，改个简单信息就花了二十分钟。"}]},
  {"d":31,"w":"pivotal","pos":"adj.","p":"/ˈpɪvətl/","cn":"关键性的、起决定作用的","k":"pivotal","ex":"The CloudTrail entry was pivotal in working out what actually happened.","tr":"那条 CloudTrail 记录对弄清真相起了关键作用。","usage":"play a pivotal role in something / doing something 是起关键作用；pivotal 更强调对结果有决定性影响。","extraExamples":[{"ex":"That conversation was a pivotal moment in our friendship.","tr":"那次谈话是我们友谊中的一个关键转折点。"},{"ex":"The volunteer drivers played a pivotal role in getting everyone home.","tr":"志愿司机在把大家送回家这件事上起了关键作用。"}]},
  {"d":31,"w":"sodden","pos":"adj.","p":"/ˈsɒdn/","cn":"湿透的、浸饱水的","k":"sodden","ex":"The track was sodden after two days of rain.","tr":"下了两天雨，那条小路已经湿透了。","usage":"sodden clothes / ground 是吸满水、湿透；water-sodden 也常见，与 humid air 的空气潮湿不同。","extraExamples":[{"ex":"We left our sodden trainers by the door to dry.","tr":"我们把湿透的运动鞋放在门口晾干。"},{"ex":"By the time the bus arrived, my coat was completely sodden.","tr":"公交车到站时，我的外套已经彻底湿透了。"}]},
  {"d":31,"w":"sluggish","pos":"adj.","p":"/ˈslʌɡɪʃ/","cn":"（市场）低迷不振的（第二义项）","k":"sluggish","ex":"The market has been sluggish since the rate decision.","tr":"利率决议之后市场一直很低迷。","usage":"a sluggish market / economy 指活跃度低、增长慢；这里不是 Day 5 中系统反应迟缓的具体用法。","extraExamples":[{"ex":"Sales were sluggish all winter, but picked up when the weather improved.","tr":"整个冬天销售都很低迷，天气转好后才回升。"},{"ex":"Demand for holiday rentals has been sluggish outside the school holidays.","tr":"学校假期之外，度假短租的需求一直不旺。"}]},
  {"d":31,"w":"take something with a grain of salt","pos":"phr.","p":"/ə ɡreɪn əv sɔːlt/","cn":"对某事持保留态度、别全信","k":"with a grain of salt","ex":"Take the vendor's benchmark numbers with a grain of salt.","tr":"厂商那些跑分数据，别全信。","usage":"take a claim with a grain of salt 是不全盘相信；英澳也常说 with a pinch of salt。","extraExamples":[{"ex":"I'd take that glowing review with a grain of salt; the writer got a free stay.","tr":"那篇赞不绝口的评价我会有所保留，作者可是免费入住的。"},{"ex":"Take his predictions with a grain of salt until we have the actual figures.","tr":"拿到实际数据之前，别全信他的预测。"}]},
  {"d":31,"w":"the lay of the land","pos":"phr.","p":"/ðə leɪ əv ðə lænd/","cn":"局势大概、情况全貌","k":"the lay of the land","ex":"Give me a week to get the lay of the land before I commit to a timeline.","tr":"给我一周时间了解一下情况，再定时间表。","usage":"get the lay of the land 是先了解整体情况；英澳也常用 the lie of the land，可指地形或局势。","extraExamples":[{"ex":"Let's walk around the neighbourhood and get the lay of the land.","tr":"我们在附近走走，先熟悉一下周边情况吧。"},{"ex":"She spent her first few days getting the lay of the land at the new club.","tr":"她用最初几天了解新俱乐部的整体情况。"}]},
  {"d":31,"w":"cut to the chase","pos":"phr.","p":"/kʌt tə ðə tʃeɪs/","cn":"直接说重点、别绕弯子","k":"cut to the chase","ex":"Let me cut to the chase — we need another maintenance window.","tr":"我直接说重点：我们还需要一个维护窗口。","usage":"Let me cut to the chase 是直接进入重点；命令别人 Cut to the chase 可能显得不耐烦。","extraExamples":[{"ex":"Can we cut to the chase? What will the repairs actually cost?","tr":"我们直接说重点好吗？维修到底要花多少钱？"},{"ex":"She cut to the chase and asked whether I wanted the spare ticket.","tr":"她开门见山地问我要不要那张多余的票。"}]},

  {"d":32,"w":"entail","pos":"v.","p":"/ɪnˈteɪl/","cn":"涉及、必然包含（多少工作量）","k":"entails","ex":"The upgrade entails downtime on all three clusters.","tr":"这次升级必然涉及三个集群的停机。","usage":"entail something / doing something 指必然涉及或需要；问 What does it entail? 是问具体要做哪些事。","extraExamples":[{"ex":"What would changing our flights entail?","tr":"改签我们的航班需要办些什么？"},{"ex":"Looking after their dog would entail a walk every morning and evening.","tr":"照看他们的狗意味着每天早晚都得遛一次。"}]},
  {"d":32,"w":"expedient","pos":"adj. / n.","p":"/ɪkˈspiːdiənt/","cn":"图方便的、权宜的","k":"expedient","ex":"Restarting was the expedient choice, not the correct one.","tr":"重启是图方便的选择，而不是正确的选择。","usage":"an expedient solution 是方便、合时宜的办法，可能牺牲原则或长期效果；不要与 expedite（加快）混淆。","extraExamples":[{"ex":"It seemed expedient to postpone the discussion until everyone had calmed down.","tr":"把讨论推迟到大家冷静下来后，似乎是个权宜之计。"},{"ex":"Cancelling the meeting was politically expedient, but it solved nothing.","tr":"取消会议在政治上是省事的选择，却没有解决任何问题。"}]},
  {"d":32,"w":"corrosive","pos":"adj.","p":"/kəˈrəʊsɪv/","cn":"腐蚀性的；（对士气）侵蚀性的","k":"corrosive","ex":"Salt air off the coast is corrosive — check the underbody after the trip.","tr":"海边的盐分空气有腐蚀性，这趟回来检查一下底盘。","usage":"corrosive substances 会腐蚀材料；a corrosive effect on morale 则比喻逐渐损害士气。","extraExamples":[{"ex":"Constant sarcasm can have a corrosive effect on a friendship.","tr":"不断说挖苦话会逐渐侵蚀一段友谊。"},{"ex":"The label warns that the liquid is corrosive and can damage metal.","tr":"标签警告这种液体有腐蚀性，会损坏金属。"}]},
  {"d":32,"w":"amenable","pos":"adj.","p":"/əˈmiːnəbl/","cn":"愿意配合的、听得进意见的","k":"amenable","ex":"The security team is amenable to a phased rollout.","tr":"安全团队愿意配合分阶段上线的方案。","usage":"be amenable to a suggestion / doing something 是愿意考虑或配合；to 是介词，后接名词或动名词。","extraExamples":[{"ex":"Would you be amenable to meeting a little earlier?","tr":"你愿意稍微提前一点见面吗？"},{"ex":"Our landlord was surprisingly amenable to letting us keep a cat.","tr":"房东出乎意料地愿意让我们养猫。"}]},
  {"d":32,"tag":"au","w":"brackish","pos":"adj.","p":"/ˈbrækɪʃ/","cn":"半咸的（淡咸水交汇）","k":"brackish","ex":"Estuarine crocodiles live in brackish water near river mouths.","tr":"河口鳄栖息在入海口附近的半咸水中。","usage":"brackish water 是带一定盐分的水，常见于淡咸水交汇处；不是用来形容普通淡水。","extraExamples":[{"ex":"The stream becomes brackish where it meets the incoming tide.","tr":"溪流与涨潮海水交汇的地方，水变成了半咸水。"},{"ex":"Only a few plants can tolerate the brackish water around the lagoon.","tr":"只有少数植物能耐受潟湖周围的半咸水。"}]},
  {"d":32,"w":"supple","pos":"adj.","p":"/ˈsʌpl/","cn":"柔韧顺从的（身体或悬架）","k":"supple","ex":"The damping feels supple over broken tarmac without going soft.","tr":"这套阻尼在破损路面上很柔韧，但又不显得软。","usage":"supple leather / muscles 指柔软有弹性；车评中 supple suspension 强调柔韧吸震，同时不必松垮。","extraExamples":[{"ex":"The leather was stiff at first, but became supple with use.","tr":"皮革起初很硬，用久了就变得柔软了。"},{"ex":"Gentle stretches help keep my shoulders supple between training sessions.","tr":"训练间隙做些轻柔拉伸，有助于保持肩部柔韧。"}]},
  {"d":32,"w":"go back to the drawing board","pos":"phr.","p":"/ðə ˈdrɔːɪŋ bɔːd/","cn":"推翻重新设计","k":"back to the drawing board","ex":"If prefix delegation doesn't help, we go back to the drawing board.","tr":"如果前缀委派也没用，我们就得推翻重新设计。","usage":"go back to the drawing board 是失败后重新考虑设计或方案；不保证必须完全丢弃之前每一部分。","extraExamples":[{"ex":"The venue fell through, so we'll have to go back to the drawing board.","tr":"场地没着落了，我们得重新制定方案。"},{"ex":"When the prototype failed its first test, the team went back to the drawing board.","tr":"原型第一次测试失败后，团队重新开始设计。"}]},
  {"d":32,"w":"bend over backwards","pos":"phr.","p":"/bend ˈəʊvə ˈbækwədz/","cn":"竭尽全力去配合、拼命迁就","k":"bent over backwards","ex":"We bent over backwards to fit their timeline and they still missed it.","tr":"我们竭尽全力配合他们的时间表，结果他们还是没赶上。","usage":"bend over backwards to help someone 是竭力帮助或迁就；过去式 bent，常暗示付出已超出正常程度。","extraExamples":[{"ex":"The staff bent over backwards to find us two seats together.","tr":"工作人员想尽办法，帮我们找到了两个连在一起的座位。"},{"ex":"You shouldn't have to bend over backwards to keep one friend happy.","tr":"你不该为了让一个朋友高兴就拼命迁就。"}]},
  {"d":32,"w":"a blessing in disguise","pos":"phr.","p":"/ə ˈblesɪŋ ɪn dɪsˈɡaɪz/","cn":"塞翁失马、坏事变好事","k":"a blessing in disguise","ex":"The failed deploy was a blessing in disguise — it exposed the missing alert.","tr":"那次部署失败反倒是好事，它暴露了缺失的告警。","usage":"a blessing in disguise 是最初看似坏事、后来带来好处；常在知道后续结果时回头评价。","extraExamples":[{"ex":"Missing that train was a blessing in disguise; I bumped into an old friend at the station.","tr":"错过那班火车反倒是好事，我在车站碰见了一位老朋友。"},{"ex":"The cancelled race proved a blessing in disguise because my ankle needed more rest.","tr":"比赛取消反倒是件好事，因为我的脚踝还需要多休息。"}]},
  {"d":32,"w":"all things considered","pos":"phr.","p":"/ɔːl θɪŋz kənˈsɪdəd/","cn":"综合来看、考虑到各种因素","k":"All things considered","ex":"All things considered, a forty-minute outage wasn't a bad outcome.","tr":"综合来看，四十分钟的中断算不上糟糕的结果。","usage":"All things considered, ... 是综合权衡后的判断；常放句首，允许结论中保留缺点或例外。","extraExamples":[{"ex":"All things considered, I'd rather pay a little more and stay closer to the station.","tr":"综合来看，我宁愿多花一点钱，住得离车站近些。"},{"ex":"It was a good trip, all things considered, even with the rain.","tr":"考虑到各方面情况，那趟旅行还是不错的，虽然下了雨。"}]},
  {"d":33,"w":"underwhelming","pos":"adj.","p":"/ˌʌndəˈwelmɪŋ/","cn":"令人失望的；不如预期惊艳","usage":"评价没有想象中出色的体验，比 disappointing 更委婉。","ex":"The restaurant had amazing reviews, but the food was honestly a bit underwhelming.","tr":"那家餐厅评价特别高，但说实话，食物有点让人失望。","k":"underwhelming","extraExamples":[{"ex":"The much-hyped exhibition was rather underwhelming in person.","tr":"那场被大力宣传的展览，实际看起来相当令人失望。"},{"ex":"For such an expensive car, the interior felt underwhelming.","tr":"对于这么贵的一辆车来说，内饰有些不尽如人意。"}]},
  {"d":33,"w":"spontaneous","pos":"adj.","p":"/spɒnˈteɪniəs/","cn":"随性的；即兴的；心血来潮的","usage":"常修饰临时起意的旅行、决定或活动；spontaneous trip。","ex":"We went on a spontaneous road trip down the coast last weekend.","tr":"上周末我们心血来潮，沿着海岸线自驾了一趟。","k":"spontaneous","extraExamples":[{"ex":"It was a spontaneous decision to stay another night.","tr":"多住一晚是个临时起意的决定。"},{"ex":"Her speech drew a spontaneous round of applause from the audience.","tr":"她的讲话引得观众自发地鼓起掌来。"}]},
  {"d":33,"w":"flustered","pos":"adj.","p":"/ˈflʌstəd/","cn":"慌乱的；手忙脚乱的","usage":"get flustered 表示由于压力或突发情况而一时慌了阵脚。","ex":"I got a bit flustered when everyone started asking me questions at once.","tr":"大家突然同时问我问题，我一下子有点手忙脚乱。","k":"flustered","extraExamples":[{"ex":"Don't get flustered if you miss the turning; there's another exit ahead.","tr":"错过转弯也别慌，前面还有一个出口。"},{"ex":"She looked flustered after realising she'd joined the wrong video call.","tr":"发现自己进错视频会议后，她显得有些慌乱。"}]},
  {"d":33,"w":"considerate","pos":"adj.","p":"/kənˈsɪdərət/","cn":"体贴的；考虑周到的","usage":"It was considerate of someone to do something 表示某人做某事很体贴。","ex":"It was really considerate of her to check whether everyone had got home safely.","tr":"她特意确认大家是否安全到家，真的很体贴。","k":"considerate","extraExamples":[{"ex":"Please be considerate of the neighbours when you leave tonight.","tr":"今晚离开时请顾及邻居，尽量轻声些。"},{"ex":"Leaving us a spare towel was a considerate touch.","tr":"给我们多留一条毛巾，这个细节很贴心。"}]},
  {"d":33,"w":"apprehensive","pos":"adj.","p":"/ˌæprɪˈhensɪv/","cn":"忐忑不安的；心存顾虑的","usage":"be apprehensive about something：对未来或未知的事情感到不安。","ex":"I was a little apprehensive about joining the badminton club, but everyone turned out to be really friendly.","tr":"刚开始我对加入羽毛球俱乐部有点忐忑，但后来发现大家都很友好。","k":"apprehensive","extraExamples":[{"ex":"She felt apprehensive about driving on the left for the first time.","tr":"第一次靠左行驶，她心里有些忐忑。"},{"ex":"I'm excited about the move, though a little apprehensive about starting again.","tr":"我很期待搬家，不过对重新开始也有些顾虑。"}]},
  {"d":33,"w":"knack","pos":"n.","p":"/næk/","cn":"诀窍；特别擅长某事的本事","usage":"have a knack for something / doing something 是常用固定搭配。","ex":"He's got a knack for making people feel comfortable, even when they've only just met.","tr":"他特别擅长让人感到自在，即使是刚认识的人也一样。","k":"knack","extraExamples":[{"ex":"My sister has a knack for finding great restaurants down unpromising side streets.","tr":"我姐姐特别会在看着不起眼的小街里找到好餐馆。"},{"ex":"Once you've got the knack of folding the tent, it only takes a minute.","tr":"掌握了折帐篷的诀窍后，一分钟就能收好。"}]},
  {"d":33,"w":"I'm not fussed","pos":"phr.","p":"/aɪm nɒt fʌst/","cn":"我都行；我没有特别偏好","usage":"英澳常用口语，表示对两个选择都可以，不一定是不感兴趣。","ex":"I'm not fussed whether we get Thai or Japanese food tonight — whatever you feel like.","tr":"今晚吃泰餐还是日餐我都行——看你想吃什么。","k":"I'm not fussed","extraExamples":[{"ex":"Window or aisle? I'm not fussed, as long as we sit together.","tr":"靠窗还是靠过道？我都行，只要我们坐在一起。"},{"ex":"I'm not fussed about the colour, but it needs to fit properly.","tr":"颜色我没什么偏好，但尺寸一定要合适。"}]},
  {"d":33,"w":"It slipped my mind","pos":"phr.","p":"/ɪt slɪpt maɪ maɪnd/","cn":"我一时忘了","usage":"委婉自然地解释非故意忘事；也可说 It completely slipped my mind。","ex":"I was supposed to call you yesterday, but it completely slipped my mind.","tr":"我昨天本来应该给你打电话的，但我完全忘了。","k":"slipped my mind","extraExamples":[{"ex":"Sorry, your birthday completely slipped my mind.","tr":"抱歉，我把你的生日忘得一干二净了。"},{"ex":"The appointment slipped my mind until the reminder popped up.","tr":"直到提醒弹出来，我才想起那个预约。"}]},
  {"d":33,"w":"read the room","pos":"phr.","p":"/riːd ðə ruːm/","cn":"察言观色；看清场合气氛","usage":"判断社交环境中其他人的情绪和现场氛围。","ex":"He started joking while everyone was stressed. He really needs to read the room.","tr":"大家都很焦虑时他却开始开玩笑。他真应该学会看场合。","k":"read the room","extraExamples":[{"ex":"You need to read the room before bringing up another expensive holiday.","tr":"提议再去一次昂贵的旅行之前，你得先看看大家的反应。"},{"ex":"She read the room and saved her announcement for a quieter moment.","tr":"她看出了现场的气氛，把自己的消息留到稍安静的时候再说。"}]},
  {"d":33,"w":"go out of your way","pos":"phr.","p":"/ɡəʊ aʊt əv jɔː weɪ/","cn":"特意费心；不嫌麻烦","usage":"go out of your way to do something，常用于感谢额外付出。","ex":"You didn't have to go out of your way to pick me up from the airport, but I appreciate it.","tr":"你其实不用特意跑一趟机场接我，不过真的很感谢。","k":"go out of your way","extraExamples":[{"ex":"Thanks for going out of your way to make me feel welcome.","tr":"谢谢你特意费心，让我感到很受欢迎。"},{"ex":"They went out of their way to find a meal our vegan friend could eat.","tr":"他们特意想办法，找了一份我们那位纯素食朋友能吃的餐食。"}]},
  {"d":34,"date":"2026-10-09","w":"accommodating","pos":"adj.","p":"/əˈkɒmədeɪtɪŋ/","cn":"乐于配合的；愿意通融的","usage":"形容愿意照顾别人需要的人或服务；比 helpful 更强调灵活配合。","ex":"The host was really accommodating when we asked to check in a bit earlier.","tr":"我们提出想提前一点入住时，房东很愿意通融。","k":"accommodating","extraExamples":[{"ex":"The café was very accommodating about our different dietary requirements.","tr":"咖啡馆很愿意配合我们各不相同的饮食要求。"},{"ex":"I appreciate you being so accommodating when our plans keep changing.","tr":"我们的计划总在变，谢谢你一直这么愿意配合。"}]},
  {"d":34,"date":"2026-10-09","w":"rapport","pos":"n.","p":"/ræˈpɔː/","cn":"融洽的关系；彼此信任的默契","usage":"build / establish a rapport with someone：与某人建立融洽关系；常用于朋友、同事或客户之间。","ex":"We built a good rapport over a few games of badminton and a coffee afterwards.","tr":"一起打了几场羽毛球，之后又喝了杯咖啡，我们渐渐熟络起来。","k":"rapport","extraExamples":[{"ex":"The coach quickly established a rapport with the younger players.","tr":"教练很快就和年轻球员建立了融洽的关系。"},{"ex":"It's easier to discuss a problem once you've built some rapport.","tr":"彼此有了一些信任和默契后，讨论问题就容易多了。"}]},
  {"d":34,"date":"2026-10-09","w":"frazzled","pos":"adj.","p":"/ˈfræzld/","cn":"忙得精疲力竭的；心力交瘁的","usage":"非正式表达，强调忙乱或压力导致的身心疲惫；feel / look frazzled。","ex":"I was feeling pretty frazzled after work, so I went for an easy run to clear my head.","tr":"下班后我感到心力交瘁，就出去轻松跑了一会儿，让脑子放松一下。","k":"frazzled","extraExamples":[{"ex":"By Friday evening, I was too frazzled to make any plans.","tr":"到了周五晚上，我已经累得没心思安排任何活动了。"},{"ex":"A quiet breakfast helped me feel less frazzled before the journey.","tr":"出发前安安静静地吃了顿早餐，让我没那么心烦意乱了。"}]},
  {"d":34,"date":"2026-10-09","w":"haphazard","pos":"adj.","p":"/hæpˈhæzəd/","cn":"缺乏规划的；杂乱无章的","usage":"形容安排或做法随意、没有系统性，通常带批评意味；a haphazard approach。","ex":"Our packing was a bit haphazard, and we ended up bringing three chargers but no sunscreen.","tr":"我们收拾行李时有点乱，结果带了三个充电器，却没带防晒霜。","k":"haphazard","extraExamples":[{"ex":"The signs had been put up in a haphazard fashion, leaving visitors confused.","tr":"标牌装得毫无章法，让游客一头雾水。"},{"ex":"My haphazard approach to saving money wasn't getting me anywhere.","tr":"我那种毫无规划的存钱方式一直没什么成效。"}]},
  {"d":34,"date":"2026-10-09","w":"unobtrusive","pos":"adj.","p":"/ˌʌnəbˈtruːsɪv/","cn":"不引人注意的；不打扰人的","usage":"常形容服务、设计或设备低调、不妨碍体验；通常是褒义，区别于 intrusive（打扰人的）。","ex":"The service was friendly and unobtrusive, so we could chat without being interrupted.","tr":"服务亲切又不打扰人，我们可以自在聊天，不被打断。","k":"unobtrusive","extraExamples":[{"ex":"The hotel has an unobtrusive entrance tucked between two shops.","tr":"酒店入口藏在两家商店之间，很不起眼。"},{"ex":"I wanted an unobtrusive phone mount that wouldn't block the view.","tr":"我想要一个不显眼、也不挡视线的手机支架。"}]},
  {"d":34,"date":"2026-10-09","w":"buoyant","pos":"adj.","p":"/ˈbɔɪənt/","cn":"情绪高涨的；乐观有活力的；有浮力的","usage":"形容心情时可说 in a buoyant mood；也可描述能漂浮的物体，或活跃的市场。","ex":"She was in a buoyant mood after finishing her first half marathon.","tr":"完成自己的第一场半程马拉松后，她心情特别振奋。","k":"buoyant","extraExamples":[{"ex":"The market was in a buoyant mood after the good news.","tr":"好消息传来后，市场情绪十分乐观。"},{"ex":"The life jacket kept her buoyant while she waited for the boat.","tr":"她等船的时候，救生衣让她一直浮在水面上。"}]},
  {"d":34,"date":"2026-10-09","w":"be up for something","pos":"phr.","p":"/biː ʌp fə ˈsʌmθɪŋ/","cn":"愿意参加；有兴致做某事","usage":"be up for + 名词 / 动名词，常用于轻松邀约；Are you up for ...? 注意区别于 be up to（正在做或胜任）。","ex":"Are you up for a coastal walk and a coffee on Saturday?","tr":"周六有兴趣一起沿海边走走，再喝杯咖啡吗？","k":"up for","extraExamples":[{"ex":"I'm up for trying that new climbing gym if you are.","tr":"如果你愿意，我也很想去试试那家新攀岩馆。"},{"ex":"Would your flatmate be up for joining us for dinner?","tr":"你室友有兴致跟我们一起吃晚饭吗？"}]},
  {"d":34,"date":"2026-10-09","w":"give it a miss","pos":"phr.","p":"/ɡɪv ɪt ə mɪs/","cn":"这次不参加；跳过这一次","usage":"英澳常用非正式表达；give something a miss 指主动决定不做，并非错过机会。","ex":"I usually play on Wednesdays, but I'll give it a miss this week because my knee is sore.","tr":"我通常周三打球，但这周膝盖疼，就先不去了。","k":"give it a miss","extraExamples":[{"ex":"The queue is enormous. Let's give it a miss and find another café.","tr":"队伍太长了。我们跳过这家，找别的咖啡馆吧。"},{"ex":"I gave the dessert a miss because I was already full.","tr":"我已经吃饱了，所以没要甜点。"}]},
  {"d":34,"date":"2026-10-09","w":"put someone on the spot","pos":"phr.","p":"/pʊt ˈsʌmwʌn ɒn ðə spɒt/","cn":"让某人当场为难；逼某人立即表态","usage":"常用于突然要求别人回答或作决定；I don't mean to put you on the spot 是缓和语气的说法。","ex":"I don't want to put you on the spot, but do you reckon you could cover my shift on Friday?","tr":"我不想让你当场为难，不过你觉得周五能帮我顶个班吗？","k":"put you on the spot","extraExamples":[{"ex":"Asking about her salary in front of everyone really put her on the spot.","tr":"当着大家的面问她薪水，真让她很为难。"},{"ex":"You don't have to decide now; I'm not trying to put you on the spot.","tr":"你不用现在决定，我不是要逼你当场表态。"}]},
  {"d":34,"date":"2026-10-09","w":"make a day of it","pos":"phr.","p":"/meɪk ə deɪ əv ɪt/","cn":"顺便安排一整天的活动；玩上一整天","usage":"把原本的一项活动扩展成一整天的出游，通常带轻松愉快的意味。","ex":"If we're driving out to the winery, we might as well make a day of it and explore the nearby village.","tr":"既然要开车去酒庄，不如安排一整天，顺便逛逛附近的小镇。","k":"make a day of it","extraExamples":[{"ex":"We could visit the gallery, have lunch nearby and make a day of it.","tr":"我们可以逛美术馆，再在附近吃午饭，安排成一整天的活动。"},{"ex":"Since the drive takes two hours, let's make a day of it.","tr":"既然开车要两小时，我们就玩一整天吧。"}]},
  {"d":35,"date":"2026-10-10","w":"affable","pos":"adj.","p":"/ˈæfəbl/","cn":"和蔼友善的；容易交谈的","usage":"形容一个人态度亲切、容易相处，常用于初次见面时的印象；比 friendly 稍正式。","ex":"The club organiser was affable and made a point of introducing us to the other players.","tr":"俱乐部组织者很亲切，还特意把我们介绍给了其他球友。","k":"affable","extraExamples":[{"ex":"Our new neighbour is an affable man who always stops for a chat.","tr":"新邻居很和气，总会停下来聊上几句。"},{"ex":"Despite being exhausted, she remained affable throughout the long dinner.","tr":"尽管累坏了，她在漫长的晚餐中仍然和蔼友善。"}]},
  {"d":35,"date":"2026-10-10","w":"resourceful","pos":"adj.","p":"/rɪˈzɔːsfəl/","cn":"足智多谋的；善于想办法解决问题的","usage":"褒义词，强调善用手头资源解决困难，而不只是知识多；a resourceful person。","ex":"You have to be resourceful when your camping stove stops working halfway through a road trip.","tr":"自驾途中露营炉突然坏了，就得靠自己灵活想办法。","k":"resourceful","extraExamples":[{"ex":"She's resourceful enough to put a meal together from almost nothing.","tr":"她很会想办法，几乎没什么食材也能做出一顿饭。"},{"ex":"The resourceful guide found us shelter when the storm arrived.","tr":"风暴来袭时，那位足智多谋的向导为我们找到了避雨处。"}]},
  {"d":35,"date":"2026-10-10","w":"disgruntled","pos":"adj.","p":"/dɪsˈɡrʌntld/","cn":"不满的；心中有怨气的","usage":"常描述因待遇、安排或服务未达预期而不满的人；a disgruntled customer / employee。","ex":"A few passengers looked disgruntled when the airline announced another delay.","tr":"航空公司又宣布延误时，几位乘客显得很不满。","k":"disgruntled","extraExamples":[{"ex":"The guests were disgruntled about being charged for parking.","tr":"客人们对被收取停车费感到不满。"},{"ex":"He left a disgruntled message after nobody returned his calls.","tr":"一直没人回电话，他便留了一条带着怨气的留言。"}]},
  {"d":35,"date":"2026-10-10","w":"nonchalant","pos":"adj.","p":"/ˈnɒnʃələnt/","cn":"若无其事的；表现得毫不在意的","usage":"形容外表显得轻松、不紧张或不在意，不一定代表内心真的如此；try to look nonchalant。","ex":"He tried to look nonchalant before the badminton final, but he kept checking the draw.","tr":"羽毛球决赛前，他想表现得若无其事，却一直在查看对阵表。","k":"nonchalant","extraExamples":[{"ex":"She gave a nonchalant shrug, but I could tell she was disappointed.","tr":"她若无其事地耸了耸肩，但我看得出她很失望。"},{"ex":"He sounded surprisingly nonchalant about losing his wallet.","tr":"他说起丢钱包的事时，语气出奇地不在意。"}]},
  {"d":35,"date":"2026-10-10","w":"restorative","pos":"adj.","p":"/rɪˈstɒrətɪv/","cn":"帮助恢复精力的；使人身心恢复的","usage":"可形容休息、睡眠或让人重新有精神的活动；a restorative walk / break，语气比 relaxing 更强调恢复。","ex":"A quiet walk along the beach felt surprisingly restorative after a week of late shifts.","tr":"上了一周晚班后，沿海边安静走走，出乎意料地让人恢复了精神。","k":"restorative","extraExamples":[{"ex":"An afternoon without my phone turned out to be wonderfully restorative.","tr":"一个下午不用手机，结果让我格外恢复精神。"},{"ex":"We booked a restorative weekend somewhere with no traffic or crowds.","tr":"我们订了一个远离车流和人群的周末行程，好好恢复精力。"}]},
  {"d":35,"date":"2026-10-10","w":"peckish","pos":"adj.","p":"/ˈpekɪʃ/","cn":"有点饿的；想吃点东西的","usage":"英澳常见非正式口语，比 hungry 轻，适合提议吃点小食；feel a bit peckish。","ex":"I'm feeling a bit peckish after that run. Shall we stop for a toastie?","tr":"跑完这一趟，我有点饿了。我们停下来吃个烤三明治怎么样？","k":"peckish","extraExamples":[{"ex":"Are you peckish, or shall we wait until dinner?","tr":"你有点饿了吗，还是我们等到晚饭再吃？"},{"ex":"I keep some nuts in my bag in case I get peckish on the train.","tr":"我包里放了些坚果，以防坐火车时想吃点东西。"}]},
  {"d":35,"date":"2026-10-10","w":"get around to something","pos":"phr.","p":"/ɡet əˈraʊnd tə ˈsʌmθɪŋ/","cn":"终于抽出时间做某事","usage":"get around to + 名词 / 动名词，指之前没空或一直拖着，后来终于做了；注意 to 后用 doing。","ex":"I finally got around to reviewing the incident notes after the morning handover.","tr":"早上的交接结束后，我终于抽出时间查看了事件记录。","k":"got around to","extraExamples":[{"ex":"Have you got around to booking the car in for a service yet?","tr":"你抽出时间预约汽车保养了吗？"},{"ex":"I keep meaning to frame that photo, but I never get around to it.","tr":"我一直想把那张照片装裱起来，却总没抽出空。"}]},
  {"d":35,"date":"2026-10-10","w":"take something in your stride","pos":"phr.","p":"/teɪk ˈsʌmθɪŋ ɪn jɔː straɪd/","cn":"从容应对某事；不因困难而慌乱","usage":"英澳常用；take a setback / change in your stride 表示遇到意外仍能平稳应对，美式常省略 your。","ex":"She took the last-minute change in her stride and found us another place to stay.","tr":"面对临时的变动，她从容应对，给我们找到了另一个住处。","k":"took the last-minute change in her stride","extraExamples":[{"ex":"He took the criticism in his stride and asked how he could improve.","tr":"他从容接受了批评，并问自己可以怎样改进。"},{"ex":"A cancelled flight is frustrating, but she's taking it in her stride.","tr":"航班取消让人沮丧，但她正从容应对。"}]},
  {"d":35,"date":"2026-10-10","w":"be on the fence","pos":"phr.","p":"/biː ɒn ðə fens/","cn":"犹豫不决；尚未决定支持哪一方","usage":"be on the fence about + 名词 / 动名词，强调自己的选择或立场未定，区别于 up in the air（事情本身尚未定下来）。","ex":"I'm still on the fence about entering the half marathon; I need to see how my training goes.","tr":"我还在犹豫要不要报名半程马拉松，得先看看训练进展。","k":"on the fence","extraExamples":[{"ex":"We're on the fence about getting a dog while we travel so often.","tr":"我们经常旅行，所以对要不要养狗还拿不定主意。"},{"ex":"If you're still on the fence, try borrowing one before buying it.","tr":"如果你还在犹豫，买之前先借一个试试。"}]},
  {"d":35,"date":"2026-10-10","w":"get carried away","pos":"phr.","p":"/ɡet ˈkærid əˈweɪ/","cn":"一时兴奋过头；忘了分寸","usage":"常指因为兴奋、热情或情绪而做得过头；get carried away with something，不是被字面意义地带走。","ex":"We got carried away planning the road trip and nearly booked a different town for every night.","tr":"我们规划自驾游时兴奋过了头，差点每晚都订在不同的小镇。","k":"got carried away","extraExamples":[{"ex":"I got carried away at the bookshop and bought more than I could carry.","tr":"我在书店一时买得太起劲，买到拿都拿不动了。"},{"ex":"Let's not get carried away; we've only won the first game.","tr":"我们别高兴过头，才赢了第一局而已。"}]},
  {"d":36,"date":"2026-10-11","w":"aloof","pos":"adj.","p":"/əˈluːf/","cn":"冷淡疏远的；不愿与人亲近的","usage":"seem / come across as aloof 指给人疏远的印象，通常带负面评价；与 nonchalant（若无其事、不显得担心）侧重点不同。","ex":"I thought he was a bit aloof at first, but he relaxed once we started chatting about cars.","tr":"起初我觉得他有点冷淡，但我们开始聊汽车后，他就放松下来了。","k":"aloof","extraExamples":[{"ex":"She can seem aloof in a large group, but she's warm one to one.","tr":"人多时她可能显得疏远，但单独相处时很热情。"},{"ex":"His aloof manner made it hard for the newcomers to approach him.","tr":"他那种冷淡的态度让新来的人很难主动接近。"}]},
  {"d":36,"date":"2026-10-11","w":"uncanny","pos":"adj.","p":"/ʌnˈkæni/","cn":"奇异得令人惊讶的；巧得不可思议的","usage":"an uncanny resemblance 是惊人的相似；It's uncanny how ... 常用来感叹某种巧合或能力奇异得难以解释。","ex":"It's uncanny how often we turn up at the same café without planning it.","tr":"我们没约好却经常出现在同一家咖啡馆，巧得让人难以置信。","k":"uncanny","extraExamples":[{"ex":"The resemblance between the two brothers is uncanny.","tr":"这兄弟俩像得令人惊讶。"},{"ex":"She has an uncanny ability to know when something is bothering me.","tr":"她总能察觉我什么时候有心事，这种本领有些不可思议。"}]},
  {"d":36,"date":"2026-10-11","w":"squeamish","pos":"adj.","p":"/ˈskwiːmɪʃ/","cn":"容易因血腥或恶心场面而不适的","usage":"be squeamish about blood / needles 指看到血或针头会觉得难受；不是一般的害羞或社交紧张。","ex":"I'm a bit squeamish about blood, so I looked away while she cleaned the cut.","tr":"我有点怕见血，所以她清理伤口时，我把目光移开了。","k":"squeamish","extraExamples":[{"ex":"He isn't usually squeamish, but the scene made him look away.","tr":"他平时并不容易觉得恶心，但那个场面还是让他移开了视线。"},{"ex":"If you're squeamish about insects, you might want to skip that part of the exhibition.","tr":"如果你看见昆虫就不舒服，可能最好跳过展览的那一部分。"}]},
  {"d":36,"date":"2026-10-11","w":"rummage","pos":"v.","p":"/ˈrʌmɪdʒ/","cn":"翻找；乱翻着寻找","usage":"rummage through / in a bag for something 是在包里翻找某物；强调翻动东西寻找，不是整齐地逐项检查。","ex":"I had to rummage through my backpack to find the car keys.","tr":"我得在背包里翻找一番，才能找到车钥匙。","k":"rummage","extraExamples":[{"ex":"She rummaged in the kitchen drawer for a bottle opener.","tr":"她在厨房抽屉里翻找开瓶器。"},{"ex":"We spent the morning rummaging through boxes of old photographs.","tr":"我们整个上午都在一箱箱旧照片里翻找。"}]},
  {"d":36,"date":"2026-10-11","tag":"bad","w":"gumption","pos":"n.","p":"/ˈɡʌmpʃən/","cn":"主动行动的魄力；勇气和干劲","usage":"口语不可数名词；have the gumption to do something 表示有主动出手的魄力，侧重敢行动，而不只是 resourceful（善于想办法）。","ex":"It takes a bit of gumption to walk into a new badminton club and ask for a game.","tr":"走进一家陌生的羽毛球俱乐部，主动找人打一场，是需要一点勇气和干劲的。","k":"gumption","extraExamples":[{"ex":"She had the gumption to ask for a refund when everyone else just complained.","tr":"别人都只是抱怨，她却有魄力开口要求退款。"},{"ex":"I wish I'd had the gumption to introduce myself instead of waiting to be noticed.","tr":"我真希望当时能主动介绍自己，而不是等别人注意到我。"}]},
  {"d":36,"date":"2026-10-11","w":"tangible","pos":"adj.","p":"/ˈtændʒəbl/","cn":"实实在在的；可明显感受到的；有形的","usage":"tangible results / benefits 指看得见、能明确感受到的成效；make a tangible difference 是带来切实改变，也可描述有形资产。","ex":"The new runbook has made a tangible difference to how quickly we resolve incidents.","tr":"新的操作手册切实提高了我们处理故障的速度。","k":"tangible","extraExamples":[{"ex":"Finishing that first five-kilometre run gave me tangible proof that I was improving.","tr":"第一次跑完五公里，让我切实看到了自己的进步。"},{"ex":"We need something more tangible than a vague promise that things will improve.","tr":"我们需要比一句事情会好转的模糊承诺更实在的东西。"}]},
  {"d":36,"date":"2026-10-11","w":"get a word in edgeways","pos":"phr.","p":"/ɡet ə wɜːd ɪn ˈedʒweɪz/","cn":"插得上话；找到插话的机会","usage":"英澳口语常用 couldn't / can't get a word in edgeways，抱怨别人一直说、自己插不上话；美式常用 edgewise。","ex":"He was so excited about his road trip that I couldn't get a word in edgeways.","tr":"他兴奋地不停讲自驾游的事，我连一句话都插不上。","k":"get a word in edgeways","extraExamples":[{"ex":"With everyone talking at once, I could barely get a word in edgeways.","tr":"大家同时说话，我几乎插不上嘴。"},{"ex":"Let her get a word in edgeways; you haven't stopped talking since we arrived.","tr":"让她也插句话吧，我们到这里以后你就一直没停过。"}]},
  {"d":36,"date":"2026-10-11","w":"put your foot in it","pos":"phr.","p":"/pʊt jɔː fʊt ɪn ɪt/","cn":"不小心说错话，让人尴尬或不快","usage":"英澳常用来描述无意中冒犯别人；人称要相应变化：I put my foot in it。美式也常说 put your foot in your mouth。","ex":"I put my foot in it when I asked why he hadn't invited his partner, not realising they'd split up.","tr":"我不知道他们已经分手，还问他为什么没邀请伴侣，一不小心说了让人尴尬的话。","k":"put my foot in it","extraExamples":[{"ex":"I really put my foot in it by calling the event a waste of time in front of its organiser.","tr":"我当着组织者的面说活动浪费时间，真是说错话了。"},{"ex":"Before I put my foot in it again, is this meant to be a surprise?","tr":"免得我又说错话，这件事是打算给人惊喜的吗？"}]},
  {"d":36,"date":"2026-10-11","w":"go halves","pos":"phr.","p":"/ɡəʊ hɑːvz/","cn":"两人各付一半；平摊费用","usage":"go halves on something / with someone 是两人平摊费用；与 split the difference（两个报价或立场各让一步）不同。","ex":"Shall we go halves on a pizza after the run? I'm hungry, but I couldn't finish a whole one.","tr":"跑完步后，我们要不要一起点个披萨、各付一半？我饿了，但一个人吃不下一整个。","k":"go halves","extraExamples":[{"ex":"We went halves on a taxi because neither of us wanted to wait for the bus.","tr":"我们都不想等公交车，于是平摊了出租车费。"},{"ex":"Would you like to go halves on a bottle of wine?","tr":"你愿意跟我合买一瓶葡萄酒吗？"}]},
  {"d":36,"date":"2026-10-11","w":"be at a loose end","pos":"phr.","p":"/biː ət ə luːs end/","cn":"闲着没事做；一时不知道做什么好","usage":"英澳常见口语，指暂时没有安排；If you're at a loose end ... 常用来邀请人。loose ends 单独用则可指未收尾的事情。","ex":"If you're at a loose end on Sunday, come over for a coffee and we can plan the coastal drive.","tr":"如果你周日闲着没安排，就来喝杯咖啡，我们可以一起规划沿海自驾路线。","k":"at a loose end","extraExamples":[{"ex":"I found myself at a loose end when the match was called off.","tr":"比赛取消后，我一下子闲着不知道该干什么。"},{"ex":"She's at a loose end this afternoon, so I invited her along.","tr":"她今天下午没什么事做，所以我也邀请她一起去了。"}]},
  {"d":37,"date":"2026-10-12","w":"replenish","pos":"v.","p":"/rɪˈplenɪʃ/","cn":"补充；重新备足消耗掉的东西","usage":"replenish supplies / stocks 是补充已消耗的物资；replenish your energy 可指恢复精力，强调补回原有储备。","ex":"We stopped in town to replenish our supplies before driving further into the outback.","tr":"继续深入澳洲内陆之前，我们在镇上停下来补充物资。","k":"replenish","extraExamples":[{"ex":"A proper lunch helped replenish my energy after the early start.","tr":"一大早出门后，一顿像样的午餐帮我补充了体力。"},{"ex":"The volunteers replenished the water stations before the next group of runners arrived.","tr":"下一批跑者到达前，志愿者补足了补水站的水。"}]},
  {"d":37,"date":"2026-10-12","w":"treacherous","pos":"adj.","p":"/ˈtretʃərəs/","cn":"暗藏危险的；危险且难以行走或驾驭的","usage":"treacherous roads / conditions 指因湿滑、复杂或难预测而危险的路况；形容人时则有背信弃义的含义。","ex":"The coastal track became treacherous after the rain, so we turned back before the steep section.","tr":"雨后沿海小路变得很危险，所以还没走到陡峭的路段，我们就折返了。","k":"treacherous","extraExamples":[{"ex":"Black ice can make an ordinary stretch of road treacherous.","tr":"看不见的薄冰会让普通路段变得十分危险。"},{"ex":"The steps were treacherous in the dark, so we used our phone torches.","tr":"那些台阶在黑暗里很不好走，所以我们打开了手机手电筒。"}]},
  {"d":37,"date":"2026-10-12","w":"serendipity","pos":"n.","p":"/ˌserənˈdɪpəti/","cn":"意外发现美好事物的幸运；机缘巧合","usage":"通常不可数，常说 pure serendipity，指没有刻意寻找却碰上好事；与 a blessing in disguise（坏事后来变好事）不同。","ex":"Finding that tiny café while we were looking for a petrol station was pure serendipity.","tr":"我们本来在找加油站，却发现了那家小咖啡馆，真是意外的幸运。","k":"serendipity","extraExamples":[{"ex":"It was serendipity that we both chose the same tiny guesthouse.","tr":"我们都选中了同一家小旅馆，实在是美妙的巧合。"},{"ex":"A little serendipity led us to the best meal of the whole trip.","tr":"一次意外的幸运，让我们吃到了整趟旅行中最好的一餐。"}]},
  {"d":37,"date":"2026-10-12","w":"chafe","pos":"v.","p":"/tʃeɪf/","cn":"摩擦得疼痛；把皮肤磨痛或磨破","usage":"衣物可以 chafe your skin，皮肤也可以直接作主语说 chafe；名词 chafing 指摩擦引起的不适，跑步语境很常见。","ex":"The seam on my new running top started to chafe my skin halfway through the run.","tr":"跑到一半时，新跑步上衣的接缝开始把我的皮肤磨得生疼。","k":"chafe","extraExamples":[{"ex":"These socks chafe at the heel when I walk for too long.","tr":"我走路太久时，这双袜子会磨脚跟。"},{"ex":"Make sure the backpack straps don't chafe your shoulders.","tr":"确认一下背包带不会磨疼肩膀。"}]},
  {"d":37,"date":"2026-10-12","w":"snug","pos":"adj.","p":"/snʌɡ/","cn":"温暖舒适的；贴合而不松垮的","usage":"a snug cabin 是温暖舒适的小屋；a snug fit 是贴合的尺寸，通常带正面意味，比 cramped（狭窄得难受）更强调舒服。","ex":"The cabin was small but snug, and we spent the evening reading by the fire.","tr":"小木屋虽然不大，但温暖舒适，我们晚上就在炉火旁读书。","k":"snug","extraExamples":[{"ex":"The sleeping bag kept me snug even when the temperature dropped.","tr":"即使气温下降，睡袋也让我暖和舒适。"},{"ex":"These gloves should be a snug fit without restricting your fingers.","tr":"这副手套应该贴合手部，但不能妨碍手指活动。"}]},
  {"d":37,"date":"2026-10-12","tag":"au","w":"inquisitive","pos":"adj.","p":"/ɪnˈkwɪzətɪv/","cn":"好奇爱探究的；喜欢问问题的","usage":"an inquisitive child / animal 指爱探索的孩子或动物；形容人过度打听隐私时也可能含有爱刨根问底的负面意味。","ex":"An inquisitive possum appeared near our tent and kept sniffing around our bags.","tr":"一只好奇的负鼠出现在帐篷附近，不停地在我们的包周围嗅来嗅去。","k":"inquisitive","extraExamples":[{"ex":"She's an inquisitive child who wants to know how everything works.","tr":"她是个好奇心很强的孩子，什么都想弄明白。"},{"ex":"The new colleague was inquisitive without making anyone feel interrogated.","tr":"新同事很爱问问题，却不会让人觉得在受盘问。"}]},
  {"d":37,"date":"2026-10-12","w":"have a soft spot for something","pos":"phr.","p":"/hæv ə sɒft spɒt fə ˈsʌmθɪŋ/","cn":"对某人或某物有特别的喜爱；情有独钟","usage":"have a soft spot for someone / something 表示带感情的偏爱，常说 I've always had a soft spot for ...，不是字面上的软弱之处。","ex":"I've always had a soft spot for small coastal towns with a good bakery.","tr":"我一直对那些有好吃面包店的沿海小镇情有独钟。","k":"had a soft spot for","extraExamples":[{"ex":"She has a soft spot for rescue dogs and keeps sending me adoption listings.","tr":"她特别喜欢救助犬，不停给我发领养信息。"},{"ex":"I still have a soft spot for the battered old car I learned to drive in.","tr":"我对学车时开的那辆破旧汽车，至今还怀有特别的感情。"}]},
  {"d":37,"date":"2026-10-12","w":"give someone the benefit of the doubt","pos":"phr.","p":"/ɡɪv ˈsʌmwʌn ðə ˈbenɪfɪt əv ðə daʊt/","cn":"在不能确定时先相信某人；往好的方面理解","usage":"用于事实尚不清楚时先接受对方的解释；固定搭配中 benefit 和 doubt 前都用 the，不代表已经证实对方的话。","ex":"He said his train was delayed, so I gave him the benefit of the doubt.","tr":"他说火车晚点了，所以我先选择相信他的解释。","k":"gave him the benefit of the doubt","extraExamples":[{"ex":"I'll give her the benefit of the doubt; perhaps she never saw the message.","tr":"我先往好的方面理解她吧，也许她根本没看到消息。"},{"ex":"We gave the new café the benefit of the doubt and went back after a disappointing first visit.","tr":"虽然第一次体验令人失望，我们还是愿意先相信那家新咖啡馆，又去了一次。"}]},
  {"d":37,"date":"2026-10-12","w":"take a toll on someone","pos":"phr.","p":"/teɪk ə təʊl ɒn ˈsʌmwʌn/","cn":"对某人造成持续的损耗或负面影响","usage":"take a toll on someone / something 常描述压力或长期消耗对健康、精力或关系的影响；也可说 take a heavy toll on ... 强调影响严重。","ex":"The late-night incident calls were taking a toll on me, so I asked to swap an on-call shift.","tr":"深夜的故障电话持续消耗着我的精力，所以我申请换一次值班。","k":"taking a toll on me","extraExamples":[{"ex":"The long commute is starting to take a toll on her.","tr":"漫长的通勤开始让她有些吃不消了。"},{"ex":"Months of uncertainty had taken a toll on everyone's morale.","tr":"几个月的不确定状态已经持续打击了大家的士气。"}]},
  {"d":37,"date":"2026-10-12","tag":"bad","w":"be out of your depth","pos":"phr.","p":"/biː aʊt əv jɔː depθ/","cn":"超出自己的能力或经验范围；应付不来","usage":"人称相应变化：I felt out of my depth。表示知识或技能不足以应付，比 off one's game（当天状态欠佳）更强调难度超出能力。","ex":"I felt out of my depth at the advanced badminton session, but the coach helped me find a group at my level.","tr":"在高级羽毛球训练课上，我觉得自己应付不来，不过教练帮我找到了水平合适的组。","k":"out of my depth","extraExamples":[{"ex":"I was out of my depth when they started discussing engine tuning.","tr":"他们开始讨论发动机调校时，我就完全跟不上了。"},{"ex":"There's no shame in admitting you're out of your depth and asking for help.","tr":"承认自己应付不来并寻求帮助，并没有什么丢人的。"}]},
  {"d":38,"date":"2026-10-13","w":"meander","pos":"v.","p":"/miˈændə/","cn":"悠闲地漫步；蜿蜒流经","usage":"meander through / around a place 指没有急着赶路、随意走走；河流也可以 meander through a valley，不等于因道路封闭而 detour（绕道）。","ex":"We spent the afternoon meandering through the little streets behind the harbour.","tr":"我们花了一下午，在港口后面的小街巷里悠闲地走走逛逛。","k":"meandering","extraExamples":[{"ex":"A narrow stream meanders through the campsite.","tr":"一条窄窄的小溪蜿蜒流过营地。"},{"ex":"We meandered along the river with no particular destination in mind.","tr":"我们沿河悠闲地走着，并没有特定目的地。"}]},
  {"d":38,"date":"2026-10-13","tag":"au","w":"windswept","pos":"adj.","p":"/ˈwɪndswept/","cn":"无遮蔽、经常受强风吹袭的；被风吹乱的","usage":"a windswept beach / headland 常描述空旷、多风的海岸；windswept hair 则指被风吹乱的头发，不只是一般的 windy（有风的）。","ex":"We stopped at a windswept lookout near Apollo Bay and put our jackets on before getting out of the car.","tr":"我们在阿波罗湾附近一个风很大的观景点停下，先穿好外套才下车。","k":"windswept","extraExamples":[{"ex":"She arrived with windswept hair and sand on her shoes.","tr":"她来时头发被风吹得凌乱，鞋上还沾着沙。"},{"ex":"The village sits on a windswept stretch of coast with very few trees.","tr":"村子位于一段常受强风吹袭、树木稀少的海岸边。"}]},
  {"d":38,"date":"2026-10-13","w":"wince","pos":"v.","p":"/wɪns/","cn":"因疼痛或不适而皱眉、缩一下","usage":"wince at something / with pain 描述短暂的痛苦表情或退缩动作；也可因尴尬的话或高昂价格而 wince，不等于 squeamish（容易怕血或感到恶心）。","ex":"I winced when I took my shoes off and saw the blister on my heel after the long run.","tr":"长跑后脱下鞋，看到脚跟上的水泡时，我疼得皱了一下眉。","k":"winced","extraExamples":[{"ex":"He winced as the dentist touched the sensitive tooth.","tr":"牙医碰到那颗敏感的牙齿时，他疼得缩了一下。"},{"ex":"I still wince when I remember what I said at that dinner.","tr":"我现在想起那次晚餐上说的话，还是会尴尬得皱眉。"}]},
  {"d":38,"date":"2026-10-13","w":"bicker","pos":"v.","p":"/ˈbɪkə/","cn":"为小事拌嘴；争吵不休","usage":"bicker about / over something，或 bicker with someone，通常指琐碎、反复的争吵；比 argue 更突出为小事吵来吵去，常带不赞同的语气。","ex":"We started to bicker over where to have dinner, then realised we were both just hungry.","tr":"我们为了去哪儿吃晚饭开始拌嘴，后来才意识到两个人只是饿了。","k":"bicker","extraExamples":[{"ex":"The children bickered about whose turn it was to choose the music.","tr":"孩子们为轮到谁选音乐而拌嘴。"},{"ex":"We'd been bickering over tiny details instead of enjoying the holiday.","tr":"我们一直为小细节争吵，都没好好享受假期。"}]},
  {"d":38,"date":"2026-10-13","w":"unflappable","pos":"adj.","p":"/ˌʌnˈflæpəbl/","cn":"遇到意外也不慌乱的；镇定自若的","usage":"形容人在压力或突发状况下始终冷静，通常是褒义；an unflappable person，比 laid-back（随和放松）更强调临场不乱。","ex":"Our host was unflappable when we locked ourselves out and calmly brought over a spare key.","tr":"我们把自己锁在门外时，房东一点也不慌，平静地拿来了一把备用钥匙。","k":"unflappable","extraExamples":[{"ex":"The receptionist remained unflappable despite a queue of irritated guests.","tr":"尽管一群恼火的客人在排队，接待员依然镇定自若。"},{"ex":"I'd love to be as unflappable as my driving instructor in heavy traffic.","tr":"交通拥堵时，我真希望自己能像驾驶教练那样沉着。"}]},
  {"d":38,"date":"2026-10-13","tag":"bad","w":"lopsided","pos":"adj.","p":"/ˌlɒpˈsaɪdɪd/","cn":"一边倒的；两边不平衡的","usage":"a lopsided score / contest 指比分或比赛实力差距很大；也可描述向一侧倾斜的物体或 a lopsided grin（歪向一边的笑容）。","ex":"The score looked lopsided, but most of the rallies were close and I learned a lot from the match.","tr":"比分看着很悬殊，但大多数回合都打得很接近，而且我从这场比赛中学到了不少。","k":"lopsided","extraExamples":[{"ex":"My first attempt at a birthday cake came out rather lopsided.","tr":"我第一次做的生日蛋糕有点歪向一边。"},{"ex":"The conversation felt lopsided because I was doing all the asking.","tr":"我一直在提问，让这场对话显得很不平衡。"}]},
  {"d":38,"date":"2026-10-13","w":"get cold feet","pos":"phr.","p":"/ɡet kəʊld fiːt/","cn":"临到要行动时胆怯退缩；打退堂鼓","usage":"常用于原本已决定做某事，却在开始前因紧张而想退出；get cold feet about something / before doing something，比单纯 apprehensive 更强调临阵退缩。","ex":"I nearly got cold feet before joining the social badminton session, but a friend offered to come with me.","tr":"参加社交羽毛球活动前，我差点打了退堂鼓，不过一个朋友说可以陪我一起去。","k":"got cold feet","extraExamples":[{"ex":"She got cold feet just before signing the lease.","tr":"她就在要签租约之前打了退堂鼓。"},{"ex":"I was keen on the solo trip, but I'm starting to get cold feet.","tr":"我原本很想独自旅行，但现在开始有点退缩了。"}]},
  {"d":38,"date":"2026-10-13","w":"make do with something","pos":"phr.","p":"/meɪk duː wɪð ˈsʌmθɪŋ/","cn":"用现有的东西将就；凑合着用","usage":"make do with + 名词，指没有理想的东西时先用手头的替代品；常说 We'll have to make do with ...，不是 make something do。","ex":"We forgot the camping chairs, so we had to make do with a picnic blanket for the evening.","tr":"我们忘了带露营椅，所以晚上只好用一张野餐毯将就。","k":"make do with","extraExamples":[{"ex":"The kitchen had no sharp knives, so we made do with a small pair of scissors.","tr":"厨房没有锋利的刀，我们只好用一把小剪刀将就。"},{"ex":"Until the new desk arrives, I'll make do with the dining table.","tr":"新书桌送来之前，我先用餐桌凑合。"}]},
  {"d":38,"date":"2026-10-13","w":"be in the same boat","pos":"phr.","p":"/biː ɪn ðə seɪm bəʊt/","cn":"处境相同；面临同样的困难","usage":"通常指与别人有同样的麻烦或限制，常说 We're in the same boat；不同于 on the same page（理解一致）或 on the same wavelength（想法合拍）。","ex":"I'm still getting used to the new on-call rota, and it sounds like you're in the same boat.","tr":"我还在适应新的值班安排，听起来你也面临同样的情况。","k":"in the same boat","extraExamples":[{"ex":"Neither of us has used this system before, so we're in the same boat.","tr":"我们俩都没用过这个系统，所以处境相同。"},{"ex":"Once I spoke to the other newcomers, I realised we were all in the same boat.","tr":"和其他新人聊过后，我发现我们其实都面临同样的问题。"}]},
  {"d":38,"date":"2026-10-13","w":"leave someone in the lurch","pos":"phr.","p":"/liːv ˈsʌmwʌn ɪn ðə lɜːtʃ/","cn":"在别人需要帮助时丢下不管；让人陷入困境","usage":"leave someone in the lurch 强调关键时刻突然不提供原本指望的帮助；常用否定承诺 I won't leave you in the lurch，区别于 throw someone under the bus（甩锅或出卖）。","ex":"I won't leave you in the lurch if the lift falls through; I'll help you arrange another way home.","tr":"如果说好的搭车安排泡汤了，我不会丢下你不管，会帮你安排别的回家方式。","k":"leave you in the lurch","extraExamples":[{"ex":"When the caterer cancelled, it left us in the lurch two days before the party.","tr":"餐饮供应商取消服务，让我们在聚会前两天陷入了困境。"},{"ex":"Please give me some notice if you can't help; don't leave me in the lurch.","tr":"如果你帮不了忙，请提前告诉我，别让我临时没着落。"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"soothe","pos":"v.","p":"/suːð/","cn":"安抚；缓解不适","usage":"soothe someone 是安抚情绪；soothe irritation / pain 是缓解不适。不是说服对方同意某个观点。","ex":"A quiet walk by the sea helped soothe her nerves after the difficult conversation.","tr":"那次艰难的谈话之后，在海边安静地散步帮她缓解了紧张情绪。","k":"soothe","source":{"id":"twisted-lip","title":"歪唇男人","page":2,"form":"soothed","quote":"It was not the first time that she had spoken to us about her husband’s trouble, to me as a doctor, to my wife as an old friend and school companion. We soothed and comforted her by such words as we could find.","tr":"她向我们诉说丈夫的麻烦已不止一次：找我是因为我是医生，找我妻子则是因为她们曾是同学，也是多年的好友。我们只能尽力说些安慰的话，让她平静下来。"},"extraExamples":[{"ex":"Her calm voice helped soothe the frightened child.","tr":"她平静的声音安抚了那个受惊的孩子。"},{"ex":"A cool shower helped soothe my sunburnt shoulders.","tr":"冲了个凉水澡，晒伤的肩膀舒服了一些。"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"haggard","pos":"adj.","p":"/ˈhæɡəd/","cn":"因疲劳或忧虑而显得憔悴的","usage":"常说 look haggard，描述脸色和外貌显得疲惫憔悴；比 tired 更强调看得出来的消耗。","ex":"After the overnight flight, we both looked haggard.","tr":"经过那趟通宵航班，我们两个人都显得很憔悴。","k":"haggard","source":{"id":"twisted-lip","title":"歪唇男人","page":4,"form":"haggard","quote":"There was a movement and an exclamation from my right, and peering through the gloom, I saw Whitney, pale, haggard, and unkempt, staring out at me.","tr":"右边立刻传来一阵动静和惊呼。我透过烟雾望去，看见惠特尼正苍白憔悴、蓬头垢面地盯着我。"},"extraExamples":[{"ex":"He looked haggard after a week of looking after a sick relative.","tr":"照顾生病的亲人一周后，他显得很憔悴。"},{"ex":"You look haggard. Have you managed to get any sleep?","tr":"你看起来很憔悴。最近有睡上一点觉吗？"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"unkempt","pos":"adj.","p":"/ʌnˈkempt/","cn":"不整洁的；蓬乱的","usage":"常搭配 unkempt hair / beard，表示没有梳理或打理；不一定意味着不卫生。","ex":"I turned up for breakfast with unkempt hair after sleeping in the car.","tr":"在车里睡了一夜后，我顶着乱蓬蓬的头发去吃早餐。","k":"unkempt","source":{"id":"twisted-lip","title":"歪唇男人","page":4,"form":"unkempt","quote":"There was a movement and an exclamation from my right, and peering through the gloom, I saw Whitney, pale, haggard, and unkempt, staring out at me.","tr":"右边立刻传来一阵动静和惊呼。我透过烟雾望去，看见惠特尼正苍白憔悴、蓬头垢面地盯着我。"},"extraExamples":[{"ex":"The garden had grown unkempt while the house stood empty.","tr":"房子空着的时候，花园变得杂乱荒芜。"},{"ex":"His unkempt beard made him look older than he was.","tr":"他蓬乱的胡须让他看起来比实际年龄大。"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"agitated","pos":"adj.","p":"/ˈædʒɪteɪtɪd/","cn":"焦躁不安的；情绪激动的","usage":"become / sound agitated 常指因担忧或生气而难以平静；不是期待好事的 excited。","ex":"She sounded agitated when the airline said her booking had disappeared.","tr":"航空公司说查不到她的预订时，她听起来很焦躁。","k":"agitated","source":{"id":"twisted-lip","title":"歪唇男人","page":11,"form":"agitated","quote":"The window was open, and she distinctly saw his face, which she describes as being terribly agitated.","tr":"“窗户敞开着，她清清楚楚地看见他的脸，据她说，他的神情极其惊慌。"},"extraExamples":[{"ex":"He became increasingly agitated when nobody could explain the delay.","tr":"一直没人能解释延误的原因，他变得越来越焦躁。"},{"ex":"Try not to send a reply while you're still agitated.","tr":"情绪还很激动时，尽量先别回复。"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"bewilderment","pos":"n.","p":"/bɪˈwɪldəmənt/","cn":"困惑；不知所措","usage":"不可数名词，常说 in bewilderment / a look of bewilderment；重点是弄不明白眼前发生了什么。","ex":"I stared at the parking meter in bewilderment; none of the payment options worked.","tr":"我困惑地盯着停车收费机：没有一种付款方式能用。","k":"bewilderment","source":{"id":"twisted-lip","title":"歪唇男人","page":28,"form":"bewilderment","quote":"Never in my life have I seen such a sight. The man’s face peeled off under the sponge like the bark from a tree. Gone was the coarse brown tint! Gone, too, was the horrid scar and the twisted lip which had given the repulsive sneer to the face! A twitch brought away the tangled red hair, and there, sitting up in his bed, was a pale, sad-faced, refined-looking man, black-haired and smooth-skinned, rubbing his eyes and staring about him with sleepy bewilderment.","tr":"我有生以来从未见过如此惊人的景象。海绵擦过之处，那人的面孔像树皮一样一层层剥落。粗糙的棕褐色肤色不见了，狰狞的伤疤与歪斜的嘴唇也不见了，那种令人厌恶的冷笑随之消失。福尔摩斯又一扯，把纠结的红头发也取了下来。眼前坐在床上的，竟是一个面色苍白、神情忧郁、相貌文雅的男子。他有乌黑的头发、光滑的皮肤，正揉着眼睛，带着刚醒来的茫然四下张望。"},"extraExamples":[{"ex":"She shook her head in bewilderment at the complicated instructions.","tr":"看着复杂的说明，她困惑地摇了摇头。"},{"ex":"My initial bewilderment faded once someone showed me the first step.","tr":"有人演示第一步以后，我最初的茫然就慢慢消退了。"}]},
