  {"d":11,"w":"attest","pos":"v.","p":"/əˈtest/","cn":"证明、证实","k":"attest","ex":"The logs attest to the fact that the agent never checked in.","tr":"日志可以证明该 agent 从未上报过。","usage":"attest to something 指证实某事，较正式；人作主语时可说 I can attest to that，表示亲身证明。","extraExamples":[{"ex":"Anyone who stayed there can attest to how welcoming the owners are.","tr":"在那里住过的人都能证明，主人有多热情。"},{"ex":"The worn steps attest to the building's long history.","tr":"磨损的台阶见证了这栋建筑悠久的历史。"}]},
  {"d":11,"w":"defer","pos":"v.","p":"/dɪˈfɜː/","cn":"推迟；听从某人意见","k":"deferred","ex":"We deferred the upgrade to the next maintenance window.","tr":"我们把升级推迟到了下一个维护窗口。","usage":"defer something until / to a later date 是延期；defer to someone 则是听从对方，介词决定含义。","extraExamples":[{"ex":"We deferred the decision until everyone had seen the new timetable.","tr":"我们把决定推迟到所有人都看过新时间表之后。"},{"ex":"I'll defer to your judgement on which route is safest.","tr":"哪条路线最安全，我听你的判断。"}]},
  {"d":11,"w":"redundant","pos":"adj.","p":"/rɪˈdʌndənt/","cn":"冗余的（技术褒义）；多余重复的","k":"redundant","ex":"We added a redundant path so a single link failure won't take the site down.","tr":"我们加了一条冗余链路，这样单条链路故障不会导致整站中断。","usage":"技术中 redundant components 可是有意设置的备用部件；普通语境 redundant information 是多余信息。","extraExamples":[{"ex":"The last paragraph is redundant; you've already made that point.","tr":"最后一段是多余的，你已经讲过这个观点了。"},{"ex":"A redundant power supply keeps the equipment running if the main one fails.","tr":"主电源故障时，备用电源能让设备继续运行。"}]},
  {"d":11,"w":"docile","pos":"adj.","p":"/ˈdəʊsaɪl/","cn":"温顺听话的、好开不咬人的","k":"docile","ex":"The BRZ is docile at low speed but comes alive above four thousand rpm.","tr":"BRZ 低速时温顺听话，但过了四千转就活了。","usage":"a docile animal 指温顺易控制；车评中借用来形容好驾驭，形容成年人时可能显得轻视其自主性。","extraExamples":[{"ex":"The dog was docile enough to sit quietly beside the children.","tr":"那只狗很温顺，能安静地坐在孩子们旁边。"},{"ex":"Despite its size, the horse was surprisingly docile.","tr":"那匹马虽然体型大，却出乎意料地温顺。"}]},
  {"d":11,"w":"scalding","pos":"adj.","p":"/ˈskɔːldɪŋ/","cn":"滚烫的（烫伤级别）","k":"scalding","ex":"Water straight off the boil is scalding and will burn the grounds.","tr":"刚烧开的水太烫，会把咖啡粉烫焦。","usage":"scalding hot 常连用，强调烫得厉害；be scalded by hot water 是被热水烫伤。","extraExamples":[{"ex":"Be careful with that mug; the handle is scalding hot.","tr":"小心那个杯子，杯柄烫得很。"},{"ex":"The soup arrived scalding, so we left it to cool for a while.","tr":"汤端上来时滚烫，我们放了一会儿才喝。"}]},
  {"d":11,"w":"lucrative","pos":"adj.","p":"/ˈluːkrətɪv/","cn":"赚钱的、收益丰厚的","k":"lucrative","ex":"Index investing isn't exciting, but it's been quietly lucrative.","tr":"指数投资并不刺激，但一直在悄悄赚钱。","usage":"a lucrative job / deal / business 指收益丰厚，语气较正式；不自动意味着风险低或回报有保证。","extraExamples":[{"ex":"He left a lucrative job to spend more time with his family.","tr":"他辞掉了一份收入丰厚的工作，好多陪陪家人。"},{"ex":"The shop found that repairing old cameras was surprisingly lucrative.","tr":"那家店发现，修旧相机竟然很赚钱。"}]},
  {"d":11,"w":"put something on hold","pos":"phr.","p":"/pʊt ɒn həʊld/","cn":"把某事挂起、暂停","k":"on hold","ex":"We've put the migration on hold until the vendor responds.","tr":"在厂商回复之前，我们把迁移暂停了。","usage":"put a project on hold 是暂停等待；电话里 put someone on hold 则是让对方在线等候。","extraExamples":[{"ex":"We put the house search on hold until we knew whether we'd be moving cities.","tr":"确认是否要换城市之前，我们暂停了找房。"},{"ex":"Could you put that order on hold? I need to check the size.","tr":"能不能先暂停处理那笔订单？我需要确认尺码。"}]},
  {"d":11,"w":"take a rain check","pos":"phr.","p":"/teɪk ə ˈreɪn tʃek/","cn":"这次先算了、改天再约","k":"take a rain check","ex":"I'll have to take a rain check on dinner — I'm on call tonight.","tr":"晚饭我改天再约吧，今晚我值班。","usage":"take a rain check on dinner 是这次婉拒、希望改天再约，适合朋友邀请；不是单纯拒绝到底。","extraExamples":[{"ex":"Can I take a rain check on the run? I barely slept last night.","tr":"跑步能不能改天再约？我昨晚几乎没睡。"},{"ex":"She took a rain check on lunch and suggested meeting the following week.","tr":"她婉拒了这次午饭，提议下周再见。"}]},
  {"d":11,"w":"be swamped","pos":"phr.","p":"/biː swɒmpt/","cn":"忙得不可开交、被淹没了","k":"swamped","ex":"I'm completely swamped this week — can we push it to Monday?","tr":"这周我忙得不可开交，能推到周一吗？","usage":"be swamped with work / requests 表示忙得应付不过来；I'm swamped 比 I'm busy 更强，偏口语。","extraExamples":[{"ex":"The little café was swamped with customers after the concert.","tr":"演唱会结束后，那家小咖啡馆忙得应付不过来。"},{"ex":"We're swamped with messages, but we'll reply as soon as we can.","tr":"消息太多，我们有些应接不暇，不过会尽快回复。"}]},
  {"d":11,"w":"a ballpark figure","pos":"phr.","p":"/ə ˈbɔːlpɑːk ˈfɪɡə/","cn":"大概的数字、估个大致范围","k":"a ballpark figure","ex":"Can you give me a ballpark figure for how long the rollback will take?","tr":"回滚大概要多久，能给个大致的数吗？","usage":"give someone a ballpark figure 是给粗略估计；适合初步讨论，不能当成精确报价或承诺。","extraExamples":[{"ex":"I only need a ballpark figure so I can compare the two options.","tr":"我只需要一个大概数字，好比较两个方案。"},{"ex":"The builder gave us a ballpark figure before inspecting the roof.","tr":"检查屋顶之前，施工方先给了我们一个粗略报价。"}]},
  {"d":12,"w":"pinpoint","pos":"v.","p":"/ˈpɪnpɔɪnt/","cn":"精确定位、准确指出","k":"pinpoint","ex":"CloudTrail helped us pinpoint exactly who deleted the file system.","tr":"CloudTrail 帮我们精确定位到了究竟是谁删除了该文件系统。","usage":"pinpoint the cause / location 指准确找出问题或位置；比 identify 更强调定位精确。","extraExamples":[{"ex":"Can you pinpoint where the rattling sound is coming from?","tr":"你能准确找出咔嗒声从哪里传来吗？"},{"ex":"It was difficult to pinpoint the moment when the conversation became uncomfortable.","tr":"很难准确说出，谈话是从哪一刻开始变得不自在的。"}]},
  {"d":12,"w":"outage","pos":"n.","p":"/ˈaʊtɪdʒ/","cn":"服务中断、停机","k":"outage","ex":"The outage lasted forty minutes and affected two production accounts.","tr":"本次中断持续了四十分钟，影响两个生产账号。","usage":"a power / service / network outage 是供应或服务中断；系统正常计划停机也常用 downtime 描述。","extraExamples":[{"ex":"A power outage shut the station's ticket machines down.","tr":"停电让车站的售票机都停止了运行。"},{"ex":"The internet outage meant we had to pay in cash.","tr":"网络中断，我们只好付现金。"}]},
  {"d":12,"w":"tedious","pos":"adj.","p":"/ˈtiːdiəs/","cn":"枯燥乏味的、磨人的","k":"tedious","ex":"Checking each server by hand is tedious and error-prone.","tr":"逐台手工检查服务器既枯燥又容易出错。","usage":"a tedious task 是重复、耗时而令人厌烦的工作；不一定难，只是做起来枯燥磨人。","extraExamples":[{"ex":"Packing all those glasses individually was tedious work.","tr":"把那些玻璃杯一个个包好，是件很磨人的活。"},{"ex":"The journey became tedious once the scenery disappeared behind the fog.","tr":"风景被雾遮住后，旅途变得单调乏味。"}]},
  {"d":12,"w":"grippy","pos":"adj.","p":"/ˈɡrɪpi/","cn":"抓地力强的（口语）","k":"grippier","ex":"The new tyres are noticeably grippier once they're up to temperature.","tr":"新轮胎热起来之后抓地力明显更强。","usage":"口语车评和运动装备评价常说 grippy tyres / soles；比较级 grippier，侧重抓地表现。","extraExamples":[{"ex":"These shoes have grippy soles that work well on wet steps.","tr":"这双鞋的鞋底抓地力很好，适合湿滑台阶。"},{"ex":"The new handlebar tape feels grippy even when my hands are sweaty.","tr":"即使手上有汗，新的车把缠带也不滑。"}]},
  {"d":12,"w":"muddled","pos":"adj.","p":"/ˈmʌdld/","cn":"混乱不清的、糊成一团的","k":"muddled","ex":"If you over-extract, the flavours get muddled and flat.","tr":"萃取过头的话，风味会糊成一团、变得平淡。","usage":"muddled flavours 指风味混在一起分不清；muddled thinking 则是思路不清晰，也可说 feel muddled。","extraExamples":[{"ex":"My instructions were muddled, so it's no wonder you went to the wrong entrance.","tr":"我的指示说得乱，难怪你走错了入口。"},{"ex":"I felt muddled after trying to compare all the different ticket options.","tr":"比较完各种不同的票种，我已经有点晕了。"}]},
  {"d":12,"w":"windfall","pos":"n.","p":"/ˈwɪndfɔːl/","cn":"意外之财、飞来横财","k":"windfall","ex":"I put most of the bonus windfall into the index fund rather than spending it.","tr":"这笔意外的奖金我大部分投进了指数基金，没花掉。","usage":"an unexpected windfall 是意外所得；常说 a tax windfall / windfall gains，不是固定的日常收入。","extraExamples":[{"ex":"The unexpected refund was a welcome windfall.","tr":"那笔意外退款真是一笔令人高兴的额外收入。"},{"ex":"Selling the old records brought her a small windfall.","tr":"卖掉那些旧唱片，让她得到了一小笔意外之财。"}]},
  {"d":12,"w":"touch and go","pos":"phr.","p":"/tʌtʃ ənd ɡəʊ/","cn":"悬乎、说不准能不能成","k":"touch and go","ex":"It was touch and go whether we'd finish before the window closed.","tr":"能不能在窗口关闭前做完，当时挺悬的。","usage":"It was touch and go whether ... 表示结果很悬；放在名词前作形容词可写 a touch-and-go situation。","extraExamples":[{"ex":"It was touch and go whether we'd catch the ferry after getting lost.","tr":"迷路之后，我们能否赶上渡轮，当时很悬。"},{"ex":"It was touch and go whether the weather would clear, but the outdoor screening went ahead.","tr":"天气能否转好一直很悬，不过露天放映还是照常举行了。"}]},
  {"d":12,"w":"back to square one","pos":"phr.","p":"/bæk tə skweə wʌn/","cn":"回到原点、白忙一场","k":"back to square one","ex":"The rollback failed too, so we're back to square one.","tr":"回滚也失败了，我们又回到了原点。","usage":"be back to square one 是先前努力失效、重新从起点开始；send someone back to square one 可表示让人重来。","extraExamples":[{"ex":"The flat we wanted was taken, so we're back to square one.","tr":"我们想租的公寓被别人租走了，只好重新开始找。"},{"ex":"Losing the draft sent me back to square one.","tr":"草稿丢了，我只好从头再来。"}]},
  {"d":12,"w":"buy time","pos":"phr.","p":"/baɪ taɪm/","cn":"争取时间、拖一拖","k":"buys us time","ex":"Restarting the service buys us time until the vendor patch arrives.","tr":"重启服务能争取一点时间，撑到厂商补丁下来。","usage":"buy someone time 表示为某人争取时间；buy time to do something 是争取时间做后续处理。","extraExamples":[{"ex":"An earlier check-in would buy us time to unpack before dinner.","tr":"早点入住能给我们争取时间，在晚饭前把行李收拾好。"},{"ex":"I asked another question to buy myself time to think.","tr":"我又问了一个问题，给自己争取时间思考。"}]},
  {"d":12,"w":"be up in the air","pos":"phr.","p":"/ʌp ɪn ði eə/","cn":"还没定、悬而未决","k":"up in the air","ex":"The October travel dates are still up in the air.","tr":"十月的出行日期还没定下来。","usage":"plans / dates are up in the air 表示尚未确定；常加 still，适合自然地解释安排还没定。","extraExamples":[{"ex":"The venue is booked, but the start time is still up in the air.","tr":"场地订好了，但开始时间还没定。"},{"ex":"Everything was up in the air until she heard back about the job.","tr":"得到那份工作的回复之前，什么事都定不下来。"}]},
  {"d":13,"w":"substantiate","pos":"v.","p":"/səbˈstænʃieɪt/","cn":"用证据支持、证实（说法）","k":"substantiate","ex":"We couldn't substantiate the claim that the agent had run successfully.","tr":"我们无法证实「该 agent 已成功运行」这一说法。","usage":"substantiate a claim / allegation 指拿出证据支持说法；语气正式，只有猜测时不能说已 substantiated。","extraExamples":[{"ex":"The photographs helped substantiate his account of the damage.","tr":"那些照片帮助证实了他对损坏情况的描述。"},{"ex":"We need more than a rumour to substantiate that accusation.","tr":"要证实那项指控，我们需要的不只是传闻。"}]},
  {"d":13,"w":"pertinent","pos":"adj.","p":"/ˈpɜːtɪnənt/","cn":"切题的、相关的","k":"pertinent","ex":"I've attached the pertinent CloudTrail entries for your review.","tr":"我已附上相关的 CloudTrail 记录供你查阅。","usage":"pertinent to something 表示与某事直接相关；pertinent details / questions 常见于报告或讨论。 语域提示：pertinent 比 relevant 更正式。","extraExamples":[{"ex":"She asked a pertinent question about how the extra costs would be shared.","tr":"她问了一个切题的问题：额外费用如何分摊。"},{"ex":"Only include details that are pertinent to the complaint.","tr":"只写与投诉直接相关的细节。"}]},
  {"d":13,"w":"transient","pos":"adj.","p":"/ˈtrænziənt/","cn":"短暂的、出现一次就消失的","k":"transient","ex":"The error was transient and hasn't reappeared since the restart.","tr":"该错误是短暂性的，重启后再未出现。","usage":"a transient error / state 指持续时间短、会消失的状态；不是所有 transient errors 都会反复出现。","extraExamples":[{"ex":"The sadness was transient; a call from an old friend lifted her mood.","tr":"那阵难过很短暂，老朋友的一通电话让她心情好了起来。"},{"ex":"The software sometimes shows a transient warning while reconnecting.","tr":"软件重新连接时，有时会短暂显示警告。"}]},
  {"d":13,"w":"forgiving","pos":"adj.","p":"/fəˈɡɪvɪŋ/","cn":"容错性好的、不惩罚失误的","k":"forgiving","ex":"A wider power band makes the car more forgiving when you get the gear wrong.","tr":"更宽的动力带让这台车在你挡位选错时更宽容。","usage":"a forgiving car / racket 容许小失误，不容易立刻失控或影响表现；形容人则是宽容、不记仇。","extraExamples":[{"ex":"The wide trail is forgiving if you lose your footing for a moment.","tr":"这条步道很宽，即使脚下一时没踩稳，也有回旋余地。"},{"ex":"She's forgiving about honest mistakes, but expects people to learn from them.","tr":"她能包容无心的错误，但希望大家从中吸取教训。"}]},
  {"d":13,"w":"decadent","pos":"adj.","p":"/ˈdekədənt/","cn":"（食物）浓郁奢华的、罪恶的美味","k":"decadent","ex":"That flat white with a slice of basque cheesecake felt decadent.","tr":"那杯 flat white 配一块巴斯克蛋糕，简直是罪恶的享受。","usage":"食物评价中的 decadent dessert 常带享受、浓郁奢华的意味；其他语境也可能批评奢靡或颓废。","extraExamples":[{"ex":"Breakfast in bed felt wonderfully decadent after weeks of early starts.","tr":"连续几周早起之后，在床上吃早餐简直奢侈得让人愉悦。"},{"ex":"We shared a decadent chocolate dessert instead of ordering two.","tr":"我们分享了一份浓郁丰盛的巧克力甜点，没有各点一份。"}]},
  {"d":13,"w":"dip","pos":"n. / v.","p":"/dɪp/","cn":"回落、小幅下跌；蘸","k":"the dip","ex":"I usually buy the dip rather than trying to time the top.","tr":"我一般是逢跌买入，而不是去猜顶部。","usage":"a dip in prices / temperature 是小幅下降；buy the dip 是市场惯用语，这里不表示蘸食物。","extraExamples":[{"ex":"There was a sudden dip in temperature as the sun disappeared.","tr":"太阳隐去时，气温突然下降了。"},{"ex":"Dip the bread into the sauce while it's still warm.","tr":"趁酱汁还热，把面包蘸进去吃。"}]},
  {"d":13,"w":"on second thought","pos":"phr.","p":"/ɒn ˈsekənd θɔːt/","cn":"再想想的话、转念一想","k":"On second thought","ex":"On second thought, let's do the reboot during the weekend window instead.","tr":"再想想的话，我们还是改到周末的窗口做重启吧。","usage":"用于刚说完又改变主意；英澳更常说 On second thoughts，历史例句用的是常见美式单数形式。","extraExamples":[{"ex":"On second thought, I'd rather walk than wait for another bus.","tr":"再想想，我宁愿走路，也不想再等一班公交车。"},{"ex":"On second thought, let's keep the booking until we know the forecast.","tr":"转念一想，我们还是等看清天气预报，再决定是否取消预订。"}]},
  {"d":13,"w":"stay on top of something","pos":"phr.","p":"/steɪ ɒn tɒp əv/","cn":"持续盯住、掌控住某事","k":"stay on top of","ex":"I'll stay on top of the ticket queue while you're on leave.","tr":"你休假期间，工单队列我会一直盯着。","usage":"stay on top of emails / tasks 是持续跟进、掌控状况；强调主动处理，比偶尔看一眼更积极。","extraExamples":[{"ex":"I need a quieter afternoon to stay on top of my emails.","tr":"我需要一个安静点的下午，及时处理邮件。"},{"ex":"A shared calendar helps us stay on top of family appointments.","tr":"共用日历帮助我们掌握家里的各种预约安排。"}]},
  {"d":13,"w":"a heads-up call","pos":"phr.","p":"/ə ˈhedz ʌp kɔːl/","cn":"预警式的沟通、提前打的招呼","k":"a heads-up call","ex":"Consider this a heads-up call — the vendor may miss the deadline.","tr":"就当我提前给你打个招呼：厂商可能赶不上截止日期。","usage":"a heads-up call 可指提前预警的电话或沟通，意思透明但不是必须背成固定习语；常用 give someone a heads-up。","extraExamples":[{"ex":"I gave the organiser a heads-up call about our late arrival.","tr":"我提前给组织者打了个电话，说明我们会晚到。"},{"ex":"That heads-up call meant the host could save a meal for us.","tr":"那通提前打招呼的电话，让主人能给我们留饭。"}]},
  {"d":13,"w":"go the extra mile","pos":"phr.","p":"/ɡəʊ ði ˈekstrə maɪl/","cn":"多做一步、格外用心","k":"went the extra mile","ex":"The night shift went the extra mile and rebuilt the node before handover.","tr":"夜班同事额外多做了一步，在交接前把节点重建好了。","usage":"go the extra mile for someone / to do something 表示比基本要求多付出，常用于赞扬服务或帮助。","extraExamples":[{"ex":"The receptionist went the extra mile and found us a room overlooking a quiet courtyard.","tr":"前台格外用心，帮我们找了一间面朝安静庭院的房间。"},{"ex":"You can tell she goes the extra mile for her students.","tr":"看得出来，她为学生付出了额外的心力。"}]},
  {"d":14,"w":"discrete","pos":"adj.","p":"/dɪˈskriːt/","cn":"独立分开的、离散的","k":"discrete","ex":"We split the rollout into three discrete phases so each can be verified.","tr":"我们把上线拆成三个独立的阶段，每一阶段都能单独验证。","usage":"discrete phases / units 是分开的独立部分；同音的 discreet 表示谨慎低调，两者拼写和意思不同。","extraExamples":[{"ex":"The course is divided into six discrete modules.","tr":"这门课程分成六个独立的单元。"},{"ex":"We found three discrete problems rather than one underlying fault.","tr":"我们发现的是三个独立问题，而不是一个共同的底层故障。"}]},
  {"d":14,"w":"antiquated","pos":"adj.","p":"/ˈæntɪkweɪtɪd/","cn":"陈旧过时的（该淘汰了）","k":"antiquated","ex":"The monitoring stack is antiquated and barely maintained anymore.","tr":"这套监控系统已经很陈旧，几乎没人再维护了。","usage":"antiquated equipment / methods 强调太老旧、已不合时宜；比 old 更带有应该更新的评价。","extraExamples":[{"ex":"The house still had an antiquated heating system.","tr":"那栋房子还在用一套老旧的供暖系统。"},{"ex":"Making everyone print the form feels rather antiquated.","tr":"让每个人都把表格打印出来，感觉相当过时。"}]},
  {"d":14,"w":"leeway","pos":"n.","p":"/ˈliːweɪ/","cn":"回旋余地、宽松空间","k":"leeway","ex":"The deadline gives us very little leeway if the first attempt fails.","tr":"如果第一次尝试失败，这个截止日期留给我们的余地非常有限。","usage":"give / allow someone leeway 是给回旋余地；leeway 通常不可数，常说 little / some leeway。","extraExamples":[{"ex":"The flexible ticket gives us some leeway if the walk takes longer than expected.","tr":"灵活票给了我们一些余地，徒步花的时间长一点也不怕。"},{"ex":"How much leeway do we have on the arrival time?","tr":"到达时间上，我们有多少弹性？"}]},
  {"d":14,"w":"telegraph","pos":"v.","p":"/ˈtelɪɡrɑːf/","cn":"（提前）传递出信号、预告","k":"telegraph","ex":"Good tyres telegraph the limit before they let go.","tr":"好轮胎会在失去抓地之前把极限信号传递给你。","usage":"telegraph your intentions 是提前暴露意图；车评中指车辆在失去抓地前通过反馈给出预兆。","extraExamples":[{"ex":"His expression telegraphed his disappointment before he said a word.","tr":"他还没开口，表情就已经透露出失望。"},{"ex":"The director telegraphs the ending a little too clearly.","tr":"导演对结局的暗示有点太明显了。"}]},
  {"d":14,"w":"potent","pos":"adj.","p":"/ˈpəʊtnt/","cn":"（效力）强劲的、后劲足的","k":"potent","ex":"A double ristretto is small but surprisingly potent.","tr":"双份 ristretto 分量虽小，后劲却出奇地足。","usage":"potent coffee / medicine 强调作用强，未必只是味道浓；a potent argument 则是有力的论证。","extraExamples":[{"ex":"That tiny chilli is much more potent than it looks.","tr":"那颗小辣椒比看起来辣得多。"},{"ex":"The song is a potent reminder of the summer we spent together.","tr":"那首歌强烈地唤起了我们一起度过的那个夏天。"}]},
  {"d":14,"w":"forfeit","pos":"v. / n.","p":"/ˈfɔːfɪt/","cn":"（因故）丧失、放弃（权利或钱）","k":"forfeit","ex":"If you cancel within 48 hours, you forfeit the full booking fee.","tr":"如果在 48 小时内取消，你将损失全部预订费用。","usage":"forfeit a deposit / right 指因条件或行为失去押金或权利；不同于暂时延后付款。","extraExamples":[{"ex":"Guests who leave early may forfeit the discount on longer stays.","tr":"提前离店的客人可能会失去长住优惠。"},{"ex":"He chose to forfeit the match rather than play with a damaged racket.","tr":"他宁愿弃赛，也不想用损坏的球拍比赛。"}]},
  {"d":14,"w":"take it from here","pos":"phr.","p":"/teɪk ɪt frəm hɪə/","cn":"接下来交给你了、由你接手","k":"take it from here","ex":"The node is back online — the day shift can take it from here.","tr":"节点已恢复上线，接下来交给白班同事。","usage":"I can take it from here 是主动接手；Can you take it from here? 是请对方负责后续，人称决定谁接手。","extraExamples":[{"ex":"You've done the hard part; I can take it from here.","tr":"最难的部分你已经做完了，接下来我来接手。"},{"ex":"I'll introduce you both, and then you can take it from here.","tr":"我会先给你们介绍认识，之后你们自己继续聊。"}]},
  {"d":14,"w":"give or take","pos":"phr.","p":"/ɡɪv ɔː teɪk/","cn":"上下浮动、差不多（估数用）","k":"give or take","ex":"The rollback takes about half an hour, give or take.","tr":"回滚大概要半小时上下。","usage":"放在估数后：about an hour, give or take；也可加具体幅度，如 give or take ten minutes。","extraExamples":[{"ex":"The campsite is forty kilometres away, give or take a few.","tr":"营地大约在四十公里外，上下差不了几公里。"},{"ex":"Dinner should be ready at seven, give or take ten minutes.","tr":"晚饭应该七点做好，上下浮动十分钟。"}]},
  {"d":14,"w":"be all over the place","pos":"phr.","p":"/ɔːl əʊvə ðə pleɪs/","cn":"乱七八糟、毫无章法","k":"all over the place","ex":"The latency numbers were all over the place last night.","tr":"昨晚的延迟数据乱七八糟，毫无规律。","usage":"可说数据波动很乱、物品散落各处，或自己注意力不集中；语境决定是哪种乱。","extraExamples":[{"ex":"My thoughts are all over the place after that phone call.","tr":"接完那通电话，我的思绪乱成一团。"},{"ex":"The weather has been all over the place this week.","tr":"这周天气变化无常。"}]},
  {"d":14,"w":"nail something down","pos":"phr. v.","p":"/neɪl ˈsʌmθɪŋ daʊn/","cn":"敲定、确定下来","k":"nail down","ex":"Let's nail down the maintenance date before we notify the users.","tr":"通知用户之前，我们先把维护日期敲定。","usage":"nail down a date / agreement 指把细节最终敲定；代词放中间：nail it down，偏口语。","extraExamples":[{"ex":"Can we nail down who's bringing the food?","tr":"我们能不能确定一下，谁来带食物？"},{"ex":"Once we've nailed down the dates, I'll ask for leave.","tr":"日期一敲定，我就请假。"}]},
  {"d":15,"w":"attribute","pos":"v.","p":"/əˈtrɪbjuːt/","cn":"归因于","k":"attribute","ex":"We attribute the failure to a race condition in the patching script.","tr":"我们将此次故障归因于打补丁脚本中的竞态条件。","usage":"attribute A to B 是把 A 归因于 B；此处为动词，词尾发 /bjuːt/，名词 attribute 的读音不同。","extraExamples":[{"ex":"She attributes her confidence to years of working with the public.","tr":"她把自己的自信归功于多年与公众打交道的经历。"},{"ex":"It's difficult to attribute the change to any single cause.","tr":"很难把这种变化归因于某一个原因。"}]},
  {"d":15,"w":"corroborate","pos":"v.","p":"/kəˈrɒbəreɪt/","cn":"（用另一来源）佐证、印证","k":"corroborate","ex":"The vendor's logs corroborate what we saw in CloudTrail.","tr":"厂商的日志印证了我们在 CloudTrail 里看到的情况。","usage":"corroborate an account / findings 常指另一来源的证据相互印证；不只是重复同一人的说法。","extraExamples":[{"ex":"A second witness corroborated her description of the car.","tr":"另一名目击者证实了她对那辆车的描述。"},{"ex":"The timestamps corroborate his claim that he arrived before noon.","tr":"时间记录佐证了他说的中午之前已经到达。"}]},
  {"d":15,"w":"marginal","pos":"adj.","p":"/ˈmɑːdʒɪnl/","cn":"微小的、边际的；勉强的","k":"marginal","ex":"The tuning change gave only a marginal improvement in latency.","tr":"这次调参对延迟的改善非常有限。","usage":"a marginal improvement 是改善幅度很小；marginally better 指稍好一点，经济学里也可表示边际。","extraExamples":[{"ex":"The larger room offered only a marginal increase in space.","tr":"大房间的空间只多了一点点。"},{"ex":"We decided the marginal saving wasn't worth the extra journey.","tr":"我们觉得省下的那一点钱，不值得多跑一趟。"}]},
  {"d":15,"w":"abrupt","pos":"adj.","p":"/əˈbrʌpt/","cn":"突兀的、生硬的","k":"abrupt","ex":"The throttle response feels abrupt in Sport Sharp mode.","tr":"在 Sport Sharp 模式下，油门响应显得有些突兀。","usage":"abrupt changes / responses 指突然且不平顺；an abrupt manner 则是说话生硬、不太客气。 易混提示：progressive 强调渐进，abrupt 强调突然、生硬。","extraExamples":[{"ex":"The conversation came to an abrupt end when his phone rang.","tr":"他的电话一响，谈话就突然结束了。"},{"ex":"Sorry if I sounded abrupt; I was trying to catch the train.","tr":"如果刚才我听起来很生硬，抱歉，我在赶火车。"}]},
  {"d":15,"w":"pungent","pos":"adj.","p":"/ˈpʌndʒənt/","cn":"气味刺鼻浓烈的（偏负面）","k":"pungent","ex":"Over-roasted beans give off a pungent, ashy smell.","tr":"烘过头的豆子会散发出刺鼻的焦灰味。","usage":"a pungent smell 是浓烈刺鼻的气味；pungent garlic / spices 也可中性描述强烈气味，并非一定臭。","extraExamples":[{"ex":"A pungent smell of onions filled the kitchen.","tr":"浓烈的洋葱味充满了厨房。"},{"ex":"The cheese was pungent enough that we wrapped it twice.","tr":"那块奶酪气味很浓，我们把它包了两层。"}]},
  {"d":15,"w":"hedge","pos":"v. / n.","p":"/hedʒ/","cn":"对冲、留后手；说话打太极","k":"hedges","ex":"Holding some bonds hedges against a sharp drawdown in equities.","tr":"持有一部分债券可以对冲股票大幅回撤的风险。","usage":"hedge against a risk 是设法降低风险；hedge your bets 指给自己留余地，不把希望押在单一结果上。","extraExamples":[{"ex":"Booking a refundable room was our hedge against a change in plans.","tr":"订可退款的房间，是我们应对计划变动的后手。"},{"ex":"He hedged when I asked whether he would definitely come.","tr":"我问他是否肯定会来时，他含糊其辞，没有正面回答。"}]},
  {"d":15,"w":"wrap one's head around something","pos":"phr.","p":"/ræp əˈraʊnd/","cn":"想明白、理解透（有难度的东西）","k":"wrap my head around","ex":"It took me a while to wrap my head around how IRSA actually works.","tr":"我花了好一阵才想明白 IRSA 到底是怎么运作的。","usage":"wrap my / your head around something 指理解复杂或难接受的事；常用于 It took me a while to ...。","extraExamples":[{"ex":"I still can't wrap my head around how quickly the neighbourhood has changed.","tr":"我还是很难理解，这个社区怎么这么快就变了样。"},{"ex":"Give me a minute to wrap my head around those numbers.","tr":"给我一分钟，让我弄明白那些数字。"}]},
  {"d":15,"w":"in the loop","pos":"phr.","p":"/ɪn ðə luːp/","cn":"知情、在信息圈里","k":"in the loop","ex":"Please keep me in the loop on any vendor updates.","tr":"厂商那边有任何进展，请让我保持知情。","usage":"keep someone in the loop about / on something 是持续知会；be out of the loop 则是不知情。","extraExamples":[{"ex":"Keep me in the loop if the meeting place changes.","tr":"如果会合地点变了，记得也告诉我。"},{"ex":"I'd like her to be in the loop before we make any decisions.","tr":"我希望她先了解情况，我们再做决定。"}]},
  {"d":15,"w":"come up short","pos":"phr.","p":"/kʌm ʌp ʃɔːt/","cn":"没达标、差了一截","k":"came up short","ex":"The first fix came up short — the errors returned within an hour.","tr":"第一次修复没能奏效，一小时内错误又回来了。","usage":"come up short of a target 是没达到目标；也可直接说 We came up short，强调努力后仍差一点。","extraExamples":[{"ex":"We planned for twenty guests but came up short on chairs.","tr":"我们按二十位客人做了安排，椅子却不够。"},{"ex":"His explanation came up short when we asked for specific details.","tr":"我们追问具体细节时，他的解释就显得不足了。"}]},
  {"d":15,"w":"by and large","pos":"phr.","p":"/baɪ ənd lɑːdʒ/","cn":"总体而言、大体上","k":"By and large","ex":"By and large, the migration went smoothly apart from two nodes.","tr":"总体而言，除了两个节点之外，这次迁移进行得很顺利。","usage":"常放句首概括整体情况，允许存在例外；意思接近 on the whole，不表示每个细节都一样。","extraExamples":[{"ex":"By and large, the neighbours have been very welcoming.","tr":"总体而言，邻居们都很友善。"},{"ex":"The instructions were clear by and large, apart from the final step.","tr":"除了最后一步，说明总体上很清楚。"}]},
  {"d":16,"w":"mitigation","pos":"n.","p":"/ˌmɪtɪˈɡeɪʃn/","cn":"缓解措施（降低影响，非根治）","k":"mitigation","ex":"As a mitigation, we scaled out the node group before the peak window.","tr":"作为缓解措施，我们在高峰窗口前对节点组做了扩容。","usage":"mitigation measures 指降低影响的措施，不一定消除根因；mitigation of risk 和 risk mitigation 都常见。","extraExamples":[{"ex":"Opening the windows was only a temporary mitigation for the stuffy room.","tr":"开窗只是缓解房间闷热的临时措施。"},{"ex":"The report distinguishes immediate mitigation from work that prevents the problem recurring.","tr":"报告区分了即时缓解措施与防止问题再次发生的工作。"}]},
  {"d":16,"w":"prerequisite","pos":"n.","p":"/ˌpriːˈrekwəzɪt/","cn":"前置条件、先决要求","k":"prerequisite","ex":"The CSI snapshot controller is a prerequisite for cross-account backups.","tr":"CSI 快照控制器是跨账号备份的前置条件。","usage":"a prerequisite for something / doing something 是先决条件；可说 X is a prerequisite for Y。","extraExamples":[{"ex":"A full driving licence is a prerequisite for renting that vehicle.","tr":"租那辆车的前提是持有正式驾驶执照。"},{"ex":"You don't need expensive equipment; curiosity is the only prerequisite.","tr":"你不需要昂贵的器材，好奇心是唯一的前提。"}]},
  {"d":16,"w":"ambiguous","pos":"adj.","p":"/æmˈbɪɡjuəs/","cn":"含糊不清的、有歧义的","k":"ambiguous","ex":"The error message was ambiguous, so we had to check the raw stdout.","tr":"报错信息含糊不清，我们只好去查原始的 stdout 输出。","usage":"an ambiguous message 有不止一种理解；不只是信息少，想说不清楚也可用 unclear。","extraExamples":[{"ex":"Her reply was ambiguous, so I couldn't tell whether she was agreeing.","tr":"她的回复含糊不清，我看不出她是不是同意。"},{"ex":"The sign is ambiguous about whether parking is allowed on Sundays.","tr":"那块牌子没说清楚周日能不能停车。"}]},
  {"d":16,"w":"chuck","pos":"v.","p":"/tʃʌk/","cn":"随手一扔；扔掉（澳洲口语）","k":"chuck","ex":"Just chuck your bags in the boot and we'll head off.","tr":"把包随手扔后备箱就行，我们出发吧。","usage":"英澳非正式表达：chuck something in the boot 是随手放进后备厢；chuck it out 才是扔掉。","extraExamples":[{"ex":"Could you chuck me a towel from that bag?","tr":"你能从那个包里扔条毛巾给我吗？"},{"ex":"Don't chuck the receipt away until you've tried the shoes on at home.","tr":"回家试过鞋子之前，先别把收据扔掉。"}]},
  {"d":16,"w":"knackered","pos":"adj.","p":"/ˈnækəd/","cn":"累瘫了（英澳）；零件报废了","k":"knackered","ex":"After a full day of driving we were absolutely knackered.","tr":"开了一整天车，我们累得不行。","usage":"I'm absolutely knackered 是累瘫了，英澳朋友间常用；偏随意，正式邮件可说 exhausted。","extraExamples":[{"ex":"I'm too knackered to cook tonight. Shall we get takeaway?","tr":"我今晚累得不想做饭了，叫外卖好吗？"},{"ex":"That old washing machine is knackered; it barely spins anymore.","tr":"那台旧洗衣机已经不行了，几乎都转不动了。"}]},
  {"d":16,"w":"sturdy","pos":"adj.","p":"/ˈstɜːdi/","cn":"结实耐用的、扎实的","k":"sturdy","ex":"Pack a sturdy pair of shoes for the walks in Tasmania.","tr":"去塔斯马尼亚徒步，带一双结实的鞋。","usage":"sturdy shoes / furniture 指结实耐用；形容人时可指身体健壮，不是描述柔韧性的词。","extraExamples":[{"ex":"We need a sturdy table that won't wobble on the patio.","tr":"我们需要一张放在露台上也不会晃的结实桌子。"},{"ex":"The steps felt sturdy despite their age.","tr":"那些台阶虽然年头久，踩起来仍很牢靠。"}]},
  {"d":16,"w":"no worries","pos":"phr.","p":"/nəʊ ˈwʌriz/","cn":"没事、不用谢（澳洲国民短语）","k":"No worries","ex":"Sorry I'm late. — No worries, mate.","tr":"抱歉我迟到了。——没事儿。","usage":"澳洲日常可回应道谢、道歉或小请求：No worries；较正式的严肃问题中可用更具体的回复。","extraExamples":[{"ex":"No worries about the wait; we weren't in a rush.","tr":"等了一会儿没关系，我们也不赶时间。"},{"ex":"No worries if you can't make it; we'll catch up another day.","tr":"你来不了也没关系，我们改天再聚。"}]},
  {"d":16,"w":"how are you going","pos":"phr.","p":"/haʊ ə juː ˈɡəʊɪŋ/","cn":"最近怎么样（澳式问候，非问交通）","k":"How are you going","ex":"How are you going? Settling into Melbourne alright?","tr":"最近怎么样？在墨尔本还适应吗？","usage":"澳式 How are you going? 是问近况或状态，常简短回应 Good, thanks；不是问你坐什么交通工具。","extraExamples":[{"ex":"How are you going with the new job? Getting to know everyone?","tr":"新工作怎么样？开始和大家熟悉起来了吗？"},{"ex":"Hey, how are you going? I haven't seen you since the move.","tr":"嗨，最近怎么样？你搬家后我就没见过你了。"}]},
  {"d":16,"w":"give someone a hand","pos":"phr.","p":"/ɡɪv ə hænd/","cn":"搭把手、帮个忙","k":"give me a hand","ex":"Could you give me a hand with the handover notes?","tr":"能帮我一起弄一下交接文档吗？","usage":"give someone a hand with something 是帮忙处理；give someone a big hand 在演出场合也可指鼓掌。","extraExamples":[{"ex":"Could you give me a hand carrying this table downstairs?","tr":"你能搭把手，帮我把这张桌子搬下楼吗？"},{"ex":"I'll give you a hand with the washing-up before I leave.","tr":"走之前，我来帮你洗碗。"}]},
  {"d":16,"w":"sort something out","pos":"phr. v.","p":"/sɔːt aʊt/","cn":"搞定、处理妥当（英澳口语）","k":"sort out","ex":"I'll sort out the SIM card once we land in Brisbane.","tr":"落地布里斯班之后我把电话卡搞定。","usage":"sort out a problem / booking 是处理妥当；代词放中间：sort it out，英澳口语很常见。","extraExamples":[{"ex":"Let's sort out the sleeping arrangements before everyone arrives.","tr":"大家到来之前，我们先把住宿安排好。"},{"ex":"She sorted out the misunderstanding with a quick phone call.","tr":"她打了个简短的电话，就把误会解释清楚了。"}]},
  {"d":17,"w":"escalate","pos":"v.","p":"/ˈeskəleɪt/","cn":"升级上报；（事态）恶化","k":"escalate","ex":"If there's no response within an hour, escalate it to the on-call manager.","tr":"如果一小时内没有响应，就上报给值班经理。","usage":"escalate an issue to someone 是上报请更高层介入；不及物用法 The situation escalated 指事态升级。","extraExamples":[{"ex":"The disagreement escalated when nobody was willing to listen.","tr":"谁也不愿意听对方说，分歧便升级了。"},{"ex":"I'll escalate the missing delivery to the branch manager.","tr":"我会把送货丢失的问题向分店经理反映。"}]},
  {"d":17,"w":"consolidate","pos":"v.","p":"/kənˈsɒlɪdeɪt/","cn":"整合归并（成一个）","k":"consolidated","ex":"We consolidated four monitoring dashboards into a single view.","tr":"我们把四个监控面板整合成了一个视图。","usage":"consolidate several things into one 是归并整合；也可说 consolidate gains 指巩固已取得的成果。","extraExamples":[{"ex":"We consolidated our notes into one document before the meeting.","tr":"开会前，我们把笔记整合成了一份文件。"},{"ex":"The move gave us a chance to consolidate two storage units into one.","tr":"搬家让我们有机会把两处仓储合并为一处。"}]},
  {"d":17,"w":"latent","pos":"adj.","p":"/ˈleɪtnt/","cn":"潜伏的、尚未显现的","k":"latent","ex":"The bug had been latent for months before the upgrade exposed it.","tr":"这个 bug 潜伏了好几个月，直到升级才把它暴露出来。","usage":"a latent bug / risk 是已存在但尚未显现的问题；latency 是延迟，词形相似但不能互换。","extraExamples":[{"ex":"The course helped her discover a latent talent for drawing.","tr":"那门课帮助她发现了潜在的绘画天赋。"},{"ex":"The dry weather exposed a latent weakness in the old building.","tr":"干燥天气让那栋旧建筑潜藏的问题暴露了出来。"}]},
  {"d":17,"w":"scenic","pos":"adj.","p":"/ˈsiːnɪk/","cn":"风景优美的（路线/观景点）","k":"scenic","ex":"Take the scenic route along the coast rather than the highway.","tr":"走沿海的景观路线，别走高速。","usage":"a scenic route / drive 指风景好的路线或行程；take the scenic route 常暗示绕远一点看风景。","extraExamples":[{"ex":"The train takes a scenic route through vineyards and small towns.","tr":"火车沿着一条风景优美的线路，穿过葡萄园和小镇。"},{"ex":"It's one of the most scenic stretches of coastline I've walked.","tr":"这是我徒步走过的风景最美的海岸线之一。"}]},
  {"d":17,"w":"rugged","pos":"adj.","p":"/ˈrʌɡɪd/","cn":"崎岖粗犷的；耐造的","k":"rugged","ex":"Tasmania's west coast is wild and rugged.","tr":"塔斯马尼亚的西海岸荒野而崎岖。","usage":"rugged terrain / coastline 是崎岖粗犷的地形；rugged equipment 则是耐用、能扛恶劣条件。 发音提示：重音在首音节，结尾读 /ɡɪd/。","extraExamples":[{"ex":"The walk crosses rugged ground, so progress is slower than the distance suggests.","tr":"路线经过崎岖地形，实际走起来会比里程看上去慢。"},{"ex":"I chose a rugged camera bag that could handle dust and rain.","tr":"我选了一个耐用的相机包，能经得起灰尘和雨水。"}]},
  {"d":17,"w":"brisk","pos":"adj.","p":"/brɪsk/","cn":"（天气）清冽微寒的","k":"brisk","ex":"Mornings in Hobart can be brisk even in spring.","tr":"即使在春天，霍巴特的早晨也可能相当清冽。","usage":"这里指空气清冷、让人精神一振：a brisk morning / breeze；与 brisk walk 的快步含义不同。","extraExamples":[{"ex":"A brisk wind had us reaching for our jackets.","tr":"一阵清冽的风吹来，我们纷纷去拿外套。"},{"ex":"The air felt brisk when we stepped out before sunrise.","tr":"日出前走到外面，空气有些清冷。"}]},
  {"d":17,"w":"grab a bite","pos":"phr.","p":"/ɡræb ə baɪt/","cn":"随便吃点东西","k":"grab a bite","ex":"We've got two hours — want to grab a bite?","tr":"我们还有两个小时，去随便吃点？","usage":"grab a bite to eat 是随便吃一点，语气轻松；Want to grab a bite? 很适合邀朋友简单吃饭。","extraExamples":[{"ex":"Want to grab a bite before we head into the cinema?","tr":"进电影院之前，要不要随便吃点东西？"},{"ex":"We grabbed a bite at a bakery near the station.","tr":"我们在车站附近的面包店简单吃了点东西。"}]},
  {"d":17,"w":"pop in","pos":"phr. v.","p":"/pɒp ɪn/","cn":"顺路进去一下、短暂造访","k":"pop in","ex":"Let's pop in for a coffee before the museum opens.","tr":"趁博物馆还没开门，我们进去喝杯咖啡。","usage":"pop in for a coffee / a quick chat 是短暂造访；pop into a shop 表示顺便进某家店。","extraExamples":[{"ex":"You can pop in anytime this afternoon; I'll be at home.","tr":"今天下午你随时可以顺路过来，我在家。"},{"ex":"I popped in to return the book and ended up staying for dinner.","tr":"我顺路去还书，结果留下吃了晚饭。"}]},
  {"d":17,"w":"be worth it","pos":"phr.","p":"/wɜːθ ɪt/","cn":"值得（花这个时间或钱）","k":"worth it","ex":"The two-hour drive was long, but the view was worth it.","tr":"两小时车程是久了点，但那个景色值了。","usage":"be worth it 是付出时间、金钱或精力后觉得划算；具体接活动时用 worth doing，不用 worth to do。","extraExamples":[{"ex":"The queue looked awful, but the exhibition was worth it.","tr":"队伍看起来长得吓人，不过那个展览值得等。"},{"ex":"Is the extra legroom worth it on such a short flight?","tr":"这么短的航班，多花钱买腿部空间值得吗？"}]},
  {"d":17,"w":"first thing tomorrow","pos":"phr.","p":"/fɜːst θɪŋ təˈmɒrəʊ/","cn":"明天一早（第一件事就办）","k":"first thing tomorrow","ex":"I'll send the RCA draft first thing tomorrow.","tr":"我明天一早就把 RCA 初稿发出去。","usage":"表示明天开始工作或起床后就优先处理；不用加 at，可说 I'll do it first thing tomorrow morning。","extraExamples":[{"ex":"I'll check the opening hours first thing tomorrow.","tr":"明天一早我就确认营业时间。"},{"ex":"Let's leave first thing tomorrow before the traffic builds up.","tr":"我们明天一早就出发，趁车流还没多起来。"}]},
  {"d":18,"w":"contingent","pos":"adj.","p":"/kənˈtɪndʒənt/","cn":"取决于…的","k":"contingent","ex":"The go-live date is contingent on the security review passing.","tr":"上线日期取决于安全评审能否通过。","usage":"be contingent on something / doing something 是以某条件为前提；较正式，相当于 depend on。","extraExamples":[{"ex":"Our offer is contingent on the inspection finding no major problems.","tr":"我们的报价以检查未发现重大问题为前提。"},{"ex":"The outdoor event is contingent on having enough volunteers.","tr":"那场户外活动能否举办，取决于有没有足够的志愿者。"}]},
  {"d":18,"w":"revert","pos":"v.","p":"/rɪˈvɜːt/","cn":"恢复原状、回退（≠回复邮件）","k":"revert","ex":"If the metrics don't improve, we'll revert to the previous config.","tr":"如果指标没有改善，我们就回退到之前的配置。","usage":"revert to a previous version 是恢复先前状态；跨地区工作沟通里，回复邮件用 reply / get back to 更清楚。","extraExamples":[{"ex":"If the new layout is confusing, we can revert to the original one.","tr":"如果新布局让人困惑，我们可以恢复原来的布局。"},{"ex":"The conversation soon reverted to the subject of food.","tr":"话题很快又回到了吃的上面。"}]},
  {"d":18,"w":"discern","pos":"v.","p":"/dɪˈsɜːn/","cn":"辨别出、看出（细微差别）","k":"discern","ex":"It's hard to discern any pattern from the logs alone.","tr":"仅凭日志很难辨别出任何规律。","usage":"discern a pattern / difference 指看出不明显的规律或差别；discern A from B 是辨别两者。","extraExamples":[{"ex":"I could just discern a light through the mist.","tr":"透过薄雾，我勉强能辨认出一点灯光。"},{"ex":"It's difficult to discern any difference between the two recordings.","tr":"很难听出这两段录音有什么区别。"}]},
  {"d":18,"w":"twitchy","pos":"adj.","p":"/ˈtwɪtʃi/","cn":"（转向）过于敏感神经质的","k":"twitchy","ex":"Too little caster makes the steering feel twitchy on the highway.","tr":"主销后倾角太小会让高速上的转向显得过于神经质。","usage":"车评中的 twitchy steering 指过于敏感、不够安定；形容人则是紧张不安，不是单纯动作灵活。 易混提示：nimble 表示灵活敏捷，不含过度敏感、神经质的意思。","extraExamples":[{"ex":"The horse gets twitchy when bicycles pass too close.","tr":"自行车经过得太近时，那匹马会紧张不安。"},{"ex":"I was twitchy all morning waiting for the call.","tr":"等那通电话让我整个早上都坐立不安。"}]},
  {"d":18,"w":"tepid","pos":"adj.","p":"/ˈtepɪd/","cn":"温吞的；反应冷淡的","k":"tepid","ex":"Serve it right away — a flat white goes tepid fast.","tr":"要马上喝，flat white 很快就变温吞了。","usage":"tepid coffee 是温吞、不够热的咖啡；a tepid response 则是冷淡、不热烈的回应。","extraExamples":[{"ex":"By the time our food arrived, the coffee was tepid.","tr":"食物端上来时，咖啡已经不怎么热了。"},{"ex":"The idea received a tepid welcome from the rest of the group.","tr":"小组其他人对这个想法的反应有点冷淡。"}]},
  {"d":18,"w":"frugal","pos":"adj.","p":"/ˈfruːɡl/","cn":"节俭的","k":"frugal","ex":"Being frugal in your thirties is what makes compounding work.","tr":"三十几岁时的节俭，正是复利发挥作用的前提。","usage":"frugal with money 指精打细算，通常带肯定意味；stingy 更偏向不愿给别人花钱的吝啬。","extraExamples":[{"ex":"She's frugal with everyday spending but generous when friends need help.","tr":"她日常花钱节俭，但朋友需要帮助时很大方。"},{"ex":"We had a frugal lunch of bread, cheese and leftover soup.","tr":"我们简单吃了面包、奶酪和剩下的汤当午饭。"}]},
  {"d":18,"w":"across the board","pos":"phr.","p":"/əˈkrɒs ðə bɔːd/","cn":"全面地、所有方面都","k":"across the board","ex":"We saw improvements across the board after the kernel upgrade.","tr":"内核升级之后，各项指标全面改善。","usage":"improvements / cuts across the board 指各方面都改善或削减；放在名词前可写 across-the-board cuts。","extraExamples":[{"ex":"The café raised its prices across the board.","tr":"那家咖啡馆全面涨价了。"},{"ex":"The feedback was positive across the board, not just from regular customers.","tr":"反馈全面向好，不只是常客这么说。"}]},
  {"d":18,"w":"in a nutshell","pos":"phr.","p":"/ɪn ə ˈnʌtʃel/","cn":"简而言之、一句话概括","k":"In a nutshell","ex":"In a nutshell, the agent was reporting success while doing nothing.","tr":"简而言之，那个 agent 什么都没做却在上报成功。","usage":"In a nutshell, ... 用来压缩成核心结论；工作汇报和日常解释都可用，但后面宜简短。","extraExamples":[{"ex":"In a nutshell, the flat is lovely but too far from work.","tr":"简而言之，那套公寓很好，但离工作地点太远。"},{"ex":"Can you explain the problem in a nutshell before we go into the details?","tr":"深入细节之前，你能先简要说明问题吗？"}]},
  {"d":18,"w":"keep an eye on something","pos":"phr.","p":"/kiːp ən aɪ ɒn/","cn":"留意盯着（被动观察）","k":"Keep an eye on","ex":"Keep an eye on the disk usage over the weekend.","tr":"周末留意一下磁盘使用率。","usage":"keep an eye on something 表示持续留意；也可说 keep an eye on my bag，请人帮忙照看包。","extraExamples":[{"ex":"Could you keep an eye on my bag while I order?","tr":"我去点单时，你能帮我留意一下包吗？"},{"ex":"I'll keep an eye on the weather and message you if the forecast changes.","tr":"我会留意天气，预报有变化就给你发消息。"}]},
  {"d":18,"w":"more often than not","pos":"phr.","p":"/mɔːr ˈɒfn ðən nɒt/","cn":"多数情况下、往往","k":"More often than not","ex":"More often than not, the alert clears itself within minutes.","tr":"多数情况下，这个告警几分钟内会自行恢复。","usage":"表示通常如此、超过一半的情况，但不提供精确比例；语气比 always 留有余地。","extraExamples":[{"ex":"More often than not, I end up taking the train instead of driving.","tr":"大多数时候，我最后都会选择坐火车，而不是开车。"},{"ex":"She arrives early more often than not.","tr":"她通常都会提前到。"}]},
  {"d":19,"tag":"bad","w":"rally","pos":"n. / v.","p":"/ˈræli/","cn":"多拍回合；（市场）反弹回升","k":"rally","ex":"That rally must have lasted forty shots.","tr":"那个回合肯定打了四十拍。","usage":"羽毛球的 a rally 是发球后直到这一分结束的连续来回；金融里的 a rally 则是价格回升。","extraExamples":[{"ex":"We had a long rally before he finally caught me with a drop shot.","tr":"我们打了很长一轮多拍，最后他用吊球得分。"},{"ex":"The team rallied after a difficult first half.","tr":"经历艰难的上半场后，球队重新振作了起来。"}]},
  {"d":19,"tag":"bad","w":"lunge","pos":"v. / n.","p":"/lʌndʒ/","cn":"跨步扑救、弓步上网","k":"lunged","ex":"He lunged forward to scoop up the net shot.","tr":"他跨步向前把网前球挑了起来。","usage":"lunge forward / at something 是突然跨大步扑向目标；训练动作 a lunge 是弓步。","extraExamples":[{"ex":"She made a sudden lunge to keep the shuttle in play.","tr":"她突然向前跨出一步，勉强把球救了回来。"},{"ex":"I had to lunge across the table to stop the glass falling.","tr":"我不得不猛地探身越过桌面，阻止杯子掉下去。"}]},
  {"d":19,"tag":"bad","w":"deceptive","pos":"adj.","p":"/dɪˈseptɪv/","cn":"有欺骗性的（假动作）","k":"deceptive","ex":"Her forehand is deceptive — the smash and the drop look identical.","tr":"她的正手很有欺骗性，杀球和吊球的动作一模一样。","usage":"a deceptive shot 指动作让对手判断错球路；其他语境中 deceptive appearances 是具有误导性的外表。","extraExamples":[{"ex":"The calm water was deceptive; the current underneath was strong.","tr":"平静的水面有迷惑性，下面的水流很强。"},{"ex":"His relaxed stance is deceptive because he can move incredibly quickly.","tr":"他放松的站姿很有欺骗性，实际上他移动得非常快。"}]},
  {"d":19,"tag":"bad","w":"stamina","pos":"n.","p":"/ˈstæmɪnə/","cn":"耐力、体能储备","k":"stamina","ex":"Three games in, it comes down to stamina rather than technique.","tr":"打到第三局，拼的就是耐力而不是技术了。","usage":"build / improve stamina 是提高耐力；通常不可数，强调持续活动的能力，而非一次爆发的力量。","extraExamples":[{"ex":"The route isn't technically difficult, but it demands stamina.","tr":"这条路线技术难度不高，但很考验耐力。"},{"ex":"By the final game, my stamina was beginning to fade.","tr":"打到最后一局时，我的体力开始下降。"}]},
  {"d":19,"tag":"bad","w":"agility","pos":"n.","p":"/əˈdʒɪləti/","cn":"敏捷性","k":"agility","ex":"Footwork drills build agility more than raw speed does.","tr":"步法练习对敏捷性的提升比单纯练速度更明显。","usage":"agility drills / training 指敏捷训练，侧重快速改变方向和姿态；形容词是 agile。","extraExamples":[{"ex":"The narrow course tests both balance and agility.","tr":"这条狭窄的路线既考验平衡，也考验敏捷性。"},{"ex":"Her agility helped her recover even when the shuttle changed direction.","tr":"即使球改变了方向，她也能凭借敏捷的身手及时回位。"}]},
  {"d":19,"tag":"bad","w":"flick","pos":"n. / v.","p":"/flɪk/","cn":"抖腕轻弹（偷发后场、挑球）","k":"flick","ex":"A flick serve works well if your opponent stands too close.","tr":"如果对手站得太靠前，偷发一个后场球很有效。","usage":"a flick serve 是通过快速抖腕等动作把球发向后场；flick your wrist 强调短促、迅速的动作。","extraExamples":[{"ex":"He sent the shuttle over my head with a quick flick of his wrist.","tr":"他手腕轻轻一抖，就把球送过了我的头顶。"},{"ex":"Flick the switch beside the door to turn on the outside light.","tr":"拨一下门边的开关，就能打开外面的灯。"}]},
  {"d":19,"tag":"bad","w":"unforced error","pos":"phr.","p":"/ʌnˈfɔːst ˈerə/","cn":"非受迫失误（自己送的分）","k":"unforced errors","ex":"I lost that game on unforced errors, not on his attack.","tr":"那一局我是输在自己的非受迫失误，而不是他的进攻。","usage":"体育术语，指没有被对手强力逼迫却自己失误；常用复数 make / cut down on unforced errors。","extraExamples":[{"ex":"Too many unforced errors let our opponents back into the game.","tr":"太多非受迫失误，让对手重新找回了机会。"},{"ex":"That missed return was an unforced error, so I tried to reset for the next point.","tr":"那次接球失误并非被对手逼迫，我努力调整状态，准备下一分。"}]},
  {"d":19,"tag":"bad","w":"have the edge over someone","pos":"phr.","p":"/hæv ði edʒ/","cn":"略占优势、稍胜一筹","k":"has the edge over","ex":"He has the edge over me at the net, but I'm better at the back.","tr":"网前他比我强一点，但后场我更好。","usage":"have the edge over someone 是略胜一筹，不一定全面压倒；也可用 a slight edge 强调优势很小。","extraExamples":[{"ex":"She has the edge over the other candidates because she knows the local area.","tr":"她熟悉当地，所以比其他候选人略占优势。"},{"ex":"Their experience gives them the edge over us in close matches.","tr":"势均力敌的比赛中，他们的经验让他们比我们稍占优势。"}]},
  {"d":19,"tag":"bad","w":"hold one's own","pos":"phr.","p":"/həʊld wʌnz əʊn/","cn":"撑得住、不落下风","k":"held my own","ex":"I held my own against a much stronger player.","tr":"面对实力强得多的对手，我也没落下风。","usage":"hold my / your own against someone 是面对强者仍不落下风；强调能竞争，不保证最后获胜。","extraExamples":[{"ex":"I can hold my own in a conversation, even if I don't catch every word.","tr":"即使听不懂每个词，我也能应付一场对话。"},{"ex":"The little car held its own on the long motorway journey.","tr":"那辆小车在长途高速行程中表现得相当不错。"}]},
  {"d":19,"tag":"bad","w":"be off one's game","pos":"phr.","p":"/ɒf wʌnz ɡeɪm/","cn":"状态不佳","k":"off my game","ex":"I was completely off my game last night.","tr":"昨晚我状态完全不在。","usage":"be off my game 表示当天没发挥出平时水平；人称可换 his / her，日常工作也能借用。","extraExamples":[{"ex":"I'm a bit off my game today; I keep forgetting simple things.","tr":"我今天有点不在状态，总忘些简单的事。"},{"ex":"She was off her game after the overnight flight, but still played well.","tr":"通宵飞行后，她状态欠佳，但仍打得不错。"}]},
  {"d":20,"tag":"au","w":"marsupial","pos":"n.","p":"/mɑːˈsuːpiəl/","cn":"有袋动物","k":"marsupials","ex":"Wombats are marsupials, despite looking nothing like kangaroos.","tr":"袋熊也是有袋动物，尽管长得跟袋鼠毫不相像。","usage":"名词 a marsupial 指有袋动物；也可作形容词，如 marsupial mammals，不是所有澳洲动物都属此类。","extraExamples":[{"ex":"The guide explained how a young marsupial develops in its mother's pouch.","tr":"导游介绍了有袋动物幼崽如何在母亲的育儿袋里发育。"},{"ex":"That small animal is a marsupial, not a rodent.","tr":"那只小动物是有袋动物，不是啮齿动物。"}]},
  {"d":20,"tag":"au","w":"nocturnal","pos":"adj.","p":"/nɒkˈtɜːnl/","cn":"夜行性的","k":"nocturnal","ex":"Most Australian marsupials are nocturnal, so dusk is the best time to spot them.","tr":"澳洲多数有袋动物都是夜行性的，所以黄昏是最好的观察时段。","usage":"nocturnal animals 通常在夜间活动；相对的 diurnal 指日间活动，不能只因偶尔夜间出现就下定义。","extraExamples":[{"ex":"We used a wildlife camera to photograph nocturnal visitors to the garden.","tr":"我们用野生动物相机拍摄夜间来到花园的动物。"},{"ex":"His night shifts have made his routine almost nocturnal.","tr":"上夜班让他的作息几乎变成了昼伏夜出。"}]},
  {"d":20,"tag":"au","w":"elusive","pos":"adj.","p":"/ɪˈluːsɪv/","cn":"难得一见的、难以捉摸的","k":"elusive","ex":"The platypus is famously elusive — you need patience and a quiet creek.","tr":"鸭嘴兽出了名的难得一见，需要耐心和一条安静的溪流。","usage":"an elusive animal 很难见到或找到；an elusive answer 则是迟迟找不到的答案，不只用于动物。","extraExamples":[{"ex":"A quiet place to sit can be surprisingly elusive in a busy city.","tr":"在繁忙的城市里，找个安静的地方坐坐可能出乎意料地难。"},{"ex":"The answer remained elusive even after we checked all the records.","tr":"即使查过所有记录，答案仍然难以捉摸。"}]},
  {"d":20,"tag":"au","w":"venomous","pos":"adj.","p":"/ˈvenəməs/","cn":"有毒的","k":"venomous","ex":"Australia has plenty of venomous snakes, but bites are rare.","tr":"澳洲有很多毒蛇，但真正被咬的情况其实很少见。","usage":"venomous 通常指通过咬、刺等主动注入毒液；poisonous 指接触或摄入有害物质，重点是毒的传递方式。","extraExamples":[{"ex":"The guide pointed out the difference between venomous and non-venomous species.","tr":"导游指出了有毒和无毒物种之间的区别。"},{"ex":"Her voice took on a venomous tone when she mentioned the betrayal.","tr":"提到那次背叛时，她的语气变得恶毒起来。"}]},
  {"d":20,"tag":"au","w":"endemic","pos":"adj.","p":"/enˈdemɪk/","cn":"某地特有的、只在此处有的","k":"endemic","ex":"The Tasmanian devil is endemic to Tasmania.","tr":"袋獾是塔斯马尼亚特有的物种。","usage":"be endemic to a place 指自然分布限于该地区；native to 只表示原生，未必仅此地有。","extraExamples":[{"ex":"Some plants are endemic to this island and grow nowhere else naturally.","tr":"有些植物是这座岛特有的，在其他地方不会自然生长。"},{"ex":"The survey records several endemic species within the reserve.","tr":"调查记录了保护区内几种当地特有的物种。"}]},
  {"d":20,"tag":"au","w":"burrow","pos":"n. / v.","p":"/ˈbʌrəʊ/","cn":"洞穴；挖洞","k":"burrows","ex":"Wombats dig enormous burrows that can run for tens of metres.","tr":"袋熊会挖出巨大的洞穴，长度可达数十米。","usage":"a burrow 是动物挖的洞；动词 burrow into the ground 是往地下钻，注意不是 borrow（借）。","extraExamples":[{"ex":"We spotted fresh tracks near the entrance to the burrow.","tr":"我们在洞口附近发现了新鲜足迹。"},{"ex":"The animal burrowed into the soft ground and disappeared.","tr":"那只动物钻进松软的土里，不见了。"}]},
  {"d":20,"tag":"au","w":"in the wild","pos":"phr.","p":"/ɪn ðə waɪld/","cn":"在野外（非圈养状态）","k":"in the wild","ex":"Seeing a koala in the wild is much harder than at a sanctuary.","tr":"在野外看到考拉，比在保护区里难得多。","usage":"固定说 in the wild，保留 the；与 in captivity（圈养中）相对，也能借指真实使用环境。","extraExamples":[{"ex":"I'd only seen that bird in books before spotting one in the wild.","tr":"在野外看到那只鸟之前，我只在书上见过它。"},{"ex":"Animals can behave very differently in the wild from those in captivity.","tr":"野生动物的行为可能与圈养动物很不一样。"}]},
  {"d":20,"tag":"au","w":"be on the lookout for","pos":"phr.","p":"/ɒn ðə ˈlʊkaʊt fɔː/","cn":"留意寻找、警惕着","k":"on the lookout for","ex":"Be on the lookout for kangaroos on the road around dusk.","tr":"黄昏前后开车，要留意路上的袋鼠。","usage":"be on the lookout for something 是主动留意寻找或警惕；开车时也常见 Look out for kangaroos。","extraExamples":[{"ex":"Be on the lookout for a small sign just after the bridge.","tr":"过桥后，留意找一块小标牌。"},{"ex":"We're on the lookout for a second-hand dining table.","tr":"我们正在留意找一张二手餐桌。"}]},
  {"d":20,"tag":"au","w":"give something a wide berth","pos":"phr.","p":"/ə waɪd bɜːθ/","cn":"远远绕开、敬而远之","k":"a wide berth","ex":"If you see a snake on the track, just give it a wide berth.","tr":"如果在小路上看到蛇，远远绕开就行。","usage":"give someone / something a wide berth 是远远避开；既可字面绕开动物，也可比喻避开某人。","extraExamples":[{"ex":"We gave the muddy section of the path a wide berth.","tr":"我们远远绕过了路上那段泥地。"},{"ex":"I tend to give that noisy café a wide berth on weekends.","tr":"周末我一般会避开那家吵闹的咖啡馆。"}]},
  {"d":20,"tag":"au","w":"in the middle of nowhere","pos":"phr.","p":"/ɪn ðə ˈmɪdl əv ˈnəʊweə/","cn":"荒郊野外、前不着村后不着店","k":"in the middle of nowhere","ex":"We ran low on fuel in the middle of nowhere.","tr":"我们在前不着村后不着店的地方快没油了。","usage":"口语夸张说位置特别偏远；常说 be stuck in the middle of nowhere，不一定真是完全无人区。","extraExamples":[{"ex":"The bus dropped us in the middle of nowhere with no phone signal.","tr":"公交车把我们放在荒郊野外，手机一点信号也没有。"},{"ex":"Their house feels like it's in the middle of nowhere, though the station is only ten minutes away.","tr":"虽然车站只在十分钟路程外，他们家仍让人感觉很偏僻。"}]},
  {"d":21,"tag":"au","w":"swoop","pos":"v. / n.","p":"/swuːp/","cn":"（鸟）俯冲攻击","k":"swoop","ex":"Magpies swoop cyclists during nesting season.","tr":"筑巢季节里，喜鹊会俯冲攻击骑车的人。","usage":"swoop down on / at someone 指快速俯冲靠近或攻击；澳洲常见 magpie swooping season 这一说法。","extraExamples":[{"ex":"A small bird swooped down and snatched a crumb from the table.","tr":"一只小鸟俯冲下来，叼走了桌上的面包屑。"},{"ex":"We watched the gulls swoop over the water as the ferry approached.","tr":"渡轮靠近时，我们看着海鸥在水面上俯冲盘旋。"}]},
  {"d":21,"tag":"au","w":"feral","pos":"adj.","p":"/ˈferəl/","cn":"野化的","k":"Feral","ex":"Feral cats are a serious threat to native wildlife.","tr":"野化的家猫对本土野生动物构成严重威胁。","usage":"feral cats / pigs 指野化、在野外繁衍的家养动物；wild 通常更广泛地描述野生状态。","extraExamples":[{"ex":"The reserve runs a programme to monitor feral pigs.","tr":"保护区开展了监测野化猪的项目。"},{"ex":"A group of feral goats had gathered near the old fence.","tr":"一群野化的山羊聚在旧围栏旁。"}]},
  {"d":21,"tag":"au","w":"placid","pos":"adj.","p":"/ˈplæsɪd/","cn":"温和平静的（性情或水面）","k":"placid","ex":"Koalas look placid, but they can be surprisingly grumpy.","tr":"考拉看着温顺，其实脾气可能出奇地差。","usage":"a placid animal / lake 指温和的动物或平静水面；不等于永远不会受刺激或生气。","extraExamples":[{"ex":"The lake was placid in the early morning light.","tr":"晨光中的湖面平静无波。"},{"ex":"He's usually placid, even when the rest of us are stressed.","tr":"即使我们其他人都很紧张，他通常也很平静。"}]},
  {"d":21,"tag":"au","w":"sanctuary","pos":"n.","p":"/ˈsæŋktʃuəri/","cn":"野生动物保护区；庇护所","k":"sanctuary","ex":"The sanctuary rehabilitates injured wildlife before releasing them.","tr":"这家保护区会先让受伤的野生动物康复，再放归自然。","usage":"a wildlife sanctuary 是野生动物保护或救护场所；seek sanctuary 是寻求庇护，语境决定具体形式。","extraExamples":[{"ex":"The garden became a sanctuary from the noise of the street.","tr":"花园成了远离街道喧闹的清静之地。"},{"ex":"The sanctuary asks visitors to keep their voices low near the enclosures.","tr":"保护区请游客在围栏附近放低声音。"}]},
  {"d":21,"tag":"bad","w":"reflexes","pos":"n. pl.","p":"/ˈriːfleksɪz/","cn":"反应神经","k":"reflexes","ex":"Doubles at the net is all about reflexes.","tr":"双打网前拼的全是反应速度。","usage":"体育中常用复数 quick / sharp reflexes，指反应能力；a reflex 则可指单个反射动作。","extraExamples":[{"ex":"Her quick reflexes saved the glass before it hit the floor.","tr":"她反应很快，在杯子落地前接住了它。"},{"ex":"My reflexes aren't quite as sharp at the end of a long session.","tr":"长时间练习结束时，我的反应没那么敏捷了。"}]},
  {"d":21,"tag":"bad","w":"relentless","pos":"adj.","p":"/rɪˈlentləs/","cn":"不间断的、不留情面的","k":"relentless","ex":"His attack was relentless — I never got a chance to settle.","tr":"他的进攻毫不留情，我根本没机会站稳节奏。","usage":"relentless pressure / rain 强调一直持续、不给喘息；a relentless player 可褒可贬，取决于语境。","extraExamples":[{"ex":"The relentless rain kept us inside all weekend.","tr":"雨下个不停，我们整个周末都待在室内。"},{"ex":"I needed a break from the relentless stream of messages.","tr":"消息接连不断，我需要暂时歇一歇。"}]},
  {"d":21,"tag":"bad","w":"get the hang of something","pos":"phr.","p":"/ɡet ðə hæŋ əv/","cn":"掌握窍门、终于上手","k":"get the hang of","ex":"It took me a season to get the hang of the backhand clear.","tr":"我花了一整个赛季才掌握反手高远球的窍门。","usage":"get the hang of doing something 指通过练习摸到窍门；I'm getting the hang of it 是逐渐上手。","extraExamples":[{"ex":"You'll get the hang of the gears after a few short rides.","tr":"短途骑几次，你就能掌握换挡的窍门了。"},{"ex":"Once I got the hang of the recipe, I stopped checking it every minute.","tr":"掌握食谱的诀窍后，我就不再每分钟都去看了。"}]},
  {"d":21,"w":"on the fly","pos":"phr.","p":"/ɒn ðə flaɪ/","cn":"临场调整、边做边改","k":"on the fly","ex":"We changed tactics on the fly after losing the first game.","tr":"输掉第一局后，我们临场调整了战术。","usage":"do / change something on the fly 是边进行边调整，没有先停下来完整准备；不一定是仓促乱做。","extraExamples":[{"ex":"We worked out a new route on the fly when the path was closed.","tr":"发现步道封闭后，我们临时调整了路线。"},{"ex":"It's difficult to translate jokes on the fly.","tr":"即兴翻译笑话很难。"}]},
  {"d":21,"tag":"au","w":"be in for something","pos":"phr.","p":"/biː ɪn fɔː/","cn":"即将面临、少不了要遇上","k":"in for","ex":"If you're driving to Cairns in February, you're in for some rain.","tr":"二月开车去凯恩斯的话，少不了要遇上雨。","usage":"be in for a tough day / a treat 表示将遇到某种经历；既能预告麻烦，也能预告好事。","extraExamples":[{"ex":"You're in for a surprise when you see how much the place has changed.","tr":"看到那个地方变化多大时，你一定会吃一惊。"},{"ex":"With everyone arriving at once, we're in for a busy afternoon.","tr":"所有人同时到，我们下午肯定会很忙。"}]},
  {"d":21,"tag":"bad","w":"be no match for someone","pos":"phr.","p":"/nəʊ mætʃ fɔː/","cn":"完全不是对手","k":"no match for","ex":"My smash is no match for his, so I play the long game.","tr":"我的杀球完全比不过他，所以我打拉吊消耗。","usage":"be no match for someone / something 是能力明显比不上；与 be a good match（匹配、势均力敌）不同。","extraExamples":[{"ex":"Our little fan was no match for the afternoon heat.","tr":"我们的小风扇根本对付不了午后的炎热。"},{"ex":"I enjoy playing her, even though I'm no match for her at the net.","tr":"我喜欢和她打球，虽然网前完全不是她的对手。"}]},
  {"d":22,"w":"fluctuate","pos":"v.","p":"/ˈflʌktʃueɪt/","cn":"波动起伏（正在上下动）","k":"fluctuates","ex":"Memory usage fluctuates between forty and eighty percent all day.","tr":"内存占用一整天都在四成到八成之间波动。","usage":"fluctuate between A and B 是在两数之间波动；也可说 fluctuate with demand，表示随需求起伏。","extraExamples":[{"ex":"The room temperature fluctuates whenever someone opens the outside door.","tr":"每当有人打开外门，室温就会波动。"},{"ex":"Flight prices fluctuate so much that comparing the same dates can be confusing.","tr":"机票价格变化很大，即使比较相同日期也可能让人困惑。"}]},
  {"d":22,"w":"obsolete","pos":"adj.","p":"/ˈɒbsəliːt/","cn":"已淘汰的、彻底没人用的","k":"obsolete","ex":"That TLS version is obsolete and will be blocked next quarter.","tr":"那个 TLS 版本已经淘汰，下季度会被直接封禁。","usage":"obsolete technology 已过时或不再需要；技术文档中 deprecated 是不再推荐，可能仍暂时可用。","extraExamples":[{"ex":"The old charger became obsolete when we replaced the device.","tr":"我们换了设备后，旧充电器就用不上了。"},{"ex":"The guidebook was full of obsolete information about bus routes.","tr":"那本指南里都是已经过时的公交线路信息。"}]},
  {"d":22,"w":"proximity","pos":"n.","p":"/prɒkˈsɪməti/","cn":"邻近、距离上的接近","k":"proximity","ex":"We chose the hotel for its proximity to the airport.","tr":"我们选这家酒店是因为离机场近。","usage":"in close proximity to something 是离某物很近，语气较正式；日常说 close to 更简洁。","extraExamples":[{"ex":"The flat's proximity to the park was its biggest attraction.","tr":"那套公寓最大的吸引力是离公园近。"},{"ex":"We hadn't realised how noisy it would be living in close proximity to the station.","tr":"我们没想到，住在车站这么近的地方会这么吵。"}]},
  {"d":22,"w":"parched","pos":"adj.","p":"/pɑːtʃt/","cn":"渴得要命；（土地）干裂的","k":"parched","ex":"After two sets I was absolutely parched.","tr":"打完两局我渴得不行。","usage":"I'm parched 是口语说渴极了；parched land 指干得缺水的土地，不是空气湿度的描述。","extraExamples":[{"ex":"I was parched by the time we reached the café.","tr":"走到咖啡馆时，我已经渴得不行了。"},{"ex":"The parched ground soaked up the first shower of rain.","tr":"干裂的土地很快吸收了第一场阵雨。"}]},
  {"d":22,"w":"hefty","pos":"adj.","p":"/ˈhefti/","cn":"沉重的；（金额）数目可观的","k":"hefty","ex":"Changing the flight came with a hefty fee.","tr":"改签航班要付一笔不小的费用。","usage":"a hefty fee / fine 指一大笔费用或罚款；a hefty suitcase 则是沉重的行李箱，偏口语。","extraExamples":[{"ex":"That camera comes with a hefty price tag.","tr":"那台相机的价格可不低。"},{"ex":"He lifted a hefty box of books out of the car.","tr":"他从车里搬出了一大箱沉甸甸的书。"}]},

  {"d":22,"w":"at a glance","pos":"phr.","p":"/ət ə ɡlɑːns/","cn":"一眼就能看出、一目了然","k":"at a glance","ex":"The new dashboard shows cluster health at a glance.","tr":"新面板可以让你一眼看出集群健康状况。","usage":"see / tell at a glance 是一眼即可看出；take a glance at something 才是主动瞥一眼。","extraExamples":[{"ex":"You can see at a glance which seats are still available.","tr":"哪些座位还空着，一眼就能看出来。"},{"ex":"The simple diagram explains the route at a glance.","tr":"那张简图让路线一目了然。"}]},
  {"d":22,"w":"bank on something","pos":"phr. v.","p":"/bæŋk ɒn/","cn":"指望、把把握押在某事上","k":"bank on","ex":"Don't bank on the vendor patch arriving before Friday.","tr":"别指望厂商的补丁能在周五前到。","usage":"bank on someone / something / doing something 是有把握地指望；Don't bank on it 是别太指望它。","extraExamples":[{"ex":"Don't bank on getting a taxi outside the venue after midnight.","tr":"别指望午夜过后能在场馆外轻松打到车。"},{"ex":"We were banking on the café being open early.","tr":"我们原本指望那家咖啡馆早点开门。"}]},
  {"d":22,"w":"in the long run","pos":"phr.","p":"/ɪn ðə lɒŋ rʌn/","cn":"从长远来看","k":"in the long run","ex":"Index funds win in the long run, even if they feel boring now.","tr":"从长远来看指数基金会赢，即便现在觉得无聊。","usage":"in the long run 强调经过较长时间后的结果；与 in the short term（短期内）常成对使用。","extraExamples":[{"ex":"Spending more on a repair now could save trouble in the long run.","tr":"现在多花一点把东西修好，长远来看可能会省去麻烦。"},{"ex":"In the long run, I want a routine I can maintain rather than one that looks impressive.","tr":"长远来看，我想要的是能坚持的作息，而不是看起来很厉害的安排。"}]},

  {"d":23,"w":"viable","pos":"adj.","p":"/ˈvaɪəbl/","cn":"可行的、实际能落地的","k":"viable","ex":"Rolling back is the only viable option at this point.","tr":"到这一步，回滚是唯一可行的方案。","usage":"a viable option / solution 是在现实条件下可行的方案，不只是理论上想得到；commercially viable 指商业上可行。","extraExamples":[{"ex":"Cycling to work became a viable option once the new path opened.","tr":"新骑行道开放后，骑车上班成了可行的选择。"},{"ex":"We need a viable alternative before we cancel the current arrangement.","tr":"取消现有安排之前，我们需要一个可行的替代方案。"}]},
  {"d":23,"w":"threshold","pos":"n.","p":"/ˈθreʃhəʊld/","cn":"阈值、临界点；门槛","k":"threshold","ex":"The alert fires once CPU crosses the eighty percent threshold.","tr":"CPU 超过 80% 阈值后就会触发告警。","usage":"cross / exceed a threshold 是跨过阈值；a pain threshold 是痛觉耐受限度，a doorway threshold 是门槛。","extraExamples":[{"ex":"The sound fades once it falls below the recording threshold.","tr":"声音低于录音阈值时，就会逐渐听不见。"},{"ex":"She paused on the threshold before entering the room.","tr":"她进房间前，在门槛处停了一下。"}]},
  {"d":23,"w":"brittle","pos":"adj.","p":"/ˈbrɪtl/","cn":"脆的、一碰就崩的（系统或材料）","k":"brittle","ex":"The deployment script is brittle — any change to the path breaks it.","tr":"这个部署脚本很脆，路径一改就崩。","usage":"brittle materials 容易断裂；brittle code / systems 借指遇到小变化就出故障，带负面评价。","extraExamples":[{"ex":"The old rubber had become brittle and cracked when I bent it.","tr":"旧橡胶已经变脆，我一弯它就裂了。"},{"ex":"Their agreement was brittle; one small disagreement brought the tension back.","tr":"他们的协议很脆弱，一点小分歧就让紧张气氛重现。"}]},
