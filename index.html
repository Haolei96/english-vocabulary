  button.say { width: 44px; padding: 11px 0; font-size: 17px; }
  #done { display: none; }

  .miss { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }

 {d:5,w:"circle back",pos:"phr. v.",p:"/ˈsɜːkl bæk/",cn:"回头再聊、稍后再跟进",k:"circle back",ex:"Let's circle back on the RDS upgrade once the test results are in.",tr:"等测试结果出来，我们再回头讨论 RDS 升级的事。"},
 {d:5,w:"off the top of my head",pos:"phr.",p:"/ɒf ðə tɒp əv maɪ hed/",cn:"凭印象说、一时想到的（不确定）",k:"Off the top of my head",ex:"Off the top of my head, I'd say around twenty servers were affected.",tr:"我凭印象说，大概有二十台服务器受影响。"},
 {d:5,w:"call it a day",pos:"phr.",p:"/kɔːl ɪt ə deɪ/",cn:"今天就到这儿吧、收工",k:"call it a day",ex:"The logs can wait until tomorrow — let's call it a day.",tr:"日志明天再看吧，今天就到这儿。"},

 {d:6,w:"backlog",pos:"n.",p:"/ˈbæklɒɡ/",cn:"积压的待办工作",k:"backlog",ex:"We're still working through a backlog of patching tickets from last month.",tr:"我们还在处理上个月积压下来的打补丁工单。"},
 {d:6,w:"circumvent",pos:"v.",p:"/ˌsɜːkəmˈvent/",cn:"规避、绕过（规则或管控）",k:"circumvent",ex:"Please don't circumvent the change process just to save time.",tr:"请不要为了省时间就绕过变更流程。"},
 {d:6,w:"erratic",pos:"adj.",p:"/ɪˈrætɪk/",cn:"飘忽不定的、时好时坏的",k:"erratic",ex:"The node's memory usage has been erratic since the last deployment.",tr:"上次部署之后，这个节点的内存占用一直飘忽不定。"},
 {d:6,w:"taut",pos:"adj.",p:"/tɔːt/",cn:"紧绷的、绷得住的（底盘）",k:"taut",ex:"The KW coilovers give the car a taut, controlled feel over bumps.",tr:"这套 KW 绞牙让车过颠簸时有一种紧绷、受控的感觉。"},
 {d:6,w:"syrupy",pos:"adj.",p:"/ˈsɪrəpi/",cn:"糖浆般浓稠的",k:"syrupy",ex:"A well-pulled ristretto should be thick and almost syrupy.",tr:"萃取得好的 ristretto 应该浓稠得近乎糖浆感。"},
 {d:6,w:"balmy",pos:"adj.",p:"/ˈbɑːmi/",cn:"温暖宜人的（天气）",k:"balmy",ex:"Brisbane was still balmy in early October.",tr:"十月初的布里斯班依然温暖宜人。"},
 {d:6,w:"touch base",pos:"phr. v.",p:"/tʌtʃ beɪs/",cn:"碰个头、简短沟通一下",k:"touch base",ex:"Let's touch base on Friday before the change freeze kicks in.",tr:"变更冻结开始之前，我们周五碰个头。"},
 {d:6,w:"be on the same page",pos:"phr.",p:"/ɒn ðə seɪm peɪdʒ/",cn:"理解一致、达成共识",k:"on the same page",ex:"I'd like to make sure we're all on the same page before I send this out.",tr:"在我发出去之前，想确认一下大家的理解是一致的。"},
 {d:6,w:"drop the ball",pos:"phr.",p:"/drɒp ðə bɔːl/",cn:"掉链子、办事失误",k:"dropped the ball",ex:"I dropped the ball on that ticket — I forgot to update the status.",tr:"那个工单我掉链子了，忘了更新状态。"},
 {d:6,w:"worth a shot",pos:"phr.",p:"/wɜːθ ə ʃɒt/",cn:"值得一试",k:"worth a shot",ex:"Prefix delegation might not fix it, but it's worth a shot.",tr:"前缀委派未必能解决，但值得一试。"},

 {d:7,w:"inadvertently",pos:"adv.",p:"/ˌɪnədˈvɜːtəntli/",cn:"无意中、不小心地",k:"inadvertently",ex:"The script inadvertently removed the versionlock before the upgrade.",tr:"该脚本在升级前无意中移除了 versionlock。"},
 {d:7,w:"preemptive",pos:"adj.",p:"/priˈemptɪv/",cn:"先发的、预防性的",k:"preemptive",ex:"We did a preemptive reboot rather than waiting for the node to fail.",tr:"我们主动做了一次预防性重启，而不是等节点挂掉。"},
 {d:7,w:"granular",pos:"adj.",p:"/ˈɡrænjələ/",cn:"细粒度的、颗粒感的",k:"granular",ex:"IAM lets you define granular permissions down to a single action.",tr:"IAM 允许你把权限细化到单个操作。"},
 {d:7,w:"jittery",pos:"adj.",p:"/ˈdʒɪtəri/",cn:"心慌手抖的；（市场）神经紧张的",k:"jittery",ex:"Too much espresso before a track day leaves me jittery.",tr:"赛道日之前喝太多浓缩会让我心慌手抖。"},
 {d:7,w:"winding",pos:"adj.",p:"/ˈwaɪndɪŋ/",cn:"蜿蜒曲折的",k:"winding",ex:"The road up to Kamikochi is narrow and winding.",tr:"通往上高地的那条路又窄又蜿蜒。"},
 {d:7,w:"steep",pos:"adj. / v.",p:"/stiːp/",cn:"陡峭的；（价格）高昂的；浸泡",k:"steep",ex:"The learning curve for EKS networking is pretty steep.",tr:"EKS 网络的学习曲线相当陡。"},
 {d:7,w:"bear with me",pos:"phr.",p:"/beə wɪð miː/",cn:"请稍等一下、担待一下",k:"Bear with me",ex:"Bear with me while I pull up the CloudWatch dashboard.",tr:"稍等我一下，我把 CloudWatch 面板调出来。"},
 {d:7,w:"run something by someone",pos:"phr. v.",p:"/rʌn ˈsʌmθɪŋ baɪ/",cn:"跟某人过一下、征求一下意见",k:"run this change plan by",ex:"Let me run this change plan by the security team first.",tr:"我先把这份变更方案跟安全团队过一下。"},
 {d:7,w:"in hindsight",pos:"phr.",p:"/ɪn ˈhaɪndsaɪt/",cn:"事后回想、现在看来",k:"In hindsight",ex:"In hindsight, we should have tested the patch in dev first.",tr:"事后回想，我们本该先在 dev 环境测这个补丁。"},
 {d:7,w:"loop someone in",pos:"phr. v.",p:"/luːp ˈsʌmwʌn ɪn/",cn:"把某人拉进来知会一声",k:"loop you in",ex:"I'll loop you in on the thread with the global team.",tr:"我会把你加进跟全球团队的那条邮件线里。"},

 {d:8,w:"overhaul",pos:"n. / v.",p:"/ˈəʊvəhɔːl/",cn:"彻底整改、大修",k:"overhaul",ex:"The patching process needs a complete overhaul, not another quick fix.",tr:"打补丁的流程需要彻底重做，而不是再打一个补丁了事。"},
 {d:8,w:"stopgap",pos:"n. / adj.",p:"/ˈstɒpɡæp/",cn:"权宜之计、临时顶一下的办法",k:"stopgap",ex:"Restarting the service is only a stopgap until we fix the memory leak.",tr:"重启服务只是权宜之计，真正要解决的是内存泄漏。"},
 {d:8,w:"scrutiny",pos:"n.",p:"/ˈskruːtəni/",cn:"仔细审查、严格审视",k:"scrutiny",ex:"Any change to production networking gets extra scrutiny from the security team.",tr:"任何生产网络的变更都会受到安全团队的额外审查。"},
 {d:8,w:"skittish",pos:"adj.",p:"/ˈskɪtɪʃ/",cn:"躁动不安的；（车尾）发飘不安分的",k:"skittish",ex:"The rear end feels skittish over bumps when the damping is too stiff.",tr:"阻尼调得太硬时，车尾过颠簸会显得躁动不安。"},
 {d:8,w:"muted",pos:"adj.",p:"/ˈmjuːtɪd/",cn:"平淡的、不强烈的（反应/风味）",k:"muted",ex:"The market reaction to the earnings was surprisingly muted.",tr:"市场对这份财报的反应出奇地平淡。"},
 {d:8,w:"grueling",pos:"adj.",p:"/ˈɡruːəlɪŋ/",cn:"极其累人的、折磨人的",k:"grueling",ex:"A full day of track sessions is more grueling than it looks.",tr:"一整天的赛道跑下来，比看上去累多了。"},
 {d:8,w:"keep someone posted",pos:"phr.",p:"/kiːp ˈsʌmwʌn ˈpəʊstɪd/",cn:"随时同步进展给某人",k:"keep you posted",ex:"I'll keep you posted as the patching progresses tonight.",tr:"今晚打补丁的进展我会随时同步给你。"},
 {d:8,w:"hold off on something",pos:"phr. v.",p:"/həʊld ɒf ɒn/",cn:"先缓一缓、暂时不做",k:"hold off on",ex:"Let's hold off on the deployment until the change freeze lifts.",tr:"我们先缓一缓，等变更冻结解除再部署。"},
 {d:8,w:"at short notice",pos:"phr.",p:"/ət ʃɔːt ˈnəʊtɪs/",cn:"临时通知、仓促之间",k:"at such short notice",ex:"Thanks for joining the call at such short notice.",tr:"感谢你这么临时地加入这个会。"},
 {d:8,w:"iron out",pos:"phr. v.",p:"/ˈaɪən aʊt/",cn:"理顺、解决（细节或分歧）",k:"iron out",ex:"We still need to iron out a few details before the go-live.",tr:"上线之前还有几个细节需要理顺。"},

 {d:9,w:"cascade",pos:"v. / n.",p:"/kæˈskeɪd/",cn:"级联、引发连锁反应",k:"cascaded",ex:"One failed mount target cascaded into a full boot failure.",tr:"一个失效的挂载点级联引发了整台机器无法启动。"},
 {d:9,w:"contentious",pos:"adj.",p:"/kənˈtenʃəs/",cn:"有争议的、容易吵起来的",k:"contentious",ex:"Whether to put the endpoint on the consumer side turned out to be contentious.",tr:"端点该放在消费方这一侧，结果成了很有争议的问题。"},
 {d:9,w:"finicky",pos:"adj.",p:"/ˈfɪnɪki/",cn:"难伺候的、挑剔麻烦的",k:"finicky",ex:"The old SSM agent is finicky about proxy settings.",tr:"老版本的 SSM agent 对代理设置很挑剔。"},
 {d:9,w:"drawdown",pos:"n.",p:"/ˈdrɔːdaʊn/",cn:"回撤（从高点下跌的幅度）",k:"drawdown",ex:"I add more capital whenever the index hits a ten percent drawdown.",tr:"每当指数回撤 10%，我就追加一笔资金。"},
 {d:9,w:"immaculate",pos:"adj.",p:"/ɪˈmækjələt/",cn:"一尘不染的、完美无瑕的",k:"immaculate",ex:"He keeps the car immaculate, even after a track day.",tr:"他把车保持得一尘不染，哪怕刚跑完赛道。"},
 {d:9,w:"layover",pos:"n.",p:"/ˈleɪəʊvə/",cn:"中转停留（短暂等待）",k:"layover",ex:"We had a six-hour layover in Singapore on the way to Melbourne.",tr:"去墨尔本的路上，我们在新加坡中转停留了六个小时。"},
 {d:9,w:"fall through the cracks",pos:"phr.",p:"/fɔːl θruː ðə kræks/",cn:"被漏掉、没人跟进就没了下文",k:"fall through the cracks",ex:"Let's log it now so it doesn't fall through the cracks.",tr:"现在就把它登记下来，免得这事儿被漏掉。"},
 {d:9,w:"play it by ear",pos:"phr.",p:"/pleɪ ɪt baɪ ɪə/",cn:"看情况再定、随机应变",k:"play it by ear",ex:"We haven't booked anything for Sunday, so we'll play it by ear.",tr:"周日我们什么都没订，到时候看情况再说。"},
 {d:9,w:"on the back burner",pos:"phr.",p:"/ɒn ðə bæk ˈbɜːnə/",cn:"暂时搁置、优先级往后放",k:"on the back burner",ex:"The dashboard project is on the back burner until Q4.",tr:"那个看板项目先搁置，等第四季度再说。"},
 {d:9,w:"a long shot",pos:"phr.",p:"/ə lɒŋ ʃɒt/",cn:"希望不大的尝试、赌一把",k:"a long shot",ex:"Rolling back the driver is a long shot, but nothing else has worked.",tr:"回滚驱动希望不大，但别的办法都试过了。"},

 {d:10,w:"exacerbate",pos:"v.",p:"/ɪɡˈzæsəbeɪt/",cn:"加剧、使恶化",k:"exacerbated",ex:"Rebooting during peak hours only exacerbated the timeouts.",tr:"在高峰期重启反而让超时问题更严重了。"},
 {d:10,w:"convoluted",pos:"adj.",p:"/ˈkɒnvəluːtɪd/",cn:"错综复杂的、绕来绕去的",k:"convoluted",ex:"The cross-account routing setup is so convoluted that nobody wants to touch it.",tr:"这套跨账号路由绕得没人愿意碰。"},
 {d:10,w:"compliant",pos:"adj.",p:"/kəmˈplaɪənt/",cn:"合规的；（悬架）柔顺有韧性的",k:"compliant",ex:"A compliant suspension soaks up bumps without feeling floaty.",tr:"有柔顺性的悬架能吸收颠簸，又不会发飘。"},
 {d:10,w:"stale",pos:"adj.",p:"/steɪl/",cn:"不新鲜的；（数据）过期失效的",k:"stale",ex:"The dashboard was showing stale data from a cached query.",tr:"面板显示的是缓存查询里的过期数据。"},
 {d:10,w:"overrated",pos:"adj.",p:"/ˌəʊvəˈreɪtɪd/",cn:"名过其实的、被高估的",k:"overrated",ex:"The tourist strip was overrated; the suburbs had far better coffee.",tr:"那条游客街名过其实，郊区的咖啡好得多。"},
 {d:10,w:"rebalance",pos:"v.",p:"/ˌriːˈbæləns/",cn:"再平衡（调整资产配置比例）",k:"rebalance",ex:"I rebalance the portfolio once a year rather than reacting to every dip.",tr:"我一年做一次组合再平衡，而不是每次下跌都去反应。"},
 {d:10,w:"off the beaten path",pos:"phr.",p:"/ɒf ðə ˈbiːtn pɑːθ/",cn:"人少小众、不在常规路线上的",k:"off the beaten path",ex:"The best cafés in Melbourne are off the beaten path.",tr:"墨尔本最好的咖啡馆都藏在游客少去的地方。"},
 {d:10,w:"flag something up",pos:"phr. v.",p:"/flæɡ ˈsʌmθɪŋ ʌp/",cn:"把某事提出来、引起注意",k:"flagged it up",ex:"I flagged it up to the network team before the freeze started.",tr:"冻结开始之前，我把这件事提给网络团队了。"},
 {d:10,w:"cut corners",pos:"phr.",p:"/kʌt ˈkɔːnəz/",cn:"图省事、偷工减料",k:"cut corners",ex:"We can't cut corners on testing just to hit the deadline.",tr:"不能为了赶截止日期就在测试上偷工减料。"},
 {d:10,w:"get someone up to speed",pos:"phr.",p:"/ʌp tə spiːd/",cn:"让某人跟上进度、了解情况",k:"get you up to speed",ex:"Let me get you up to speed on what happened last night.",tr:"我先把昨晚发生的事跟你同步一下。"},

 {d:11,w:"attest",pos:"v.",p:"/əˈtest/",cn:"证明、证实（attest to sth）",k:"attest",ex:"The logs attest to the fact that the agent never checked in.",tr:"日志可以证明该 agent 从未上报过。"},
 {d:11,w:"defer",pos:"v.",p:"/dɪˈfɜː/",cn:"推迟；（defer to）听从某人意见",k:"deferred",ex:"We deferred the upgrade to the next maintenance window.",tr:"我们把升级推迟到了下一个维护窗口。"},
 {d:11,w:"redundant",pos:"adj.",p:"/rɪˈdʌndənt/",cn:"冗余的（技术褒义）；多余重复的",k:"redundant",ex:"We added a redundant path so a single link failure won't take the site down.",tr:"我们加了一条冗余链路，这样单条链路故障不会导致整站中断。"},
 {d:11,w:"docile",pos:"adj.",p:"/ˈdəʊsaɪl/",cn:"温顺听话的、好开不咬人的",k:"docile",ex:"The BRZ is docile at low speed but comes alive above four thousand rpm.",tr:"BRZ 低速时温顺听话，但过了四千转就活了。"},
 {d:11,w:"scalding",pos:"adj.",p:"/ˈskɔːldɪŋ/",cn:"滚烫的（烫伤级别）",k:"scalding",ex:"Water straight off the boil is scalding and will burn the grounds.",tr:"刚烧开的水太烫，会把咖啡粉烫焦。"},
 {d:11,w:"lucrative",pos:"adj.",p:"/ˈluːkrətɪv/",cn:"赚钱的、收益丰厚的",k:"lucrative",ex:"Index investing isn't exciting, but it's been quietly lucrative.",tr:"指数投资并不刺激，但一直在悄悄赚钱。"},
 {d:11,w:"put something on hold",pos:"phr.",p:"/pʊt ɒn həʊld/",cn:"把某事挂起、暂停",k:"on hold",ex:"We've put the migration on hold until the vendor responds.",tr:"在厂商回复之前，我们把迁移暂停了。"},
 {d:11,w:"take a rain check",pos:"phr.",p:"/teɪk ə ˈreɪn tʃek/",cn:"这次先算了、改天再约",k:"take a rain check",ex:"I'll have to take a rain check on dinner — I'm on call tonight.",tr:"晚饭我改天再约吧，今晚我值班。"},
 {d:11,w:"be swamped",pos:"phr.",p:"/biː swɒmpt/",cn:"忙得不可开交、被淹没了",k:"swamped",ex:"I'm completely swamped this week — can we push it to Monday?",tr:"这周我忙得不可开交，能推到周一吗？"},
 {d:11,w:"a ballpark figure",pos:"phr.",p:"/ə ˈbɔːlpɑːk ˈfɪɡə/",cn:"大概的数字、估个大致范围",k:"a ballpark figure",ex:"Can you give me a ballpark figure for how long the rollback will take?",tr:"回滚大概要多久，能给个大致的数吗？"},

 {d:12,w:"pinpoint",pos:"v.",p:"/ˈpɪnpɔɪnt/",cn:"精确定位、准确指出",k:"pinpoint",ex:"CloudTrail helped us pinpoint exactly who deleted the file system.",tr:"CloudTrail 帮我们精确定位到了究竟是谁删除了该文件系统。"},
 {d:12,w:"outage",pos:"n.",p:"/ˈaʊtɪdʒ/",cn:"服务中断、停机",k:"outage",ex:"The outage lasted forty minutes and affected two production accounts.",tr:"本次中断持续了四十分钟，影响两个生产账号。"},
 {d:12,w:"tedious",pos:"adj.",p:"/ˈtiːdiəs/",cn:"枯燥乏味的、磨人的",k:"tedious",ex:"Checking each server by hand is tedious and error-prone.",tr:"逐台手工检查服务器既枯燥又容易出错。"},
 {d:12,w:"grippy",pos:"adj.",p:"/ˈɡrɪpi/",cn:"抓地力强的（口语）",k:"grippier",ex:"The new tyres are noticeably grippier once they're up to temperature.",tr:"新轮胎热起来之后抓地力明显更强。"},
 {d:12,w:"muddled",pos:"adj.",p:"/ˈmʌdld/",cn:"混乱不清的、糊成一团的",k:"muddled",ex:"If you over-extract, the flavours get muddled and flat.",tr:"萃取过头的话，风味会糊成一团、变得平淡。"},
 {d:12,w:"windfall",pos:"n.",p:"/ˈwɪndfɔːl/",cn:"意外之财、飞来横财",k:"windfall",ex:"I put most of the bonus windfall into the index fund rather than spending it.",tr:"这笔意外的奖金我大部分投进了指数基金，没花掉。"},
 {d:12,w:"touch and go",pos:"phr.",p:"/tʌtʃ ənd ɡəʊ/",cn:"悬乎、说不准能不能成",k:"touch and go",ex:"It was touch and go whether we'd finish before the window closed.",tr:"能不能在窗口关闭前做完，当时挺悬的。"},
 {d:12,w:"back to square one",pos:"phr.",p:"/bæk tə skweə wʌn/",cn:"回到原点、白忙一场",k:"back to square one",ex:"The rollback failed too, so we're back to square one.",tr:"回滚也失败了，我们又回到了原点。"},
 {d:12,w:"buy time",pos:"phr.",p:"/baɪ taɪm/",cn:"争取时间、拖一拖",k:"buys us time",ex:"Restarting the service buys us time until the vendor patch arrives.",tr:"重启服务能争取一点时间，撑到厂商补丁下来。"},
 {d:12,w:"be up in the air",pos:"phr.",p:"/ʌp ɪn ði eə/",cn:"还没定、悬而未决",k:"up in the air",ex:"The October travel dates are still up in the air.",tr:"十月的出行日期还没定下来。"},

 {d:13,w:"substantiate",pos:"v.",p:"/səbˈstænʃieɪt/",cn:"用证据支持、证实（说法）",k:"substantiate",ex:"We couldn't substantiate the claim that the agent had run successfully.",tr:"我们无法证实「该 agent 已成功运行」这一说法。"},
 {d:13,w:"pertinent",pos:"adj.",p:"/ˈpɜːtɪnənt/",cn:"切题的、相关的（比 relevant 正式）",k:"pertinent",ex:"I've attached the pertinent CloudTrail entries for your review.",tr:"我已附上相关的 CloudTrail 记录供你查阅。"},
 {d:13,w:"transient",pos:"adj.",p:"/ˈtrænziənt/",cn:"短暂的、出现一次就消失的",k:"transient",ex:"The error was transient and hasn't reappeared since the restart.",tr:"该错误是短暂性的，重启后再未出现。"},
 {d:13,w:"forgiving",pos:"adj.",p:"/fəˈɡɪvɪŋ/",cn:"容错性好的、不惩罚失误的",k:"forgiving",ex:"A wider power band makes the car more forgiving when you get the gear wrong.",tr:"更宽的动力带让这台车在你挡位选错时更宽容。"},
 {d:13,w:"decadent",pos:"adj.",p:"/ˈdekədənt/",cn:"（食物）浓郁奢华的、罪恶的美味",k:"decadent",ex:"That flat white with a slice of basque cheesecake felt decadent.",tr:"那杯 flat white 配一块巴斯克蛋糕，简直是罪恶的享受。"},
 {d:13,w:"dip",pos:"n. / v.",p:"/dɪp/",cn:"回落、小幅下跌；蘸",k:"the dip",ex:"I usually buy the dip rather than trying to time the top.",tr:"我一般是逢跌买入，而不是去猜顶部。"},
 {d:13,w:"on second thought",pos:"phr.",p:"/ɒn ˈsekənd θɔːt/",cn:"再想想的话、转念一想",k:"On second thought",ex:"On second thought, let's do the reboot during the weekend window instead.",tr:"再想想的话，我们还是改到周末的窗口做重启吧。"},
 {d:13,w:"stay on top of something",pos:"phr.",p:"/steɪ ɒn tɒp əv/",cn:"持续盯住、掌控住某事",k:"stay on top of",ex:"I'll stay on top of the ticket queue while you're on leave.",tr:"你休假期间，工单队列我会一直盯着。"},
 {d:13,w:"a heads-up call",pos:"phr.",p:"/ə ˈhedz ʌp kɔːl/",cn:"预警式的沟通、提前打的招呼",k:"a heads-up call",ex:"Consider this a heads-up call — the vendor may miss the deadline.",tr:"就当我提前给你打个招呼：厂商可能赶不上截止日期。"},
 {d:13,w:"go the extra mile",pos:"phr.",p:"/ɡəʊ ði ˈekstrə maɪl/",cn:"多做一步、格外用心",k:"went the extra mile",ex:"The night shift went the extra mile and rebuilt the node before handover.",tr:"夜班同事额外多做了一步，在交接前把节点重建好了。"},

 {d:14,w:"discrete",pos:"adj.",p:"/dɪˈskriːt/",cn:"独立分开的、离散的（≠discreet 谨慎）",k:"discrete",ex:"We split the rollout into three discrete phases so each can be verified.",tr:"我们把上线拆成三个独立的阶段，每一阶段都能单独验证。"},
 {d:14,w:"antiquated",pos:"adj.",p:"/ˈæntɪkweɪtɪd/",cn:"陈旧过时的（该淘汰了）",k:"antiquated",ex:"The monitoring stack is antiquated and barely maintained anymore.",tr:"这套监控系统已经很陈旧，几乎没人再维护了。"},
 {d:14,w:"leeway",pos:"n.",p:"/ˈliːweɪ/",cn:"回旋余地、宽松空间",k:"leeway",ex:"The deadline gives us very little leeway if the first attempt fails.",tr:"如果第一次尝试失败，这个截止日期留给我们的余地非常有限。"},
 {d:14,w:"telegraph",pos:"v.",p:"/ˈtelɪɡrɑːf/",cn:"（提前）传递出信号、预告",k:"telegraph",ex:"Good tyres telegraph the limit before they let go.",tr:"好轮胎会在失去抓地之前把极限信号传递给你。"},
 {d:14,w:"potent",pos:"adj.",p:"/ˈpəʊtnt/",cn:"（效力）强劲的、后劲足的",k:"potent",ex:"A double ristretto is small but surprisingly potent.",tr:"双份 ristretto 分量虽小，后劲却出奇地足。"},
 {d:14,w:"forfeit",pos:"v. / n.",p:"/ˈfɔːfɪt/",cn:"（因故）丧失、放弃（权利或钱）",k:"forfeit",ex:"If you cancel within 48 hours, you forfeit the full booking fee.",tr:"如果在 48 小时内取消，你将损失全部预订费用。"},
 {d:14,w:"take it from here",pos:"phr.",p:"/teɪk ɪt frəm hɪə/",cn:"接下来交给你了、由你接手",k:"take it from here",ex:"The node is back online — the day shift can take it from here.",tr:"节点已恢复上线，接下来交给白班同事。"},
 {d:14,w:"give or take",pos:"phr.",p:"/ɡɪv ɔː teɪk/",cn:"上下浮动、差不多（估数用）",k:"give or take",ex:"The rollback takes about half an hour, give or take.",tr:"回滚大概要半小时上下。"},
 {d:14,w:"be all over the place",pos:"phr.",p:"/ɔːl əʊvə ðə pleɪs/",cn:"乱七八糟、毫无章法",k:"all over the place",ex:"The latency numbers were all over the place last night.",tr:"昨晚的延迟数据乱七八糟，毫无规律。"},
 {d:14,w:"nail something down",pos:"phr. v.",p:"/neɪl ˈsʌmθɪŋ daʊn/",cn:"敲定、确定下来",k:"nail down",ex:"Let's nail down the maintenance date before we notify the users.",tr:"通知用户之前，我们先把维护日期敲定。"},

 {d:15,w:"attribute",pos:"v.",p:"/əˈtrɪbjuːt/",cn:"归因于（attribute A to B）",k:"attribute",ex:"We attribute the failure to a race condition in the patching script.",tr:"我们将此次故障归因于打补丁脚本中的竞态条件。"},
 {d:15,w:"corroborate",pos:"v.",p:"/kəˈrɒbəreɪt/",cn:"（用另一来源）佐证、印证",k:"corroborate",ex:"The vendor's logs corroborate what we saw in CloudTrail.",tr:"厂商的日志印证了我们在 CloudTrail 里看到的情况。"},
 {d:15,w:"marginal",pos:"adj.",p:"/ˈmɑːdʒɪnl/",cn:"微小的、边际的；勉强的",k:"marginal",ex:"The tuning change gave only a marginal improvement in latency.",tr:"这次调参对延迟的改善非常有限。"},
 {d:15,w:"abrupt",pos:"adj.",p:"/əˈbrʌpt/",cn:"突兀的、生硬的（≠progressive）",k:"abrupt",ex:"The throttle response feels abrupt in Sport Sharp mode.",tr:"在 Sport Sharp 模式下，油门响应显得有些突兀。"},
 {d:15,w:"pungent",pos:"adj.",p:"/ˈpʌndʒənt/",cn:"气味刺鼻浓烈的（偏负面）",k:"pungent",ex:"Over-roasted beans give off a pungent, ashy smell.",tr:"烘过头的豆子会散发出刺鼻的焦灰味。"},

 {d:15,w:"wrap one's head around something",pos:"phr.",p:"/ræp əˈraʊnd/",cn:"想明白、理解透（有难度的东西）",k:"wrap my head around",ex:"It took me a while to wrap my head around how IRSA actually works.",tr:"我花了好一阵才想明白 IRSA 到底是怎么运作的。"},

 {d:15,w:"come up short",pos:"phr.",p:"/kʌm ʌp ʃɔːt/",cn:"没达标、差了一截",k:"came up short",ex:"The first fix came up short — the errors returned within an hour.",tr:"第一次修复没能奏效，一小时内错误又回来了。"},
 {d:15,w:"by and large",pos:"phr.",p:"/baɪ ənd lɑːdʒ/",cn:"总体而言、大体上",k:"By and large",ex:"By and large, the migration went smoothly apart from two nodes.",tr:"总体而言，除了两个节点之外，这次迁移进行得很顺利。"},

 {d:16,w:"mitigation",pos:"n.",p:"/ˌmɪtɪˈɡeɪʃn/",cn:"缓解措施（降低影响，非根治）",k:"mitigation",ex:"As a mitigation, we scaled out the node group before the peak window.",tr:"作为缓解措施，我们在高峰窗口前对节点组做了扩容。"},
 {d:16,w:"prerequisite",pos:"n.",p:"/ˌpriːˈrekwəzɪt/",cn:"前置条件、先决要求",k:"prerequisite",ex:"The CSI snapshot controller is a prerequisite for cross-account backups.",tr:"CSI 快照控制器是跨账号备份的前置条件。"},

 {d:16,w:"knackered",pos:"adj.",p:"/ˈnækəd/",cn:"累瘫了（英澳）；零件报废了",k:"knackered",ex:"After a full day of driving we were absolutely knackered.",tr:"开了一整天车，我们累得不行。"},
 {d:16,w:"sturdy",pos:"adj.",p:"/ˈstɜːdi/",cn:"结实耐用的、扎实的",k:"sturdy",ex:"Pack a sturdy pair of shoes for the walks in Tasmania.",tr:"去塔斯马尼亚徒步，带一双结实的鞋。"},

 {d:16,w:"how are you going",pos:"phr.",p:"/haʊ ə juː ˈɡəʊɪŋ/",cn:"最近怎么样（澳式问候，非问交通）",k:"How are you going",ex:"How are you going? Settling into Melbourne alright?",tr:"最近怎么样？在墨尔本还适应吗？"},
 {d:16,w:"give someone a hand",pos:"phr.",p:"/ɡɪv ə hænd/",cn:"搭把手、帮个忙",k:"give me a hand",ex:"Could you give me a hand with the handover notes?",tr:"能帮我一起弄一下交接文档吗？"},
 {d:16,w:"sort something out",pos:"phr. v.",p:"/sɔːt aʊt/",cn:"搞定、处理妥当（英澳口语）",k:"sort out",ex:"I'll sort out the SIM card once we land in Brisbane.",tr:"落地布里斯班之后我把电话卡搞定。"},

 {d:17,w:"escalate",pos:"v.",p:"/ˈeskəleɪt/",cn:"升级上报；（事态）恶化",k:"escalate",ex:"If there's no response within an hour, escalate it to the on-call manager.",tr:"如果一小时内没有响应，就上报给值班经理。"},

 {d:17,w:"pop in",pos:"phr. v.",p:"/pɒp ɪn/",cn:"顺路进去一下、短暂造访",k:"pop in",ex:"Let's pop in for a coffee before the museum opens.",tr:"趁博物馆还没开门，我们进去喝杯咖啡。"},
 {d:17,w:"be worth it",pos:"phr.",p:"/wɜːθ ɪt/",cn:"值得（花这个时间或钱）",k:"worth it",ex:"The two-hour drive was long, but the view was worth it.",tr:"两小时车程是久了点，但那个景色值了。"},
 {d:17,w:"first thing tomorrow",pos:"phr.",p:"/fɜːst θɪŋ təˈmɒrəʊ/",cn:"明天一早（第一件事就办）",k:"first thing tomorrow",ex:"I'll send the RCA draft first thing tomorrow.",tr:"我明天一早就把 RCA 初稿发出去。"},

 {d:18,w:"contingent",pos:"adj.",p:"/kənˈtɪndʒənt/",cn:"取决于…的（contingent on）",k:"contingent",ex:"The go-live date is contingent on the security review passing.",tr:"上线日期取决于安全评审能否通过。"},
 {d:18,w:"revert",pos:"v.",p:"/rɪˈvɜːt/",cn:"恢复原状、回退（≠回复邮件）",k:"revert",ex:"If the metrics don't improve, we'll revert to the previous config.",tr:"如果指标没有改善，我们就回退到之前的配置。"},

 {d:18,w:"frugal",pos:"adj.",p:"/ˈfruːɡl/",cn:"节俭的（褒义，≠stingy 抠门）",k:"frugal",ex:"Being frugal in your thirties is what makes compounding work.",tr:"三十几岁时的节俭，正是复利发挥作用的前提。"},

 {d:18,w:"in a nutshell",pos:"phr.",p:"/ɪn ə ˈnʌtʃel/",cn:"简而言之、一句话概括",k:"In a nutshell",ex:"In a nutshell, the agent was reporting success while doing nothing.",tr:"简而言之，那个 agent 什么都没做却在上报成功。"},
 {d:18,w:"keep an eye on something",pos:"phr.",p:"/kiːp ən aɪ ɒn/",cn:"留意盯着（被动观察）",k:"Keep an eye on",ex:"Keep an eye on the disk usage over the weekend.",tr:"周末留意一下磁盘使用率。"},
 {d:18,w:"more often than not",pos:"phr.",p:"/mɔːr ˈɒfn ðən nɒt/",cn:"多数情况下、往往",k:"More often than not",ex:"More often than not, the alert clears itself within minutes.",tr:"多数情况下，这个告警几分钟内会自行恢复。"},

 {d:19,tag:"bad",w:"rally",pos:"n. / v.",p:"/ˈræli/",cn:"多拍回合；（市场）反弹回升",k:"rally",ex:"That rally must have lasted forty shots.",tr:"那个回合肯定打了四十拍。"},
 {d:19,tag:"bad",w:"lunge",pos:"v. / n.",p:"/lʌndʒ/",cn:"跨步扑救、弓步上网",k:"lunged",ex:"He lunged forward to scoop up the net shot.",tr:"他跨步向前把网前球挑了起来。"},
 {d:19,tag:"bad",w:"deceptive",pos:"adj.",p:"/dɪˈseptɪv/",cn:"有欺骗性的（假动作）",k:"deceptive",ex:"Her forehand is deceptive — the smash and the drop look identical.",tr:"她的正手很有欺骗性，杀球和吊球的动作一模一样。"},

 {d:19,tag:"bad",w:"agility",pos:"n.",p:"/əˈdʒɪləti/",cn:"敏捷性（形容词 agile /ˈædʒaɪl/）",k:"agility",ex:"Footwork drills build agility more than raw speed does.",tr:"步法练习对敏捷性的提升比单纯练速度更明显。"},
 {d:19,tag:"bad",w:"flick",pos:"n. / v.",p:"/flɪk/",cn:"抖腕轻弹（偷发后场、挑球）",k:"flick",ex:"A flick serve works well if your opponent stands too close.",tr:"如果对手站得太靠前，偷发一个后场球很有效。"},
 {d:19,tag:"bad",w:"unforced error",pos:"phr.",p:"/ʌnˈfɔːst ˈerə/",cn:"非受迫失误（自己送的分）",k:"unforced errors",ex:"I lost that game on unforced errors, not on his attack.",tr:"那一局我是输在自己的非受迫失误，而不是他的进攻。"},

 {d:19,tag:"bad",w:"hold one's own",pos:"phr.",p:"/həʊld wʌnz əʊn/",cn:"撑得住、不落下风",k:"held my own",ex:"I held my own against a much stronger player.",tr:"面对实力强得多的对手，我也没落下风。"},
 {d:19,tag:"bad",w:"be off one's game",pos:"phr.",p:"/ɒf wʌnz ɡeɪm/",cn:"状态不佳（反义 on my game）",k:"off my game",ex:"I was completely off my game last night.",tr:"昨晚我状态完全不在。"},

 {d:20,tag:"au",w:"marsupial",pos:"n.",p:"/mɑːˈsuːpiəl/",cn:"有袋动物",k:"marsupials",ex:"Wombats are marsupials, despite looking nothing like kangaroos.",tr:"袋熊也是有袋动物，尽管长得跟袋鼠毫不相像。"},

 {d:20,tag:"au",w:"elusive",pos:"adj.",p:"/ɪˈluːsɪv/",cn:"难得一见的、难以捉摸的",k:"elusive",ex:"The platypus is famously elusive — you need patience and a quiet creek.",tr:"鸭嘴兽出了名的难得一见，需要耐心和一条安静的溪流。"},
 {d:20,tag:"au",w:"venomous",pos:"adj.",p:"/ˈvenəməs/",cn:"有毒的（咬你注毒；≠poisonous 吃了中毒）",k:"venomous",ex:"Australia has plenty of venomous snakes, but bites are rare.",tr:"澳洲有很多毒蛇，但真正被咬的情况其实很少见。"},
 {d:20,tag:"au",w:"endemic",pos:"adj.",p:"/enˈdemɪk/",cn:"某地特有的、只在此处有的",k:"endemic",ex:"The Tasmanian devil is endemic to Tasmania.",tr:"袋獾是塔斯马尼亚特有的物种。"},
 {d:20,tag:"au",w:"burrow",pos:"n. / v.",p:"/ˈbʌrəʊ/",cn:"洞穴；挖洞",k:"burrows",ex:"Wombats dig enormous burrows that can run for tens of metres.",tr:"袋熊会挖出巨大的洞穴，长度可达数十米。"},

 {d:20,tag:"au",w:"give something a wide berth",pos:"phr.",p:"/ə waɪd bɜːθ/",cn:"远远绕开、敬而远之",k:"a wide berth",ex:"If you see a snake on the track, just give it a wide berth.",tr:"如果在小路上看到蛇，远远绕开就行。"},
 {d:20,tag:"au",w:"in the middle of nowhere",pos:"phr.",p:"/ɪn ðə ˈmɪdl əv ˈnəʊweə/",cn:"荒郊野外、前不着村后不着店",k:"in the middle of nowhere",ex:"We ran low on fuel in the middle of nowhere.",tr:"我们在前不着村后不着店的地方快没油了。"},

 {d:21,tag:"au",w:"swoop",pos:"v. / n.",p:"/swuːp/",cn:"（鸟）俯冲攻击",k:"swoop",ex:"Magpies swoop cyclists during nesting season.",tr:"筑巢季节里，喜鹊会俯冲攻击骑车的人。"},
 {d:21,tag:"au",w:"feral",pos:"adj.",p:"/ˈferəl/",cn:"野化的（原本家养；≠wild 天生野生）",k:"Feral",ex:"Feral cats are a serious threat to native wildlife.",tr:"野化的家猫对本土野生动物构成严重威胁。"},
 {d:21,tag:"au",w:"placid",pos:"adj.",p:"/ˈplæsɪd/",cn:"温和平静的（性情或水面）",k:"placid",ex:"Koalas look placid, but they can be surprisingly grumpy.",tr:"考拉看着温顺，其实脾气可能出奇地差。"},
 {d:21,tag:"au",w:"sanctuary",pos:"n.",p:"/ˈsæŋktʃuəri/",cn:"野生动物保护区；庇护所",k:"sanctuary",ex:"The sanctuary rehabilitates injured wildlife before releasing them.",tr:"这家保护区会先让受伤的野生动物康复，再放归自然。"},
 {d:21,tag:"bad",w:"reflexes",pos:"n. pl.",p:"/ˈriːfleksɪz/",cn:"反应神经（单数 reflex）",k:"reflexes",ex:"Doubles at the net is all about reflexes.",tr:"双打网前拼的全是反应速度。"},
 {d:21,tag:"bad",w:"relentless",pos:"adj.",p:"/rɪˈlentləs/",cn:"不间断的、不留情面的",k:"relentless",ex:"His attack was relentless — I never got a chance to settle.",tr:"他的进攻毫不留情，我根本没机会站稳节奏。"},
 {d:21,tag:"bad",w:"get the hang of something",pos:"phr.",p:"/ɡet ðə hæŋ əv/",cn:"掌握窍门、终于上手",k:"get the hang of",ex:"It took me a season to get the hang of the backhand clear.",tr:"我花了一整个赛季才掌握反手高远球的窍门。"},
 {d:21,w:"on the fly",pos:"phr.",p:"/ɒn ðə flaɪ/",cn:"临场调整、边做边改",k:"on the fly",ex:"We changed tactics on the fly after losing the first game.",tr:"输掉第一局后，我们临场调整了战术。"},
 {d:21,tag:"au",w:"be in for something",pos:"phr.",p:"/biː ɪn fɔː/",cn:"即将面临、少不了要遇上",k:"in for",ex:"If you're driving to Cairns in February, you're in for some rain.",tr:"二月开车去凯恩斯的话，少不了要遇上雨。"},
 {d:21,tag:"bad",w:"be no match for someone",pos:"phr.",p:"/nəʊ mætʃ fɔː/",cn:"完全不是对手",k:"no match for",ex:"My smash is no match for his, so I play the long game.",tr:"我的杀球完全比不过他，所以我打拉吊消耗。"},

 {d:22,w:"fluctuate",pos:"v.",p:"/ˈflʌktʃueɪt/",cn:"波动起伏（正在上下动）",k:"fluctuates",ex:"Memory usage fluctuates between forty and eighty percent all day.",tr:"内存占用一整天都在四成到八成之间波动。"},
 {d:22,w:"obsolete",pos:"adj.",p:"/ˈɒbsəliːt/",cn:"已淘汰的、彻底没人用的",k:"obsolete",ex:"That TLS version is obsolete and will be blocked next quarter.",tr:"那个 TLS 版本已经淘汰，下季度会被直接封禁。"},
 {d:22,w:"proximity",pos:"n.",p:"/prɒkˈsɪməti/",cn:"邻近、距离上的接近",k:"proximity",ex:"We chose the hotel for its proximity to the airport.",tr:"我们选这家酒店是因为离机场近。"},
 {d:22,w:"parched",pos:"adj.",p:"/pɑːtʃt/",cn:"渴得要命；（土地）干裂的",k:"parched",ex:"After two sets I was absolutely parched.",tr:"打完两局我渴得不行。"},
 {d:22,w:"hefty",pos:"adj.",p:"/ˈhefti/",cn:"沉重的；（金额）数目可观的",k:"hefty",ex:"Changing the flight came with a hefty fee.",tr:"改签航班要付一笔不小的费用。"},
 {d:22,w:"dwindle",pos:"v.",p:"/ˈdwɪndl/",cn:"逐渐减少、慢慢缩水",k:"dwindled",ex:"Our remaining IP addresses dwindled to fewer than twenty.",tr:"我们剩余的 IP 地址逐渐减少到不足二十个。"},
 {d:22,w:"run its course",pos:"phr.",p:"/rʌn ɪts kɔːs/",cn:"自行发展完、走完过程",k:"run its course",ex:"We let the retry loop run its course rather than killing the job.",tr:"我们让重试循环自己走完，而不是直接杀掉任务。"},
 {d:22,w:"at a glance",pos:"phr.",p:"/ət ə ɡlɑːns/",cn:"一眼就能看出、一目了然",k:"at a glance",ex:"The new dashboard shows cluster health at a glance.",tr:"新面板可以让你一眼看出集群健康状况。"},
 {d:22,w:"bank on something",pos:"phr. v.",p:"/bæŋk ɒn/",cn:"指望、把把握押在某事上",k:"bank on",ex:"Don't bank on the vendor patch arriving before Friday.",tr:"别指望厂商的补丁能在周五前到。"},
 {d:22,w:"in the long run",pos:"phr.",p:"/ɪn ðə lɒŋ rʌn/",cn:"从长远来看",k:"in the long run",ex:"Index funds win in the long run, even if they feel boring now.",tr:"从长远来看指数基金会赢，即便现在觉得无聊。"},

 {d:23,w:"deteriorate",pos:"v.",p:"/dɪˈtɪəriəreɪt/",cn:"恶化、每况愈下（五个音节）",k:"deteriorated",ex:"Network latency deteriorated steadily over the weekend.",tr:"整个周末网络延迟持续恶化。"},
 {d:23,w:"viable",pos:"adj.",p:"/ˈvaɪəbl/",cn:"可行的、实际能落地的",k:"viable",ex:"Rolling back is the only viable option at this point.",tr:"到这一步，回滚是唯一可行的方案。"},
 {d:23,w:"threshold",pos:"n.",p:"/ˈθreʃhəʊld/",cn:"阈值、临界点；门槛",k:"threshold",ex:"The alert fires once CPU crosses the eighty percent threshold.",tr:"CPU 超过 80% 阈值后就会触发告警。"},
 {d:23,w:"brittle",pos:"adj.",p:"/ˈbrɪtl/",cn:"脆的、一碰就崩的（系统或材料）",k:"brittle",ex:"The deployment script is brittle — any change to the path breaks it.",tr:"这个部署脚本很脆，路径一改就崩。"},
 {d:23,w:"humid",pos:"adj.",p:"/ˈhjuːmɪd/",cn:"潮湿闷热的",k:"humid",ex:"Cairns gets seriously humid in the wet season.",tr:"雨季的凯恩斯会闷热得厉害。"},
 {d:23,w:"sparse",pos:"adj.",p:"/spɑːs/",cn:"稀疏的、稀少的",k:"sparse",ex:"Traffic gets sparse once you're past the last town.",tr:"过了最后一个镇子，路上车就很少了。"},
 {d:23,w:"pull it off",pos:"phr.",p:"/pʊl ɪt ɒf/",cn:"（有难度地）成功做成",k:"pulled it off",ex:"Finishing the migration in one window was ambitious, but we pulled it off.",tr:"一个窗口内完成迁移挺激进的，但我们做成了。"},
 {d:23,w:"the bottom line",pos:"phr.",p:"/ðə ˈbɒtəm laɪn/",cn:"关键结论、说到底",k:"The bottom line",ex:"The bottom line is that we need a second maintenance window.",tr:"结论是，我们还需要第二个维护窗口。"},
 {d:23,w:"down the line",pos:"phr.",p:"/daʊn ðə laɪn/",cn:"以后、将来某个时候",k:"down the line",ex:"We can revisit the architecture further down the line.",tr:"架构的事我们可以以后再回过头来看。"},
 {d:23,w:"from scratch",pos:"phr.",p:"/frəm skrætʃ/",cn:"从零开始、从头做起",k:"from scratch",ex:"It was faster to rebuild the node from scratch than to debug it.",tr:"把节点从零重建比慢慢排查更快。"},

 {d:24,w:"concede",pos:"v.",p:"/kənˈsiːd/",cn:"承认（对方对）；让掉一局",k:"concede",ex:"I'll concede that the vendor's explanation makes sense.",tr:"我承认厂商的解释是说得通的。"},
 {d:24,w:"stipulate",pos:"v.",p:"/ˈstɪpjuleɪt/",cn:"（合同或规定）明确规定",k:"stipulates",ex:"The SLA stipulates a four-hour response time for P1 incidents.",tr:"服务协议明确规定 P1 故障需在四小时内响应。"},
 {d:24,w:"incremental",pos:"adj.",p:"/ˌɪŋkrəˈmentl/",cn:"逐步递增的、小步推进的",k:"incremental",ex:"We took an incremental approach rather than a big-bang cutover.",tr:"我们采取逐步推进的方式，而不是一次性切换。"},
 {d:24,w:"pristine",pos:"adj.",p:"/ˈprɪstiːn/",cn:"原始未受破坏的；崭新如初的",k:"pristine",ex:"Tasmania still has genuinely pristine wilderness.",tr:"塔斯马尼亚仍保有真正原始未被破坏的荒野。"},
 {d:24,w:"cramped",pos:"adj.",p:"/kræmpt/",cn:"狭窄局促的（≠cramp 抽筋）",k:"cramped",ex:"The economy seats were cramped on the twelve-hour leg.",tr:"十二小时那一程的经济舱座位非常局促。"},
 {d:24,w:"brew",pos:"v. / n.",p:"/bruː/",cn:"冲煮；（麻烦）正在酝酿",k:"brew",ex:"Let it brew for four minutes before you press down.",tr:"按下压杆前先让它浸泡四分钟。"},
 {d:24,w:"err on the side of caution",pos:"phr.",p:"/ɜːr ɒn ðə saɪd/",cn:"宁可谨慎一点、保守起见",k:"err on the side of caution",ex:"Let's err on the side of caution and schedule a rollback window.",tr:"保守起见，我们还是预留一个回滚窗口吧。"},
 {d:24,w:"a rough idea",pos:"phr.",p:"/ə rʌf aɪˈdɪə/",cn:"大致的概念、粗略了解",k:"a rough idea",ex:"Can you give me a rough idea of the blast radius?",tr:"能大致说一下影响范围有多大吗？"},
 {d:24,w:"stand to reason",pos:"phr.",p:"/stænd tə ˈriːzn/",cn:"合乎情理、想想也知道",k:"stands to reason",ex:"It stands to reason that a bigger node pool would ease the pressure.",tr:"想想也知道，节点池更大一些自然能缓解压力。"},
 {d:24,w:"off the hook",pos:"phr.",p:"/ɒf ðə hʊk/",cn:"脱身、不用担责了",k:"off the hook",ex:"The vendor confirmed it was their bug, so we're off the hook.",tr:"厂商确认是他们的 bug，所以我们脱责了。"},

 {d:25,w:"anomaly",pos:"n.",p:"/əˈnɒməli/",cn:"异常现象、反常数据点",k:"anomaly",ex:"The spike looked like an anomaly until it happened again on Thursday.",tr:"那个尖峰本来像是个异常点，直到周四又出现了一次。"},
 {d:25,w:"supersede",pos:"v.",p:"/ˌsuːpəˈsiːd/",cn:"取代、替代（拼 -sede 不是 -cede）",k:"supersedes",ex:"This runbook supersedes the version from last March.",tr:"本操作手册取代去年三月的版本。"},
 {d:25,w:"rigorous",pos:"adj.",p:"/ˈrɪɡərəs/",cn:"严格缜密的（测试或流程）",k:"rigorous",ex:"The change passed a rigorous review before it reached production.",tr:"该变更在进入生产前通过了严格的评审。"},
 {d:25,w:"hollow",pos:"adj.",p:"/ˈhɒləʊ/",cn:"空洞的、中空的；（声音）发闷的",k:"hollow",ex:"The brakes made a hollow sound, which turned out to be worn pads.",tr:"刹车发出一种发闷的声音，后来发现是刹车片磨损了。"},
 {d:25,w:"sprawling",pos:"adj.",p:"/ˈsprɔːlɪŋ/",cn:"蔓延扩张的、摊得很开的",k:"sprawling",ex:"Melbourne is sprawling, so plan for longer drives than you expect.",tr:"墨尔本摊得很开，行程上要多留些车程时间。"},
 {d:25,w:"nagging",pos:"adj.",p:"/ˈnæɡɪŋ/",cn:"挥之不去的、隐隐作痛的",k:"nagging",ex:"I had a nagging feeling we'd missed something in the checklist.",tr:"我一直有种挥之不去的感觉，checklist 上漏了什么。"},
 {d:25,w:"cover for someone",pos:"phr. v.",p:"/ˈkʌvə fɔː/",cn:"替某人顶班、代为处理",k:"cover for me",ex:"Could you cover for me on Friday? I'll take your Monday shift.",tr:"周五能帮我顶个班吗？你周一的班我来上。"},
 {d:25,w:"be swept under the rug",pos:"phr.",p:"/swept ˈʌndə ðə rʌɡ/",cn:"被掩盖过去、压下不提",k:"swept under the rug",ex:"This near-miss shouldn't be swept under the rug.",tr:"这次险些出事的情况不该被掩盖过去。"},
 {d:25,w:"have a lot on one's plate",pos:"phr.",p:"/ə lɒt ɒn wʌnz pleɪt/",cn:"手头事情一大堆",k:"a lot on your plate",ex:"I know you've got a lot on your plate, so no rush.",tr:"我知道你手头事情一大堆，所以不急。"},
 {d:25,w:"split the difference",pos:"phr.",p:"/splɪt ðə ˈdɪfrəns/",cn:"各让一步、折中处理",k:"split the difference",ex:"They wanted Monday, we wanted Friday, so we split the difference.",tr:"他们想周一，我们想周五，最后折中了一下。"},

 {d:26,w:"warrant",pos:"v.",p:"/ˈwɒrənt/",cn:"值得、有必要（做某事）",k:"warrant",ex:"A single failed check doesn't warrant waking up the on-call engineer.",tr:"单次检查失败还不至于把值班工程师叫醒。"},
 {d:26,w:"nuance",pos:"n.",p:"/ˈnjuːɑːns/",cn:"细微差别、微妙之处（nuanced 的名词）",k:"nuance",ex:"There's a nuance here: the agent reports success even when it skips hosts.",tr:"这里有个微妙之处：即使跳过了主机，agent 也会上报成功。"},
 {d:26,w:"impede",pos:"v.",p:"/ɪmˈpiːd/",cn:"阻碍、妨碍（拖慢而非挡死）",k:"impeding",ex:"The approval backlog is impeding the whole migration schedule.",tr:"审批积压正在拖慢整个迁移计划。"},
 {d:26,w:"candid",pos:"adj.",p:"/ˈkændɪd/",cn:"坦率直言的（不回避问题）",k:"candid",ex:"I'd rather have a candid postmortem than a polished one.",tr:"我宁愿要一份坦率的复盘，而不是一份漂亮的。"},
 {d:26,w:"lush",pos:"adj.",p:"/lʌʃ/",cn:"草木茂盛葱郁的",k:"lush",ex:"The rainforest around Cairns is unbelievably lush.",tr:"凯恩斯周边的雨林葱郁得令人难以置信。"},
 {d:26,w:"brisk",pos:"adj.",p:"/brɪsk/",cn:"（生意）红火的（第三义项）",k:"brisk",ex:"The café does a brisk trade before nine every morning.",tr:"那家咖啡馆每天九点前生意都很红火。"},
 {d:26,w:"get to the bottom of something",pos:"phr.",p:"/ðə ˈbɒtəm əv/",cn:"查清根源、弄个水落石出",k:"got to the bottom of",ex:"We still haven't got to the bottom of the intermittent timeouts.",tr:"间歇性超时的根源我们还没查清楚。"},
 {d:26,w:"hit a snag",pos:"phr.",p:"/hɪt ə snæɡ/",cn:"遇到意外阻碍、卡住了",k:"hit a snag",ex:"We hit a snag halfway through the cutover.",tr:"切换进行到一半时我们遇到了意外阻碍。"},
 {d:26,w:"on the same wavelength",pos:"phr.",p:"/seɪm ˈweɪvleŋθ/",cn:"想法合拍、很默契（≠on the same page）",k:"on the same wavelength",ex:"My doubles partner and I are on the same wavelength at the net.",tr:"我和双打搭档在网前特别默契。"},
 {d:26,w:"put something to bed",pos:"phr.",p:"/pʊt tə bed/",cn:"彻底了结、收尾归档",k:"to bed",ex:"Let's put this ticket to bed before the end of the sprint.",tr:"我们在这个 sprint 结束前把这个工单彻底了结。"},

 {d:27,w:"prone",pos:"adj.",p:"/prəʊn/",cn:"易于出问题的（prone to）",k:"prone",ex:"Manual patching is prone to human error, especially at 3 a.m.",tr:"手工打补丁容易出人为失误，尤其是凌晨三点。"},
 {d:27,w:"segregate",pos:"v.",p:"/ˈseɡrɪɡeɪt/",cn:"隔离分开（网络或环境）",k:"segregate",ex:"We segregate production traffic onto a dedicated subnet.",tr:"我们把生产流量隔离到一个专用子网上。"},
 {d:27,w:"salvage",pos:"v. / n.",p:"/ˈsælvɪdʒ/",cn:"抢救出来、挽回（部分）",k:"salvage",ex:"We managed to salvage the data from the corrupted volume.",tr:"我们设法从损坏的卷里抢救出了数据。"},
 {d:27,w:"meticulous",pos:"adj.",p:"/məˈtɪkjələs/",cn:"一丝不苟的、极其细致的",k:"meticulous",ex:"His handover notes are meticulous — nothing gets missed.",tr:"他的交接记录一丝不苟，什么都不会漏。"},
 {d:27,w:"torrential",pos:"adj.",p:"/təˈrenʃl/",cn:"（雨）倾盆如注的",k:"Torrential",ex:"Torrential rain closed the coastal road for two days.",tr:"倾盆大雨让沿海公路封闭了两天。"},
 {d:27,w:"knackered",pos:"adj.",p:"/ˈnækəd/",cn:"（零件）磨坏报废了（第二义项）",k:"knackered",ex:"The rear bushings were completely knackered after the track days.",tr:"跑完那几个赛道日，后桥衬套彻底报废了。"},
 {d:27,w:"take a step back",pos:"phr.",p:"/teɪk ə step bæk/",cn:"退一步想、跳出来看全局",k:"take a step back",ex:"Let's take a step back — are we even solving the right problem?",tr:"我们退一步想想，我们解决的到底是不是对的问题？"},
 {d:27,w:"par for the course",pos:"phr.",p:"/pɑː fɔː ðə kɔːs/",cn:"意料之中、习以为常了",k:"par for the course",ex:"Vendor delays are par for the course with this product.",tr:"这个产品的厂商延期已经是家常便饭了。"},
 {d:27,w:"throw someone under the bus",pos:"phr.",p:"/ˈʌndə ðə bʌs/",cn:"甩锅给某人、出卖队友",k:"thrown under the bus",ex:"A blameless postmortem means nobody gets thrown under the bus.",tr:"无责复盘意味着没有人会被甩锅。"},
 {d:27,w:"a can of worms",pos:"phr.",p:"/ə kæn əv wɜːmz/",cn:"一堆麻烦事、打开就收不住",k:"a real can of worms",ex:"Refactoring that module would open a real can of worms.",tr:"重构那个模块会捅出一大堆麻烦。"},

 {d:28,w:"scrutinise",pos:"v.",p:"/ˈskruːtənaɪz/",cn:"细看审查（美式拼 scrutinize）",k:"scrutinised",ex:"We scrutinised every line of the diff before approving it.",tr:"批准之前，我们逐行审查了那份 diff。"},
 {d:28,w:"mundane",pos:"adj.",p:"/mʌnˈdeɪn/",cn:"平凡琐碎的、普通不起眼的",k:"mundane",ex:"The root cause turned out to be something mundane — a full disk.",tr:"根因原来是件很平常的事——磁盘满了。"},
 {d:28,w:"curb",pos:"v. / n.",p:"/kɜːb/",cn:"抑制、控制住（增长或成本）",k:"curb",ex:"We added quotas to curb runaway storage costs.",tr:"我们加了配额来控制失控的存储成本。"},
 {d:28,w:"staple",pos:"n. / adj.",p:"/ˈsteɪpl/",cn:"主食、常备必需品；订书钉",k:"staple",ex:"Flat whites are a staple of Melbourne café culture.",tr:"Flat white 是墨尔本咖啡馆文化里的标配。"},
 {d:28,w:"vantage point",pos:"n.",p:"/ˈvɑːntɪdʒ pɔɪnt/",cn:"观景位置；看问题的角度",k:"vantage point",ex:"The lookout gives you the best vantage point over the whole valley.",tr:"那个观景台是俯瞰整个山谷的最佳位置。"},
 {d:28,w:"feeble",pos:"adj.",p:"/ˈfiːbl/",cn:"微弱无力的；（借口）站不住脚的",k:"feeble",ex:"Mobile coverage gets feeble once you leave the highway.",tr:"一离开高速，手机信号就变得很弱。"},
 {d:28,w:"touch wood",pos:"phr.",p:"/tʌtʃ wʊd/",cn:"但愿别出事（美式 knock on wood）",k:"touch wood",ex:"No incidents this week — touch wood.",tr:"这周没出故障——但愿别乌鸦嘴。"},
 {d:28,w:"be none the wiser",pos:"phr.",p:"/nʌn ðə ˈwaɪzə/",cn:"完全没察觉、不明就里",k:"none the wiser",ex:"We failed over at 2 a.m. and the users were none the wiser.",tr:"我们凌晨两点做了切换，用户完全没察觉。"},
 {d:28,w:"ring a bell",pos:"phr.",p:"/rɪŋ ə bel/",cn:"听着耳熟、有点印象",k:"rings a bell",ex:"That error code rings a bell — I think we saw it last March.",tr:"那个错误码听着耳熟，我记得去年三月见过。"},

  {"d": 34, "date": "2026-10-09", "w": "make a day of it", "pos": "phr.", "p": "/meɪk ə deɪ əv ɪt/", "cn": "顺便安排一整天的活动；玩上一整天", "usage": "把原本的一项活动扩展成一整天的出游，通常带轻松愉快的意味。", "ex": "If we're driving out to the winery, we might as well make a day of it and explore the nearby village.", "tr": "既然要开车去酒庄，不如安排一整天，顺便逛逛附近的小镇。", "k": "make a day of it"}
];

const latestDay = Math.max(...DATA.map(x => x.d));
function updateSummary(){
  const title = "单词合集 · Day 1–" + latestDay;
  document.title = title;
  document.querySelector("h1").textContent = title;
  document.getElementById("summary").textContent = "Day 1–" + latestDay + " · " + DATA.length + " 项｜先看中文和挖空例句，再翻开答案；支持朗读、口音切换与错题复习。";
  const scope = document.getElementById("scope");
  const labels = {
    "0": "全部 " + DATA.length + " 项",
    "p": "只练短语（" + DATA.filter(isPhrase).length + "）",
    "v": "只练单词（" + DATA.filter(x => !isPhrase(x)).length + "）",
    "b": "羽毛球专题（" + DATA.filter(x => x.tag === "bad").length + "）",
    "z": "澳洲专题（" + DATA.filter(x => x.tag === "au").length + "）",
    "r": "最近四天（Day " + Math.max(1, latestDay - 3) + "–" + latestDay + "）"
  };
  for (const option of [...scope.options]) {
    if (/^\d+$/.test(option.value) && option.value !== "0") option.remove();
    else if (labels[option.value]) option.textContent = labels[option.value];
  }
  for (const day of [...new Set(DATA.map(x => x.d))].sort((a,b) => a-b)) {
    scope.add(new Option("Day " + day, String(day)));
  }
}

let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
function say(text){
  if (!window.speechSynthesis) {alert("此浏览器不支持语音朗读，请尝试 Safari 或 Chrome。");return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const lang = document.getElementById("accentSelect").value;
  u.lang = lang;
  const available = voices.filter(v => v.lang && v.lang.replace("_","-").toLowerCase() === lang.toLowerCase());
  if(available.length) u.voice = available.find(v => /premium|enhanced|natural/i.test(v.name)) || available[0];
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function isPhrase(x){ return x.pos.indexOf("phr") === 0; }
function makeCloze(item){
  const len = isPhrase(item) ? Math.max(6, Math.min(16, item.k.length)) : 6;
  return item.ex.replace(new RegExp(esc(item.k), "i"), '<span class="blank">' + "_".repeat(len) + '</span>');
}

let queue = [], idx = 0, missed = [];
function pool(){
  const v = document.getElementById("scope").value;
  if (v === "0") return DATA.slice();
  if (v === "p") return DATA.filter(isPhrase);
  if (v === "v") return DATA.filter(x => !isPhrase(x));
  if (v === "b") return DATA.filter(x => x.tag === "bad");
  if (v === "z") return DATA.filter(x => x.tag === "au");
  if (v === "r") return DATA.filter(x => x.d >= Math.max(1, latestDay - 3));
  if (v === "m") return DATA.filter(x => x.d >= 8 && x.d <= 28);
  if (v === "e") return DATA.filter(x => x.d <= 7);
  return DATA.filter(x => x.d === parseInt(v, 10));
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function start(list){
  queue = shuffle(list.slice()); idx = 0; missed = [];
  document.getElementById("done").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  render();
}
function render(){
  if (idx >= queue.length) return finish();
  const it = queue[idx];
  document.getElementById("pcn").textContent = it.cn;
  const pp = document.getElementById("ppos");
  pp.textContent = it.pos;
  pp.className = isPhrase(it) ? "prompt-pos p" : "prompt-pos";
  document.getElementById("pday").textContent = "Day " + it.d;
  document.getElementById("cloze").innerHTML = makeCloze(it);
  const ct = document.getElementById("clozetr");
  ct.textContent = it.tr;
  ct.className = isPhrase(it) ? "clozetr show" : "clozetr";
  document.getElementById("aw").textContent = it.w;
  document.getElementById("aipa").textContent = it.p;
  document.getElementById("aen").textContent = it.ex;
   document.getElementById("usage").textContent = it.usage ? "💡 用法："+it.usage : "";
  document.getElementById("atr").textContent = it.tr;
  document.getElementById("ans").classList.remove("show");
  document.getElementById("rowReveal").style.display = "flex";
  document.getElementById("rowJudge").style.display = "none";
  document.getElementById("prog").textContent = (idx+1) + " / " + queue.length;
  document.getElementById("fill").style.width = (idx / queue.length * 100) + "%";
}
function finish(){
  document.getElementById("quiz").style.display = "none";
  document.getElementById("done").style.display = "block";
  document.getElementById("fill").style.width = "100%";
  document.getElementById("prog").textContent = "完成";
  const total = queue.length, ok = total - missed.length;
  document.getElementById("doneTitle").textContent = "本轮完成：记得 " + ok + " / " + total;
  const ml = document.getElementById("missList");
  ml.innerHTML = "";
  if (missed.length) {
    document.getElementById("doneSub").textContent = "以下这些还需要再过一遍：";
    missed.forEach(it => {
      const d = document.createElement("div");
      d.className = "miss";
      d.innerHTML = "<b>" + it.w + "</b><span>Day " + it.d + " · " + it.cn + "</span>";
      ml.appendChild(d);
    });
    document.getElementById("again").style.display = "block";
  } else {
    document.getElementById("doneSub").textContent = "全部记住了，这轮很干净 👏";
    document.getElementById("again").style.display = "none";
  }
}
document.getElementById("reveal").addEventListener("click", () => {
  document.getElementById("ans").classList.add("show");
  document.getElementById("rowReveal").style.display = "none";
  document.getElementById("rowJudge").style.display = "flex";
  say(queue[idx].w.replace(/^a /,"").replace(/^be /,"").replace(/ something/g," it").replace(/someone/g,"somebody").replace(/-/g," "));
});
document.getElementById("btnOk").addEventListener("click", () => { idx++; render(); });
document.getElementById("btnNo").addEventListener("click", () => { missed.push(queue[idx]); idx++; render(); });
document.getElementById("btnWord").addEventListener("click", () => say(queue[idx].w));
 document.getElementById("btnSay").addEventListener("click", () => say(queue[idx].ex));
document.getElementById("again").addEventListener("click", () => start(missed));
document.getElementById("restart").addEventListener("click", () => start(pool()));
document.getElementById("scope").addEventListener("change", () => start(pool()));
updateSummary();
start(pool());
</script>
</body>
</html>
