  .daytag { font-size: 12px; color: var(--muted); }

  .clozetr { font-size: 13px; color: var(--muted); margin: 6px 0 0; line-height: 1.6; display: none; }

  .answer.show { display: block; }
  .aw { font-size: 21px; font-weight: 700; }
  .ipa { font-size: 13px; color: var(--muted); font-family: ui-monospace, monospace; margin-left: 8px; }
  .usage {font-size:13px;line-height:1.65;color:var(--sub);margin:12px 0 0;}
  .en { font-size: 15px; font-style: italic; margin: 12px 0 0; line-height: 1.6; }
  .tr { font-size: 13px; color: var(--muted); margin: 3px 0 0; line-height: 1.6; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
  button {
    font-size: 15px; padding: 11px 16px; border: none; border-radius: 10px;

  button:active { background: var(--btn-active); }
  button.primary { background: var(--accent); color: #fff; flex: 1; font-weight: 600; }
  button.ok { background: var(--ok-bg); color: var(--ok); flex: 1; font-weight: 600; }
  button.no { background: var(--no-bg); color: var(--no); flex: 1; font-weight: 600; }
  button.say { width: 44px; padding: 11px 0; font-size: 17px; }
  #done { display: none; }
  #done h2 { font-size: 18px; margin: 0 0 8px; }
  .miss { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .miss span { color: var(--muted); font-size: 13px; margin-left: 8px; }
</style>

<script>
const DATA = [
 {d:1,w:"triage",pos:"v. / n.",p:"/ˈtriːɑːʒ/",cn:"分诊；按优先级处理",k:"triage",ex:"We need to triage the P2 alerts before the change window opens.",tr:"我们得在变更窗口开始前，先把 P2 告警按优先级处理掉。",usage:"常说 triage alerts / tickets，先判断紧急程度再分配处理顺序；医疗之外也常用于运维和客服。"},
 {d:1,w:"discrepancy",pos:"n.",p:"/dɪˈskrepənsi/",cn:"不一致、出入",k:"discrepancy",ex:"There's a discrepancy between the BigFix logs and the CloudWatch metrics.",tr:"BigFix 日志和 CloudWatch 监控数据之间存在不一致。",usage:"用 a discrepancy between A and B 表示两份记录有出入；具体多处差异可用复数 discrepancies。"},
 {d:1,w:"expedite",pos:"v.",p:"/ˈekspədaɪt/",cn:"加快（进度）",k:"expedite",ex:"Could you help expedite the approval for this RFC?",tr:"能帮忙加快一下这个 RFC 的审批吗？",usage:"直接接审批、请求或流程：expedite approval / a request；工作语境较正式，口语可说 speed up。"},
 {d:1,w:"intermittent",pos:"adj.",p:"/ˌɪntəˈmɪtənt/",cn:"间歇性的（反复出现）",k:"intermittent",ex:"Users are reporting intermittent connection timeouts to the RDS instance.",tr:"用户反馈连接 RDS 实例时出现间歇性超时。",usage:"常搭配 intermittent failures / connection problems，强调时断时续；持续存在的问题用 persistent。"},
 {d:1,w:"contingency",pos:"n.",p:"/kənˈtɪndʒənsi/",cn:"应急方案",k:"contingency",ex:"Keep some cash as a contingency in case the market dips further.",tr:"留一些现金以备不时之需，万一市场继续下跌。",usage:"常见 contingency plan（应急方案）、contingency fund（备用金）；for contingencies 表示为意外情况做准备。"},
 {d:1,w:"composure",pos:"n.",p:"/kəmˈpəʊʒə/",cn:"沉着、稳定性",k:"composure",ex:"Even over mid-corner bumps, the BRZ maintains its composure.",tr:"即使弯中遇到颠簸，BRZ 依然保持稳定沉着。",usage:"keep / lose your composure 指保持镇定／乱了阵脚；车评中借用来描述底盘遇到颠簸仍然稳定。"},
 {d:1,w:"secluded",pos:"adj.",p:"/sɪˈkluːdɪd/",cn:"僻静的、隐蔽的",k:"secluded",ex:"We found a secluded beach an hour's drive from Brisbane.",tr:"我们在离布里斯班车程一小时的地方找到了一片僻静的海滩。",usage:"常修饰 beach、cabin、spot，强调远离人群、隐蔽安静；不一定表示交通不便或荒无人烟。"},
 {d:1,w:"nuanced",pos:"adj.",p:"/ˈnjuːɑːnst/",cn:"有层次的、细腻的",k:"nuanced",ex:"This washed Ethiopian has a nuanced acidity, citrus up front and floral at the finish.",tr:"这支水洗埃塞的酸质很有层次，入口是柑橘调，尾段带花香。",usage:"a nuanced view / explanation 指考虑到细微差别的观点或解释；描述风味时表示有层次，不能简单概括。"},
 {d:1,w:"frothy",pos:"adj.",p:"/ˈfrɒθi/",cn:"起泡沫的；（估值）虚高的",k:"frothy",ex:"Nasdaq valuations are looking a bit frothy.",tr:"纳斯达克的估值看起来有点虚高了。",usage:"frothy milk 是泡沫丰富的牛奶；市场评论中的 frothy valuations 比喻估值可能含有过多炒作成分。"},
 {d:1,w:"rip-off",pos:"n.",p:"/ˈrɪpɒf/",cn:"宰客、坑钱",k:"rip-off",ex:"Forty dollars for airport parking? What a rip-off.",tr:"机场停车要 40 刀？太宰人了。",usage:"口语常说 That's a rip-off! 抱怨价格不合理；动词用 rip someone off，表示宰客或骗钱。"},

 {d:2,w:"remediate",pos:"v.",p:"/rɪˈmiːdieɪt/",cn:"修复、整改",k:"remediate",ex:"After the RCA, we scheduled a change to remediate the misconfigured security group.",tr:"复盘之后，我们安排了一次变更来修复配置错误的安全组。",usage:"常见于技术、安全和整改报告：remediate vulnerabilities / issues；日常聊天说 fix 更自然。"},
 {d:2,w:"culprit",pos:"n.",p:"/ˈkʌlprɪt/",cn:"罪魁祸首、（问题的）根源",k:"culprit",ex:"The stale IAM principal ID turned out to be the culprit behind the access denials.",tr:"最后发现，那个失效的 IAM principal ID 才是拒绝访问的罪魁祸首。",usage:"The culprit is ... 可自然地指出故障根源，不一定真指犯罪者；常用 turn out to be the culprit。"},
 {d:2,w:"bottleneck",pos:"n.",p:"/ˈbɒtlnek/",cn:"瓶颈、制约点",k:"bottleneck",ex:"IP exhaustion in the VPC CNI became the main bottleneck for scaling the EKS cluster.",tr:"VPC CNI 的 IP 耗尽成了 EKS 集群扩容的主要瓶颈。",usage:"常说 identify / remove a bottleneck，表示找出／消除限制整体速度的环节，也可指道路堵点。"},
 {d:2,w:"tactile",pos:"adj.",p:"/ˈtæktaɪl/",cn:"有触感的、手感反馈好的",k:"tactile",ex:"The BRZ's steering is wonderfully tactile, you feel exactly what the front tyres are doing.",tr:"BRZ 的转向手感极好，前轮的每一个动作你都能清晰感受到。",usage:"常搭配 tactile feedback，描述能通过手感感知的反馈；车评中常指转向让你感觉到轮胎状态。"},
 {d:2,w:"progressive",pos:"adj.",p:"/prəˈɡresɪv/",cn:"渐进的、线性增强的",k:"progressive",ex:"The brake pedal has a progressive feel, which makes threshold braking easier on track.",tr:"刹车踏板的脚感是渐进式的，赛道上做临界制动更容易掌握。",usage:"这里指制动力随踩踏逐渐增加；progressive braking 强调渐进，其他语境也可指思想进步。"},
 {d:2,w:"velvety",pos:"adj.",p:"/ˈvelvəti/",cn:"丝滑的、如天鹅绒般顺滑的",k:"velvety",ex:"Properly steamed milk should feel velvety, not stiff and bubbly.",tr:"打得好的奶泡应该是丝滑的，而不是又硬又多气泡。",usage:"velvety texture / smoothness 常用于奶泡、巧克力或酱汁，强调柔滑质地，而不只是味道好。"},
 {d:2,w:"robust",pos:"adj.",p:"/rəʊˈbʌst/",cn:"浓郁醇厚的；稳健的",k:"robust",ex:"This Sumatra has a robust, earthy body that stands up well to milk.",tr:"这支苏门答腊酒体浓郁、带泥土气息，加奶也压不住。",usage:"robust flavour 指浓厚有力的风味；robust system / plan 指稳健可靠、经得起考验。"},
 {d:2,w:"resilient",pos:"adj.",p:"/rɪˈzɪliənt/",cn:"有韧性的、抗跌的",k:"resilient",ex:"Despite the sell-off, the Nasdaq has been surprisingly resilient this quarter.",tr:"尽管出现了抛售，纳斯达克本季度的抗跌表现出人意料。",usage:"be resilient to shocks 指能承受冲击并恢复；形容人时侧重挫折后的恢复能力。"},
 {d:2,w:"detour",pos:"n. / v.",p:"/ˈdiːtʊə/",cn:"绕道、绕行路线",k:"detour",ex:"We took a scenic detour through the Yarra Valley on the way to Melbourne.",tr:"去墨尔本的路上，我们绕道穿过了风景优美的雅拉河谷。",usage:"take / make a detour 是绕道；a detour via / through 某地说明经过哪里，不一定是被迫改道。"},
 {d:2,w:"hospitable",pos:"adj.",p:"/hɒˈspɪtəbl/",cn:"好客的、热情周到的",k:"hospitable",ex:"The locals in Brisbane were incredibly hospitable and gave us great tips.",tr:"布里斯班的当地人非常热情好客，给了我们很多好建议。",usage:"常形容人或接待：hospitable hosts / locals；a hospitable environment 则指适合生存或发展的环境。"},

 {d:3,w:"provision",pos:"v.",p:"/prəˈvɪʒn/",cn:"配置、开通（资源）",k:"provision",ex:"The Terraform pipeline can provision a new AWS China account in under an hour.",tr:"这条 Terraform 流水线能在一小时内开通一个新的 AWS 中国区账号。",usage:"动词常搭配 provision resources / servers，指配置并准备好资源；名词 provisions 也可指物资或条款。"},
 {d:3,w:"throttle",pos:"v. / n.",p:"/ˈθrɒtl/",cn:"限流、节流；油门",k:"throttling",ex:"The API started throttling our requests once we exceeded the rate limit.",tr:"一旦超过速率上限，API 就开始对我们的请求限流。",usage:"throttle requests 指限制请求速率，过程叫 throttling；车上的 the throttle 是油门，语境决定意思。"},
 {d:3,w:"streamline",pos:"v.",p:"/ˈstriːmlaɪn/",cn:"精简、简化（流程）",k:"streamlined",ex:"We streamlined the patching workflow to cut the change window in half.",tr:"我们精简了打补丁的流程，把变更窗口缩短了一半。",usage:"streamline a process / workflow 强调删掉多余步骤、提高效率，通常不表示简单缩短文字。"},
 {d:3,w:"nimble",pos:"adj.",p:"/ˈnɪmbl/",cn:"灵活敏捷的",k:"nimble",ex:"The BRZ feels remarkably nimble through a tight chicane.",tr:"BRZ 在狭窄的连续弯里显得格外灵活敏捷。",usage:"nimble handling 指车身灵活；形容人可指动作敏捷，形容团队可指快速适应变化。"},
 {d:3,w:"poised",pos:"adj.",p:"/pɔɪzd/",cn:"沉稳从容的；蓄势待发的",k:"poised",ex:"The chassis stays poised even when you trail-brake into the apex.",tr:"即便你拖刹进弯心，底盘依然保持沉稳。",usage:"这里形容底盘从容稳定；be poised to do something 是准备就绪、即将做某事，两种结构要分清。"},
 {d:3,w:"aromatic",pos:"adj.",p:"/ˌærəˈmætɪk/",cn:"芳香馥郁的",k:"aromatic",ex:"Freshly ground beans fill the kitchen with an aromatic scent.",tr:"刚磨好的咖啡豆让厨房充满馥郁的香气。",usage:"常搭配 aromatic coffee / herbs，侧重散发明显的香气；形容不好闻的味道一般不用它。"},
 {d:3,w:"lingering",pos:"adj.",p:"/ˈlɪŋɡərɪŋ/",cn:"余韵悠长的、久久不散的",k:"lingering",ex:"This natural Ethiopian leaves a lingering, wine-like finish.",tr:"这支日晒埃塞留下一段悠长的、类似红酒的余韵。",usage:"a lingering finish 是久久不散的余味；lingering doubts / pain 则指挥之不去的疑虑或疼痛。"},
 {d:3,w:"volatile",pos:"adj.",p:"/ˈvɒlətaɪl/",cn:"波动剧烈的、易变的",k:"volatile",ex:"Tech stocks have been especially volatile ahead of the earnings season.",tr:"财报季前科技股的波动一直特别剧烈。",usage:"volatile markets / prices 指变化剧烈且难预测；形容人的性情时可指情绪不稳定、容易激动。"},
 {d:3,w:"diversify",pos:"v.",p:"/daɪˈvɜːsɪfaɪ/",cn:"分散（投资）、多元化",k:"diversify",ex:"Spreading money across index funds helps diversify your risk.",tr:"把资金分散到多只指数基金有助于分散风险。",usage:"diversify a portfolio 指让投资组合多样化；diversify into 某领域表示拓展到新的业务方向。"},
 {d:3,w:"bustling",pos:"adj.",p:"/ˈbʌslɪŋ/",cn:"熙攘热闹的",k:"bustling",ex:"Melbourne's laneways are bustling with cafés and street art.",tr:"墨尔本的小巷里满是咖啡馆和街头艺术，热闹非凡。",usage:"a bustling city / market 描述人来人往的热闹；bustling with people 是常见结构，通常带有活力感。"},

 {d:4,w:"cumbersome",pos:"adj.",p:"/ˈkʌmbəsəm/",cn:"繁琐笨重的、不好用的",k:"cumbersome",ex:"The current approval process is far too cumbersome for emergency changes.",tr:"目前的审批流程对紧急变更来说实在太繁琐了。",usage:"a cumbersome process 强调操作繁琐；a cumbersome suitcase 则指体积笨重、不便搬动。"},
 {d:4,w:"reconcile",pos:"v.",p:"/ˈrekənsaɪl/",cn:"核对、使一致（对账）",k:"reconcile",ex:"I had to reconcile the patch report with what the agent actually logged.",tr:"我得把补丁报告和 agent 实际记录的日志核对一遍。",usage:"reconcile A with B 表示核对并使两者一致；reconcile differences 可指调和分歧。"},
 {d:4,w:"deprecate",pos:"v.",p:"/ˈdeprəkeɪt/",cn:"弃用、不再推荐使用",k:"deprecated",ex:"That API version has been deprecated, so we should migrate before the cutoff.",tr:"那个 API 版本已被弃用，我们应该在截止日期前完成迁移。",usage:"技术中 deprecated 通常表示不再推荐、将被淘汰，并不保证功能已删除；删除可用 removed。"},
 {d:4,w:"oversight",pos:"n.",p:"/ˈəʊvəsaɪt/",cn:"疏忽；监管",k:"oversight",ex:"Deleting the mount target was an oversight, not a deliberate change.",tr:"删除挂载点是一次疏忽，并非有意的变更。",usage:"an oversight 是一次疏忽；不带冠词的 oversight 常指监管，如 regulatory oversight。"},
 {d:4,w:"planted",pos:"adj.",p:"/ˈplɑːntɪd/",cn:"（车）抓地扎实、贴地感强",k:"planted",ex:"With the new coilovers, the car feels much more planted at high speed.",tr:"换上新绞牙避震后，这台车高速下的贴地感扎实多了。",usage:"车评常说 feel / stay planted，指贴地、抓地稳定；不表示车真的被固定在地面上。"},
 {d:4,w:"astringent",pos:"adj.",p:"/əˈstrɪndʒənt/",cn:"涩口的、收敛感强的",k:"astringent",ex:"If the grind is too fine, the espresso comes out bitter and astringent.",tr:"如果研磨太细，浓缩萃出来会又苦又涩。",usage:"astringent 描述口腔干涩、收敛的感觉，和 bitter（苦味）不同；茶和咖啡都可以有这两种感受。"},
 {d:4,w:"prudent",pos:"adj.",p:"/ˈpruːdnt/",cn:"审慎稳妥的",k:"prudent",ex:"It's prudent to keep six months of expenses in cash before investing more.",tr:"在加大投资之前，留出六个月的开销做现金储备是比较审慎的做法。",usage:"It is prudent to do ... 表示做某事较稳妥，语气偏正式；也常说 a prudent decision。"},
 {d:4,w:"compounding",pos:"n.",p:"/kəmˈpaʊndɪŋ/",cn:"复利（效应）",k:"compounding",ex:"The real power of index investing comes from compounding over decades.",tr:"指数投资真正的威力来自几十年的复利累积。",usage:"the power / effect of compounding 指复利的累积效应；动词 compound 还可表示使问题进一步加重。"},
 {d:4,w:"laid-back",pos:"adj.",p:"/ˌleɪd ˈbæk/",cn:"悠闲随性的、不紧不慢的",k:"laid-back",ex:"Brisbane has a far more laid-back feel than Sydney.",tr:"布里斯班的氛围比悉尼要悠闲随性得多。",usage:"a laid-back person / atmosphere 指随和或轻松，不一定是懒散；写作时保留中间连字符。"},
 {d:4,w:"quaint",pos:"adj.",p:"/kweɪnt/",cn:"古雅别致的、小而有味道的",k:"quaint",ex:"We stayed in a quaint little town on the road to the Great Ocean Road.",tr:"去大洋路的路上，我们住在一个古雅的小镇里。",usage:"a quaint village / cottage 常带欣赏意味，指小巧古雅、有旧时魅力，通常不用于现代摩天楼。"},

 {d:5,w:"hectic",pos:"adj.",p:"/ˈhektɪk/",cn:"忙乱的、兵荒马乱的",k:"hectic",ex:"It's been a hectic week with two major incidents back to back.",tr:"这周忙翻了，接连出了两起重大故障。",usage:"a hectic week / schedule 强调忙且节奏乱；It's been hectic 是朋友聊天和工作闲聊都自然的说法。"},
 {d:5,w:"juggle",pos:"v.",p:"/ˈdʒʌɡl/",cn:"同时应付、兼顾（多件事）",k:"juggling",ex:"I'm juggling three change requests and an on-call shift this week.",tr:"这周我同时忙着三个变更申请，还要值班。",usage:"juggle work and family / several tasks 指同时兼顾多项责任，常暗示时间精力不够用。"},
 {d:5,w:"sluggish",pos:"adj.",p:"/ˈslʌɡɪʃ/",cn:"迟缓的、反应慢的",k:"sluggish",ex:"The database has been sluggish since the disk hit ninety percent.",tr:"自从磁盘用到 90%，数据库就一直很迟缓。",usage:"这里指系统反应慢；也可说 feel sluggish 描述自己没精神，比单纯 slow 多一层迟钝感。"},
 {d:5,w:"crisp",pos:"adj.",p:"/krɪsp/",cn:"干脆利落的；清爽的",k:"crisp",ex:"The short-throw shifter gives you a really crisp gear change.",tr:"这套短行程换挡杆的换挡手感非常干脆利落。",usage:"crisp gear changes 指换挡清晰利落；crisp air 是清爽空气，crisp food 则是酥脆食物。"},
 {d:5,w:"brisk",pos:"adj.",p:"/brɪsk/",cn:"轻快的、爽利的",k:"brisk",ex:"We took a brisk walk along the river before the cafés opened.",tr:"趁咖啡馆还没开门，我们沿着河边快步走了一段。",usage:"a brisk walk / pace 指速度快、步伐有精神；go for a brisk walk 是常用日常搭配。"},
 {d:5,w:"pricey",pos:"adj.",p:"/ˈpraɪsi/",cn:"偏贵的（口语）",k:"pricey",ex:"Coffee in Melbourne is good, though a bit pricey compared to Shanghai.",tr:"墨尔本的咖啡很不错，就是比上海贵一些。",usage:"口语常说 a bit pricey / pretty pricey，表示觉得偏贵；正式说明价格时用 expensive 更中性。"},
 {d:5,w:"give someone a heads-up",pos:"phr.",p:"/ˈhedz ʌp/",cn:"提前打个招呼、事先知会一声",k:"a heads-up",ex:"Just a heads-up: the patching window may run past midnight.",tr:"提前跟你说一声：打补丁的窗口可能会拖到午夜以后。",usage:"give someone a heads-up about something 是提前提醒；Just a heads-up: ... 可直接放在消息开头。"},
 {d:5,w:"circle back",pos:"phr. v.",p:"/ˈsɜːkl bæk/",cn:"回头再聊、稍后再跟进",k:"circle back",ex:"Let's circle back on the RDS upgrade once the test results are in.",tr:"等测试结果出来，我们再回头讨论 RDS 升级的事。",usage:"办公室常用 circle back to / on a topic 表示稍后再谈；朋友间可以直接说 get back to this。"},
 {d:5,w:"off the top of my head",pos:"phr.",p:"/ɒf ðə tɒp əv maɪ hed/",cn:"凭印象说、一时想到的（不确定）",k:"Off the top of my head",ex:"Off the top of my head, I'd say around twenty servers were affected.",tr:"我凭印象说，大概有二十台服务器受影响。",usage:"表示没查资料、凭记忆估计，常用于回答数字或细节；说话人可换成 his / her head。"},
 {d:5,w:"call it a day",pos:"phr.",p:"/kɔːl ɪt ə deɪ/",cn:"今天就到这儿吧、收工",k:"call it a day",ex:"The logs can wait until tomorrow — let's call it a day.",tr:"日志明天再看吧，今天就到这儿。",usage:"Let's call it a day 是结束今天这轮工作或活动，不要求事情全部完成；过去式 called it a day。"},

 {d:6,w:"backlog",pos:"n.",p:"/ˈbæklɒɡ/",cn:"积压的待办工作",k:"backlog",ex:"We're still working through a backlog of patching tickets from last month.",tr:"我们还在处理上个月积压下来的打补丁工单。",usage:"a backlog of tickets / work 是积压任务；clear / work through the backlog 表示清掉／逐步处理。"},
 {d:6,w:"circumvent",pos:"v.",p:"/ˌsɜːkəmˈvent/",cn:"规避、绕过（规则或管控）",k:"circumvent",ex:"Please don't circumvent the change process just to save time.",tr:"请不要为了省时间就绕过变更流程。",usage:"直接接 rules / restrictions / a process，指设法绕过限制；常暗示规避正常程序，语气比 avoid 强。"},
 {d:6,w:"erratic",pos:"adj.",p:"/ɪˈrætɪk/",cn:"飘忽不定的、时好时坏的",k:"erratic",ex:"The node's memory usage has been erratic since the last deployment.",tr:"上次部署之后，这个节点的内存占用一直飘忽不定。",usage:"erratic behaviour / performance 指没有稳定规律，未必周期性发生；intermittent 更强调断断续续。"},
 {d:6,w:"taut",pos:"adj.",p:"/tɔːt/",cn:"紧绷的、绷得住的（底盘）",k:"taut",ex:"The KW coilovers give the car a taut, controlled feel over bumps.",tr:"这套 KW 绞牙让车过颠簸时有一种紧绷、受控的感觉。",usage:"taut suspension 描述紧致受控的悬架；a taut rope 是拉紧的绳子，注意不要和 taught 混淆。"},
 {d:6,w:"syrupy",pos:"adj.",p:"/ˈsɪrəpi/",cn:"糖浆般浓稠的",k:"syrupy",ex:"A well-pulled ristretto should be thick and almost syrupy.",tr:"萃取得好的 ristretto 应该浓稠得近乎糖浆感。",usage:"a syrupy texture 指浓稠如糖浆，未必特别甜；形容音乐或感情表达时也可含过分甜腻之意。"},
 {d:6,w:"balmy",pos:"adj.",p:"/ˈbɑːmi/",cn:"温暖宜人的（天气）",k:"balmy",ex:"Brisbane was still balmy in early October.",tr:"十月初的布里斯班依然温暖宜人。",usage:"a balmy evening / breeze 指温暖柔和、令人舒服；天气热得难受时不宜用 balmy。"},
 {d:6,w:"touch base",pos:"phr. v.",p:"/tʌtʃ beɪs/",cn:"碰个头、简短沟通一下",k:"touch base",ex:"Let's touch base on Friday before the change freeze kicks in.",tr:"变更冻结开始之前，我们周五碰个头。",usage:"touch base with someone about something 指简短联系、同步情况；适合工作沟通，也可用于朋友联络。"},
 {d:6,w:"be on the same page",pos:"phr.",p:"/ɒn ðə seɪm peɪdʒ/",cn:"理解一致、达成共识",k:"on the same page",ex:"I'd like to make sure we're all on the same page before I send this out.",tr:"在我发出去之前，想确认一下大家的理解是一致的。",usage:"be on the same page about something 强调对事情理解或目标一致；不是所有想法都完全相同。"},
 {d:6,w:"drop the ball",pos:"phr.",p:"/drɒp ðə bɔːl/",cn:"掉链子、办事失误",k:"dropped the ball",ex:"I dropped the ball on that ticket — I forgot to update the status.",tr:"那个工单我掉链子了，忘了更新状态。",usage:"常说 I dropped the ball on ... 承认自己疏忽；直接说别人 dropped the ball 可能带责备语气。"},
 {d:6,w:"worth a shot",pos:"phr.",p:"/wɜːθ ə ʃɒt/",cn:"值得一试",k:"worth a shot",ex:"Prefix delegation might not fix it, but it's worth a shot.",tr:"前缀委派未必能解决，但值得一试。",usage:"It's worth a shot 表示成功不保证，但可以试试；worth 后接名词或 doing，不接 to do。"},

 {d:7,w:"inadvertently",pos:"adv.",p:"/ˌɪnədˈvɜːtəntli/",cn:"无意中、不小心地",k:"inadvertently",ex:"The script inadvertently removed the versionlock before the upgrade.",tr:"该脚本在升级前无意中移除了 versionlock。",usage:"常用于解释非故意操作：inadvertently deleted / changed；比 accidentally 正式，适合复盘说明。"},
 {d:7,w:"preemptive",pos:"adj.",p:"/priˈemptɪv/",cn:"先发的、预防性的",k:"preemptive",ex:"We did a preemptive reboot rather than waiting for the node to fail.",tr:"我们主动做了一次预防性重启，而不是等节点挂掉。",usage:"preemptive action 指提前出手避免问题或抢先行动；preventive maintenance 更常指常规预防性维护。"},
 {d:7,w:"granular",pos:"adj.",p:"/ˈɡrænjələ/",cn:"细粒度的、颗粒感的",k:"granular",ex:"IAM lets you define granular permissions down to a single action.",tr:"IAM 允许你把权限细化到单个操作。",usage:"granular permissions / detail 指划分很细；more granular 是更细致，技术交流中比日常聊天常见。"},
 {d:7,w:"jittery",pos:"adj.",p:"/ˈdʒɪtəri/",cn:"心慌手抖的；（市场）神经紧张的",k:"jittery",ex:"Too much espresso before a track day leaves me jittery.",tr:"赛道日之前喝太多浓缩会让我心慌手抖。",usage:"feel jittery 常描述紧张、心慌或咖啡喝多后的抖动；它侧重身体和情绪上的不安。"},
 {d:7,w:"winding",pos:"adj.",p:"/ˈwaɪndɪŋ/",cn:"蜿蜒曲折的",k:"winding",ex:"The road up to Kamikochi is narrow and winding.",tr:"通往上高地的那条路又窄又蜿蜒。",usage:"a winding road / path 是蜿蜒路线，读音与 wind（风）不同；沿路多个弯，不只是一个拐角。"},
 {d:7,w:"steep",pos:"adj. / v.",p:"/stiːp/",cn:"陡峭的；（价格）高昂的；浸泡",k:"steep",ex:"The learning curve for EKS networking is pretty steep.",tr:"EKS 网络的学习曲线相当陡。",usage:"a steep learning curve 常表示上手困难；a steep price 指价格高，动词 steep tea 则是泡茶。"},
 {d:7,w:"bear with me",pos:"phr.",p:"/beə wɪð miː/",cn:"请稍等一下、担待一下",k:"Bear with me",ex:"Bear with me while I pull up the CloudWatch dashboard.",tr:"稍等我一下，我把 CloudWatch 面板调出来。",usage:"Bear with me while ... 是请对方耐心稍等；拼 bear，不是 bare，后者表示裸露。"},
 {d:7,w:"run something by someone",pos:"phr. v.",p:"/rʌn ˈsʌmθɪŋ baɪ/",cn:"跟某人过一下、征求一下意见",k:"run this change plan by",ex:"Let me run this change plan by the security team first.",tr:"我先把这份变更方案跟安全团队过一下。",usage:"run an idea / plan by someone 是先请人看看并给意见；用代词时说 run it by you。"},
 {d:7,w:"in hindsight",pos:"phr.",p:"/ɪn ˈhaɪndsaɪt/",cn:"事后回想、现在看来",k:"In hindsight",ex:"In hindsight, we should have tested the patch in dev first.",tr:"事后回想，我们本该先在 dev 环境测这个补丁。",usage:"In hindsight 常放句首，表示有了后来的信息再回看；常接 should have done 来总结教训。"},
 {d:7,w:"loop someone in",pos:"phr. v.",p:"/luːp ˈsʌmwʌn ɪn/",cn:"把某人拉进来知会一声",k:"loop you in",ex:"I'll loop you in on the thread with the global team.",tr:"我会把你加进跟全球团队的那条邮件线里。",usage:"loop someone in on something 表示让对方加入沟通并知情；代词放中间：loop me in。"},

 {d:8,w:"overhaul",pos:"n. / v.",p:"/ˈəʊvəhɔːl/",cn:"彻底整改、大修",k:"overhaul",ex:"The patching process needs a complete overhaul, not another quick fix.",tr:"打补丁的流程需要彻底重做，而不是再打一个补丁了事。",usage:"a complete overhaul 是全面重做；动词 overhaul a system / engine 可指彻底改革或大修。"},
 {d:8,w:"stopgap",pos:"n. / adj.",p:"/ˈstɒpɡæp/",cn:"权宜之计、临时顶一下的办法",k:"stopgap",ex:"Restarting the service is only a stopgap until we fix the memory leak.",tr:"重启服务只是权宜之计，真正要解决的是内存泄漏。",usage:"a stopgap measure / solution 是临时顶上的办法，默认仍需长期方案；通常不用于成熟的最终解决方案。"},
 {d:8,w:"scrutiny",pos:"n.",p:"/ˈskruːtəni/",cn:"仔细审查、严格审视",k:"scrutiny",ex:"Any change to production networking gets extra scrutiny from the security team.",tr:"任何生产网络的变更都会受到安全团队的额外审查。",usage:"under scrutiny / come under scrutiny 是受到审查；scrutiny 通常不可数，不说 a scrutiny。"},
 {d:8,w:"skittish",pos:"adj.",p:"/ˈskɪtɪʃ/",cn:"躁动不安的；（车尾）发飘不安分的",k:"skittish",ex:"The rear end feels skittish over bumps when the damping is too stiff.",tr:"阻尼调得太硬时，车尾过颠簸会显得躁动不安。",usage:"可形容易受惊的动物或紧张的人；车尾 skittish 则是对路面变化敏感、显得不安定。"},
 {d:8,w:"muted",pos:"adj.",p:"/ˈmjuːtɪd/",cn:"平淡的、不强烈的（反应/风味）",k:"muted",ex:"The market reaction to the earnings was surprisingly muted.",tr:"市场对这份财报的反应出奇地平淡。",usage:"a muted response / reaction 指反应不强烈；muted colours 是柔和低调的颜色，不等于完全没有颜色。"},
 {d:8,w:"grueling",pos:"adj.",p:"/ˈɡruːəlɪŋ/",cn:"极其累人的、折磨人的",k:"grueling",ex:"A full day of track sessions is more grueling than it looks.",tr:"一整天的赛道跑下来，比看上去累多了。",usage:"a grueling session 强调身心都很吃力；英澳常见拼写 gruelling，与历史条目的 grueling 同义。"},
 {d:8,w:"keep someone posted",pos:"phr.",p:"/kiːp ˈsʌmwʌn ˈpəʊstɪd/",cn:"随时同步进展给某人",k:"keep you posted",ex:"I'll keep you posted as the patching progresses tonight.",tr:"今晚打补丁的进展我会随时同步给你。",usage:"keep someone posted on / about progress 是持续告知新进展；I'll keep you posted 可独立作为回复。"},
 {d:8,w:"hold off on something",pos:"phr. v.",p:"/həʊld ɒf ɒn/",cn:"先缓一缓、暂时不做",k:"hold off on",ex:"Let's hold off on the deployment until the change freeze lifts.",tr:"我们先缓一缓，等变更冻结解除再部署。",usage:"hold off on a decision / doing something 是暂缓行动；说 hold off until Friday 可交代等到何时。"},
 {d:8,w:"at short notice",pos:"phr.",p:"/ət ʃɔːt ˈnəʊtɪs/",cn:"临时通知、仓促之间",k:"at such short notice",ex:"Thanks for joining the call at such short notice.",tr:"感谢你这么临时地加入这个会。",usage:"英澳常说 at short notice；美式常见 on short notice，感谢临时参加时可加 such。"},
 {d:8,w:"iron out",pos:"phr. v.",p:"/ˈaɪən aʊt/",cn:"理顺、解决（细节或分歧）",k:"iron out",ex:"We still need to iron out a few details before the go-live.",tr:"上线之前还有几个细节需要理顺。",usage:"iron out details / differences 指把剩余问题理顺；代词放中间：iron them out。"},

 {d:9,w:"cascade",pos:"v. / n.",p:"/kæˈskeɪd/",cn:"级联、引发连锁反应",k:"cascaded",ex:"One failed mount target cascaded into a full boot failure.",tr:"一个失效的挂载点级联引发了整台机器无法启动。",usage:"cascade into further failures 指故障引发后续连锁问题；cascading failures 是常见技术搭配。"},
 {d:9,w:"contentious",pos:"adj.",p:"/kənˈtenʃəs/",cn:"有争议的、容易吵起来的",k:"contentious",ex:"Whether to put the endpoint on the consumer side turned out to be contentious.",tr:"端点该放在消费方这一侧，结果成了很有争议的问题。",usage:"a contentious issue / decision 指容易引发争论；形容人时则可能是爱争辩，语气较负面。"},
 {d:9,w:"finicky",pos:"adj.",p:"/ˈfɪnɪki/",cn:"难伺候的、挑剔麻烦的",k:"finicky",ex:"The old SSM agent is finicky about proxy settings.",tr:"老版本的 SSM agent 对代理设置很挑剔。",usage:"be finicky about settings / food 指特别挑条件；用于软件时是口语化说它难调、难伺候。"},
 {d:9,w:"drawdown",pos:"n.",p:"/ˈdrɔːdaʊn/",cn:"回撤（从高点下跌的幅度）",k:"drawdown",ex:"I add more capital whenever the index hits a ten percent drawdown.",tr:"每当指数回撤 10%，我就追加一笔资金。",usage:"a drawdown 指相对先前高点的回撤；report a 10% drawdown 是描述指标，不等于已卖出亏损。"},
 {d:9,w:"immaculate",pos:"adj.",p:"/ɪˈmækjələt/",cn:"一尘不染的、完美无瑕的",k:"immaculate",ex:"He keeps the car immaculate, even after a track day.",tr:"他把车保持得一尘不染，哪怕刚跑完赛道。",usage:"in immaculate condition 是状态极好、几乎无瑕；也常说 an immaculate kitchen 指一尘不染。"},
 {d:9,w:"layover",pos:"n.",p:"/ˈleɪəʊvə/",cn:"中转停留（短暂等待）",k:"layover",ex:"We had a six-hour layover in Singapore on the way to Melbourne.",tr:"去墨尔本的路上，我们在新加坡中转停留了六个小时。",usage:"have a layover in Singapore / a six-hour layover 是中转等候；英澳旅行交流中也常用 stopover。"},
 {d:9,w:"fall through the cracks",pos:"phr.",p:"/fɔːl θruː ðə kræks/",cn:"被漏掉、没人跟进就没了下文",k:"fall through the cracks",ex:"Let's log it now so it doesn't fall through the cracks.",tr:"现在就把它登记下来，免得这事儿被漏掉。",usage:"常以任务或事项作主语：Something fell through the cracks，表示流程中被遗漏，没有人持续跟进。"},
 {d:9,w:"play it by ear",pos:"phr.",p:"/pleɪ ɪt baɪ ɪə/",cn:"看情况再定、随机应变",k:"play it by ear",ex:"We haven't booked anything for Sunday, so we'll play it by ear.",tr:"周日我们什么都没订，到时候看情况再说。",usage:"Let's play it by ear 表示先不定死、到时再看；不要把耳朵的字面意思带入旅行安排。"},
 {d:9,w:"on the back burner",pos:"phr.",p:"/ɒn ðə bæk ˈbɜːnə/",cn:"暂时搁置、优先级往后放",k:"on the back burner",ex:"The dashboard project is on the back burner until Q4.",tr:"那个看板项目先搁置，等第四季度再说。",usage:"put something on the back burner 是降低优先级、留待以后；与取消计划不同，仍可能继续做。"},
 {d:9,w:"a long shot",pos:"phr.",p:"/ə lɒŋ ʃɒt/",cn:"希望不大的尝试、赌一把",k:"a long shot",ex:"Rolling back the driver is a long shot, but nothing else has worked.",tr:"回滚驱动希望不大，但别的办法都试过了。",usage:"It's a long shot, but ... 常引出成功机会不大的尝试；强调概率低，不是路程长。"},

 {d:10,w:"exacerbate",pos:"v.",p:"/ɪɡˈzæsəbeɪt/",cn:"加剧、使恶化",k:"exacerbated",ex:"Rebooting during peak hours only exacerbated the timeouts.",tr:"在高峰期重启反而让超时问题更严重了。",usage:"exacerbate a problem / tension / symptoms 是使已有问题更严重，直接接宾语，适合较正式的说明。"},
 {d:10,w:"convoluted",pos:"adj.",p:"/ˈkɒnvəluːtɪd/",cn:"错综复杂的、绕来绕去的",k:"convoluted",ex:"The cross-account routing setup is so convoluted that nobody wants to touch it.",tr:"这套跨账号路由绕得没人愿意碰。",usage:"a convoluted explanation / setup 指复杂得难理解，通常带批评意味；不只是中性的 complex。"},
 {d:10,w:"compliant",pos:"adj.",p:"/kəmˈplaɪənt/",cn:"合规的；（悬架）柔顺有韧性的",k:"compliant",ex:"A compliant suspension soaks up bumps without feeling floaty.",tr:"有柔顺性的悬架能吸收颠簸，又不会发飘。",usage:"车评中 compliant suspension 指柔顺、能贴合路面；合规含义则用 compliant with rules / standards。"},
 {d:10,w:"stale",pos:"adj.",p:"/steɪl/",cn:"不新鲜的；（数据）过期失效的",k:"stale",ex:"The dashboard was showing stale data from a cached query.",tr:"面板显示的是缓存查询里的过期数据。",usage:"stale data / credentials 指过期或失效；stale bread 是不新鲜的面包，两者都强调失去原有状态。"},
 {d:10,w:"overrated",pos:"adj.",p:"/ˌəʊvəˈreɪtɪd/",cn:"名过其实的、被高估的",k:"overrated",ex:"The tourist strip was overrated; the suburbs had far better coffee.",tr:"那条游客街名过其实，郊区的咖啡好得多。",usage:"I think it's overrated 是认为名气超过实际水平，带主观评价；比较委婉可加 a bit。"},
 {d:10,w:"rebalance",pos:"v.",p:"/ˌriːˈbæləns/",cn:"再平衡（调整资产配置比例）",k:"rebalance",ex:"I rebalance the portfolio once a year rather than reacting to every dip.",tr:"我一年做一次组合再平衡，而不是每次下跌都去反应。",usage:"rebalance a portfolio 指调整资产权重；也可说 rebalance workloads 表示重新分配工作负载。"},
 {d:10,w:"off the beaten path",pos:"phr.",p:"/ɒf ðə ˈbiːtn pɑːθ/",cn:"人少小众、不在常规路线上的",k:"off the beaten path",ex:"The best cafés in Melbourne are off the beaten path.",tr:"墨尔本最好的咖啡馆都藏在游客少去的地方。",usage:"常形容旅行地点小众：somewhere off the beaten path；英澳也常说 off the beaten track。"},
 {d:10,w:"flag something up",pos:"phr. v.",p:"/flæɡ ˈsʌmθɪŋ ʌp/",cn:"把某事提出来、引起注意",k:"flagged it up",ex:"I flagged it up to the network team before the freeze started.",tr:"冻结开始之前，我把这件事提给网络团队了。",usage:"flag something up to someone 是提醒对方注意，英式工作英语常见；代词放中间：flag it up。"},
 {d:10,w:"cut corners",pos:"phr.",p:"/kʌt ˈkɔːnəz/",cn:"图省事、偷工减料",k:"cut corners",ex:"We can't cut corners on testing just to hit the deadline.",tr:"不能为了赶截止日期就在测试上偷工减料。",usage:"cut corners on testing / safety 指省略必要步骤，通常是负面评价；不等于合理提高效率。"},
 {d:10,w:"get someone up to speed",pos:"phr.",p:"/ʌp tə spiːd/",cn:"让某人跟上进度、了解情况",k:"get you up to speed",ex:"Let me get you up to speed on what happened last night.",tr:"我先把昨晚发生的事跟你同步一下。",usage:"get someone up to speed on something 是补齐背景和进展；be up to speed 则表示已经了解情况。"},

 {d:11,w:"attest",pos:"v.",p:"/əˈtest/",cn:"证明、证实（attest to sth）",k:"attest",ex:"The logs attest to the fact that the agent never checked in.",tr:"日志可以证明该 agent 从未上报过。",usage:"attest to something 指证实某事，较正式；人作主语时可说 I can attest to that，表示亲身证明。"},
 {d:11,w:"defer",pos:"v.",p:"/dɪˈfɜː/",cn:"推迟；（defer to）听从某人意见",k:"deferred",ex:"We deferred the upgrade to the next maintenance window.",tr:"我们把升级推迟到了下一个维护窗口。",usage:"defer something until / to a later date 是延期；defer to someone 则是听从对方，介词决定含义。"},
 {d:11,w:"redundant",pos:"adj.",p:"/rɪˈdʌndənt/",cn:"冗余的（技术褒义）；多余重复的",k:"redundant",ex:"We added a redundant path so a single link failure won't take the site down.",tr:"我们加了一条冗余链路，这样单条链路故障不会导致整站中断。",usage:"技术中 redundant components 可是有意设置的备用部件；普通语境 redundant information 是多余信息。"},
 {d:11,w:"docile",pos:"adj.",p:"/ˈdəʊsaɪl/",cn:"温顺听话的、好开不咬人的",k:"docile",ex:"The BRZ is docile at low speed but comes alive above four thousand rpm.",tr:"BRZ 低速时温顺听话，但过了四千转就活了。",usage:"a docile animal 指温顺易控制；车评中借用来形容好驾驭，形容成年人时可能显得轻视其自主性。"},
 {d:11,w:"scalding",pos:"adj.",p:"/ˈskɔːldɪŋ/",cn:"滚烫的（烫伤级别）",k:"scalding",ex:"Water straight off the boil is scalding and will burn the grounds.",tr:"刚烧开的水太烫，会把咖啡粉烫焦。",usage:"scalding hot 常连用，强调烫得厉害；be scalded by hot water 是被热水烫伤。"},
 {d:11,w:"lucrative",pos:"adj.",p:"/ˈluːkrətɪv/",cn:"赚钱的、收益丰厚的",k:"lucrative",ex:"Index investing isn't exciting, but it's been quietly lucrative.",tr:"指数投资并不刺激，但一直在悄悄赚钱。",usage:"a lucrative job / deal / business 指收益丰厚，语气较正式；不自动意味着风险低或回报有保证。"},
 {d:11,w:"put something on hold",pos:"phr.",p:"/pʊt ɒn həʊld/",cn:"把某事挂起、暂停",k:"on hold",ex:"We've put the migration on hold until the vendor responds.",tr:"在厂商回复之前，我们把迁移暂停了。",usage:"put a project on hold 是暂停等待；电话里 put someone on hold 则是让对方在线等候。"},
 {d:11,w:"take a rain check",pos:"phr.",p:"/teɪk ə ˈreɪn tʃek/",cn:"这次先算了、改天再约",k:"take a rain check",ex:"I'll have to take a rain check on dinner — I'm on call tonight.",tr:"晚饭我改天再约吧，今晚我值班。",usage:"take a rain check on dinner 是这次婉拒、希望改天再约，适合朋友邀请；不是单纯拒绝到底。"},
 {d:11,w:"be swamped",pos:"phr.",p:"/biː swɒmpt/",cn:"忙得不可开交、被淹没了",k:"swamped",ex:"I'm completely swamped this week — can we push it to Monday?",tr:"这周我忙得不可开交，能推到周一吗？",usage:"be swamped with work / requests 表示忙得应付不过来；I'm swamped 比 I'm busy 更强，偏口语。"},
 {d:11,w:"a ballpark figure",pos:"phr.",p:"/ə ˈbɔːlpɑːk ˈfɪɡə/",cn:"大概的数字、估个大致范围",k:"a ballpark figure",ex:"Can you give me a ballpark figure for how long the rollback will take?",tr:"回滚大概要多久，能给个大致的数吗？",usage:"give someone a ballpark figure 是给粗略估计；适合初步讨论，不能当成精确报价或承诺。"},

 {d:12,w:"pinpoint",pos:"v.",p:"/ˈpɪnpɔɪnt/",cn:"精确定位、准确指出",k:"pinpoint",ex:"CloudTrail helped us pinpoint exactly who deleted the file system.",tr:"CloudTrail 帮我们精确定位到了究竟是谁删除了该文件系统。",usage:"pinpoint the cause / location 指准确找出问题或位置；比 identify 更强调定位精确。"},
 {d:12,w:"outage",pos:"n.",p:"/ˈaʊtɪdʒ/",cn:"服务中断、停机",k:"outage",ex:"The outage lasted forty minutes and affected two production accounts.",tr:"本次中断持续了四十分钟，影响两个生产账号。",usage:"a power / service / network outage 是供应或服务中断；系统正常计划停机也常用 downtime 描述。"},
 {d:12,w:"tedious",pos:"adj.",p:"/ˈtiːdiəs/",cn:"枯燥乏味的、磨人的",k:"tedious",ex:"Checking each server by hand is tedious and error-prone.",tr:"逐台手工检查服务器既枯燥又容易出错。",usage:"a tedious task 是重复、耗时而令人厌烦的工作；不一定难，只是做起来枯燥磨人。"},
 {d:12,w:"grippy",pos:"adj.",p:"/ˈɡrɪpi/",cn:"抓地力强的（口语）",k:"grippier",ex:"The new tyres are noticeably grippier once they're up to temperature.",tr:"新轮胎热起来之后抓地力明显更强。",usage:"口语车评和运动装备评价常说 grippy tyres / soles；比较级 grippier，侧重抓地表现。"},
 {d:12,w:"muddled",pos:"adj.",p:"/ˈmʌdld/",cn:"混乱不清的、糊成一团的",k:"muddled",ex:"If you over-extract, the flavours get muddled and flat.",tr:"萃取过头的话，风味会糊成一团、变得平淡。",usage:"muddled flavours 指风味混在一起分不清；muddled thinking 则是思路不清晰，也可说 feel muddled。"},
 {d:12,w:"windfall",pos:"n.",p:"/ˈwɪndfɔːl/",cn:"意外之财、飞来横财",k:"windfall",ex:"I put most of the bonus windfall into the index fund rather than spending it.",tr:"这笔意外的奖金我大部分投进了指数基金，没花掉。",usage:"an unexpected windfall 是意外所得；常说 a tax windfall / windfall gains，不是固定的日常收入。"},
 {d:12,w:"touch and go",pos:"phr.",p:"/tʌtʃ ənd ɡəʊ/",cn:"悬乎、说不准能不能成",k:"touch and go",ex:"It was touch and go whether we'd finish before the window closed.",tr:"能不能在窗口关闭前做完，当时挺悬的。",usage:"It was touch and go whether ... 表示结果很悬；放在名词前作形容词可写 a touch-and-go situation。"},
 {d:12,w:"back to square one",pos:"phr.",p:"/bæk tə skweə wʌn/",cn:"回到原点、白忙一场",k:"back to square one",ex:"The rollback failed too, so we're back to square one.",tr:"回滚也失败了，我们又回到了原点。",usage:"be back to square one 是先前努力失效、重新从起点开始；send someone back to square one 可表示让人重来。"},
 {d:12,w:"buy time",pos:"phr.",p:"/baɪ taɪm/",cn:"争取时间、拖一拖",k:"buys us time",ex:"Restarting the service buys us time until the vendor patch arrives.",tr:"重启服务能争取一点时间，撑到厂商补丁下来。",usage:"buy someone time 表示为某人争取时间；buy time to do something 是争取时间做后续处理。"},
 {d:12,w:"be up in the air",pos:"phr.",p:"/ʌp ɪn ði eə/",cn:"还没定、悬而未决",k:"up in the air",ex:"The October travel dates are still up in the air.",tr:"十月的出行日期还没定下来。",usage:"plans / dates are up in the air 表示尚未确定；常加 still，适合自然地解释安排还没定。"},

 {d:13,w:"substantiate",pos:"v.",p:"/səbˈstænʃieɪt/",cn:"用证据支持、证实（说法）",k:"substantiate",ex:"We couldn't substantiate the claim that the agent had run successfully.",tr:"我们无法证实「该 agent 已成功运行」这一说法。",usage:"substantiate a claim / allegation 指拿出证据支持说法；语气正式，只有猜测时不能说已 substantiated。"},
 {d:13,w:"pertinent",pos:"adj.",p:"/ˈpɜːtɪnənt/",cn:"切题的、相关的（比 relevant 正式）",k:"pertinent",ex:"I've attached the pertinent CloudTrail entries for your review.",tr:"我已附上相关的 CloudTrail 记录供你查阅。",usage:"pertinent to something 表示与某事直接相关；pertinent details / questions 常见于报告或讨论。"},
 {d:13,w:"transient",pos:"adj.",p:"/ˈtrænziənt/",cn:"短暂的、出现一次就消失的",k:"transient",ex:"The error was transient and hasn't reappeared since the restart.",tr:"该错误是短暂性的，重启后再未出现。",usage:"a transient error / state 指持续时间短、会消失的状态；不是所有 transient errors 都会反复出现。"},
 {d:13,w:"forgiving",pos:"adj.",p:"/fəˈɡɪvɪŋ/",cn:"容错性好的、不惩罚失误的",k:"forgiving",ex:"A wider power band makes the car more forgiving when you get the gear wrong.",tr:"更宽的动力带让这台车在你挡位选错时更宽容。",usage:"a forgiving car / racket 容许小失误，不容易立刻失控或影响表现；形容人则是宽容、不记仇。"},
 {d:13,w:"decadent",pos:"adj.",p:"/ˈdekədənt/",cn:"（食物）浓郁奢华的、罪恶的美味",k:"decadent",ex:"That flat white with a slice of basque cheesecake felt decadent.",tr:"那杯 flat white 配一块巴斯克蛋糕，简直是罪恶的享受。",usage:"食物评价中的 decadent dessert 常带享受、浓郁奢华的意味；其他语境也可能批评奢靡或颓废。"},
 {d:13,w:"dip",pos:"n. / v.",p:"/dɪp/",cn:"回落、小幅下跌；蘸",k:"the dip",ex:"I usually buy the dip rather than trying to time the top.",tr:"我一般是逢跌买入，而不是去猜顶部。",usage:"a dip in prices / temperature 是小幅下降；buy the dip 是市场惯用语，这里不表示蘸食物。"},
 {d:13,w:"on second thought",pos:"phr.",p:"/ɒn ˈsekənd θɔːt/",cn:"再想想的话、转念一想",k:"On second thought",ex:"On second thought, let's do the reboot during the weekend window instead.",tr:"再想想的话，我们还是改到周末的窗口做重启吧。",usage:"用于刚说完又改变主意；英澳更常说 On second thoughts，历史例句用的是常见美式单数形式。"},
 {d:13,w:"stay on top of something",pos:"phr.",p:"/steɪ ɒn tɒp əv/",cn:"持续盯住、掌控住某事",k:"stay on top of",ex:"I'll stay on top of the ticket queue while you're on leave.",tr:"你休假期间，工单队列我会一直盯着。",usage:"stay on top of emails / tasks 是持续跟进、掌控状况；强调主动处理，比偶尔看一眼更积极。"},
 {d:13,w:"a heads-up call",pos:"phr.",p:"/ə ˈhedz ʌp kɔːl/",cn:"预警式的沟通、提前打的招呼",k:"a heads-up call",ex:"Consider this a heads-up call — the vendor may miss the deadline.",tr:"就当我提前给你打个招呼：厂商可能赶不上截止日期。",usage:"a heads-up call 可指提前预警的电话或沟通，意思透明但不是必须背成固定习语；常用 give someone a heads-up。"},
 {d:13,w:"go the extra mile",pos:"phr.",p:"/ɡəʊ ði ˈekstrə maɪl/",cn:"多做一步、格外用心",k:"went the extra mile",ex:"The night shift went the extra mile and rebuilt the node before handover.",tr:"夜班同事额外多做了一步，在交接前把节点重建好了。",usage:"go the extra mile for someone / to do something 表示比基本要求多付出，常用于赞扬服务或帮助。"},

 {d:14,w:"discrete",pos:"adj.",p:"/dɪˈskriːt/",cn:"独立分开的、离散的（≠discreet 谨慎）",k:"discrete",ex:"We split the rollout into three discrete phases so each can be verified.",tr:"我们把上线拆成三个独立的阶段，每一阶段都能单独验证。",usage:"discrete phases / units 是分开的独立部分；同音的 discreet 表示谨慎低调，两者拼写和意思不同。"},
 {d:14,w:"antiquated",pos:"adj.",p:"/ˈæntɪkweɪtɪd/",cn:"陈旧过时的（该淘汰了）",k:"antiquated",ex:"The monitoring stack is antiquated and barely maintained anymore.",tr:"这套监控系统已经很陈旧，几乎没人再维护了。",usage:"antiquated equipment / methods 强调太老旧、已不合时宜；比 old 更带有应该更新的评价。"},
 {d:14,w:"leeway",pos:"n.",p:"/ˈliːweɪ/",cn:"回旋余地、宽松空间",k:"leeway",ex:"The deadline gives us very little leeway if the first attempt fails.",tr:"如果第一次尝试失败，这个截止日期留给我们的余地非常有限。",usage:"give / allow someone leeway 是给回旋余地；leeway 通常不可数，常说 little / some leeway。"},
 {d:14,w:"telegraph",pos:"v.",p:"/ˈtelɪɡrɑːf/",cn:"（提前）传递出信号、预告",k:"telegraph",ex:"Good tyres telegraph the limit before they let go.",tr:"好轮胎会在失去抓地之前把极限信号传递给你。",usage:"telegraph your intentions 是提前暴露意图；车评中指车辆在失去抓地前通过反馈给出预兆。"},
 {d:14,w:"potent",pos:"adj.",p:"/ˈpəʊtnt/",cn:"（效力）强劲的、后劲足的",k:"potent",ex:"A double ristretto is small but surprisingly potent.",tr:"双份 ristretto 分量虽小，后劲却出奇地足。",usage:"potent coffee / medicine 强调作用强，未必只是味道浓；a potent argument 则是有力的论证。"},
 {d:14,w:"forfeit",pos:"v. / n.",p:"/ˈfɔːfɪt/",cn:"（因故）丧失、放弃（权利或钱）",k:"forfeit",ex:"If you cancel within 48 hours, you forfeit the full booking fee.",tr:"如果在 48 小时内取消，你将损失全部预订费用。",usage:"forfeit a deposit / right 指因条件或行为失去押金或权利；不同于暂时延后付款。"},
 {d:14,w:"take it from here",pos:"phr.",p:"/teɪk ɪt frəm hɪə/",cn:"接下来交给你了、由你接手",k:"take it from here",ex:"The node is back online — the day shift can take it from here.",tr:"节点已恢复上线，接下来交给白班同事。",usage:"I can take it from here 是主动接手；Can you take it from here? 是请对方负责后续，人称决定谁接手。"},
 {d:14,w:"give or take",pos:"phr.",p:"/ɡɪv ɔː teɪk/",cn:"上下浮动、差不多（估数用）",k:"give or take",ex:"The rollback takes about half an hour, give or take.",tr:"回滚大概要半小时上下。",usage:"放在估数后：about an hour, give or take；也可加具体幅度，如 give or take ten minutes。"},
 {d:14,w:"be all over the place",pos:"phr.",p:"/ɔːl əʊvə ðə pleɪs/",cn:"乱七八糟、毫无章法",k:"all over the place",ex:"The latency numbers were all over the place last night.",tr:"昨晚的延迟数据乱七八糟，毫无规律。",usage:"可说数据波动很乱、物品散落各处，或自己注意力不集中；语境决定是哪种乱。"},
 {d:14,w:"nail something down",pos:"phr. v.",p:"/neɪl ˈsʌmθɪŋ daʊn/",cn:"敲定、确定下来",k:"nail down",ex:"Let's nail down the maintenance date before we notify the users.",tr:"通知用户之前，我们先把维护日期敲定。",usage:"nail down a date / agreement 指把细节最终敲定；代词放中间：nail it down，偏口语。"},

 {d:15,w:"attribute",pos:"v.",p:"/əˈtrɪbjuːt/",cn:"归因于（attribute A to B）",k:"attribute",ex:"We attribute the failure to a race condition in the patching script.",tr:"我们将此次故障归因于打补丁脚本中的竞态条件。",usage:"attribute A to B 是把 A 归因于 B；此处为动词，词尾发 /bjuːt/，名词 attribute 的读音不同。"},
 {d:15,w:"corroborate",pos:"v.",p:"/kəˈrɒbəreɪt/",cn:"（用另一来源）佐证、印证",k:"corroborate",ex:"The vendor's logs corroborate what we saw in CloudTrail.",tr:"厂商的日志印证了我们在 CloudTrail 里看到的情况。",usage:"corroborate an account / findings 常指另一来源的证据相互印证；不只是重复同一人的说法。"},
 {d:15,w:"marginal",pos:"adj.",p:"/ˈmɑːdʒɪnl/",cn:"微小的、边际的；勉强的",k:"marginal",ex:"The tuning change gave only a marginal improvement in latency.",tr:"这次调参对延迟的改善非常有限。",usage:"a marginal improvement 是改善幅度很小；marginally better 指稍好一点，经济学里也可表示边际。"},
 {d:15,w:"abrupt",pos:"adj.",p:"/əˈbrʌpt/",cn:"突兀的、生硬的（≠progressive）",k:"abrupt",ex:"The throttle response feels abrupt in Sport Sharp mode.",tr:"在 Sport Sharp 模式下，油门响应显得有些突兀。",usage:"abrupt changes / responses 指突然且不平顺；an abrupt manner 则是说话生硬、不太客气。"},
 {d:15,w:"pungent",pos:"adj.",p:"/ˈpʌndʒənt/",cn:"气味刺鼻浓烈的（偏负面）",k:"pungent",ex:"Over-roasted beans give off a pungent, ashy smell.",tr:"烘过头的豆子会散发出刺鼻的焦灰味。",usage:"a pungent smell 是浓烈刺鼻的气味；pungent garlic / spices 也可中性描述强烈气味，并非一定臭。"},
 {d:15,w:"hedge",pos:"v. / n.",p:"/hedʒ/",cn:"对冲、留后手；说话打太极",k:"hedges",ex:"Holding some bonds hedges against a sharp drawdown in equities.",tr:"持有一部分债券可以对冲股票大幅回撤的风险。",usage:"hedge against a risk 是设法降低风险；hedge your bets 指给自己留余地，不把希望押在单一结果上。"},
 {d:15,w:"wrap one's head around something",pos:"phr.",p:"/ræp əˈraʊnd/",cn:"想明白、理解透（有难度的东西）",k:"wrap my head around",ex:"It took me a while to wrap my head around how IRSA actually works.",tr:"我花了好一阵才想明白 IRSA 到底是怎么运作的。",usage:"wrap my / your head around something 指理解复杂或难接受的事；常用于 It took me a while to ...。"},
 {d:15,w:"in the loop",pos:"phr.",p:"/ɪn ðə luːp/",cn:"知情、在信息圈里",k:"in the loop",ex:"Please keep me in the loop on any vendor updates.",tr:"厂商那边有任何进展，请让我保持知情。",usage:"keep someone in the loop about / on something 是持续知会；be out of the loop 则是不知情。"},
 {d:15,w:"come up short",pos:"phr.",p:"/kʌm ʌp ʃɔːt/",cn:"没达标、差了一截",k:"came up short",ex:"The first fix came up short — the errors returned within an hour.",tr:"第一次修复没能奏效，一小时内错误又回来了。",usage:"come up short of a target 是没达到目标；也可直接说 We came up short，强调努力后仍差一点。"},
 {d:15,w:"by and large",pos:"phr.",p:"/baɪ ənd lɑːdʒ/",cn:"总体而言、大体上",k:"By and large",ex:"By and large, the migration went smoothly apart from two nodes.",tr:"总体而言，除了两个节点之外，这次迁移进行得很顺利。",usage:"常放句首概括整体情况，允许存在例外；意思接近 on the whole，不表示每个细节都一样。"},

 {d:16,w:"mitigation",pos:"n.",p:"/ˌmɪtɪˈɡeɪʃn/",cn:"缓解措施（降低影响，非根治）",k:"mitigation",ex:"As a mitigation, we scaled out the node group before the peak window.",tr:"作为缓解措施，我们在高峰窗口前对节点组做了扩容。",usage:"mitigation measures 指降低影响的措施，不一定消除根因；mitigation of risk 和 risk mitigation 都常见。"},
 {d:16,w:"prerequisite",pos:"n.",p:"/ˌpriːˈrekwəzɪt/",cn:"前置条件、先决要求",k:"prerequisite",ex:"The CSI snapshot controller is a prerequisite for cross-account backups.",tr:"CSI 快照控制器是跨账号备份的前置条件。",usage:"a prerequisite for something / doing something 是先决条件；可说 X is a prerequisite for Y。"},
 {d:16,w:"ambiguous",pos:"adj.",p:"/æmˈbɪɡjuəs/",cn:"含糊不清的、有歧义的",k:"ambiguous",ex:"The error message was ambiguous, so we had to check the raw stdout.",tr:"报错信息含糊不清，我们只好去查原始的 stdout 输出。",usage:"an ambiguous message 有不止一种理解；不只是信息少，想说不清楚也可用 unclear。"},
 {d:16,w:"chuck",pos:"v.",p:"/tʃʌk/",cn:"随手一扔；扔掉（澳洲口语）",k:"chuck",ex:"Just chuck your bags in the boot and we'll head off.",tr:"把包随手扔后备箱就行，我们出发吧。",usage:"英澳非正式表达：chuck something in the boot 是随手放进后备厢；chuck it out 才是扔掉。"},
 {d:16,w:"knackered",pos:"adj.",p:"/ˈnækəd/",cn:"累瘫了（英澳）；零件报废了",k:"knackered",ex:"After a full day of driving we were absolutely knackered.",tr:"开了一整天车，我们累得不行。",usage:"I'm absolutely knackered 是累瘫了，英澳朋友间常用；偏随意，正式邮件可说 exhausted。"},
 {d:16,w:"sturdy",pos:"adj.",p:"/ˈstɜːdi/",cn:"结实耐用的、扎实的",k:"sturdy",ex:"Pack a sturdy pair of shoes for the walks in Tasmania.",tr:"去塔斯马尼亚徒步，带一双结实的鞋。",usage:"sturdy shoes / furniture 指结实耐用；形容人时可指身体健壮，不是描述柔韧性的词。"},
 {d:16,w:"no worries",pos:"phr.",p:"/nəʊ ˈwʌriz/",cn:"没事、不用谢（澳洲国民短语）",k:"No worries",ex:"Sorry I'm late. — No worries, mate.",tr:"抱歉我迟到了。——没事儿。",usage:"澳洲日常可回应道谢、道歉或小请求：No worries；较正式的严肃问题中可用更具体的回复。"},
 {d:16,w:"how are you going",pos:"phr.",p:"/haʊ ə juː ˈɡəʊɪŋ/",cn:"最近怎么样（澳式问候，非问交通）",k:"How are you going",ex:"How are you going? Settling into Melbourne alright?",tr:"最近怎么样？在墨尔本还适应吗？",usage:"澳式 How are you going? 是问近况或状态，常简短回应 Good, thanks；不是问你坐什么交通工具。"},
 {d:16,w:"give someone a hand",pos:"phr.",p:"/ɡɪv ə hænd/",cn:"搭把手、帮个忙",k:"give me a hand",ex:"Could you give me a hand with the handover notes?",tr:"能帮我一起弄一下交接文档吗？",usage:"give someone a hand with something 是帮忙处理；give someone a big hand 在演出场合也可指鼓掌。"},
 {d:16,w:"sort something out",pos:"phr. v.",p:"/sɔːt aʊt/",cn:"搞定、处理妥当（英澳口语）",k:"sort out",ex:"I'll sort out the SIM card once we land in Brisbane.",tr:"落地布里斯班之后我把电话卡搞定。",usage:"sort out a problem / booking 是处理妥当；代词放中间：sort it out，英澳口语很常见。"},

 {d:17,w:"escalate",pos:"v.",p:"/ˈeskəleɪt/",cn:"升级上报；（事态）恶化",k:"escalate",ex:"If there's no response within an hour, escalate it to the on-call manager.",tr:"如果一小时内没有响应，就上报给值班经理。",usage:"escalate an issue to someone 是上报请更高层介入；不及物用法 The situation escalated 指事态升级。"},
 {d:17,w:"consolidate",pos:"v.",p:"/kənˈsɒlɪdeɪt/",cn:"整合归并（成一个）",k:"consolidated",ex:"We consolidated four monitoring dashboards into a single view.",tr:"我们把四个监控面板整合成了一个视图。",usage:"consolidate several things into one 是归并整合；也可说 consolidate gains 指巩固已取得的成果。"},
 {d:17,w:"latent",pos:"adj.",p:"/ˈleɪtnt/",cn:"潜伏的、尚未显现的（≠latency）",k:"latent",ex:"The bug had been latent for months before the upgrade exposed it.",tr:"这个 bug 潜伏了好几个月，直到升级才把它暴露出来。",usage:"a latent bug / risk 是已存在但尚未显现的问题；latency 是延迟，词形相似但不能互换。"},
 {d:17,w:"scenic",pos:"adj.",p:"/ˈsiːnɪk/",cn:"风景优美的（路线/观景点）",k:"scenic",ex:"Take the scenic route along the coast rather than the highway.",tr:"走沿海的景观路线，别走高速。",usage:"a scenic route / drive 指风景好的路线或行程；take the scenic route 常暗示绕远一点看风景。"},
 {d:17,w:"rugged",pos:"adj.",p:"/ˈrʌɡɪd/",cn:"崎岖粗犷的；耐造的（读 RUG-gid）",k:"rugged",ex:"Tasmania's west coast is wild and rugged.",tr:"塔斯马尼亚的西海岸荒野而崎岖。",usage:"rugged terrain / coastline 是崎岖粗犷的地形；rugged equipment 则是耐用、能扛恶劣条件。"},
 {d:17,w:"brisk",pos:"adj.",p:"/brɪsk/",cn:"（天气）清冽微寒的",k:"brisk",ex:"Mornings in Hobart can be brisk even in spring.",tr:"即使在春天，霍巴特的早晨也可能相当清冽。",usage:"这里指空气清冷、让人精神一振：a brisk morning / breeze；与 brisk walk 的快步含义不同。"},
 {d:17,w:"grab a bite",pos:"phr.",p:"/ɡræb ə baɪt/",cn:"随便吃点东西",k:"grab a bite",ex:"We've got two hours — want to grab a bite?",tr:"我们还有两个小时，去随便吃点？",usage:"grab a bite to eat 是随便吃一点，语气轻松；Want to grab a bite? 很适合邀朋友简单吃饭。"},
 {d:17,w:"pop in",pos:"phr. v.",p:"/pɒp ɪn/",cn:"顺路进去一下、短暂造访",k:"pop in",ex:"Let's pop in for a coffee before the museum opens.",tr:"趁博物馆还没开门，我们进去喝杯咖啡。",usage:"pop in for a coffee / a quick chat 是短暂造访；pop into a shop 表示顺便进某家店。"},
 {d:17,w:"be worth it",pos:"phr.",p:"/wɜːθ ɪt/",cn:"值得（花这个时间或钱）",k:"worth it",ex:"The two-hour drive was long, but the view was worth it.",tr:"两小时车程是久了点，但那个景色值了。",usage:"be worth it 是付出时间、金钱或精力后觉得划算；具体接活动时用 worth doing，不用 worth to do。"},
 {d:17,w:"first thing tomorrow",pos:"phr.",p:"/fɜːst θɪŋ təˈmɒrəʊ/",cn:"明天一早（第一件事就办）",k:"first thing tomorrow",ex:"I'll send the RCA draft first thing tomorrow.",tr:"我明天一早就把 RCA 初稿发出去。",usage:"表示明天开始工作或起床后就优先处理；不用加 at，可说 I'll do it first thing tomorrow morning。"},

 {d:18,w:"contingent",pos:"adj.",p:"/kənˈtɪndʒənt/",cn:"取决于…的（contingent on）",k:"contingent",ex:"The go-live date is contingent on the security review passing.",tr:"上线日期取决于安全评审能否通过。",usage:"be contingent on something / doing something 是以某条件为前提；较正式，相当于 depend on。"},
 {d:18,w:"revert",pos:"v.",p:"/rɪˈvɜːt/",cn:"恢复原状、回退（≠回复邮件）",k:"revert",ex:"If the metrics don't improve, we'll revert to the previous config.",tr:"如果指标没有改善，我们就回退到之前的配置。",usage:"revert to a previous version 是恢复先前状态；跨地区工作沟通里，回复邮件用 reply / get back to 更清楚。"},
 {d:18,w:"discern",pos:"v.",p:"/dɪˈsɜːn/",cn:"辨别出、看出（细微差别）",k:"discern",ex:"It's hard to discern any pattern from the logs alone.",tr:"仅凭日志很难辨别出任何规律。",usage:"discern a pattern / difference 指看出不明显的规律或差别；discern A from B 是辨别两者。"},
 {d:18,w:"twitchy",pos:"adj.",p:"/ˈtwɪtʃi/",cn:"（转向）过于敏感神经质的（≠nimble）",k:"twitchy",ex:"Too little caster makes the steering feel twitchy on the highway.",tr:"主销后倾角太小会让高速上的转向显得过于神经质。",usage:"车评中的 twitchy steering 指过于敏感、不够安定；形容人则是紧张不安，不是单纯动作灵活。"},
 {d:18,w:"tepid",pos:"adj.",p:"/ˈtepɪd/",cn:"温吞的；反应冷淡的",k:"tepid",ex:"Serve it right away — a flat white goes tepid fast.",tr:"要马上喝，flat white 很快就变温吞了。",usage:"tepid coffee 是温吞、不够热的咖啡；a tepid response 则是冷淡、不热烈的回应。"},
 {d:18,w:"frugal",pos:"adj.",p:"/ˈfruːɡl/",cn:"节俭的（褒义，≠stingy 抠门）",k:"frugal",ex:"Being frugal in your thirties is what makes compounding work.",tr:"三十几岁时的节俭，正是复利发挥作用的前提。",usage:"frugal with money 指精打细算，通常带肯定意味；stingy 更偏向不愿给别人花钱的吝啬。"},
 {d:18,w:"across the board",pos:"phr.",p:"/əˈkrɒs ðə bɔːd/",cn:"全面地、所有方面都",k:"across the board",ex:"We saw improvements across the board after the kernel upgrade.",tr:"内核升级之后，各项指标全面改善。",usage:"improvements / cuts across the board 指各方面都改善或削减；放在名词前可写 across-the-board cuts。"},
 {d:18,w:"in a nutshell",pos:"phr.",p:"/ɪn ə ˈnʌtʃel/",cn:"简而言之、一句话概括",k:"In a nutshell",ex:"In a nutshell, the agent was reporting success while doing nothing.",tr:"简而言之，那个 agent 什么都没做却在上报成功。",usage:"In a nutshell, ... 用来压缩成核心结论；工作汇报和日常解释都可用，但后面宜简短。"},
 {d:18,w:"keep an eye on something",pos:"phr.",p:"/kiːp ən aɪ ɒn/",cn:"留意盯着（被动观察）",k:"Keep an eye on",ex:"Keep an eye on the disk usage over the weekend.",tr:"周末留意一下磁盘使用率。",usage:"keep an eye on something 表示持续留意；也可说 keep an eye on my bag，请人帮忙照看包。"},
 {d:18,w:"more often than not",pos:"phr.",p:"/mɔːr ˈɒfn ðən nɒt/",cn:"多数情况下、往往",k:"More often than not",ex:"More often than not, the alert clears itself within minutes.",tr:"多数情况下，这个告警几分钟内会自行恢复。",usage:"表示通常如此、超过一半的情况，但不提供精确比例；语气比 always 留有余地。"},

 {d:19,tag:"bad",w:"rally",pos:"n. / v.",p:"/ˈræli/",cn:"多拍回合；（市场）反弹回升",k:"rally",ex:"That rally must have lasted forty shots.",tr:"那个回合肯定打了四十拍。",usage:"羽毛球的 a rally 是发球后直到这一分结束的连续来回；金融里的 a rally 则是价格回升。"},
 {d:19,tag:"bad",w:"lunge",pos:"v. / n.",p:"/lʌndʒ/",cn:"跨步扑救、弓步上网",k:"lunged",ex:"He lunged forward to scoop up the net shot.",tr:"他跨步向前把网前球挑了起来。",usage:"lunge forward / at something 是突然跨大步扑向目标；训练动作 a lunge 是弓步。"},
 {d:19,tag:"bad",w:"deceptive",pos:"adj.",p:"/dɪˈseptɪv/",cn:"有欺骗性的（假动作）",k:"deceptive",ex:"Her forehand is deceptive — the smash and the drop look identical.",tr:"她的正手很有欺骗性，杀球和吊球的动作一模一样。",usage:"a deceptive shot 指动作让对手判断错球路；其他语境中 deceptive appearances 是具有误导性的外表。"},
 {d:19,tag:"bad",w:"stamina",pos:"n.",p:"/ˈstæmɪnə/",cn:"耐力、体能储备",k:"stamina",ex:"Three games in, it comes down to stamina rather than technique.",tr:"打到第三局，拼的就是耐力而不是技术了。",usage:"build / improve stamina 是提高耐力；通常不可数，强调持续活动的能力，而非一次爆发的力量。"},
 {d:19,tag:"bad",w:"agility",pos:"n.",p:"/əˈdʒɪləti/",cn:"敏捷性（形容词 agile /ˈædʒaɪl/）",k:"agility",ex:"Footwork drills build agility more than raw speed does.",tr:"步法练习对敏捷性的提升比单纯练速度更明显。",usage:"agility drills / training 指敏捷训练，侧重快速改变方向和姿态；形容词是 agile。"},
 {d:19,tag:"bad",w:"flick",pos:"n. / v.",p:"/flɪk/",cn:"抖腕轻弹（偷发后场、挑球）",k:"flick",ex:"A flick serve works well if your opponent stands too close.",tr:"如果对手站得太靠前，偷发一个后场球很有效。",usage:"a flick serve 是通过快速抖腕等动作把球发向后场；flick your wrist 强调短促、迅速的动作。"},
 {d:19,tag:"bad",w:"unforced error",pos:"phr.",p:"/ʌnˈfɔːst ˈerə/",cn:"非受迫失误（自己送的分）",k:"unforced errors",ex:"I lost that game on unforced errors, not on his attack.",tr:"那一局我是输在自己的非受迫失误，而不是他的进攻。",usage:"体育术语，指没有被对手强力逼迫却自己失误；常用复数 make / cut down on unforced errors。"},
 {d:19,tag:"bad",w:"have the edge over someone",pos:"phr.",p:"/hæv ði edʒ/",cn:"略占优势、稍胜一筹",k:"has the edge over",ex:"He has the edge over me at the net, but I'm better at the back.",tr:"网前他比我强一点，但后场我更好。",usage:"have the edge over someone 是略胜一筹，不一定全面压倒；也可用 a slight edge 强调优势很小。"},
 {d:19,tag:"bad",w:"hold one's own",pos:"phr.",p:"/həʊld wʌnz əʊn/",cn:"撑得住、不落下风",k:"held my own",ex:"I held my own against a much stronger player.",tr:"面对实力强得多的对手，我也没落下风。",usage:"hold my / your own against someone 是面对强者仍不落下风；强调能竞争，不保证最后获胜。"},
 {d:19,tag:"bad",w:"be off one's game",pos:"phr.",p:"/ɒf wʌnz ɡeɪm/",cn:"状态不佳（反义 on my game）",k:"off my game",ex:"I was completely off my game last night.",tr:"昨晚我状态完全不在。",usage:"be off my game 表示当天没发挥出平时水平；人称可换 his / her，日常工作也能借用。"},

 {d:20,tag:"au",w:"marsupial",pos:"n.",p:"/mɑːˈsuːpiəl/",cn:"有袋动物",k:"marsupials",ex:"Wombats are marsupials, despite looking nothing like kangaroos.",tr:"袋熊也是有袋动物，尽管长得跟袋鼠毫不相像。",usage:"名词 a marsupial 指有袋动物；也可作形容词，如 marsupial mammals，不是所有澳洲动物都属此类。"},
 {d:20,tag:"au",w:"nocturnal",pos:"adj.",p:"/nɒkˈtɜːnl/",cn:"夜行性的",k:"nocturnal",ex:"Most Australian marsupials are nocturnal, so dusk is the best time to spot them.",tr:"澳洲多数有袋动物都是夜行性的，所以黄昏是最好的观察时段。",usage:"nocturnal animals 通常在夜间活动；相对的 diurnal 指日间活动，不能只因偶尔夜间出现就下定义。"},
 {d:20,tag:"au",w:"elusive",pos:"adj.",p:"/ɪˈluːsɪv/",cn:"难得一见的、难以捉摸的",k:"elusive",ex:"The platypus is famously elusive — you need patience and a quiet creek.",tr:"鸭嘴兽出了名的难得一见，需要耐心和一条安静的溪流。",usage:"an elusive animal 很难见到或找到；an elusive answer 则是迟迟找不到的答案，不只用于动物。"},
 {d:20,tag:"au",w:"venomous",pos:"adj.",p:"/ˈvenəməs/",cn:"有毒的（咬你注毒；≠poisonous 吃了中毒）",k:"venomous",ex:"Australia has plenty of venomous snakes, but bites are rare.",tr:"澳洲有很多毒蛇，但真正被咬的情况其实很少见。",usage:"venomous 通常指通过咬、刺等主动注入毒液；poisonous 指接触或摄入有害物质，重点是毒的传递方式。"},
 {d:20,tag:"au",w:"endemic",pos:"adj.",p:"/enˈdemɪk/",cn:"某地特有的、只在此处有的",k:"endemic",ex:"The Tasmanian devil is endemic to Tasmania.",tr:"袋獾是塔斯马尼亚特有的物种。",usage:"be endemic to a place 指自然分布限于该地区；native to 只表示原生，未必仅此地有。"},
 {d:20,tag:"au",w:"burrow",pos:"n. / v.",p:"/ˈbʌrəʊ/",cn:"洞穴；挖洞",k:"burrows",ex:"Wombats dig enormous burrows that can run for tens of metres.",tr:"袋熊会挖出巨大的洞穴，长度可达数十米。",usage:"a burrow 是动物挖的洞；动词 burrow into the ground 是往地下钻，注意不是 borrow（借）。"},
 {d:20,tag:"au",w:"in the wild",pos:"phr.",p:"/ɪn ðə waɪld/",cn:"在野外（非圈养状态）",k:"in the wild",ex:"Seeing a koala in the wild is much harder than at a sanctuary.",tr:"在野外看到考拉，比在保护区里难得多。",usage:"固定说 in the wild，保留 the；与 in captivity（圈养中）相对，也能借指真实使用环境。"},
 {d:20,tag:"au",w:"be on the lookout for",pos:"phr.",p:"/ɒn ðə ˈlʊkaʊt fɔː/",cn:"留意寻找、警惕着",k:"on the lookout for",ex:"Be on the lookout for kangaroos on the road around dusk.",tr:"黄昏前后开车，要留意路上的袋鼠。",usage:"be on the lookout for something 是主动留意寻找或警惕；开车时也常见 Look out for kangaroos。"},
 {d:20,tag:"au",w:"give something a wide berth",pos:"phr.",p:"/ə waɪd bɜːθ/",cn:"远远绕开、敬而远之",k:"a wide berth",ex:"If you see a snake on the track, just give it a wide berth.",tr:"如果在小路上看到蛇，远远绕开就行。",usage:"give someone / something a wide berth 是远远避开；既可字面绕开动物，也可比喻避开某人。"},
 {d:20,tag:"au",w:"in the middle of nowhere",pos:"phr.",p:"/ɪn ðə ˈmɪdl əv ˈnəʊweə/",cn:"荒郊野外、前不着村后不着店",k:"in the middle of nowhere",ex:"We ran low on fuel in the middle of nowhere.",tr:"我们在前不着村后不着店的地方快没油了。",usage:"口语夸张说位置特别偏远；常说 be stuck in the middle of nowhere，不一定真是完全无人区。"},

 {d:21,tag:"au",w:"swoop",pos:"v. / n.",p:"/swuːp/",cn:"（鸟）俯冲攻击",k:"swoop",ex:"Magpies swoop cyclists during nesting season.",tr:"筑巢季节里，喜鹊会俯冲攻击骑车的人。",usage:"swoop down on / at someone 指快速俯冲靠近或攻击；澳洲常见 magpie swooping season 这一说法。"},
 {d:21,tag:"au",w:"feral",pos:"adj.",p:"/ˈferəl/",cn:"野化的（原本家养；≠wild 天生野生）",k:"Feral",ex:"Feral cats are a serious threat to native wildlife.",tr:"野化的家猫对本土野生动物构成严重威胁。",usage:"feral cats / pigs 指野化、在野外繁衍的家养动物；wild 通常更广泛地描述野生状态。"},
 {d:21,tag:"au",w:"placid",pos:"adj.",p:"/ˈplæsɪd/",cn:"温和平静的（性情或水面）",k:"placid",ex:"Koalas look placid, but they can be surprisingly grumpy.",tr:"考拉看着温顺，其实脾气可能出奇地差。",usage:"a placid animal / lake 指温和的动物或平静水面；不等于永远不会受刺激或生气。"},
 {d:21,tag:"au",w:"sanctuary",pos:"n.",p:"/ˈsæŋktʃuəri/",cn:"野生动物保护区；庇护所",k:"sanctuary",ex:"The sanctuary rehabilitates injured wildlife before releasing them.",tr:"这家保护区会先让受伤的野生动物康复，再放归自然。",usage:"a wildlife sanctuary 是野生动物保护或救护场所；seek sanctuary 是寻求庇护，语境决定具体形式。"},
 {d:21,tag:"bad",w:"reflexes",pos:"n. pl.",p:"/ˈriːfleksɪz/",cn:"反应神经（单数 reflex）",k:"reflexes",ex:"Doubles at the net is all about reflexes.",tr:"双打网前拼的全是反应速度。",usage:"体育中常用复数 quick / sharp reflexes，指反应能力；a reflex 则可指单个反射动作。"},
 {d:21,tag:"bad",w:"relentless",pos:"adj.",p:"/rɪˈlentləs/",cn:"不间断的、不留情面的",k:"relentless",ex:"His attack was relentless — I never got a chance to settle.",tr:"他的进攻毫不留情，我根本没机会站稳节奏。",usage:"relentless pressure / rain 强调一直持续、不给喘息；a relentless player 可褒可贬，取决于语境。"},
 {d:21,tag:"bad",w:"get the hang of something",pos:"phr.",p:"/ɡet ðə hæŋ əv/",cn:"掌握窍门、终于上手",k:"get the hang of",ex:"It took me a season to get the hang of the backhand clear.",tr:"我花了一整个赛季才掌握反手高远球的窍门。",usage:"get the hang of doing something 指通过练习摸到窍门；I'm getting the hang of it 是逐渐上手。"},
 {d:21,w:"on the fly",pos:"phr.",p:"/ɒn ðə flaɪ/",cn:"临场调整、边做边改",k:"on the fly",ex:"We changed tactics on the fly after losing the first game.",tr:"输掉第一局后，我们临场调整了战术。",usage:"do / change something on the fly 是边进行边调整，没有先停下来完整准备；不一定是仓促乱做。"},
 {d:21,tag:"au",w:"be in for something",pos:"phr.",p:"/biː ɪn fɔː/",cn:"即将面临、少不了要遇上",k:"in for",ex:"If you're driving to Cairns in February, you're in for some rain.",tr:"二月开车去凯恩斯的话，少不了要遇上雨。",usage:"be in for a tough day / a treat 表示将遇到某种经历；既能预告麻烦，也能预告好事。"},
 {d:21,tag:"bad",w:"be no match for someone",pos:"phr.",p:"/nəʊ mætʃ fɔː/",cn:"完全不是对手",k:"no match for",ex:"My smash is no match for his, so I play the long game.",tr:"我的杀球完全比不过他，所以我打拉吊消耗。",usage:"be no match for someone / something 是能力明显比不上；与 be a good match（匹配、势均力敌）不同。"},

 {d:22,w:"fluctuate",pos:"v.",p:"/ˈflʌktʃueɪt/",cn:"波动起伏（正在上下动）",k:"fluctuates",ex:"Memory usage fluctuates between forty and eighty percent all day.",tr:"内存占用一整天都在四成到八成之间波动。",usage:"fluctuate between A and B 是在两数之间波动；也可说 fluctuate with demand，表示随需求起伏。"},
 {d:22,w:"obsolete",pos:"adj.",p:"/ˈɒbsəliːt/",cn:"已淘汰的、彻底没人用的",k:"obsolete",ex:"That TLS version is obsolete and will be blocked next quarter.",tr:"那个 TLS 版本已经淘汰，下季度会被直接封禁。",usage:"obsolete technology 已过时或不再需要；技术文档中 deprecated 是不再推荐，可能仍暂时可用。"},
 {d:22,w:"proximity",pos:"n.",p:"/prɒkˈsɪməti/",cn:"邻近、距离上的接近",k:"proximity",ex:"We chose the hotel for its proximity to the airport.",tr:"我们选这家酒店是因为离机场近。",usage:"in close proximity to something 是离某物很近，语气较正式；日常说 close to 更简洁。"},
 {d:22,w:"parched",pos:"adj.",p:"/pɑːtʃt/",cn:"渴得要命；（土地）干裂的",k:"parched",ex:"After two sets I was absolutely parched.",tr:"打完两局我渴得不行。",usage:"I'm parched 是口语说渴极了；parched land 指干得缺水的土地，不是空气湿度的描述。"},
 {d:22,w:"hefty",pos:"adj.",p:"/ˈhefti/",cn:"沉重的；（金额）数目可观的",k:"hefty",ex:"Changing the flight came with a hefty fee.",tr:"改签航班要付一笔不小的费用。",usage:"a hefty fee / fine 指一大笔费用或罚款；a hefty suitcase 则是沉重的行李箱，偏口语。"},
 {d:22,w:"dwindle",pos:"v.",p:"/ˈdwɪndl/",cn:"逐渐减少、慢慢缩水",k:"dwindled",ex:"Our remaining IP addresses dwindled to fewer than twenty.",tr:"我们剩余的 IP 地址逐渐减少到不足二十个。",usage:"resources / numbers dwindle 指数量逐步减少；dwindle to ... 说明最后剩多少，一般不直接接宾语。"},
 {d:22,w:"run its course",pos:"phr.",p:"/rʌn ɪts kɔːs/",cn:"自行发展完、走完过程",k:"run its course",ex:"We let the retry loop run its course rather than killing the job.",tr:"我们让重试循环自己走完，而不是直接杀掉任务。",usage:"let something run its course 是让过程自然走完；常用于疾病、趋势或事件，不一定表示什么都不管。"},
 {d:22,w:"at a glance",pos:"phr.",p:"/ət ə ɡlɑːns/",cn:"一眼就能看出、一目了然",k:"at a glance",ex:"The new dashboard shows cluster health at a glance.",tr:"新面板可以让你一眼看出集群健康状况。",usage:"see / tell at a glance 是一眼即可看出；take a glance at something 才是主动瞥一眼。"},
 {d:22,w:"bank on something",pos:"phr. v.",p:"/bæŋk ɒn/",cn:"指望、把把握押在某事上",k:"bank on",ex:"Don't bank on the vendor patch arriving before Friday.",tr:"别指望厂商的补丁能在周五前到。",usage:"bank on someone / something / doing something 是有把握地指望；Don't bank on it 是别太指望它。"},
 {d:22,w:"in the long run",pos:"phr.",p:"/ɪn ðə lɒŋ rʌn/",cn:"从长远来看",k:"in the long run",ex:"Index funds win in the long run, even if they feel boring now.",tr:"从长远来看指数基金会赢，即便现在觉得无聊。",usage:"in the long run 强调经过较长时间后的结果；与 in the short term（短期内）常成对使用。"},

 {d:23,w:"deteriorate",pos:"v.",p:"/dɪˈtɪəriəreɪt/",cn:"恶化、每况愈下（五个音节）",k:"deteriorated",ex:"Network latency deteriorated steadily over the weekend.",tr:"整个周末网络延迟持续恶化。",usage:"conditions / performance deteriorate 指变差，通常不直接接宾语；要说使某事恶化可用 worsen something。"},
 {d:23,w:"viable",pos:"adj.",p:"/ˈvaɪəbl/",cn:"可行的、实际能落地的",k:"viable",ex:"Rolling back is the only viable option at this point.",tr:"到这一步，回滚是唯一可行的方案。",usage:"a viable option / solution 是在现实条件下可行的方案，不只是理论上想得到；commercially viable 指商业上可行。"},
 {d:23,w:"threshold",pos:"n.",p:"/ˈθreʃhəʊld/",cn:"阈值、临界点；门槛",k:"threshold",ex:"The alert fires once CPU crosses the eighty percent threshold.",tr:"CPU 超过 80% 阈值后就会触发告警。",usage:"cross / exceed a threshold 是跨过阈值；a pain threshold 是痛觉耐受限度，a doorway threshold 是门槛。"},
 {d:23,w:"brittle",pos:"adj.",p:"/ˈbrɪtl/",cn:"脆的、一碰就崩的（系统或材料）",k:"brittle",ex:"The deployment script is brittle — any change to the path breaks it.",tr:"这个部署脚本很脆，路径一改就崩。",usage:"brittle materials 容易断裂；brittle code / systems 借指遇到小变化就出故障，带负面评价。"},
 {d:23,w:"humid",pos:"adj.",p:"/ˈhjuːmɪd/",cn:"潮湿闷热的",k:"humid",ex:"Cairns gets seriously humid in the wet season.",tr:"雨季的凯恩斯会闷热得厉害。",usage:"humid weather / air 指空气水汽多；并非一定炎热，hot and humid 才明确同时闷热潮湿。"},
 {d:23,w:"sparse",pos:"adj.",p:"/spɑːs/",cn:"稀疏的、稀少的",k:"sparse",ex:"Traffic gets sparse once you're past the last town.",tr:"过了最后一个镇子，路上车就很少了。",usage:"sparse traffic / vegetation 指密度低、分布零散；sparse information 则是信息少、不够充分。"},
 {d:23,w:"pull it off",pos:"phr.",p:"/pʊl ɪt ɒf/",cn:"（有难度地）成功做成",k:"pulled it off",ex:"Finishing the migration in one window was ambitious, but we pulled it off.",tr:"一个窗口内完成迁移挺激进的，但我们做成了。",usage:"pull off a difficult task 是成功做成难事；代词必须放中间：pull it off，不说 pull off it。"},
 {d:23,w:"the bottom line",pos:"phr.",p:"/ðə ˈbɒtəm laɪn/",cn:"关键结论、说到底",k:"The bottom line",ex:"The bottom line is that we need a second maintenance window.",tr:"结论是，我们还需要第二个维护窗口。",usage:"The bottom line is that ... 用来引出最关键的结论；财务语境中 bottom line 也指净利润。"},
 {d:23,w:"down the line",pos:"phr.",p:"/daʊn ðə laɪn/",cn:"以后、将来某个时候",k:"down the line",ex:"We can revisit the architecture further down the line.",tr:"架构的事我们可以以后再回过头来看。",usage:"somewhere / further down the line 指将来某个阶段；表达时间较模糊，不适合代替明确的交付日期。"},
 {d:23,w:"from scratch",pos:"phr.",p:"/frəm skrætʃ/",cn:"从零开始、从头做起",k:"from scratch",ex:"It was faster to rebuild the node from scratch than to debug it.",tr:"把节点从零重建比慢慢排查更快。",usage:"build / cook / start from scratch 是从零开始；make food from scratch 常指自己用原料做，而非用现成品。"},

 {d:24,w:"concede",pos:"v.",p:"/kənˈsiːd/",cn:"承认（对方对）；让掉一局",k:"concede",ex:"I'll concede that the vendor's explanation makes sense.",tr:"我承认厂商的解释是说得通的。",usage:"concede that ... 是勉强承认对方有道理；concede a point / goal 则可指让出分数或被对方得分。"},
 {d:24,w:"stipulate",pos:"v.",p:"/ˈstɪpjuleɪt/",cn:"（合同或规定）明确规定",k:"stipulates",ex:"The SLA stipulates a four-hour response time for P1 incidents.",tr:"服务协议明确规定 P1 故障需在四小时内响应。",usage:"stipulate that ... / stipulate a condition 表示条款明确要求；常见于合同和规定，日常请求用 ask 更自然。"},
 {d:24,w:"incremental",pos:"adj.",p:"/ˌɪŋkrəˈmentl/",cn:"逐步递增的、小步推进的",k:"incremental",ex:"We took an incremental approach rather than a big-bang cutover.",tr:"我们采取逐步推进的方式，而不是一次性切换。",usage:"incremental changes / improvements 是一点点推进的改变；incremental backup 则是技术里的增量备份。"},
 {d:24,w:"pristine",pos:"adj.",p:"/ˈprɪstiːn/",cn:"原始未受破坏的；崭新如初的",k:"pristine",ex:"Tasmania still has genuinely pristine wilderness.",tr:"塔斯马尼亚仍保有真正原始未被破坏的荒野。",usage:"pristine wilderness 强调原始未受破坏；in pristine condition 指物品像新的一样，侧重点不同。"},
 {d:24,w:"cramped",pos:"adj.",p:"/kræmpt/",cn:"狭窄局促的（≠cramp 抽筋）",k:"cramped",ex:"The economy seats were cramped on the twelve-hour leg.",tr:"十二小时那一程的经济舱座位非常局促。",usage:"a cramped room / seat 指空间狭窄、活动受限；cramp 是抽筋，feel cramped 才是觉得局促。"},
 {d:24,w:"brew",pos:"v. / n.",p:"/bruː/",cn:"冲煮；（麻烦）正在酝酿",k:"brew",ex:"Let it brew for four minutes before you press down.",tr:"按下压杆前先让它浸泡四分钟。",usage:"brew coffee / tea 是冲煮或浸泡；trouble is brewing 是麻烦在酝酿，brew 本身也可作名词指饮品。"},
 {d:24,w:"err on the side of caution",pos:"phr.",p:"/ɜːr ɒn ðə saɪd/",cn:"宁可谨慎一点、保守起见",k:"err on the side of caution",ex:"Let's err on the side of caution and schedule a rollback window.",tr:"保守起见，我们还是预留一个回滚窗口吧。",usage:"表示拿不准时宁可选择更谨慎的一边；err on the side of 后也可接 generosity 等名词。"},
 {d:24,w:"a rough idea",pos:"phr.",p:"/ə rʌf aɪˈdɪə/",cn:"大致的概念、粗略了解",k:"a rough idea",ex:"Can you give me a rough idea of the blast radius?",tr:"能大致说一下影响范围有多大吗？",usage:"have / give a rough idea of something 是有／提供大致了解；rough 在这里不是粗鲁，而是不精确。"},
 {d:24,w:"stand to reason",pos:"phr.",p:"/stænd tə ˈriːzn/",cn:"合乎情理、想想也知道",k:"stands to reason",ex:"It stands to reason that a bigger node pool would ease the pressure.",tr:"想想也知道，节点池更大一些自然能缓解压力。",usage:"固定结构 It stands to reason that ...，表示结论合乎情理；it 作主语时 stands 要加 s。"},
 {d:24,w:"off the hook",pos:"phr.",p:"/ɒf ðə hʊk/",cn:"脱身、不用担责了",k:"off the hook",ex:"The vendor confirmed it was their bug, so we're off the hook.",tr:"厂商确认是他们的 bug，所以我们脱责了。",usage:"be / get off the hook 是摆脱责任、义务或困境；let someone off the hook 是不再追究或放过对方。"},

 {d:25,w:"anomaly",pos:"n.",p:"/əˈnɒməli/",cn:"异常现象、反常数据点",k:"anomaly",ex:"The spike looked like an anomaly until it happened again on Thursday.",tr:"那个尖峰本来像是个异常点，直到周四又出现了一次。",usage:"detect / investigate an anomaly 是发现／调查异常；复数 anomalies，异常点不一定意味着已经找到故障根因。"},
 {d:25,w:"supersede",pos:"v.",p:"/ˌsuːpəˈsiːd/",cn:"取代、替代（拼 -sede 不是 -cede）",k:"supersedes",ex:"This runbook supersedes the version from last March.",tr:"本操作手册取代去年三月的版本。",usage:"A supersedes B 表示新版本替代旧版本，较正式；特别注意拼写 supersede，不是 supercede。"},
 {d:25,w:"rigorous",pos:"adj.",p:"/ˈrɪɡərəs/",cn:"严格缜密的（测试或流程）",k:"rigorous",ex:"The change passed a rigorous review before it reached production.",tr:"该变更在进入生产前通过了严格的评审。",usage:"rigorous testing / analysis 指严格、细致、缜密；rigorous 不等于 rigid，后者常指僵化不灵活。"},
 {d:25,w:"hollow",pos:"adj.",p:"/ˈhɒləʊ/",cn:"空洞的、中空的；（声音）发闷的",k:"hollow",ex:"The brakes made a hollow sound, which turned out to be worn pads.",tr:"刹车发出一种发闷的声音，后来发现是刹车片磨损了。",usage:"a hollow sound 指带空腔感的声音；hollow promises 是空洞承诺，hollow victory 是缺乏满足感的胜利。"},
 {d:25,w:"sprawling",pos:"adj.",p:"/ˈsprɔːlɪŋ/",cn:"蔓延扩张的、摊得很开的",k:"sprawling",ex:"Melbourne is sprawling, so plan for longer drives than you expect.",tr:"墨尔本摊得很开，行程上要多留些车程时间。",usage:"a sprawling city / suburb 指向外扩展、覆盖面积大；可能暗示分散，不能简单等同于人口密集。"},
 {d:25,w:"nagging",pos:"adj.",p:"/ˈnæɡɪŋ/",cn:"挥之不去的、隐隐作痛的",k:"nagging",ex:"I had a nagging feeling we'd missed something in the checklist.",tr:"我一直有种挥之不去的感觉，checklist 上漏了什么。",usage:"a nagging doubt / pain 指持续纠缠的疑虑或隐痛；a nagging person 则是在不停唠叨的人。"},
 {d:25,w:"cover for someone",pos:"phr. v.",p:"/ˈkʌvə fɔː/",cn:"替某人顶班、代为处理",k:"cover for me",ex:"Could you cover for me on Friday? I'll take your Monday shift.",tr:"周五能帮我顶个班吗？你周一的班我来上。",usage:"cover for someone 可指替人顶班，也可指替人掩饰过失；工作交接最好明确说明覆盖哪项职责。"},
 {d:25,w:"be swept under the rug",pos:"phr.",p:"/swept ˈʌndə ðə rʌɡ/",cn:"被掩盖过去、压下不提",k:"swept under the rug",ex:"This near-miss shouldn't be swept under the rug.",tr:"这次险些出事的情况不该被掩盖过去。",usage:"sweep a problem under the rug 指刻意掩盖、不处理；英澳也常说 under the carpet，常用于批评。"},
 {d:25,w:"have a lot on one's plate",pos:"phr.",p:"/ə lɒt ɒn wʌnz pleɪt/",cn:"手头事情一大堆",k:"a lot on your plate",ex:"I know you've got a lot on your plate, so no rush.",tr:"我知道你手头事情一大堆，所以不急。",usage:"have a lot on my / your plate 指任务或责任很多；常用来体谅对方忙，不是在说吃了很多食物。"},
 {d:25,w:"split the difference",pos:"phr.",p:"/splɪt ðə ˈdɪfrəns/",cn:"各让一步、折中处理",k:"split the difference",ex:"They wanted Monday, we wanted Friday, so we split the difference.",tr:"他们想周一，我们想周五，最后折中了一下。",usage:"原指在两个数之间各让一半，也常泛指折中；商量价格时 Let's split the difference 很自然。"},

 {d:26,w:"warrant",pos:"v.",p:"/ˈwɒrənt/",cn:"值得、有必要（做某事）",k:"warrant",ex:"A single failed check doesn't warrant waking up the on-call engineer.",tr:"单次检查失败还不至于把值班工程师叫醒。",usage:"warrant action / further investigation 指情况足以值得采取行动；后接动名词也可，如 warrant waking someone up。"},
 {d:26,w:"nuance",pos:"n.",p:"/ˈnjuːɑːns/",cn:"细微差别、微妙之处（nuanced 的名词）",k:"nuance",ex:"There's a nuance here: the agent reports success even when it skips hosts.",tr:"这里有个微妙之处：即使跳过了主机，agent 也会上报成功。",usage:"a nuance 是细微但有意义的差别；the nuances of something 是其中的微妙之处，形容词是 nuanced。"},
 {d:26,w:"impede",pos:"v.",p:"/ɪmˈpiːd/",cn:"阻碍、妨碍（拖慢而非挡死）",k:"impeding",ex:"The approval backlog is impeding the whole migration schedule.",tr:"审批积压正在拖慢整个迁移计划。",usage:"impede progress / traffic / recovery 是阻碍进展；比 prevent 更不强调完全阻止，语气偏正式。"},
 {d:26,w:"candid",pos:"adj.",p:"/ˈkændɪd/",cn:"坦率直言的（不回避问题）",k:"candid",ex:"I'd rather have a candid postmortem than a polished one.",tr:"我宁愿要一份坦率的复盘，而不是一份漂亮的。",usage:"a candid discussion / assessment 指坦率面对问题；to be candid 可引出直言，但仍需注意措辞。"},
 {d:26,w:"lush",pos:"adj.",p:"/lʌʃ/",cn:"草木茂盛葱郁的",k:"lush",ex:"The rainforest around Cairns is unbelievably lush.",tr:"凯恩斯周边的雨林葱郁得令人难以置信。",usage:"lush vegetation / rainforest 指草木丰茂葱郁；形容装修或音乐时也可能指华丽、丰富。"},
 {d:26,w:"brisk",pos:"adj.",p:"/brɪsk/",cn:"（生意）红火的（第三义项）",k:"brisk",ex:"The café does a brisk trade before nine every morning.",tr:"那家咖啡馆每天九点前生意都很红火。",usage:"do a brisk trade 是生意红火的固定搭配；这里的 brisk 描述交易活跃，不是天气冷或走路快。"},
 {d:26,w:"get to the bottom of something",pos:"phr.",p:"/ðə ˈbɒtəm əv/",cn:"查清根源、弄个水落石出",k:"got to the bottom of",ex:"We still haven't got to the bottom of the intermittent timeouts.",tr:"间歇性超时的根源我们还没查清楚。",usage:"get to the bottom of a problem 是弄清根源；常用于排查异常或追查真相，比了解表面情况更深入。"},
 {d:26,w:"hit a snag",pos:"phr.",p:"/hɪt ə snæɡ/",cn:"遇到意外阻碍、卡住了",k:"hit a snag",ex:"We hit a snag halfway through the cutover.",tr:"切换进行到一半时我们遇到了意外阻碍。",usage:"hit / run into a snag 是遇到意外障碍；snag 通常指具体卡点，不一定让整个计划彻底失败。"},
 {d:26,w:"on the same wavelength",pos:"phr.",p:"/seɪm ˈweɪvleŋθ/",cn:"想法合拍、很默契（≠on the same page）",k:"on the same wavelength",ex:"My doubles partner and I are on the same wavelength at the net.",tr:"我和双打搭档在网前特别默契。",usage:"be on the same wavelength 表示思路合拍、容易互相理解；on the same page 更侧重对具体事情达成一致。"},
 {d:26,w:"put something to bed",pos:"phr.",p:"/pʊt tə bed/",cn:"彻底了结、收尾归档",k:"to bed",ex:"Let's put this ticket to bed before the end of the sprint.",tr:"我们在这个 sprint 结束前把这个工单彻底了结。",usage:"put an issue / project to bed 是把事情彻底处理完，偏口语；正式报告可说 resolve / close。"},

 {d:27,w:"prone",pos:"adj.",p:"/prəʊn/",cn:"易于出问题的（prone to）",k:"prone",ex:"Manual patching is prone to human error, especially at 3 a.m.",tr:"手工打补丁容易出人为失误，尤其是凌晨三点。",usage:"be prone to errors / injury / doing something 指容易发生某种问题；to 后接名词或动名词，不接动词原形。"},
 {d:27,w:"segregate",pos:"v.",p:"/ˈseɡrɪɡeɪt/",cn:"隔离分开（网络或环境）",k:"segregate",ex:"We segregate production traffic onto a dedicated subnet.",tr:"我们把生产流量隔离到一个专用子网上。",usage:"segregate A from B 是将两者隔离；技术场景可指流量隔离，涉及人群时可能带歧视性隔离的含义。"},
 {d:27,w:"salvage",pos:"v. / n.",p:"/ˈsælvɪdʒ/",cn:"抢救出来、挽回（部分）",k:"salvage",ex:"We managed to salvage the data from the corrupted volume.",tr:"我们设法从损坏的卷里抢救出了数据。",usage:"salvage data / a situation 是从受损或失败中挽回有用部分；不意味着原样完整恢复。"},
 {d:27,w:"meticulous",pos:"adj.",p:"/məˈtɪkjələs/",cn:"一丝不苟的、极其细致的",k:"meticulous",ex:"His handover notes are meticulous — nothing gets missed.",tr:"他的交接记录一丝不苟，什么都不会漏。",usage:"be meticulous about details / in your work 是做事极细致；常用于赞扬记录、检查或准备工作。"},
 {d:27,w:"torrential",pos:"adj.",p:"/təˈrenʃl/",cn:"（雨）倾盆如注的",k:"Torrential",ex:"Torrential rain closed the coastal road for two days.",tr:"倾盆大雨让沿海公路封闭了两天。",usage:"torrential rain / downpours 是倾盆大雨；通常用来形容雨势，不用来形容闷热或小阵雨。"},
 {d:27,w:"knackered",pos:"adj.",p:"/ˈnækəd/",cn:"（零件）磨坏报废了（第二义项）",k:"knackered",ex:"The rear bushings were completely knackered after the track days.",tr:"跑完那几个赛道日，后桥衬套彻底报废了。",usage:"这里是零件磨损坏掉：The bushings are knackered；形容人则是累坏了，两者都是英澳随意口语。"},
 {d:27,w:"take a step back",pos:"phr.",p:"/teɪk ə step bæk/",cn:"退一步想、跳出来看全局",k:"take a step back",ex:"Let's take a step back — are we even solving the right problem?",tr:"我们退一步想想，我们解决的到底是不是对的问题？",usage:"take a step back from a problem 是暂时抽离、重新看全局；也可字面表示往后退一步。"},
 {d:27,w:"par for the course",pos:"phr.",p:"/pɑː fɔː ðə kɔːs/",cn:"意料之中、习以为常了",k:"par for the course",ex:"Vendor delays are par for the course with this product.",tr:"这个产品的厂商延期已经是家常便饭了。",usage:"That's par for the course 表示这种事在该情况下很常见；往往带无奈语气，不是称赞事情做得好。"},
 {d:27,w:"throw someone under the bus",pos:"phr.",p:"/ˈʌndə ðə bʌs/",cn:"甩锅给某人、出卖队友",k:"thrown under the bus",ex:"A blameless postmortem means nobody gets thrown under the bus.",tr:"无责复盘意味着没有人会被甩锅。",usage:"throw someone under the bus 是为自保牺牲或甩锅给他人，语气强；无责复盘中可用其被动形式。"},
 {d:27,w:"a can of worms",pos:"phr.",p:"/ə kæn əv wɜːmz/",cn:"一堆麻烦事、打开就收不住",k:"a real can of worms",ex:"Refactoring that module would open a real can of worms.",tr:"重构那个模块会捅出一大堆麻烦。",usage:"open a can of worms 指牵出一串难处理的问题；常用于劝人先想清楚某项改动的连带影响。"},

 {d:28,w:"scrutinise",pos:"v.",p:"/ˈskruːtənaɪz/",cn:"细看审查（美式拼 scrutinize）",k:"scrutinised",ex:"We scrutinised every line of the diff before approving it.",tr:"批准之前，我们逐行审查了那份 diff。",usage:"scrutinise a document / decision 是仔细审查，直接接宾语；美式常拼 scrutinize，名词是 scrutiny。"},
 {d:28,w:"mundane",pos:"adj.",p:"/mʌnˈdeɪn/",cn:"平凡琐碎的、普通不起眼的",k:"mundane",ex:"The root cause turned out to be something mundane — a full disk.",tr:"根因原来是件很平常的事——磁盘满了。",usage:"mundane tasks / details 指平常、琐碎甚至有点无聊的事；用来描述原因时强调它并不神秘。"},
 {d:28,w:"curb",pos:"v. / n.",p:"/kɜːb/",cn:"抑制、控制住（增长或成本）",k:"curb",ex:"We added quotas to curb runaway storage costs.",tr:"我们加了配额来控制失控的存储成本。",usage:"curb spending / costs 是控制或遏制增长；英澳路边的路缘石通常拼 kerb，动词仍拼 curb。"},
 {d:28,w:"staple",pos:"n. / adj.",p:"/ˈsteɪpl/",cn:"主食、常备必需品；订书钉",k:"staple",ex:"Flat whites are a staple of Melbourne café culture.",tr:"Flat white 是墨尔本咖啡馆文化里的标配。",usage:"a staple of something 指其中常见、不可缺少的组成部分；staple food 是主食，另有订书钉含义。"},
 {d:28,w:"vantage point",pos:"n.",p:"/ˈvɑːntɪdʒ pɔɪnt/",cn:"观景位置；看问题的角度",k:"vantage point",ex:"The lookout gives you the best vantage point over the whole valley.",tr:"那个观景台是俯瞰整个山谷的最佳位置。",usage:"a vantage point 是观察位置，常用 from a vantage point；也可比喻分析角度，不只表示看风景。"},
 {d:28,w:"feeble",pos:"adj.",p:"/ˈfiːbl/",cn:"微弱无力的；（借口）站不住脚的",k:"feeble",ex:"Mobile coverage gets feeble once you leave the highway.",tr:"一离开高速，手机信号就变得很弱。",usage:"a feeble signal / attempt 是微弱或无力；a feeble excuse 带批评意味，指借口很站不住脚。"},
 {d:28,w:"touch wood",pos:"phr.",p:"/tʌtʃ wʊd/",cn:"但愿别出事（美式 knock on wood）",k:"touch wood",ex:"No incidents this week — touch wood.",tr:"这周没出故障——但愿别乌鸦嘴。",usage:"英澳在说完好情况后加 touch wood，表示但愿好运持续；美式常说 knock on wood。"},
 {d:28,w:"be none the wiser",pos:"phr.",p:"/nʌn ðə ˈwaɪzə/",cn:"完全没察觉、不明就里",k:"none the wiser",ex:"We failed over at 2 a.m. and the users were none the wiser.",tr:"我们凌晨两点做了切换，用户完全没察觉。",usage:"be none the wiser 可以是毫不知情，也可以是听完解释仍没弄懂；需由上下文判断。"},
 {d:28,w:"ring a bell",pos:"phr.",p:"/rɪŋ ə bel/",cn:"听着耳熟、有点印象",k:"rings a bell",ex:"That error code rings a bell — I think we saw it last March.",tr:"那个错误码听着耳熟，我记得去年三月见过。",usage:"That rings a bell 是觉得耳熟，但不一定能想起细节；否定说 It doesn't ring a bell。"},
 {d:28,w:"go pear-shaped",pos:"phr.",p:"/ɡəʊ ˈpeəʃeɪpt/",cn:"彻底搞砸、事情崩了（英澳口语）",k:"went pear-shaped",ex:"The upgrade went pear-shaped about twenty minutes in.",tr:"升级开始大约二十分钟后就彻底崩了。",usage:"英澳口语描述计划出岔子或搞砸；过去式 went pear-shaped，正式复盘可说 went wrong。"},

 {d:29,tag:"au",w:"mob",pos:"n.",p:"/mɒb/",cn:"一群袋鼠（澳洲专用量词）",k:"A mob",ex:"A mob of kangaroos was grazing right beside the road.",tr:"一群袋鼠正在路边吃草。",usage:"澳洲自然语境常说 a mob of kangaroos；mob 在其他语境也可指喧闹或具有威胁性的人群。"},
 {d:29,tag:"au",w:"pouch",pos:"n.",p:"/paʊtʃ/",cn:"育儿袋（小袋鼠叫 joey）",k:"pouch",ex:"You could just see a joey's foot poking out of the pouch.",tr:"能看到一只小袋鼠的脚从育儿袋里伸出来。",usage:"a joey in its mother's pouch 是育儿袋里的幼崽；pouch 也可指装小物品的软袋，不只用于动物。"},
 {d:29,tag:"au",w:"forage",pos:"v.",p:"/ˈfɒrɪdʒ/",cn:"觅食、四处找吃的",k:"forage",ex:"Possums come down to forage once the campsite goes quiet.",tr:"营地一安静下来，负鼠就下来觅食了。",usage:"forage for food 是四处觅食；forage in an area 说明觅食地点，与 scavenge 的捡食剩余物不同。"},
 {d:29,tag:"au",w:"cull",pos:"v. / n.",p:"/kʌl/",cn:"（为控制数量而）扑杀、剔除",k:"Culling",ex:"Culling feral animals remains a contentious policy in Australia.",tr:"扑杀野化动物在澳洲仍是一项有争议的政策。",usage:"cull a population 指有选择地减少数量；a cull 可指这类控制行动，讨论政策时是较严肃的用词。"},
 {d:29,tag:"au",w:"habitat",pos:"n.",p:"/ˈhæbɪtæt/",cn:"栖息地（habitat loss 栖息地丧失）",k:"habitat",ex:"Bushfires destroyed a huge amount of koala habitat.",tr:"山火摧毁了大量考拉栖息地。",usage:"natural habitat / habitat loss 是常见搭配；可用 habitats 指不同栖息环境，不要与 habit（习惯）混淆。"},
 {d:29,tag:"au",w:"thrive",pos:"v.",p:"/θraɪv/",cn:"繁衍兴旺、长得好（≠survive 只是活着）",k:"thrive",ex:"Rainbow lorikeets thrive in suburban gardens.",tr:"彩虹鹦鹉在城郊的花园里繁衍得很好。",usage:"thrive in an environment 指在某环境中生长或发展得很好；survive 只是活下来，thrive 强调兴旺。"},
 {d:29,tag:"au",w:"a sight to behold",pos:"phr.",p:"/ə saɪt tə bɪˈhəʊld/",cn:"非常壮观、值得一看的景象",k:"a sight to behold",ex:"Thousands of flying foxes leaving at dusk is a sight to behold.",tr:"黄昏时成千上万只狐蝠飞离，是极为壮观的景象。",usage:"常用来赞叹令人印象深刻的景象，略带描绘色彩；What a sight! 则是更短的口语感叹。"},
 {d:29,tag:"au",w:"keep one's distance",pos:"phr.",p:"/kiːp wʌnz ˈdɪstəns/",cn:"保持距离、别靠太近",k:"Keep your distance",ex:"Keep your distance from kangaroos — the big males can be aggressive.",tr:"离袋鼠远一点，成年雄性可能有攻击性。",usage:"keep your distance from something 是保持距离；也可比喻疏远某人，人称需随主语变化。"},
 {d:29,tag:"au",w:"out and about",pos:"phr.",p:"/aʊt ənd əˈbaʊt/",cn:"外出活动、在外面走动",k:"out and about",ex:"Wombats are mostly out and about after dark.",tr:"袋熊主要在天黑之后出来活动。",usage:"be out and about 是外出走动、活动；既能形容人出门办事，也能形容动物开始活跃。"},
 {d:29,tag:"au",w:"few and far between",pos:"phr.",p:"/fjuː ənd fɑː bɪˈtwiːn/",cn:"寥寥无几、少得可怜",k:"few and far between",ex:"Petrol stations are few and far between out there.",tr:"那一带的加油站少得可怜。",usage:"通常用于复数主语：Good options are few and far between，强调数量少且彼此相隔远或不常出现。"},

 {d:30,w:"dormant",pos:"adj.",p:"/ˈdɔːmənt/",cn:"休眠的、蛰伏不活动的（≠latent）",k:"dormant",ex:"The account had been dormant for two years before someone logged in.",tr:"那个账号已休眠两年，直到有人登录进去。",usage:"a dormant account / volcano 指当前不活跃但可能重新活动；latent 更强调特征或问题尚未显露。"},
 {d:30,tag:"au",w:"territorial",pos:"adj.",p:"/ˌterɪˈtɔːriəl/",cn:"护领地的、地盘意识强的",k:"territorial",ex:"Magpies get very territorial while they're nesting.",tr:"喜鹊在筑巢期间地盘意识会变得非常强。",usage:"territorial behaviour 是护领地的行为；形容同事时可比喻特别维护自己职责或资源，不愿别人介入。"},
 {d:30,tag:"au",w:"scavenge",pos:"v.",p:"/ˈskævɪndʒ/",cn:"食腐、捡剩的吃",k:"scavenge",ex:"Tasmanian devils scavenge carcasses rather than hunting much.",tr:"袋獾主要以腐肉为食，而不太主动捕猎。",usage:"scavenge for food / scavenge carcasses 指捡食或食腐；比 forage 更突出利用剩余、弃置或死去的东西。"},
 {d:30,tag:"au",w:"camouflage",pos:"n. / v.",p:"/ˈkæməflɑːʒ/",cn:"伪装、保护色",k:"camouflage",ex:"The frogmouth's camouflage makes it look exactly like a broken branch.",tr:"蟆口鸱的保护色让它看起来就像一截断枝。",usage:"camouflage 常作不可数名词指伪装；动词 camouflage something as something 是把某物伪装成别的东西。"},
 {d:30,tag:"au",w:"resurgence",pos:"n.",p:"/rɪˈsɜːdʒəns/",cn:"重新抬头、回升复苏",k:"resurgence",ex:"There's been a resurgence in the local quoll population.",tr:"当地的袋鼬种群数量出现了回升。",usage:"a resurgence in numbers 是数量回升；a resurgence of interest 则是兴趣重新兴起，常用于较正式描述。"},
 {d:30,w:"taper",pos:"v.",p:"/ˈteɪpə/",cn:"逐渐变细、慢慢减少（taper off）",k:"tapers off",ex:"Traffic tapers off after eight on weeknights.",tr:"工作日晚上八点之后车流就渐渐少了。",usage:"taper off 是逐渐减少或减弱；跑步训练中的 taper 指赛前逐步减少训练量，不是突然全停。"},
 {d:30,tag:"au",w:"a far cry from something",pos:"phr.",p:"/ə fɑː kraɪ frəm/",cn:"与…相去甚远、差得远",k:"a far cry from",ex:"A zoo enclosure is a far cry from the open bush.",tr:"动物园的围栏跟开阔的灌木林相去甚远。",usage:"A is a far cry from B 表示两者差距很大；不自动表示谁更好，评价方向取决于上下文。"},
 {d:30,tag:"au",w:"in one piece",pos:"phr.",p:"/ɪn wʌn piːs/",cn:"完好无损地（人或物）",k:"in one piece",ex:"We made it back from the outback in one piece.",tr:"我们从内陆平安无事地回来了。",usage:"arrive / get back in one piece 是平安无损地到达或回来，常带松一口气的口语感觉。"},
 {d:30,tag:"au",w:"up close",pos:"phr.",p:"/ʌp kləʊs/",cn:"近距离地",k:"up close",ex:"You don't appreciate how big an emu is until you see one up close.",tr:"不近距离看一次，你不会知道鸸鹋有多大。",usage:"see something up close 是近距离看；放名词前常写 an up-close view，作副词时不加连字符。"},
 {d:30,w:"call it a night",pos:"phr.",p:"/kɔːl ɪt ə naɪt/",cn:"今晚就到这儿（call it a day 的夜间版）",k:"call it a night",ex:"The spotlighting walk was great, but let's call it a night.",tr:"夜观动物挺好玩的，不过今晚就到这儿吧。",usage:"Let's call it a night 是结束今晚的活动、准备休息；与 call it a day 类似，但更贴合夜间情境。"},

 {d:31,w:"reinstate",pos:"v.",p:"/ˌriːɪnˈsteɪt/",cn:"恢复（权限、职位、规则）",k:"reinstated",ex:"We reinstated the read-only role after the audit finished.",tr:"审计结束后我们恢复了那个只读角色。",usage:"reinstate access / a rule / an employee 是恢复先前被取消的权限、规则或职位，语气较正式。"},
 {d:31,w:"cursory",pos:"adj.",p:"/ˈkɜːsəri/",cn:"草草的、走马观花的（≠rigorous）",k:"cursory",ex:"A cursory look at the logs won't tell you much — you need the raw output.",tr:"草草看一眼日志说明不了什么，你得看原始输出。",usage:"a cursory glance / review 是匆匆、表面的查看，常暗示不够深入；与 thorough review 相对。"},
 {d:31,w:"unwieldy",pos:"adj.",p:"/ʌnˈwiːldi/",cn:"笨重难操作的、大得不好使",k:"unwieldy",ex:"The config file has grown unwieldy — nobody knows what half of it does.",tr:"这个配置文件已经臃肿到不好使了，一半的内容没人知道是干什么的。",usage:"an unwieldy object / system 指因体积或复杂度而难操作；重点是不好掌控，不只是重量大。"},
 {d:31,w:"pivotal",pos:"adj.",p:"/ˈpɪvətl/",cn:"关键性的、起决定作用的",k:"pivotal",ex:"The CloudTrail entry was pivotal in working out what actually happened.",tr:"那条 CloudTrail 记录对弄清真相起了关键作用。",usage:"play a pivotal role in something / doing something 是起关键作用；pivotal 更强调对结果有决定性影响。"},
 {d:31,w:"sodden",pos:"adj.",p:"/ˈsɒdn/",cn:"湿透的、浸饱水的（≠humid 空气闷湿）",k:"sodden",ex:"The track was sodden after two days of rain.",tr:"下了两天雨，那条小路已经湿透了。",usage:"sodden clothes / ground 是吸满水、湿透；water-sodden 也常见，与 humid air 的空气潮湿不同。"},
 {d:31,w:"sluggish",pos:"adj.",p:"/ˈslʌɡɪʃ/",cn:"（市场）低迷不振的（第二义项）",k:"sluggish",ex:"The market has been sluggish since the rate decision.",tr:"利率决议之后市场一直很低迷。",usage:"a sluggish market / economy 指活跃度低、增长慢；这里不是 Day 5 中系统反应迟缓的具体用法。"},
 {d:31,w:"take something with a grain of salt",pos:"phr.",p:"/ə ɡreɪn əv sɔːlt/",cn:"对某事持保留态度、别全信",k:"with a grain of salt",ex:"Take the vendor's benchmark numbers with a grain of salt.",tr:"厂商那些跑分数据，别全信。",usage:"take a claim with a grain of salt 是不全盘相信；英澳也常说 with a pinch of salt。"},
 {d:31,w:"the lay of the land",pos:"phr.",p:"/ðə leɪ əv ðə lænd/",cn:"局势大概、情况全貌",k:"the lay of the land",ex:"Give me a week to get the lay of the land before I commit to a timeline.",tr:"给我一周时间了解一下情况，再定时间表。",usage:"get the lay of the land 是先了解整体情况；英澳也常用 the lie of the land，可指地形或局势。"},
 {d:31,w:"cut to the chase",pos:"phr.",p:"/kʌt tə ðə tʃeɪs/",cn:"直接说重点、别绕弯子",k:"cut to the chase",ex:"Let me cut to the chase — we need another maintenance window.",tr:"我直接说重点：我们还需要一个维护窗口。",usage:"Let me cut to the chase 是直接进入重点；命令别人 Cut to the chase 可能显得不耐烦。"},
 {d:31,w:"be up to scratch",pos:"phr.",p:"/ʌp tə skrætʃ/",cn:"达到标准、够格（英澳）",k:"up to scratch",ex:"The documentation isn't up to scratch for a production handover.",tr:"这份文档还达不到生产环境交接的标准。",usage:"英澳常说 not up to scratch 表示未达要求；bring something up to scratch 是把它改进到合格水平。"},

 {d:32,w:"entail",pos:"v.",p:"/ɪnˈteɪl/",cn:"涉及、必然包含（多少工作量）",k:"entails",ex:"The upgrade entails downtime on all three clusters.",tr:"这次升级必然涉及三个集群的停机。",usage:"entail something / doing something 指必然涉及或需要；问 What does it entail? 是问具体要做哪些事。"},
 {d:32,w:"expedient",pos:"adj. / n.",p:"/ɪkˈspiːdiənt/",cn:"图方便的、权宜的（≠expedite 加快）",k:"expedient",ex:"Restarting was the expedient choice, not the correct one.",tr:"重启是图方便的选择，而不是正确的选择。",usage:"an expedient solution 是方便、合时宜的办法，可能牺牲原则或长期效果；不要与 expedite（加快）混淆。"},
 {d:32,w:"corrosive",pos:"adj.",p:"/kəˈrəʊsɪv/",cn:"腐蚀性的；（对士气）侵蚀性的",k:"corrosive",ex:"Salt air off the coast is corrosive — check the underbody after the trip.",tr:"海边的盐分空气有腐蚀性，这趟回来检查一下底盘。",usage:"corrosive substances 会腐蚀材料；a corrosive effect on morale 则比喻逐渐损害士气。"},
 {d:32,w:"amenable",pos:"adj.",p:"/əˈmiːnəbl/",cn:"愿意配合的、听得进意见的（amenable to）",k:"amenable",ex:"The security team is amenable to a phased rollout.",tr:"安全团队愿意配合分阶段上线的方案。",usage:"be amenable to a suggestion / doing something 是愿意考虑或配合；to 是介词，后接名词或动名词。"},
