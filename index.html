  {"d":39,"date":"2026-10-13","kind":"reading","w":"incredulity","pos":"n.","p":"/ˌɪnkrəˈdʒuːləti/","cn":"难以置信；不愿相信的神情","usage":"不可数，常见 a look of incredulity / in incredulity；与 bewilderment 的困惑不同，侧重不相信听到的事。","ex":"She looked at me in incredulity when I said the taxi had cost more than the flight.","tr":"我说打车费比机票还贵时，她难以置信地看着我。","k":"incredulity","source":{"id":"twisted-lip","title":"歪唇男人","page":25,"form":"incredulity","quote":"“In the bathroom,” he answered. “Oh, yes, I am not joking,” he continued, seeing my look of incredulity. “I have just been there, and I have taken it out, and I have got it in this Gladstone bag. Come on, my boy, and we shall see whether it will not fit the lock.”","tr":"“在浴室里。”他回答。看见我一脸不信，又接着说：“没错，我可不是开玩笑。我刚去过浴室，已经把它取出来，放进这只旅行包了。走吧，老伙计，我们看看它能不能打开这把锁。”"},"extraExamples":[{"ex":"His suggestion was met with a mixture of laughter and incredulity.","tr":"大家听了他的建议，有人发笑，也有人难以置信。"},{"ex":"I watched in incredulity as he paid for everyone's meal.","tr":"看到他替所有人结账，我简直不敢相信。"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"be in the dark","pos":"phr.","p":"/biː ɪn ðə dɑːk/","cn":"对情况一无所知；被蒙在鼓里","usage":"be / keep / leave someone in the dark about something 常指信息未被告知或被隐瞒；与 be none the wiser（听过解释或调查后仍没弄明白）有侧重点的区别。","ex":"Nobody told us the venue had changed, so we were left in the dark.","tr":"没人告诉我们地点改了，所以我们一直被蒙在鼓里。","k":"in the dark","source":{"id":"twisted-lip","title":"歪唇男人","page":8,"form":"all in the dark","quote":"“But I am all in the dark.”","tr":"“可我对整件事还一无所知呢。”"},"extraExamples":[{"ex":"We're still in the dark about why the booking was cancelled.","tr":"我们仍然不知道预订为什么被取消。"},{"ex":"Don't keep me in the dark if the plans change.","tr":"计划有变的话别瞒着我。"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"be lost in thought","pos":"phr.","p":"/biː lɒst ɪn θɔːt/","cn":"陷入沉思；想事情想得出神","usage":"be lost in thought 描述专注思考而没留意周围，不是迷路；可说 so lost in thought that ...。","ex":"I was so lost in thought that I walked straight past the café.","tr":"我想事情想得太出神，直接走过了那家咖啡馆。","k":"lost in thought","source":{"id":"twisted-lip","title":"歪唇男人","page":9,"form":"lost in thought","quote":"Holmes drove in silence, with his head sunk upon his breast, and the air of a man who is lost in thought, while I sat beside him, curious to learn what this new quest might be which seemed to tax his powers so sorely, and yet afraid to break in upon the current of his thoughts.","tr":"福尔摩斯默默驾车，低着头，一副陷入沉思的模样。我坐在旁边，既好奇是什么新案子让他如此煞费心思，又怕打断他的思绪。"},"extraExamples":[{"ex":"She sat by the window, lost in thought, until her tea went cold.","tr":"她坐在窗边想事情想得出神，连茶凉了都没注意到。"},{"ex":"Sorry, I was lost in thought. What did you say?","tr":"抱歉，我刚刚想事情走神了。你说什么？"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"weigh on one's mind","pos":"phr.","p":"/weɪ ɒn wʌnz maɪnd/","cn":"让某人一直忧虑；压在心头","usage":"常以问题或遗憾作主语：Something is weighing on my mind。原文用 upon，现代通常用 on。","ex":"The disagreement with my friend has been weighing on my mind all week.","tr":"和朋友的那次争执整整一周都压在我心头。","k":"weighing on my mind","source":{"id":"twisted-lip","title":"歪唇男人","page":10,"form":"weighing upon his mind","quote":"There is no reason, therefore, to think that money troubles have been weighing upon his mind.","tr":"“因此没有理由认为他受到了经济困难的困扰。"},"extraExamples":[{"ex":"The cost of the repairs has been weighing on his mind.","tr":"维修费用一直让他忧心忡忡。"},{"ex":"If something is weighing on your mind, I'm happy to listen.","tr":"如果你有什么心事，我愿意听你说。"}]},
  {"d":39,"date":"2026-10-13","kind":"reading","w":"something is amiss","pos":"phr.","p":"/ˈsʌmθɪŋ ɪz əˈmɪs/","cn":"有什么不对劲；情况有异","usage":"amiss 表示不正常或出了问题，常用 something is / was amiss；比 something is wrong 稍书面，但现在仍常用。","ex":"I knew something was amiss when the usually busy café was completely empty.","tr":"那家平时很忙的咖啡馆空无一人时，我就知道有什么不对劲。","k":"something was amiss","source":{"id":"twisted-lip","title":"歪唇男人","page":11,"form":"something was amiss","quote":"“Convinced that something was amiss with him, she rushed down the steps—for the house was none other than the opium den in which you found me tonight—and running through the front room she attempted to go up the stairs which led to the first floor.","tr":"“她确信丈夫出事了，便冲下那座房子的台阶——那房子恰好就是你今晚找到我的鸦片烟馆。她跑过前厅，试图登上通往楼上的楼梯。"},"extraExamples":[{"ex":"Something is amiss with the bill; we've been charged for three coffees instead of two.","tr":"账单有点不对，我们明明点了两杯咖啡，却被收了三杯的钱。"},{"ex":"Her unusually short reply made me wonder whether something was amiss.","tr":"她回复得异常简短，让我怀疑是不是出了什么问题。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"huddle","pos":"v.","p":"/ˈhʌdl/","cn":"挤在一起；蜷缩着靠拢","usage":"huddle together / under shelter 常指为了保暖或避雨挤在一起；也可用 huddle up 召集大家围拢。","ex":"We huddled under the awning while the storm passed.","tr":"暴风雨经过时，我们挤在遮雨棚下面。","k":"huddled","source":{"id":"twisted-lip","title":"歪唇男人","page":1,"form":"huddled","quote":"I can see him now, with yellow, pasty face, drooping lids, and pin-point pupils, all huddled in a chair, the wreck and ruin of a noble man.","tr":"如今我仿佛仍能看见他：蜡黄浮肿的脸，低垂的眼皮，针尖般细小的瞳孔，整个人蜷缩在椅子里。一个原本高尚的人，就这样被折磨得形销骨立。"},"extraExamples":[{"ex":"The players huddled together for a quick talk before the final game.","tr":"最后一局开始前，队员们聚在一起简短商量了一下。"},{"ex":"We found a kitten huddled behind the bins, shivering in the rain.","tr":"我们在垃圾桶后发现一只蜷缩着的小猫，在雨中瑟瑟发抖。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"peer","pos":"v.","p":"/pɪə/","cn":"费力地仔细看；凝视辨认","usage":"peer through / into / at 常用于光线差、距离远或看不清时；不是普通随意的一看。","ex":"I had to peer through the fog to read the sign.","tr":"我得透过雾仔细辨认，才能看清标牌。","k":"peer","source":{"id":"twisted-lip","title":"歪唇男人","page":4,"form":"peering","quote":"There was a movement and an exclamation from my right, and peering through the gloom, I saw Whitney, pale, haggard, and unkempt, staring out at me.","tr":"右边立刻传来一阵动静和惊呼。我透过烟雾望去，看见惠特尼正苍白憔悴、蓬头垢面地盯着我。"},"extraExamples":[{"ex":"She peered over my shoulder to see what I was reading.","tr":"她从我肩头上方探头看我在读什么。"},{"ex":"He peered into the dark garage but couldn't see the bike.","tr":"他费力地往漆黑的车库里看，却看不到自行车。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"beckon","pos":"v.","p":"/ˈbekən/","cn":"招手示意；示意某人靠近","usage":"beckon to someone / beckon someone over 指用手势叫人过来；作比喻时可说 adventure beckons，表示吸引人前往。","ex":"The waiter beckoned us towards a table by the window.","tr":"服务员招手示意我们到窗边的一张桌子去。","k":"beckoned","source":{"id":"twisted-lip","title":"歪唇男人","page":4,"form":"beckoning","quote":"As I entered, a sickly Malay attendant had hurried up with a pipe for me and a supply of the drug, beckoning me to an empty berth.","tr":"我刚进去，一个病恹恹的马来人侍者就拿着烟斗和鸦片赶来，招手示意我躺到一张空铺上。"},"extraExamples":[{"ex":"She beckoned me over before I could walk past.","tr":"我还没来得及走过去，她就招手叫我过去了。"},{"ex":"The smell of fresh bread beckoned us into the bakery.","tr":"新出炉面包的香味吸引我们走进了面包店。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"lurk","pos":"v.","p":"/lɜːk/","cn":"潜伏；暗藏","usage":"lurk behind / in 常描述不易察觉的问题或危险；网络中也指只看帖子不发言，语境决定含义。","ex":"There may be extra fees lurking in the small print.","tr":"细则里可能暗藏着额外费用。","k":"lurking","source":{"id":"twisted-lip","title":"歪唇男人","page":3,"form":"lurking","quote":"There was no great difficulty in the first stage of my adventure. Upper Swandam Lane is a vile alley lurking behind the high wharves which line the north side of the river to the east of London Bridge.","tr":"这次冒险的开头并没有遇到多大困难。上斯旺丹巷是一条肮脏的小巷，藏在伦敦桥以东、泰晤士河北岸一排高大码头仓库的后面。"},"extraExamples":[{"ex":"A nagging doubt lurked at the back of my mind.","tr":"我心底一直藏着一丝挥之不去的疑虑。"},{"ex":"Don't leave food outside; there are possums lurking around the campsite.","tr":"别把食物放在外面，营地周围有负鼠在暗处活动。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"protrude","pos":"v.","p":"/prəˈtruːd/","cn":"伸出；突出于表面","usage":"protrude from / through 指某部分从物体中突出；比 stick out 正式，说明物件状况时很实用。","ex":"A sharp screw was protruding from the bench, so we chose another seat.","tr":"长椅上有一颗尖螺丝突出来，所以我们换了个座位。","k":"protruding","source":{"id":"twisted-lip","title":"歪唇男人","page":18,"form":"protruded","quote":"She stood with her figure outlined against the flood of light, one hand upon the door, one half-raised in her eagerness, her body slightly bent, her head and face protruded, with eager eyes and parted lips, a standing question.","tr":"门内倾泻的灯光勾勒出她的身影。一只手扶着门，另一只手因急切而微微抬起；身体前倾，头向外探，双眼期待地张望，嘴唇微张，整个人仿佛都在问着同一个问题。"},"extraExamples":[{"ex":"A corner of the envelope protruded from his jacket pocket.","tr":"信封的一角露在他的夹克口袋外面。"},{"ex":"The branches protrude into the path and catch on people's bags.","tr":"树枝伸到了小路上，会勾住行人的包。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"shuffle","pos":"v.","p":"/ˈʃʌfl/","cn":"拖着脚缓慢走；洗牌或打乱顺序","usage":"走路时 shuffle along / towards 指脚步拖沓，不同于悠闲漫步；shuffle cards / songs 则是打乱顺序。","ex":"We shuffled towards the bus, still half asleep after the early start.","tr":"一大早出发让我们仍半梦半醒，拖着脚朝公交车走去。","k":"shuffled","source":{"id":"twisted-lip","title":"歪唇男人","page":7,"form":"shuffled","quote":"For two streets he shuffled along with a bent back and an uncertain foot. Then, glancing quickly round, he straightened himself out and burst into a hearty fit of laughter.","tr":"走过两条街时，他仍弓着背，脚步踉跄。随后他飞快地环顾四周，直起身子，放声大笑。"},"extraExamples":[{"ex":"He shuffled into the kitchen in his slippers.","tr":"他穿着拖鞋，拖着脚走进厨房。"},{"ex":"Could you shuffle the cards while I clear the table?","tr":"我收拾桌子的时候，你能洗一下牌吗？"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"catch a glimpse of something","pos":"phr.","p":"/kætʃ ə ɡlɪmps əv ˈsʌmθɪŋ/","cn":"短暂瞥见某物","usage":"强调只看到一瞬间或一小部分；过去式 caught a glimpse of，不是长时间盯着看。","ex":"We caught a glimpse of a dolphin just before it slipped beneath the water.","tr":"海豚潜入水下前，我们短暂地瞥见了它。","k":"caught a glimpse of","source":{"id":"twisted-lip","title":"歪唇男人","page":4,"form":"catch a glimpse","quote":"Through the gloom one could dimly catch a glimpse of bodies lying in strange fantastic poses, bowed shoulders, bent knees, heads thrown back, and chins pointing upward, with here and there a dark, lack-lustre eye turned upon the newcomer.","tr":"昏暗之中，可以隐约看到一具具身体摆出奇形怪状的姿势：肩膀耸起、双膝弯曲、脑袋后仰、下巴朝天。偶尔有一双暗淡无神的眼睛转向刚刚进来的人。"},"extraExamples":[{"ex":"I caught a glimpse of her red coat as the train pulled away.","tr":"火车驶离时，我短暂瞥见了她的红色外套。"},{"ex":"From the lookout, you can catch a glimpse of the mountains between the clouds.","tr":"从观景台望去，你能从云层间隙中瞥见群山。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"make one's way","pos":"phr.","p":"/meɪk wʌnz weɪ/","cn":"前往；穿行着到达","usage":"make your way to / through / into 某地，强调移动过程或路线；未必很困难，具体看语境。","ex":"We made our way to the station through the crowded market.","tr":"我们穿过拥挤的市场，往车站走去。","k":"made our way","source":{"id":"twisted-lip","title":"歪唇男人","page":12,"form":"made their way","quote":"The inspector and two men accompanied her back, and in spite of the continued resistance of the proprietor, they made their way to the room in which Mr. St. Clair had last been seen.","tr":"“督察带着两名警员陪她返回烟馆。尽管店主一再阻挠，他们还是闯进了圣克莱尔先生最后露面的房间。"},"extraExamples":[{"ex":"Take your time making your way down; the steps are slippery.","tr":"往下走时慢一点，台阶很滑。"},{"ex":"After lunch, we made our way back to the car along the beach.","tr":"午饭后，我们沿着海滩往回走到停车处。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"drop off to sleep","pos":"phr.","p":"/drɒp ɒf tə sliːp/","cn":"不知不觉入睡；渐渐睡着","usage":"drop off / drop off to sleep 是口语中的睡着；与 drop someone off（送某人下车）不同。","ex":"I dropped off to sleep before the plane even left the gate.","tr":"飞机还没离开登机口，我就睡着了。","k":"dropped off to sleep","source":{"id":"twisted-lip","title":"歪唇男人","page":24,"form":"dropped off to sleep","quote":"So he sat as I dropped off to sleep, and so he sat when a sudden ejaculation caused me to wake up, and I found the summer sun shining into the apartment.","tr":"我入睡时，他是那副样子；后来一声突如其来的惊呼把我唤醒，夏日的阳光已经洒进了房间，他仍是那副样子。"},"extraExamples":[{"ex":"I often drop off to sleep halfway through a film.","tr":"我经常电影看到一半就不知不觉睡着了。"},{"ex":"She had just dropped off to sleep when the doorbell rang.","tr":"她刚迷迷糊糊睡着，门铃就响了。"}]},
  {"d":40,"date":"2026-10-13","kind":"reading","w":"in the act of doing something","pos":"phr.","p":"/ɪn ði ækt əv ˈduːɪŋ ˈsʌmθɪŋ/","cn":"正在做某事的当口","usage":"常见 catch someone in the act of doing something，表示当场撞见；of 后接动名词。","ex":"She caught me in the act of eating the last slice of cake.","tr":"我正在吃最后一块蛋糕时，被她当场撞见了。","k":"in the act of eating","source":{"id":"twisted-lip","title":"歪唇男人","page":16,"form":"in the act of throwing it out","quote":"He would seize the coat, then, and be in the act of throwing it out, when it would occur to him that it would swim and not sink. He has little time, for he has heard the scuffle downstairs when the wife tried to force her way up, and perhaps he has already heard from his Lascar confederate that the police are hurrying up the street.","tr":"“于是他拿起外套，正要扔出去，却忽然意识到外套会浮在水上，不会下沉。他已经没有多少时间了，因为他听见楼下圣克莱尔太太试图强行上楼的争吵声，或许那位水手同伙还告诉他警察正赶过来。"},"extraExamples":[{"ex":"The camera caught a possum in the act of stealing food from the table.","tr":"摄像头拍到了负鼠正从桌上偷食物的一幕。"},{"ex":"I was in the act of closing the door when I heard someone call my name.","tr":"我正要关门时，听见有人喊我的名字。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"ascertain","pos":"v.","p":"/ˌæsəˈteɪn/","cn":"查明；弄清并确认","usage":"ascertain whether / how / the cause 强调查证后确定，语域较正式；日常也可说 find out。","ex":"We need to ascertain whether the trail is open before we drive all the way there.","tr":"开车大老远过去之前，我们得确认那条步道是否开放。","k":"ascertain","source":{"id":"twisted-lip","title":"歪唇男人","page":10,"form":"ascertain","quote":"I may add that his whole debts at the present moment, as far as we have been able to ascertain, amount to 88 pounds 10s., while he has 220 pounds standing to his credit in the Capital and Counties Bank.","tr":"“据我们所查，他目前的全部债务不过八十八英镑十先令，而他在首都与郡县银行还有二百二十英镑存款。"},"extraExamples":[{"ex":"Before paying a deposit, ascertain exactly what is included in the price.","tr":"付订金之前，先弄清价格具体包含哪些项目。"},{"ex":"We haven't yet ascertained who left the gate open.","tr":"我们还没查清是谁没关大门。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"ominous","pos":"adj.","p":"/ˈɒmɪnəs/","cn":"预示坏事的；令人不安的","usage":"an ominous sign / silence / cloud 暗示接下来可能不妙；不是单纯难看或令人害怕。","ex":"The sky turned an ominous shade of grey just as we reached the ridge.","tr":"我们刚到山脊，天空就变成了令人不安的灰色。","k":"ominous","source":{"id":"twisted-lip","title":"歪唇男人","page":13,"form":"ominous","quote":"Out of the window he must apparently have gone for no other exit could be discovered, and the ominous bloodstains upon the window sill gave little promise that he could save himself by swimming, for the tide was at its very highest at the moment of the tragedy.","tr":"“看来他一定从窗户出去了，因为别无出口。窗台上那不祥的血迹，令人很难相信他还能游泳逃生；毕竟出事时潮水正涨到最高点。"},"extraExamples":[{"ex":"There was an ominous silence after I mentioned the broken window.","tr":"我一提到打破的窗户，现场便出现了令人不安的沉默。"},{"ex":"An ominous rattling noise was coming from under the bonnet.","tr":"引擎盖下面传来一阵不祥的哐啷声。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"implicate","pos":"v.","p":"/ˈɪmplɪkeɪt/","cn":"牵连；显示某人卷入不当行为","usage":"implicate someone in something，常指证据将某人牵涉进事件；不等于已经证实有罪，也不同于 imply。","ex":"The messages implicated several people in the cover-up.","tr":"那些消息显示，有几个人牵涉到掩盖事实的行为中。","k":"implicated","source":{"id":"twisted-lip","title":"歪唇男人","page":13,"form":"implicated","quote":"“And now as to the villains who seemed to be immediately implicated in the matter. The Lascar was known to be a man with a very shady background, but as, by Mrs. St. Clair’s story, he was known to have been at the foot of the stair within a few seconds of her husband’s appearance at the window, he could hardly have been more than an accessory to the crime.","tr":"“现在来说说看似直接牵涉此案的嫌疑人。大家都知道，那个水手的背景很不干净。不过按照圣克莱尔太太的叙述，丈夫在窗口露面后的几秒钟内，他就守在楼梯口，所以即便与罪案有关，最多也只能是个帮凶。"},"extraExamples":[{"ex":"The investigation implicated the club's treasurer in the missing funds.","tr":"调查显示，俱乐部司库牵涉了资金失踪事件。"},{"ex":"Nothing in the report implicates her in the decision to hide the results.","tr":"报告中没有任何内容表明她参与了隐瞒结果的决定。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"incriminate","pos":"v.","p":"/ɪnˈkrɪmɪneɪt/","cn":"使某人显得有罪；提供不利于某人的证据","usage":"incriminate someone / incriminate yourself 用于证据或言行可能指向违法行为；语域比普通 blame 正式。","ex":"He refused to answer because he thought it might incriminate him.","tr":"他拒绝回答，因为他觉得那可能成为对自己不利的证据。","k":"incriminate","source":{"id":"twisted-lip","title":"歪唇男人","page":15,"form":"incriminate","quote":"One mistake had been made in not arresting Boone instantly, as he was allowed a few minutes during which he might have communicated with his friend the Lascar, but this fault was soon remedied, and he was seized and searched, without anything being found which could incriminate him.","tr":"“他们犯过一个错误：没有立刻逮捕布恩，让他有几分钟机会同水手朋友串通。不过警方很快纠正了这一点，把他抓起来搜了身，仍没找到足以证明他有罪的东西。"},"extraExamples":[{"ex":"The stolen phone in his bag appeared to incriminate him.","tr":"他包里的被盗手机似乎成了对他不利的证据。"},{"ex":"The witness was worried that an honest answer would incriminate a friend.","tr":"证人担心如实回答会提供使朋友获罪的证据。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"telltale","pos":"adj.","p":"/ˈtelteɪl/","cn":"泄露真相的；可辨认出问题的","usage":"常见 a telltale sign / smell / mark，指无意中透露情况的迹象；不是讲故事的 tale。","ex":"The telltale smell of burnt toast drifted out of the kitchen.","tr":"厨房飘出的焦味暴露了吐司烤糊的事实。","k":"telltale","source":{"id":"twisted-lip","title":"歪唇男人","page":16,"form":"telltale","quote":"What would he do then? It would of course instantly strike him that he must get rid of the telltale garments.","tr":"“他接下来会怎么做？他自然立刻想到，必须把那些会暴露罪行的衣服处理掉。"},"extraExamples":[{"ex":"There were telltale drops of coffee on the otherwise spotless desk.","tr":"原本一尘不染的桌上，那几滴咖啡泄露了痕迹。"},{"ex":"The telltale squeak meant someone had opened the garden gate.","tr":"那声熟悉的吱呀声表明，有人打开了花园的门。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"fathom","pos":"v.","p":"/ˈfæðəm/","cn":"理解透；弄明白复杂或令人费解的事","usage":"现代常用 can't fathom why / how，表示实在想不明白；原文 fathomed it 是把谜题弄清楚。","ex":"I can't fathom why anyone would pay that much for a coffee.","tr":"我实在想不明白，怎么会有人为一杯咖啡花那么多钱。","k":"fathom","source":{"id":"twisted-lip","title":"歪唇男人","page":24,"form":"fathomed","quote":"without rest, turning it over, rearranging his facts, looking at it from every point of view until he had either fathomed it or convinced himself that his data were insufficient.","tr":"他会反复思索，重新梳理各项事实，从每个角度审视，直到彻底弄清问题，或者确信掌握的资料还不足以得出结论。"},"extraExamples":[{"ex":"I couldn't fathom how we'd ended up on the opposite side of town.","tr":"我怎么也想不通，我们怎么跑到了城的另一头。"},{"ex":"Can you fathom what this parking sign is trying to say?","tr":"你能弄明白这块停车标牌到底想表达什么吗？"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"account for something","pos":"phr.","p":"/əˈkaʊnt fə ˈsʌmθɪŋ/","cn":"解释某事的原因；说明某种现象","usage":"文中指解释衣服为何出现；也可表示占某个比例，不能与 take something into account（考虑进去）混淆。","ex":"A road closure would account for the unusually long journey.","tr":"道路封闭可以解释为什么这趟路花了异常长的时间。","k":"account for","source":{"id":"twisted-lip","title":"歪唇男人","page":13,"form":"account in any way for","quote":"His defense was one of absolute ignorance, and he protested that he had no knowledge as to the doings of Hugh Boone, his lodger, and that he could not account in any way for the presence of the missing gentleman’s clothes.","tr":"“他的辩解是自己一无所知。他坚称既不知道房客休·布恩在做什么，也完全解释不了失踪先生的衣服怎么会出现在屋里。"},"extraExamples":[{"ex":"Can you account for the extra charge on this invoice?","tr":"你能解释一下这张发票上的额外收费吗？"},{"ex":"The missing page would account for why the instructions made no sense.","tr":"少了一页，就能解释为什么这些说明看不明白了。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"throw light on something","pos":"phr.","p":"/θrəʊ laɪt ɒn ˈsʌmθɪŋ/","cn":"使某事更清楚；提供有助理解的信息","usage":"throw / shed light on something 表示提供线索或解释，不一定已经完全解决问题；原文用 light upon。","ex":"Her photos threw light on what had happened before we arrived.","tr":"她的照片让我们更清楚抵达之前发生了什么。","k":"threw light on","source":{"id":"twisted-lip","title":"歪唇男人","page":15,"form":"threw any light upon the matter","quote":"Inspector Barton, who was in charge of the case, made a very careful examination of the premises, but without finding anything which threw any light upon the matter.","tr":"“负责此案的巴顿督察对现场进行了极为细致的检查，却没有找到任何可以解释这件事的东西。"},"extraExamples":[{"ex":"The old map may throw light on why the road takes such an odd route.","tr":"那张旧地图也许能说明，这条路为什么走向如此奇怪。"},{"ex":"Talking to the neighbours threw some light on the noise we'd heard.","tr":"和邻居聊过后，我们对之前听到的噪声有了些了解。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"it occurs to someone that...","pos":"phr.","p":"/ɪt əˈkɜːz tə ˈsʌmwʌn ðæt/","cn":"某人突然想到……","usage":"主语 it 是形式主语，后接 that 从句；也常说 It never occurred to me that ...，表示此前完全没想到。","ex":"It occurred to me that I'd left my passport in the hotel safe.","tr":"我突然想到，护照还放在酒店保险箱里。","k":"It occurred to me that","source":{"id":"twisted-lip","title":"歪唇男人","page":32,"form":"it occurred to me","quote":"Even a wife’s eyes could not pierce so complete a disguise. But then it occurred to me that there might be a search in the room, and that the clothes might betray me.","tr":"“如此彻底的伪装，就连妻子的眼睛也不可能识破。可我突然想到，警方可能会搜查房间，留下的衣服会出卖我。"},"extraExamples":[{"ex":"Did it occur to you that she might already have other plans?","tr":"你有没有想过，她可能已经有别的安排了？"},{"ex":"It suddenly occurred to me that the keys were in yesterday's jacket.","tr":"我突然想到，钥匙在昨天穿的夹克里。"}]},
  {"d":41,"date":"2026-10-13","kind":"reading","w":"turn something over","pos":"phr.","p":"/tɜːn ˈsʌmθɪŋ ˈəʊvə/","cn":"反复琢磨；仔细斟酌","usage":"文中 turning it over 指反复思考问题；这个含义常加 in your mind。其他语境可指翻转物体或移交。","ex":"I've been turning the idea over in my mind, but I still haven't decided.","tr":"我一直在脑子里反复琢磨这个想法，但还没决定。","k":"turning the idea over","source":{"id":"twisted-lip","title":"歪唇男人","page":24,"form":"turning it over","quote":"without rest, turning it over, rearranging his facts, looking at it from every point of view until he had either fathomed it or convinced himself that his data were insufficient.","tr":"他会反复思索，重新梳理各项事实，从每个角度审视，直到彻底弄清问题，或者确信掌握的资料还不足以得出结论。"},"extraExamples":[{"ex":"She turned his offer over in her mind on the train home.","tr":"回家的火车上，她反复琢磨着他的提议。"},{"ex":"I've been turning the problem over all morning without finding an answer.","tr":"我整个上午都在反复想这个问题，却没找到答案。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"incoherent","pos":"adj.","p":"/ˌɪnkəʊˈhɪərənt/","cn":"语无伦次的；缺乏连贯逻辑的","usage":"an incoherent explanation / argument 指内容无法形成清楚连贯的意思；不只是口音难听懂。","ex":"The explanation became so incoherent that I couldn't tell what had actually happened.","tr":"解释变得如此缺乏逻辑，我根本弄不清实际发生了什么。","k":"incoherent","source":{"id":"twisted-lip","title":"歪唇男人","page":7,"form":"incoherent","quote":"“Yes; one of my natural enemies, or, shall I say, my natural prey. Briefly, Watson, I am in the midst of a very remarkable inquiry, and I have hoped to find a clue in the incoherent ramblings of these addicts, as I have done before now. Had I been recognised in that den my life would not have been worth an hour’s purchase; for I have used it before now for my own purposes, and the rascally Lascar who runs it has sworn to have vengeance upon me.","tr":"“是的，我的天敌之一，或者说，是我的天然猎物。简单地说，华生，我正在调查一件非常奇特的案子。我想从这些瘾君子语无伦次的胡话里找到线索，以前我就曾这样做过。如果有人在烟馆里认出我，我恐怕活不过一个小时。我以前为了查案利用过这地方，那位经营烟馆的无赖印度水手发誓要报复我。"},"extraExamples":[{"ex":"He was so exhausted that his account of the journey was almost incoherent.","tr":"他累得不行，讲起旅途的经过时几乎语无伦次。"},{"ex":"The instructions were an incoherent mix of old and new procedures.","tr":"这份说明把新旧流程混在一起，前后缺乏逻辑。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"murky","pos":"adj.","p":"/ˈmɜːki/","cn":"浑浊昏暗的；含混不清的","usage":"murky water 指浑浊看不清；murky details / dealings 可指事情不透明或有可疑之处。","ex":"Nobody wanted to swim in the murky water near the harbour.","tr":"没人想在港口附近浑浊的水里游泳。","k":"murky","source":{"id":"twisted-lip","title":"歪唇男人","page":8,"form":"murky","quote":"He flicked the horse with his whip, and we dashed away through the endless succession of sombre and deserted streets, which widened gradually, until we were flying across a broad balustraded bridge, with the murky river flowing sluggishly beneath us. Beyond lay another dull wilderness of bricks and mortar, its silence broken only by the heavy, regular footfall of the policeman, or the songs and shouts of some belated party of revellers.","tr":"他甩动马鞭，马车便冲进一条接一条阴沉冷清的街道。道路渐渐变宽，我们疾驰过一座装有栏杆的宽阔大桥，桥下浑浊的河水缓缓流动。对岸又是一片砖瓦房屋构成的沉闷荒原，寂静中偶尔传来巡警沉重而规律的脚步声，或夜归狂欢者的歌唱与叫喊。"},"extraExamples":[{"ex":"The details of how they met are still a bit murky.","tr":"他们究竟怎么认识的，细节仍有些不清不楚。"},{"ex":"We could barely see the bottom through the murky water.","tr":"水很浑浊，我们几乎看不到底部。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"sombre","pos":"adj.","p":"/ˈsɒmbə/","cn":"阴郁沉重的；严肃忧伤的","usage":"英澳拼 sombre，美式 somber；常见 a sombre mood / tone，适合描述坏消息后的沉重气氛。","ex":"The mood was sombre after we heard that our old neighbour had died.","tr":"听说老邻居去世后，大家的心情都很沉重。","k":"sombre","source":{"id":"twisted-lip","title":"歪唇男人","page":8,"form":"sombre","quote":"He flicked the horse with his whip, and we dashed away through the endless succession of sombre and deserted streets, which widened gradually, until we were flying across a broad balustraded bridge, with the murky river flowing sluggishly beneath us. Beyond lay another dull wilderness of bricks and mortar, its silence broken only by the heavy, regular footfall of the policeman, or the songs and shouts of some belated party of revellers.","tr":"他甩动马鞭，马车便冲进一条接一条阴沉冷清的街道。道路渐渐变宽，我们疾驰过一座装有栏杆的宽阔大桥，桥下浑浊的河水缓缓流动。对岸又是一片砖瓦房屋构成的沉闷荒原，寂静中偶尔传来巡警沉重而规律的脚步声，或夜归狂欢者的歌唱与叫喊。"},"extraExamples":[{"ex":"His usual jokes gave way to a more sombre tone.","tr":"他收起了平时的玩笑，语气变得更加沉重。"},{"ex":"The room was decorated in sombre shades of grey and brown.","tr":"房间用灰色和棕色等暗沉色调装饰。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"coarse","pos":"adj.","p":"/kɔːs/","cn":"粗糙的；粗俗的","usage":"coarse fabric / writing 强调粗糙、不精细；coarse language 是粗俗用语。发音与 course 相同，但拼写和意思不同。","ex":"The cheap wool felt coarse against my neck.","tr":"那种便宜羊毛贴着脖子时，感觉很粗糙。","k":"coarse","source":{"id":"twisted-lip","title":"歪唇男人","page":20,"form":"Coarse writing","quote":"“Coarse writing,” murmured Holmes. “Surely this is not your husband’s writing, madam.”","tr":"“字写得很潦草，”福尔摩斯喃喃道，“夫人，这肯定不是您丈夫的笔迹吧。”"},"extraExamples":[{"ex":"The bread had a coarse texture, with plenty of seeds.","tr":"那面包口感比较粗，里面有很多种子。"},{"ex":"I didn't appreciate his coarse jokes in front of the children.","tr":"我不喜欢他当着孩子的面讲那些粗俗的笑话。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"shady","pos":"adj.","p":"/ˈʃeɪdi/","cn":"可疑的；不太正当的；背阴的","usage":"a shady seller / deal 是值得怀疑的人或交易，偏口语；a shady spot 则只是有阴凉的地方。","ex":"That seller seems shady; he won't say where the bike came from.","tr":"那个卖家看起来很可疑；他不肯说自行车是哪来的。","k":"shady","source":{"id":"twisted-lip","title":"歪唇男人","page":13,"form":"shady","quote":"“And now as to the villains who seemed to be immediately implicated in the matter. The Lascar was known to be a man with a very shady background, but as, by Mrs. St. Clair’s story, he was known to have been at the foot of the stair within a few seconds of her husband’s appearance at the window, he could hardly have been more than an accessory to the crime.","tr":"“现在来说说看似直接牵涉此案的嫌疑人。大家都知道，那个水手的背景很不干净。不过按照圣克莱尔太太的叙述，丈夫在窗口露面后的几秒钟内，他就守在楼梯口，所以即便与罪案有关，最多也只能是个帮凶。"},"extraExamples":[{"ex":"Let's find a shady spot where we can eat our lunch.","tr":"我们找个背阴的地方吃午饭吧。"},{"ex":"The offer sounded shady, especially when they asked for cash in advance.","tr":"那个提议听起来很可疑，尤其是他们要求先付现金的时候。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"ghastly","pos":"adj.","p":"/ˈɡɑːstli/","cn":"糟糕透顶的；可怕的","usage":"英式口语可用 ghastly weather / headache 表示很糟，不一定涉及恐怖；原文描述令人惊骇的脸。","ex":"I had a ghastly headache after the long flight.","tr":"坐完那趟长途航班后，我头痛得厉害。","k":"ghastly","source":{"id":"twisted-lip","title":"歪唇男人","page":31,"form":"ghastly","quote":"It was a long fight between my pride and the money, but the pounds won at last, and I threw up reporting and sat day after day in the corner which I had first chosen, inspiring pity by my ghastly face and filling my pockets with coppers.","tr":"“尊严和金钱在我心里斗争了很久，但最终还是金钱赢了。我辞去记者工作，日复一日地坐回最初选定的街角，靠着那张可怕的脸博取同情，让铜币不断装满口袋。"},"extraExamples":[{"ex":"The weather was ghastly, so we spent the day playing cards indoors.","tr":"天气糟透了，所以我们一整天都在室内打牌。"},{"ex":"That paint colour looks ghastly under the kitchen lights.","tr":"那种油漆颜色在厨房灯光下看起来糟糕透了。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"in the prime of one's life","pos":"phr.","p":"/ɪn ðə praɪm əv wʌnz laɪf/","cn":"在人生最强健或最有活力的阶段","usage":"常说 in the prime of his / her life；不对应固定年龄，可指健康、精力或事业最旺盛的时期。","ex":"She started her own business in the prime of her life.","tr":"她在人生精力最旺盛的阶段创办了自己的事业。","k":"in the prime of her life","source":{"id":"twisted-lip","title":"歪唇男人","page":14,"form":"in the prime of life","quote":"“But a cripple!” said I. “What could he have done single-handed against a man in the prime of life?”","tr":"“可他是个跛子！”我说，“他怎么能单枪匹马对付一个正当壮年的男人呢？”"},"extraExamples":[{"ex":"He was in the prime of his life when he decided to change careers.","tr":"他在人生年富力强的时候决定转行。"},{"ex":"They met in the prime of their lives and travelled together for decades.","tr":"他们在人生最有活力的年纪相识，之后一起旅行了几十年。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"with the exception of something","pos":"phr.","p":"/wɪð ði ɪkˈsepʃən əv ˈsʌmθɪŋ/","cn":"除某人或某物之外","usage":"用于指出唯一或特定例外，比 except for 更正式；exception 前需有 the。","ex":"Everyone arrived on time, with the exception of the organiser.","tr":"除了组织者之外，所有人都准时到了。","k":"with the exception of","source":{"id":"twisted-lip","title":"歪唇男人","page":13,"form":"with the exception of his coat","quote":"clothes of Mr. Neville St. Clair, with the exception of his coat. His boots, his socks, his hat, and his watch—all were there.","tr":"“衣物，唯独缺少外套。靴子、袜子、帽子、手表全在那里。"},"extraExamples":[{"ex":"With the exception of the bathroom, the flat has been fully renovated.","tr":"除了浴室之外，这套公寓已经全部翻新。"},{"ex":"The trail is easy, with the exception of one steep section near the end.","tr":"这条步道很好走，只有快到终点的一段比较陡。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"for want of something","pos":"phr.","p":"/fə wɒnt əv ˈsʌmθɪŋ/","cn":"由于缺少某物；因为没有更好的选择","usage":"这里 want 是缺乏，不是想要；常见 for want of a better word / option，稍书面，但仍常用。","ex":"We stayed in the airport overnight for want of a better option.","tr":"因为没有更好的选择，我们在机场过了一夜。","k":"for want of","source":{"id":"twisted-lip","title":"歪唇男人","page":16,"form":"for want of a better one","quote":"“Well, we will take it as a working hypothesis for want of a better one. Boone, as I have told you, was arrested and taken to the station, but it could not be shown that there had ever before been anything against","tr":"“是啊，既然没有更好的解释，我们就暂且把它当作工作假设。我说过，布恩已经被捕，带到警察局，不过警方找不到证据证明他过去曾……"},"extraExamples":[{"ex":"The match was abandoned for want of enough players.","tr":"由于凑不够球员，比赛没有进行。"},{"ex":"I called it a shed for want of a better word, though it was almost a small house.","tr":"一时找不到更合适的说法，我就叫它棚屋，虽然它几乎像一间小房子。"}]},
  {"d":42,"date":"2026-10-13","kind":"reading","w":"at one's disposal","pos":"phr.","p":"/æt wʌnz dɪˈspəʊzəl/","cn":"可供某人使用或支配","usage":"have something at your disposal 表示有资源可使用；与 dispose of something（处理掉某物）不同。","ex":"You'll have a kitchen and a washing machine at your disposal during your stay.","tr":"住宿期间，你可以使用厨房和洗衣机。","k":"at your disposal","source":{"id":"twisted-lip","title":"歪唇男人","page":17,"form":"at my disposal","quote":"“Because there are many inquiries which must be made out here. Mrs. St. Clair has most kindly put two rooms at my disposal, and you may rest assured that she will have nothing but a welcome for my friend and colleague. I hate to meet her, Watson, when I have no news of her husband. Here we are. Whoa, there, whoa!”","tr":"“因为许多调查必须在这里进行。圣克莱尔太太很热情地给我安排了两间房，你大可以放心，她一定会欢迎我的朋友兼同事。华生，我最不愿意的，就是在还没有丈夫消息时去见她。到了，吁——停！”"},"extraExamples":[{"ex":"We had only one car at our disposal for the whole weekend.","tr":"整个周末我们只有一辆车可用。"},{"ex":"Please use the towels and toiletries at your disposal.","tr":"请随意使用为你准备的毛巾和洗漱用品。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"conceal","pos":"v.","p":"/kənˈsiːl/","cn":"隐藏；掩饰；使人看不见","usage":"conceal something from someone 指不让某人知道或看见；也可 conceal emotions，刻意不表露情绪。","ex":"He tried to conceal his disappointment when the trip was cancelled.","tr":"旅行取消时，他试图掩饰自己的失望。","k":"conceal","source":{"id":"twisted-lip","title":"歪唇男人","page":27,"form":"conceal","quote":"He was, as the inspector had said, extremely dirty, but the grime which covered his face could not conceal its repulsive ugliness.","tr":"正如督察所说，他脏得厉害，但脸上厚厚的污垢仍掩盖不住令人厌恶的丑陋。"},"extraExamples":[{"ex":"The curtains conceal a storage alcove behind the sofa.","tr":"窗帘遮住了沙发后面的一个储物凹间。"},{"ex":"She could barely conceal her excitement when the tickets arrived.","tr":"票送来时，她几乎掩饰不住自己的兴奋。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"ostensibly","pos":"adv.","p":"/ɒsˈtensəbli/","cn":"表面上；据称是为了某目的","usage":"常暗示表面理由与实际目的可能不同，较书面；不是确实如此的 certainly，也不同于明显地 obviously。","ex":"We met ostensibly to plan the trip, but mostly talked about our favourite cafés.","tr":"我们表面上是见面规划旅行，实际大部分时间都在聊喜欢的咖啡馆。","k":"ostensibly","source":{"id":"twisted-lip","title":"歪唇男人","page":30,"form":"ostensibly","quote":"Then with a red head of hair, and an appropriate dress, I took my station in the business part of the city, ostensibly as a match-seller but really as a beggar.","tr":"“接着，我戴上红色假发，穿上合适的破衣服，在城里的商业区找了个位置，表面上卖火柴，实际上靠乞讨为生。"},"extraExamples":[{"ex":"He stopped by ostensibly to return a book, though I think he wanted company.","tr":"他表面上是来还书的，不过我觉得他其实想找人作伴。"},{"ex":"The event was ostensibly free, but most activities required a paid ticket.","tr":"活动名义上免费，但大多数项目都需要付费票。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"confess","pos":"v.","p":"/kənˈfes/","cn":"承认不愿承认的事；坦白","usage":"confess to doing something / confess that ...；日常 I have to confess ... 可坦白小事，不一定是犯罪供认。","ex":"I have to confess that I bought the car partly because I loved how it looked.","tr":"我得承认，买那辆车有一部分原因是我喜欢它的外形。","k":"confess","source":{"id":"twisted-lip","title":"歪唇男人","page":23,"form":"confessed","quote":"“No, but this horrible man confessed to having been there, and the Lascar was at the foot of the stairs.”","tr":"“没有，但那个可怕的男人承认自己在房间里，水手又守在楼梯口。”"},"extraExamples":[{"ex":"I confess I hadn't expected the walk to be quite so steep.","tr":"我承认，原先真没想到这段路会这么陡。"},{"ex":"She confessed to eating the biscuits we'd saved for the trip.","tr":"她承认把我们留着旅行吃的饼干吃掉了。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"confide","pos":"v.","p":"/kənˈfaɪd/","cn":"向信任的人吐露；托付","usage":"现代常用 confide in someone about a worry，或 confide a secret to someone；原文 confided it to 指把戒指托付给对方。","ex":"She confided in me about how lonely she had felt since moving.","tr":"她向我吐露，搬家之后她一直觉得很孤独。","k":"confided","source":{"id":"twisted-lip","title":"歪唇男人","page":32,"form":"confided it","quote":"Knowing that my wife would be terribly anxious, I slipped off my ring and confided it to the Lascar at a moment when no constable was watching me, together with a hurried scrawl, telling her that she had no cause to fear.”","tr":"“我知道妻子一定急坏了，便趁警员没有盯着我的时候，悄悄摘下戒指交给那个水手，同时塞给他一张匆匆写下的便条，告诉她不必担心。”"},"extraExamples":[{"ex":"He confided his worries to a close friend rather than posting them online.","tr":"他把烦恼告诉了一个亲密的朋友，而没有发到网上。"},{"ex":"I'm glad you felt you could confide in me.","tr":"你觉得可以向我吐露心事，我很高兴。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"betray","pos":"v.","p":"/bɪˈtreɪ/","cn":"无意中暴露情绪或秘密；背叛","usage":"a smile / voice can betray a feeling，指流露出本想隐藏的情况；原文是衣服会暴露真实身份，不只是背叛某人。","ex":"His smile betrayed how pleased he was with the surprise.","tr":"他的笑容流露出，他对这个惊喜有多高兴。","k":"betrayed","source":{"id":"twisted-lip","title":"歪唇男人","page":32,"form":"betray","quote":"Even a wife’s eyes could not pierce so complete a disguise. But then it occurred to me that there might be a search in the room, and that the clothes might betray me.","tr":"“如此彻底的伪装，就连妻子的眼睛也不可能识破。可我突然想到，警方可能会搜查房间，留下的衣服会出卖我。"},"extraExamples":[{"ex":"A slight tremor in her voice betrayed her nervousness.","tr":"她声音里轻微的颤抖暴露了她的紧张。"},{"ex":"He felt betrayed when his private message was shared with the whole group.","tr":"自己的私信被转发给整个群时，他觉得遭到了背叛。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"scrawl","pos":"n. / v.","p":"/skrɔːl/","cn":"潦草的字迹；潦草地写","usage":"a hurried / illegible scrawl 描述难辨认的字迹；动词 scrawl a note 是匆忙潦草地写便条。","ex":"I could barely read the address in his hurried scrawl.","tr":"他匆匆写下的字迹太潦草，我几乎看不清地址。","k":"scrawl","source":{"id":"twisted-lip","title":"歪唇男人","page":32,"form":"hurried scrawl","quote":"Knowing that my wife would be terribly anxious, I slipped off my ring and confided it to the Lascar at a moment when no constable was watching me, together with a hurried scrawl, telling her that she had no cause to fear.”","tr":"“我知道妻子一定急坏了，便趁警员没有盯着我的时候，悄悄摘下戒指交给那个水手，同时塞给他一张匆匆写下的便条，告诉她不必担心。”"},"extraExamples":[{"ex":"She scrawled her number on the back of a receipt.","tr":"她在收据背面潦草地写下了号码。"},{"ex":"The note was written in such a scrawl that I misread the time.","tr":"便条字迹太潦草，我把时间看错了。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"in one's heart of hearts","pos":"phr.","p":"/ɪn wʌnz hɑːt əv hɑːts/","cn":"在内心深处；心底其实知道","usage":"常用于承认不愿面对的真相；可说 in my / your heart of hearts，语气比 simply knowing 更强调内心感受。","ex":"In my heart of hearts, I knew the flat was too expensive for me.","tr":"我心底其实知道，那套公寓对我来说太贵了。","k":"In my heart of hearts","source":{"id":"twisted-lip","title":"歪唇男人","page":19,"form":"In your heart of hearts","quote":"“In your heart of hearts, do you think that Neville is alive?”","tr":"“在您内心深处，您觉得内维尔还活着吗？”"},"extraExamples":[{"ex":"In her heart of hearts, she knew she didn't want to move away.","tr":"在她内心深处，她知道自己不想搬走。"},{"ex":"I think, in your heart of hearts, you've already made up your mind.","tr":"我觉得你心底其实已经作出了决定。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"have a quiet word with someone","pos":"phr.","p":"/hæv ə ˈkwaɪət wɜːd wɪð ˈsʌmwʌn/","cn":"与某人私下简短谈谈","usage":"常用于不想让旁人听到的沟通，有时涉及提醒或批评；quiet 指私下，不只是音量小。","ex":"Could I have a quiet word with you before everyone else arrives?","tr":"其他人到之前，我能和你私下聊几句吗？","k":"have a quiet word with you","source":{"id":"twisted-lip","title":"歪唇男人","page":26,"form":"have a quiet word with you","quote":"“I wish to have a quiet word with you, Bradstreet.”","tr":"“我想私下和你谈几句，布拉德斯特里特。”"},"extraExamples":[{"ex":"I'll have a quiet word with the manager about the extra charge.","tr":"我会找经理私下简短谈谈这笔额外收费。"},{"ex":"Could we have a quiet word after the meeting? Nothing serious.","tr":"会后我们能私下聊两句吗？没什么大事。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"take the liberty of doing something","pos":"phr.","p":"/teɪk ðə ˈlɪbəti əv ˈduːɪŋ ˈsʌmθɪŋ/","cn":"冒昧地做某事；未先询问就替人做某事","usage":"礼貌说明自己已经先做了一件事；of 后接动名词，常用过去式 I took the liberty of ...。","ex":"I took the liberty of booking a table, since the restaurant fills up quickly.","tr":"因为那家餐厅很快就会坐满，我就冒昧地先订了桌。","k":"took the liberty of booking","source":{"id":"twisted-lip","title":"歪唇男人","page":27,"form":"took the liberty of bringing","quote":"“I had an idea that he might, and I took the liberty of bringing the tools with me.”","tr":"“我早料到这一点，所以擅自把工具也带来了。”"},"extraExamples":[{"ex":"I took the liberty of bringing a dessert so you wouldn't have to make one.","tr":"我擅自带了一份甜点，这样你就不用做了。"},{"ex":"We've taken the liberty of moving your luggage to the larger room.","tr":"我们冒昧把你的行李搬到了那间大一点的房间。"}]},
  {"d":43,"date":"2026-10-13","kind":"reading","w":"rest assured","pos":"phr.","p":"/rest əˈʃʊəd/","cn":"请放心；可以确信","usage":"常说 You can rest assured that ...，用于给出保证，稍正式；后面的保证应当是自己能兑现的事。","ex":"You can rest assured that I'll let you know as soon as the tickets arrive.","tr":"你可以放心，票一到我就会告诉你。","k":"rest assured","source":{"id":"twisted-lip","title":"歪唇男人","page":17,"form":"rest assured","quote":"“Because there are many inquiries which must be made out here. Mrs. St. Clair has most kindly put two rooms at my disposal, and you may rest assured that she will have nothing but a welcome for my friend and colleague. I hate to meet her, Watson, when I have no news of her husband. Here we are. Whoa, there, whoa!”","tr":"“因为许多调查必须在这里进行。圣克莱尔太太很热情地给我安排了两间房，你大可以放心，她一定会欢迎我的朋友兼同事。华生，我最不愿意的，就是在还没有丈夫消息时去见她。到了，吁——停！”"},"extraExamples":[{"ex":"Rest assured, your booking will be held even if the train is late.","tr":"请放心，即使火车晚点，我们也会保留你的预订。"},{"ex":"You can rest assured that this conversation will stay between us.","tr":"你尽管放心，这次谈话的内容不会告诉别人。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"reckless","pos":"adj.","p":"/ˈrekləs/","cn":"鲁莽的；不顾后果的","usage":"reckless driving / behaviour 强调明知有风险仍不顾后果；不同于无意犯错的 careless。","ex":"Overtaking on that blind bend would be reckless.","tr":"在那个看不见前方的弯道超车会很鲁莽。","k":"reckless","source":{"id":"twisted-lip","title":"歪唇男人","page":28,"form":"reckless","quote":"The prisoner turned with the reckless air of a man who abandons himself to his destiny.","tr":"犯人转过身来，神态像一个已经认命、豁出一切的人。"},"extraExamples":[{"ex":"It would be reckless to attempt that crossing after dark.","tr":"天黑后尝试渡过去，会很鲁莽。"},{"ex":"His reckless spending left him with nothing for the rent.","tr":"他花钱不计后果，最后连房租都没钱付。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"recede","pos":"v.","p":"/rɪˈsiːd/","cn":"退去；逐渐远离或消退","usage":"the tide / floodwater recedes 是水退去；a receding hairline 是发际线后移，不能把所有减少都机械换成 recede。","ex":"We waited for the floodwater to recede before heading back to the car.","tr":"我们等洪水退去后，才往车那边走。","k":"recede","source":{"id":"twisted-lip","title":"歪唇男人","page":15,"form":"receded","quote":"“And it did, though they hardly found upon the mud-bank what they had feared to find. It was Neville St. Clair’s coat, and not Neville St. Clair, which lay uncovered as the tide receded. And what do you think they found in the pockets?”","tr":"“新线索果然出现了，只不过泥滩上暴露出来的不是他们所担心的尸体，而是圣克莱尔的外套。你猜口袋里装了什么？”"},"extraExamples":[{"ex":"The sound of the engine receded as the boat moved out to sea.","tr":"船驶向海上时，发动机声渐渐远去。"},{"ex":"My worries began to recede once we had a workable plan.","tr":"有了可行的计划后，我的忧虑开始慢慢消退。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"tattered","pos":"adj.","p":"/ˈtætəd/","cn":"破旧的；磨损得破破烂烂的","usage":"常修饰 tattered clothes / pages / backpack，强调磨损或撕裂；不是单纯使用时间长。","ex":"He still travels with the same tattered backpack he bought at university.","tr":"他旅行时还背着大学时买的那个破旧背包。","k":"tattered","source":{"id":"twisted-lip","title":"歪唇男人","page":27,"form":"tattered","quote":"He was a middle-sized man, coarsely clad as became his calling, with a coloured shirt protruding through the rent in his tattered coat.","tr":"他中等身材，衣着粗劣，十分符合乞丐的身份。一件花衬衫从破旧外套的裂口露出来。"},"extraExamples":[{"ex":"A tattered sign pointed towards the old campsite.","tr":"一块破旧的指示牌指向旧营地。"},{"ex":"She kept the tattered letter because it was the last one her grandfather had sent.","tr":"她保留着那封破旧的信，因为那是祖父寄来的最后一封。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"snatch","pos":"v.","p":"/snætʃ/","cn":"突然快速抓取；一把夺过","usage":"snatch something from someone / off a table 强调动作突然且急促；也可说 snatch a few minutes of sleep。","ex":"She snatched her phone off the table as soon as it rang.","tr":"电话一响，她就一把拿起了桌上的手机。","k":"snatched","source":{"id":"twisted-lip","title":"歪唇男人","page":20,"form":"snatched","quote":"He snatched it from her in his eagerness, and smoothing it out upon the table he drew over the lamp and examined it intently.","tr":"他急切地把纸条接过来，在桌上铺平，移过台灯仔细检查。"},"extraExamples":[{"ex":"He snatched the glass before it rolled off the table.","tr":"玻璃杯滚下桌子之前，他一把抓住了它。"},{"ex":"I managed to snatch a few minutes of sleep on the bus.","tr":"我在公交车上好不容易抓紧空当睡了几分钟。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"frantically","pos":"adv.","p":"/ˈfræntɪkəli/","cn":"慌乱而急切地；焦急忙乱地","usage":"常搭配 search / wave / try frantically，强调急切并伴随情绪失控；比 quickly 多了慌张的感觉。","ex":"I searched frantically for my keys while the taxi waited outside.","tr":"出租车在外面等着时，我慌忙找钥匙。","k":"frantically","source":{"id":"twisted-lip","title":"歪唇男人","page":11,"form":"frantically","quote":"He waved his hands frantically to her, and then vanished from the window so suddenly that it seemed to her that he had been pulled back by some irresistible force from behind.","tr":"“他疯狂地向她挥舞双手，随后突然从窗口消失，快得让她觉得仿佛有一股不可抗拒的力量从身后把他拖了回去。"},"extraExamples":[{"ex":"She waved frantically as the bus began to pull away.","tr":"公交车开始驶离时，她焦急地挥着手。"},{"ex":"We were frantically trying to move the outdoor furniture before the rain arrived.","tr":"雨快下来了，我们正手忙脚乱地往里搬户外家具。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"perpetual","pos":"adj.","p":"/pəˈpetʃuəl/","cn":"持续不断的；总是反复出现的","usage":"常见 perpetual noise / complaints，往往带厌烦意味；原文 perpetual snarl 描述一直呈现的表情。","ex":"I'm tired of the perpetual noise from the building work next door.","tr":"隔壁施工持续不断的噪声让我受够了。","k":"perpetual","source":{"id":"twisted-lip","title":"歪唇男人","page":27,"form":"perpetual","quote":"A broad wheal from an old scar ran right across it from eye to chin, and by its contraction had turned up one side of the upper lip, so that three teeth were exposed in a perpetual snarl.","tr":"一道旧伤疤造成的宽阔隆起，从眼角一直延伸到下巴。疤痕的收缩把上嘴唇的一侧拉了起来，露出三颗牙齿，形成永远龇牙咧嘴的怪相。"},"extraExamples":[{"ex":"The café seems to be in a perpetual state of renovation.","tr":"那家咖啡馆似乎总处在装修状态。"},{"ex":"His perpetual lateness is starting to annoy the rest of the group.","tr":"他总是迟到，开始惹得组里其他人不高兴了。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"lay one's hands on something","pos":"phr.","p":"/leɪ wʌnz hændz ɒn ˈsʌmθɪŋ/","cn":"找到或弄到某物","usage":"常用于找不容易得到的东西：lay my hands on a copy / some tools；不是字面上的把手放上去。","ex":"I've been trying to lay my hands on a second-hand copy of that book.","tr":"我一直想弄到那本书的一本二手版本。","k":"lay my hands on","source":{"id":"twisted-lip","title":"歪唇男人","page":16,"form":"lay his hands","quote":"There is not an instant to be lost. He rushes to some secret hoard, where he has accumulated the fruits of his beggary, and he stuffs all the coins upon which he can lay his hands into the pockets to make sure of the coat’s sinking.","tr":"“一刻也不能耽误。他冲向秘密藏钱的地方，那里堆放着他乞讨所得的硬币，抓起能拿到的零钱，统统塞进衣袋，好让外套沉入水底。"},"extraExamples":[{"ex":"Can you lay your hands on a spare phone charger?","tr":"你能找到一个备用手机充电器吗？"},{"ex":"We couldn't lay our hands on a map, so we asked at the visitor centre.","tr":"我们找不到地图，就去游客中心问了问。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"take the cake","pos":"phr.","p":"/teɪk ðə keɪk/","cn":"最离谱；在同类中最极端","usage":"常带讽刺或惊讶：That takes the cake! 现代尤其常见于美式，英式常说 take the biscuit；不是去拿蛋糕。","ex":"I've heard some ridiculous excuses, but that one takes the cake.","tr":"我听过不少荒唐的借口，但那个真是最离谱的。","k":"takes the cake","source":{"id":"twisted-lip","title":"歪唇男人","page":29,"form":"takes the cake","quote":"“Well, I have been twenty-seven years in the force, but this really takes the cake.”","tr":"“唉，我在警察队伍里干了二十七年，这件事实在称得上头一遭！”"},"extraExamples":[{"ex":"Of all the overpriced cafés we've visited, this one takes the cake.","tr":"我们去过那么多价格虚高的咖啡馆，这家最离谱。"},{"ex":"Turning up two hours late and asking why we started without him really takes the cake.","tr":"迟到两小时，还问我们为什么不等他就开始，真是够离谱的。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"be at one's wits' end","pos":"phr.","p":"/biː æt wʌnz wɪts end/","cn":"愁得没办法；不知还能怎么办","usage":"现代通常写复数 wits' end，apostrophe 在 s 后；原文采用单数 wit's 的旧写法。强调焦虑或烦恼到无计可施。","ex":"I'm at my wits' end trying to get the printer to work.","tr":"为了让打印机正常工作，我已经愁得没办法了。","k":"at my wits' end","source":{"id":"twisted-lip","title":"歪唇男人","page":30,"form":"at my wit’s end","quote":"“I wrote my articles and thought little more of the matter until, some time later, I backed a bill for a friend and had a writ served upon me for 25 pounds. I was at my wit’s end where to get the money, but a sudden idea came to me.","tr":"“我写完那组文章后，就没再多想。直到过了一阵，我替朋友担保了一张票据，结果因二十五英镑的债务收到了法院的执行文书。我正愁去哪里弄这笔钱，忽然灵机一动。"},"extraExamples":[{"ex":"She was at her wits' end after another night of the alarm going off.","tr":"警报又响了一整夜，她已经愁得没办法了。"},{"ex":"I'm at my wits' end with these repeated cancellations; I don't know what else to book.","tr":"这些预订一再取消，我实在没辙了，不知道还能订什么。"}]},
  {"d":44,"date":"2026-10-13","kind":"reading","w":"settle down to something","pos":"phr.","p":"/ˈsetl daʊn tə ˈsʌmθɪŋ/","cn":"静下心开始认真做某事","usage":"settle down to work / studying 中 to 是介词，后接名词或动名词；与结婚安定下来的 settle down 要区分。","ex":"We settled down to planning the trip once everyone had arrived.","tr":"所有人到齐后，我们静下心开始认真规划旅行。","k":"settled down to planning","source":{"id":"twisted-lip","title":"歪唇男人","page":30,"form":"settle down to arduous work","quote":"“Well, you can imagine how hard it was to settle down to arduous work at 2 pounds a week when I knew that I could earn as much in a day by smearing my face with a little paint, laying my cap on the ground, and sitting still.","tr":"“你们可以想象，当我知道只需往脸上涂点颜料，把帽子放在地上，静静坐着，一天就能挣到同样的钱时，再去做每周只有两英镑收入的辛苦工作，是多么难熬。"},"extraExamples":[{"ex":"I couldn't settle down to reading until the washing was finished.","tr":"洗完衣服之前，我一直没法静下心来看书。"},{"ex":"Once the guests had left, she settled down to writing a long email.","tr":"客人离开后，她静下心来开始写一封长邮件。"}]},
  {"d":45,"date":"2026-10-14","w":"scramble","pos":"v.","p":"/ˈskræmbl/","cn":"手脚并用地攀爬；匆忙设法完成","usage":"scramble over / up rocks 指手脚并用地爬；scramble to do something 则强调因时间紧而赶忙设法做，不是悠闲的 meander。","ex":"We had to scramble over the rocks to reach the small beach on the other side.","tr":"我们得手脚并用地爬过那些岩石，才能到达另一边的小海滩。","k":"scramble","extraExamples":[{"ex":"We scrambled to find another campsite before it got dark.","tr":"天快黑了，我们赶忙寻找另一个营地。"},{"ex":"The children scrambled up the grassy bank to see the ducks.","tr":"孩子们手脚并用地爬上草坡，去看那些鸭子。"}]},
  {"d":45,"date":"2026-10-14","w":"drizzle","pos":"n. / v.","p":"/ˈdrɪzl/","cn":"毛毛雨；下毛毛雨；淋上少量液体","usage":"天气中 drizzle 通常不可数：a bit of drizzle；It is drizzling 是在下毛毛雨。烹饪中 drizzle oil over something 指淋少量油，不是大雨的 torrential rain。","ex":"There was a bit of drizzle when we set off, but it cleared before we reached the coast.","tr":"我们出发时下着一点毛毛雨，不过到达海边前天气就放晴了。","k":"drizzle","extraExamples":[{"ex":"It was drizzling when I left the office, so I walked to the station under my umbrella.","tr":"我离开办公室时正下着毛毛雨，就撑伞走去了车站。"},{"ex":"Drizzle a little olive oil over the tomatoes just before serving.","tr":"上桌前，在西红柿上淋一点橄榄油。"}]},
  {"d":45,"date":"2026-10-14","w":"unassuming","pos":"adj.","p":"/ˌʌnəˈsjuːmɪŋ/","cn":"谦逊不张扬的；外表朴实的","usage":"an unassuming person / café 通常是褒义，指不摆架子或外表不显眼；并不表示 lack of confidence（缺乏自信），也不一定是不起眼的服务设计。","ex":"The café looked unassuming from the street, but it served the best coffee of the trip.","tr":"从街上看，那家咖啡馆很朴实，却供应了我们整趟旅行中最好喝的咖啡。","k":"unassuming","extraExamples":[{"ex":"He was so unassuming that nobody guessed he had played badminton professionally.","tr":"他十分谦逊，谁也没猜到他曾是职业羽毛球运动员。"},{"ex":"Behind that unassuming entrance is a lovely little courtyard.","tr":"那扇朴实的入口后面，是一个可爱的小庭院。"}]},
  {"d":45,"date":"2026-10-14","w":"fickle","pos":"adj.","p":"/ˈfɪkl/","cn":"善变的；变化无常的","usage":"fickle weather / tastes 描述经常变来变去；形容朋友或感情时通常带批评意味，侧重喜好或忠诚不稳定，而不只是做事难预测。","ex":"The weather along the coast can be fickle, so I always pack a light waterproof jacket.","tr":"沿海天气可能变化无常，所以我总会带一件轻便防水外套。","k":"fickle","extraExamples":[{"ex":"Online audiences can be fickle; a popular channel can lose viewers surprisingly quickly.","tr":"网络观众的喜好可能很善变，一个热门频道也可能迅速流失观众。"},{"ex":"The coastal breeze was fickle, changing direction every few minutes.","tr":"海风变化无常，每隔几分钟就换个方向。"}]},
  {"d":45,"date":"2026-10-14","w":"grumble","pos":"v.","p":"/ˈɡrʌmbl/","cn":"发牢骚；嘟囔着抱怨","usage":"grumble about something / at someone 常指小声或反复抱怨，语气通常比正式投诉轻；不是与对方互相争吵的 bicker。","ex":"We grumbled about the expensive airport parking, then decided to take the train next time.","tr":"我们抱怨了一番机场停车费太贵，随后决定下次坐火车。","k":"grumbled","extraExamples":[{"ex":"My stomach started to grumble halfway through the walk.","tr":"走到半程时，我的肚子开始咕咕叫了。"},{"ex":"He grumbled about the early start but enjoyed the sunrise once we arrived.","tr":"他抱怨出发时间太早，不过到达后还是很享受看日出。"}]},
  {"d":45,"date":"2026-10-14","w":"savour","pos":"v.","p":"/ˈseɪvə/","cn":"细细品味；慢慢享受","usage":"英澳拼 savour，美式 savor；savour a meal / the moment 强调用心、慢慢享受，而不是仓促吃完或仅仅认为值得。","ex":"I wanted to savour the quiet morning, so I left my phone inside and took my coffee onto the balcony.","tr":"我想慢慢享受那个安静的早晨，就把手机留在屋里，端着咖啡去了阳台。","k":"savour","extraExamples":[{"ex":"She paused to savour the first mouthful of the homemade soup.","tr":"她停下来，细细品味第一口家常汤。"},{"ex":"We stayed by the harbour a little longer to savour the last evening of our holiday.","tr":"我们在港口多待了一会儿，慢慢享受假期的最后一个晚上。"}]},
  {"d":45,"date":"2026-10-14","w":"get a second wind","pos":"phr.","p":"/ɡet ə ˌsekənd ˈwɪnd/","cn":"疲倦后又恢复一股精神或体力","usage":"常用于运动或持续工作中原本疲倦、后来又有精神；也可说 find / catch a second wind，wind 在这里读 /wɪnd/，不是动词卷绕的 /waɪnd/。","ex":"I was ready to stop halfway through the run, but I got a second wind after we slowed the pace.","tr":"跑到一半时我都想停下了，不过我们放慢速度后，我又恢复了一股体力。","k":"got a second wind","extraExamples":[{"ex":"I got a second wind after dinner and finally finished packing for the trip.","tr":"晚饭后我又有了精神，终于把出游的行李收拾好了。"},{"ex":"Just when the team looked exhausted, they found a second wind and won the final game.","tr":"就在全队看起来筋疲力尽时，他们又恢复了体力，赢下了最后一局。"}]},

const latestDay = Math.max(...DATA.map(x => x.d));
function updateSummary(){
  const title = "单词合集 · Day 1–" + latestDay;
  document.title = title;
  document.querySelector("h1").textContent = title;
  const readingCount = DATA.filter(x => x.kind === "reading").length;
  document.getElementById("summary").textContent = "Day 1–" + latestDay + " · " + DATA.length + " 项" + (readingCount ? "（含阅读补充 " + readingCount + " 项）" : "") + "｜先看中文和挖空例句，再翻开答案；支持朗读、口音切换与错题复习。";
  const days = [...new Set(DATA.map(x => x.d))].sort((a,b) => a-b);
  for (const id of ["dayFrom", "dayTo"]) {
    const select = document.getElementById(id);
    select.replaceChildren();
    for (const day of days) select.add(new Option("Day " + day, String(day)));
    select.value = String(id === "dayFrom" ? days[0] : latestDay);
  }
  updateFilterLabels();
}
function dayRange(){
  const from = Number(document.getElementById("dayFrom").value);
  const to = Number(document.getElementById("dayTo").value);
  return DATA.filter(x => x.d >= from && x.d <= to);
}
function updateFilterLabels(){
  const items = dayRange();
  const phrases = items.filter(isPhrase).length;
  const labels = {
    "0": "全部 " + items.length + " 项",
    "p": "只练短语（" + phrases + "）",
    "v": "只练单词（" + (items.length - phrases) + "）"
  };
  for (const option of document.getElementById("scope").options) {
    option.textContent = labels[option.value];
  }
}
function changeRange(changed){
  const from = document.getElementById("dayFrom");
  const to = document.getElementById("dayTo");
  if (Number(from.value) > Number(to.value)) {
    if (changed === "dayFrom") to.value = from.value;
    else from.value = to.value;
  }
  updateFilterLabels();
  start(pool());
}

let voices = [];
function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
function say(text){
  if (!window.speechSynthesis) {alert("此浏览器不支持语音朗读，请尝试 Safari 或 Chrome。");return;}
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const lang = document.getElementById("accentSelect").value;
  u.lang = lang;
  const available = voices.filter(v => v.lang && v.lang.replace("_","-").toLowerCase() === lang.toLowerCase());
  if(available.length) u.voice = available.find(v => /premium|enhanced|natural/i.test(v.name)) || available[0];
  u.rate = 0.85;
  speechSynthesis.speak(u);
}

function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function isPhrase(x){ return x.pos.indexOf("phr") === 0; }
function makeCloze(item){
  const len = isPhrase(item) ? Math.max(6, Math.min(16, item.k.length)) : 6;
  return item.ex.replace(new RegExp(esc(item.k), "i"), '<span class="blank">' + "_".repeat(len) + '</span>');
}

let queue = [], idx = 0, missed = [];
function pool(){
  const v = document.getElementById("scope").value;
  const items = dayRange();
  if (v === "p") return items.filter(isPhrase);
  if (v === "v") return items.filter(x => !isPhrase(x));
  return items;
}
function shuffle(a){
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function start(list){
  queue = shuffle(list.slice()); idx = 0; missed = [];
  document.getElementById("done").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  render();
}
function render(){
  if (idx >= queue.length) return finish();
  const it = queue[idx];
  document.getElementById("pcn").textContent = it.cn;
  const pp = document.getElementById("ppos");
  pp.textContent = it.pos;
  pp.className = isPhrase(it) ? "prompt-pos p" : "prompt-pos";
  document.getElementById("pday").textContent = "Day " + it.d + (it.kind === "reading" ? " · 《" + it.source.title + "》阅读补充" : "");
  document.getElementById("cloze").innerHTML = makeCloze(it);
  const ct = document.getElementById("clozetr");
  ct.textContent = it.tr;
  ct.className = isPhrase(it) ? "clozetr show" : "clozetr";
  document.getElementById("aw").textContent = it.w;
  document.getElementById("aipa").textContent = it.p;
  document.getElementById("aen").textContent = it.ex;
   document.getElementById("usage").textContent = it.usage ? "💡 用法："+it.usage : "";
  document.getElementById("atr").textContent = it.tr;
  const extraExamples = document.getElementById("extraExamples");
  extraExamples.replaceChildren();
  for (const [index, example] of (it.extraExamples || []).entries()) {
    const block = document.createElement("div");
    block.className = "extra-example";
    const label = document.createElement("p");
    label.className = "example-label";
    label.textContent = "例句 " + (index + 2);
    const sentence = document.createElement("div");
    sentence.className = "sentence-row";
    const english = document.createElement("p");
    english.className = "en";
    english.textContent = example.ex;
    const audio = document.createElement("button");
    audio.className = "say";
    audio.textContent = "🔊";
    audio.setAttribute("aria-label", "朗读例句" + (index + 2));
    audio.addEventListener("click", () => say(example.ex));
    sentence.append(english, audio);
    const translation = document.createElement("p");
    translation.className = "tr";
    translation.textContent = example.tr;
    block.append(label, sentence, translation);
    extraExamples.append(block);
  }
  const sourceNote = document.getElementById("sourceNote");
  sourceNote.hidden = !it.source;
  sourceNote.open = false;
  document.getElementById("sourceTitle").textContent = it.source ? "📖 原文第 " + it.source.page + " 页 · " + it.source.form : "";
  document.getElementById("sourceQuote").textContent = it.source ? it.source.quote : "";
  document.getElementById("sourceTranslation").textContent = it.source ? it.source.tr : "";
  document.getElementById("ans").classList.remove("show");
  document.getElementById("rowReveal").style.display = "flex";
  document.getElementById("rowJudge").style.display = "none";
  document.getElementById("prog").textContent = (idx+1) + " / " + queue.length;
  document.getElementById("fill").style.width = (idx / queue.length * 100) + "%";
}
function finish(){
  document.getElementById("quiz").style.display = "none";
  document.getElementById("done").style.display = "block";
  document.getElementById("fill").style.width = "100%";
  document.getElementById("prog").textContent = "完成";
  const total = queue.length, ok = total - missed.length;
  document.getElementById("doneTitle").textContent = "本轮完成：记得 " + ok + " / " + total;
  const ml = document.getElementById("missList");
  ml.innerHTML = "";
  if (!total) {
    document.getElementById("doneTitle").textContent = "所选范围没有可练习的词条";
    document.getElementById("doneSub").textContent = "请调整学习日范围或词条类型。";
    document.getElementById("again").style.display = "none";
    document.getElementById("prog").textContent = "0 / 0";
    document.getElementById("fill").style.width = "0%";
    return;
  }
  if (missed.length) {
    document.getElementById("doneSub").textContent = "以下这些还需要再过一遍：";
    missed.forEach(it => {
      const d = document.createElement("div");
      d.className = "miss";
      d.innerHTML = "<b>" + it.w + "</b><span>Day " + it.d + " · " + it.cn + "</span>";
      ml.appendChild(d);
    });
    document.getElementById("again").style.display = "block";
  } else {
    document.getElementById("doneSub").textContent = "全部记住了，这轮很干净 👏";
    document.getElementById("again").style.display = "none";
  }
}
document.getElementById("reveal").addEventListener("click", () => {
  document.getElementById("ans").classList.add("show");
  document.getElementById("rowReveal").style.display = "none";
  document.getElementById("rowJudge").style.display = "flex";
  say(queue[idx].w.replace(/^a /,"").replace(/^be /,"").replace(/ something/g," it").replace(/someone/g,"somebody").replace(/-/g," "));
});
document.getElementById("btnOk").addEventListener("click", () => { idx++; render(); });
document.getElementById("btnNo").addEventListener("click", () => { missed.push(queue[idx]); idx++; render(); });
document.getElementById("btnWord").addEventListener("click", () => say(queue[idx].w));
 document.getElementById("btnSay").addEventListener("click", () => say(queue[idx].ex));
document.getElementById("again").addEventListener("click", () => start(missed));
document.getElementById("restart").addEventListener("click", () => start(pool()));
document.getElementById("scope").addEventListener("change", () => start(pool()));
for (const id of ["dayFrom", "dayTo"]) {
  document.getElementById(id).addEventListener("change", () => changeRange(id));
}
updateSummary();
start(pool());
</script>
</body>
</html>
